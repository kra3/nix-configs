# Estimated power for what has no meter: every bulb and a few appliances (https://github.com/bramstroker/homeassistant-powercalc).
# Bulbs use library profiles keyed by manufacturer/model; the rest are fixed per state from datasheets, marked approx. on the dashboard.
powercalc:
  create_standby_group: false
  ignore_unavailable_state: true
  discovery:
    enabled: false
  sensors:
    - create_group: Lights
      entities:
        - create_group: Lights Bedroom
          entities:
            - entity_id: light.bedroom_wardrobe_light_1
              manufacturer: signify
              model: LWW001
            - entity_id: light.bedroom_wardrobe_light_2
              manufacturer: signify
              model: LWA011
        - create_group: Lights Kitchen
          entities:
            - entity_id: light.kitchen_light_1
              manufacturer: ikea
              model: LED2005R5
            - entity_id: light.kitchen_light_2
              manufacturer: ikea
              model: LED2005R5
            - entity_id: light.kitchen_light_3
              manufacturer: ikea
              model: LED2005R5
        - create_group: Lights Kitchen Dining
          entities:
            - entity_id: light.kitchen_dining_light_1
              manufacturer: signify
              model: LWW001
            - entity_id: light.kitchen_dining_light_2
              manufacturer: signify
              model: LWW001
        - create_group: Lights Dining Room
          entities:
            - entity_id: light.dining_room_light_1
              manufacturer: signify
              model: LWU002
            - entity_id: light.dining_room_light_2
              manufacturer: signify
              model: LWU002
            - entity_id: light.dining_room_light_3
              manufacturer: signify
              model: LWU002
        - create_group: Lights Living Room
          entities:
            - entity_id: light.living_room_light_1
              manufacturer: signify
              model: LCG006
            - entity_id: light.living_room_light_2
              manufacturer: signify
              model: LCG006
            - entity_id: light.living_room_light_3
              manufacturer: signify
              model: LCG006
            - entity_id: light.living_room_light_4
              manufacturer: signify
              model: LCG006
            - entity_id: light.living_room_light_5
              manufacturer: signify
              model: LCG006
        - create_group: Lights Office
          entities:
            - entity_id: light.office_room_light
              manufacturer: ikea
              model: LED1924G9
        - create_group: Lights Hall
          entities:
            - entity_id: light.hallway_hall_lights
              name: Hall dimmer
              linear:
                min_power: 0.5
                max_power: 50

    - create_group: Estimated devices
      entities:
        - entity_id: media_player.lg_webos_tv_oled77c35la
          name: LG TV
          standby_power: 2
          fixed:
            power: 126
            states_power:
              source|HDMI 1: 239
              source|HDMI 3: 239
              source|HDMI 4: 239
              source|Litefin: 239
              source|Moonfin: 239
              source|PlayStation 5: 239
        - entity_id: media_player.home_theater_2
          name: Marantz NR1711
          standby_power: 3.7
          fixed:
            power: 40
        - entity_id: camera.ranger_duo_fxd
          name: Camera Duo
          standby_power: 0
          fixed:
            power: 5.65
        - entity_id: camera.ranger_uno
          name: Camera Uno
          standby_power: 0
          fixed:
            power: 5
        - entity_id: media_player.kitchen_speaker
          name: Kitchen speaker
          standby_power: 0
          fixed:
            power: 2
        - power_sensor_id: sensor.fridge_power
          energy_sensor_id: sensor.fridge_energy
        - power_sensor_id: sensor.hob_power
          energy_sensor_id: sensor.hob_energy
        - power_sensor_id: sensor.hood_power
          energy_sensor_id: sensor.hood_energy
        - power_sensor_id: sensor.dishwasher_power
          energy_sensor_id: sensor.dishwasher_energy
        - power_sensor_id: sensor.oven_power
          energy_sensor_id: sensor.oven_energy
        - power_sensor_id: sensor.microwave_power
          energy_sensor_id: sensor.microwave_energy

template:
  - sensor:
      # Electrolux EN3441JOX label: 0.844 kWh/day = 35.2 W average; swap for a plug reading
      - name: "Fridge Power"
        unique_id: fridge_power
        device_class: power
        unit_of_measurement: W
        state_class: measurement
        state: "35.2"

      - name: "Hob Power"
        unique_id: hob_power
        device_class: power
        unit_of_measurement: W
        state_class: measurement
        state: "{{ (105 * 1500 / 1440) | round(1) }}"
        attributes:
          assumes: "105 min/day at 1.5 kW average (induction, daily average)"

      - name: "Hood Power"
        unique_id: hood_power
        device_class: power
        unit_of_measurement: W
        state_class: measurement
        state: "{{ (105 * 150 / 1440) | round(1) }}"
        attributes:
          assumes: "105 min/day at 150 W (270 W max, daily average)"

      - name: "Dishwasher Power"
        unique_id: dishwasher_power
        device_class: power
        unit_of_measurement: W
        state_class: measurement
        state: "{{ (4 * 1200 / 168) | round(1) }}"
        attributes:
          assumes: "4 cycles/week at 1.2 kWh (class A, weekly average)"

      - name: "Oven Power"
        unique_id: oven_power
        device_class: power
        unit_of_measurement: W
        state_class: measurement
        state: "{{ (3 * 1000 / 168) | round(1) }}"
        attributes:
          assumes: "3 uses/week at 1.0 kWh (label 0.93 kWh/cycle plus preheat, weekly average)"

      - name: "Microwave Power"
        unique_id: microwave_power
        device_class: power
        unit_of_measurement: W
        state_class: measurement
        state: "{{ (10 * 1300 / 1440) | round(1) }}"
        attributes:
          assumes: "10 min/day at 1300 W input (daily average)"

      - name: "Energy Cost Month"
        unique_id: energy_cost_month
        device_class: monetary
        unit_of_measurement: SEK
        state: >-
          {{ (states('sensor.washer_cost') | float(0) + states('sensor.dryer_cost') | float(0) + states('sensor.sutala_cost') | float(0) + states('sensor.lights_cost') | float(0) + states('sensor.devices_cost') | float(0) + states('sensor.energy_fees_month') | float(0)) | round(2) }}

      - name: "Energy Fees Month"
        unique_id: energy_fees_month
        device_class: monetary
        unit_of_measurement: SEK
        state: "{% from 'laundry.jinja' import fees %}{{ fees(now().year, now().month) }}"
        attributes:
          covers: "E.ON grid subscription 193 kr/month and contract fee 384 kr/year, with VAT"

      - name: "Energy Used Today"
        unique_id: energy_used_today
        device_class: energy
        unit_of_measurement: kWh
        state: >-
          {{ (states('sensor.washer_energy_day') | float(0) + states('sensor.dryer_energy_day') | float(0) + states('sensor.sutala_energy_day') | float(0) + states('sensor.lights_energy_day') | float(0) + states('sensor.devices_energy_day') | float(0)) | round(2) }}

      - name: "Energy Used Month"
        unique_id: energy_used_month
        device_class: energy
        unit_of_measurement: kWh
        state: >-
          {{ (states('sensor.washer_energy_month') | float(0) + states('sensor.dryer_energy_month') | float(0) + states('sensor.sutala_energy_month') | float(0) + states('sensor.lights_energy_month') | float(0) + states('sensor.devices_energy_month') | float(0)) | round(2) }}

      - name: "Home Power Estimate"
        unique_id: home_power_estimate
        device_class: power
        unit_of_measurement: W
        state_class: measurement
        state: >-
          {{ (states('sensor.power_monitor_1_power') | float(0) + states('sensor.washer_power_monitor_power') | float(0) + states('sensor.dryer_power_monitor_power') | float(0) + states('sensor.lights_power') | float(0) + states('sensor.estimated_devices_power') | float(0)) | round(0) }}
        attributes:
          covers: Washer, dryer, home server, lights and estimated devices, not the whole home

      - name: "Cost Today All lights"
        unique_id: cost_today_all_lights
        unit_of_measurement: kr
        state: "{% from 'laundry.jinja' import today %}{{ '%.2f' | format(today('lights') | float(0)) }}"
        attributes:
          power: "{{ states('sensor.lights_power') | float(0) | round(1) }} W"

      - name: "Cost Today Bedroom"
        unique_id: cost_today_bedroom
        unit_of_measurement: kr
        state: "{% from 'laundry.jinja' import today %}{{ '%.2f' | format(today('lights_bedroom') | float(0)) }}"
        attributes:
          power: "{{ states('sensor.lights_bedroom_power') | float(0) | round(1) }} W"

      - name: "Cost Today Kitchen"
        unique_id: cost_today_kitchen
        unit_of_measurement: kr
        state: "{% from 'laundry.jinja' import today %}{{ '%.2f' | format(today('lights_kitchen') | float(0)) }}"
        attributes:
          power: "{{ states('sensor.lights_kitchen_power') | float(0) | round(1) }} W"

      - name: "Cost Today Kitchen dining"
