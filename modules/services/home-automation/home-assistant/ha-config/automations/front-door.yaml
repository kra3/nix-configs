# ── Front Door Management ──────────────────────────────────────
- id: front_door_knock_announcements
  alias: "Front Door: Knock TTS & Notifications"
  description: Plays TTS and sends notifications when someone knocks at the front door.
  trigger:
    - platform: state
      entity_id: binary_sensor.front_door_knock_vibration
      to: "on"
  action:
    # 1. Wait 2 seconds to let contact/lock sensor state settle
    - delay: "00:00:02"

    # 2. Check if this was a valid knock (door is closed, and was not recently opened/closed/locked/unlocked)
    - if: &valid_knock_check
        - condition: state
          entity_id: binary_sensor.front_door_open
          state: "off"
        - condition: template
          value_template: "{{ (as_timestamp(now()) - as_timestamp(states.binary_sensor.front_door_open.last_changed)) > 15 }}"
        - condition: template
          value_template: "{{ (as_timestamp(now()) - as_timestamp(states.lock.front_door.last_changed | default(now()))) > 15 }}"
      then:
        # Determine Presence
        - variables:
            anjali_home: "{{ is_state('person.anjalipc', 'home') }}"
            arun_home: "{{ is_state('person.arun_karunagath', 'home') }}"
            anyone_home: "{{ anjali_home or arun_home }}"

        # If someone home: Play Announcement on HT and Notify present people
        - if:
            - condition: template
              value_template: "{{ anyone_home }}"
          then:
            # Toggle TV pause
            - if:
                - condition: state
                  entity_id: media_player.lg_webos_tv_oled77c35la
                  state: "playing"
              then:
                - action: media_player.media_play_pause
                  target: { entity_id: media_player.lg_webos_tv_oled77c35la }

            # Snapshot Denon (HT_2) source
            - action: input_text.set_value
              target: { entity_id: input_text.doorbell_return_source }
              data:
                value: "{{ state_attr('media_player.home_theater_2', 'source') }}"

            # Announce
            - action: music_assistant.play_announcement
              target: { entity_id: media_player.ma_home_theater }
              data:
                url: "https://ha.karunagath.in/local/sounds/doorbell-chimes.mp3"
                announce_volume: 60

            # Restore HT_2 (Denon) source
            - delay: "00:00:10"
            - action: media_player.select_source
              target: { entity_id: media_player.home_theater_2 }
              data:
                source: "{{ states('input_text.doorbell_return_source') }}"

            # Resume TV
            - if:
                - condition: state
                  entity_id: media_player.lg_webos_tv_oled77c35la
                  state: "paused"
              then:
                - action: media_player.media_play_pause
                  target: { entity_id: media_player.lg_webos_tv_oled77c35la }

            # Notify present people
            - if:
                - condition: template
                  value_template: "{{ anjali_home }}"
              then:
                - action: notify.send_message
                  target: { entity_id: notify.anjalis_iphone }
                  data: { title: "Front Door", message: "Someone is knocking at the front door." }
            - if:
                - condition: template
                  value_template: "{{ arun_home }}"
              then:
                - action: notify.send_message
                  target: { entity_id: notify.iphone }
                  data: { title: "Front Door", message: "Someone is knocking at the front door." }

          # If no one home: Notify all phones
          else:
            - action: script.notify_all_phones
              data: { title: "Front Door", message: "Someone is knocking at the front door." }

        # Cooldown delay to prevent rapid back-to-back announcements
        - delay: "00:00:30"
  mode: single

- id: front_door_knock_lights
  alias: "Front Door: Knock Lights"
  description: Handles smart lighting logic for the front entrance when someone knocks.
  trigger:
    - platform: state
      entity_id: binary_sensor.front_door_knock_vibration
      to: "on"
      id: knock
    # An HA restart mid-sequence (waiting on motion, door-open, or the
    # final off-delay) loses that wait entirely, stranding a switch on
    # with nothing left to turn it off. Doesn't try to reconstruct which
    # stage was interrupted — just falls back to the same close-then-
    # delay safety net a normal completed knock would end with.
    - platform: homeassistant
      event: start
      id: startup
  action:
    - choose:
        - conditions:
            - condition: trigger
              id: startup
            - condition: or
              conditions:
                - condition: state
                  entity_id: switch.front_entrance_double_switch_left
                  state: "on"
                - condition: state
                  entity_id: switch.front_entrance_double_switch_right
                  state: "on"
          sequence:
            - if:
                - condition: state
                  entity_id: binary_sensor.front_door_open
                  state: "on"
              then:
                - wait_for_trigger:
                    - platform: state
                      entity_id: binary_sensor.front_door_open
                      to: "off"
            - delay: "00:10:00"
            - action: switch.turn_off
              target:
                entity_id:
                  - switch.front_entrance_double_switch_right
                  - switch.front_entrance_double_switch_left
      default:
        # 1. Wait 2 seconds to let contact/lock sensor state settle
        - delay: "00:00:02"

        # 2. Check if this was a valid knock (door is closed, and was not recently opened/closed/locked/unlocked)
        - if: *valid_knock_check
          then:
            # Was gated on schedule.sleep (fixed clock, not sun-relative) —
            # turned this on in broad Swedish-summer daylight. Use sun.sun.
            - if:
                - condition: state
                  entity_id: sun.sun
                  state: below_horizon
              then:
                - action: switch.turn_on
                  target:
                    entity_id: switch.front_entrance_double_switch_right

            # Entrance Light: Turn on only if motion detected after knock (someone going to the door)
            - wait_for_trigger:
                - platform: state
                  entity_id: binary_sensor.hue_pir_hallway_occupancy
                  to: "on"
              timeout: "00:02:00"
            - if:
                - condition: template
                  value_template: "{{ wait.trigger is not none }}"
              then:
                - action: switch.turn_on
                  target:
                    entity_id: switch.front_entrance_double_switch_left

            # Auto-off logic
            - wait_for_trigger:
                - platform: state
                  entity_id: binary_sensor.front_door_open
                  to: "on"
              timeout: "00:10:00"

            - if:
                - condition: template
                  value_template: "{{ wait.trigger is none }}"
              then:
                # No door open within 10 mins of knock - turn off both lights
                - action: switch.turn_off
                  target:
                    entity_id:
                      - switch.front_entrance_double_switch_right
                      - switch.front_entrance_double_switch_left
              else:
                # Door was opened! Now wait for it to be closed.
                - wait_for_trigger:
                    - platform: state
                      entity_id: binary_sensor.front_door_open
                      to: "off"
                # 10 min delay after door close before turning off
                - delay: "00:10:00"
                - action: switch.turn_off
                  target:
                    entity_id:
                      - switch.front_entrance_double_switch_right
                      - switch.front_entrance_double_switch_left
  mode: restart

- id: front_door_open_entrance_light
  alias: "Front Door: Entrance light on open (dark)"
  description: >-
    Turns on the interior entrance light whenever the front door opens
    and it's dark - sun below horizon OR sensor.toilet_occupancy_illuminance
    reading low (that sensor's range - near 0 lux at night, hundreds to
    thousands in daylight, confirmed via Prometheus history - also
    catches overcast daytime dimness sun.sun alone would miss). Stays
    on for as long as the door is open: the 10-min countdown only
    starts once the door closes, so propping it open holds the light
    rather than racing it off. mode: restart so a fresh door-open
    cancels any pending off and starts the wait over.
  triggers:
  - entity_id: binary_sensor.front_door_open
    to: "on"
    trigger: state
    id: door_open
  # An HA restart mid-wait (door still open, or mid off-delay after it
  # closed) loses that wait entirely, stranding the light on with
  # nothing left to turn it off — resume from whichever state we're in.
  - trigger: homeassistant
    event: start
    id: startup
  actions:
  - choose:
      - conditions:
          - condition: trigger
            id: door_open
          - condition: or
            conditions:
            - condition: state
              entity_id: sun.sun
              state: below_horizon
            - condition: numeric_state
              entity_id: sensor.toilet_occupancy_illuminance
              below: 30
        sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.front_entrance_double_switch_left
          - wait_for_trigger:
            - entity_id: binary_sensor.front_door_open
              to: "off"
              trigger: state
          - delay: "00:10:00"
          - action: switch.turn_off
            target:
              entity_id: switch.front_entrance_double_switch_left
      - conditions:
          - condition: trigger
            id: startup
          - condition: state
            entity_id: binary_sensor.front_door_open
            state: "on"
        sequence:
          # Door was already open when HA restarted — resume waiting for
          # it to close, then the usual 10-min delay before off.
          - wait_for_trigger:
            - entity_id: binary_sensor.front_door_open
              to: "off"
              trigger: state
          - delay: "00:10:00"
          - action: switch.turn_off
            target:
              entity_id: switch.front_entrance_double_switch_left
      - conditions:
          - condition: trigger
            id: startup
          - condition: state
            entity_id: binary_sensor.front_door_open
            state: "off"
          - condition: state
            entity_id: switch.front_entrance_double_switch_left
            state: "on"
        sequence:
          # Door already closed before restart — resume the remaining
          # off-delay instead of waiting a fresh 10 minutes.
          - delay: >-
              {{ [0, 600 - (as_timestamp(now()) - as_timestamp(states.binary_sensor.front_door_open.last_changed))] | max }}
          - action: switch.turn_off
            target:
              entity_id: switch.front_entrance_double_switch_left
  mode: restart
