type: custom:command-centre
title: System
path: system-health
icon: mdi:server
max_columns: 3
sections:
- !include ../rail.yaml
- type: grid
  cards:
  - type: heading
    heading: Compute
    icon: mdi:cpu-64-bit
    heading_style: title
    badges:
    - type: entity
      entity: sensor.system_monitor_last_boot
  - type: custom:mushroom-template-card
    primary: Maintenance
    secondary: "Batteries, devices not reporting"
    icon: mdi:wrench
    tap_action:
      action: navigate
      navigation_path: /dashboard-home/dash-maintenance
    grid_options:
      columns: full
  - type: custom:health-metric-card
    entity: sensor.system_monitor_processor_use
    name: CPU
    icon: mdi:cpu-64-bit
    color: "#ff9f6b"
    decimals: 0
    show_date: false
    chart:
      type: line
      days: 7
    delta:
      mode: range
      decimals: 0
    items:
    - entity: sensor.system_monitor_processor_temperature
      name: Temperature
      mode: now
      days: 7
      decimals: 0
      unit: "°C"
      color: "#ff7b7b"
    - entity: sensor.system_monitor_load_1m
      name: Load 1 min
      mode: now
      days: 7
      decimals: 2
      unit: ""
      color: "#c9a7e8"
    popup:
      graphs:
      - name: CPU use
        entities:
        - sensor.system_monitor_processor_use
        days: 7
      - name: Temperature
        entities:
        - sensor.system_monitor_processor_temperature
        days: 7
      - name: Load average
        entities:
        - entity: sensor.system_monitor_load_1m
          name: 1 min
        - entity: sensor.system_monitor_load_5m
          name: 5 min
        - entity: sensor.system_monitor_load_15m
          name: 15 min
        days: 7
    grid_options:
      columns: 12
  - type: heading
    heading: Internet
    icon: mdi:web
    heading_style: title
  - type: custom:status-row-card
    grid_options:
      columns: 12
    layout: chips
    head:
    - entity: binary_sensor.office_room_ex3600_t0_wan_status
      name: ""
      icon: mdi:web
      labels:
        "on": Online
        "off": Offline
      colors:
        "on": success
        "off": error
    - entity: sensor.office_room_ex3600_t0_external_ip
      name: ""
      icon: mdi:ip-network
    spark:
      title: Last 24 h
      hours: 24
      scale: 0.008192
      unit: Mbit/s
      decimals: 1
      series:
      - entity: sensor.office_room_ex3600_t0_download_speed
        name: Download
      - entity: sensor.office_room_ex3600_t0_upload_speed
        name: Upload
    items:
    - entity: sensor.wan_speed
      name: ""
      icon: mdi:swap-vertical
    - entity: sensor.wan_down_this_month
      name: Month
      icon: mdi:lan-disconnect
    - entity: sensor.wan_down_this_year
      name: Year
  - type: heading
    heading: Powerline
    icon: mdi:power-plug
    heading_style: title
  - type: custom:status-row-card
    grid_options:
      columns: 12
    layout: chips
    head:
    - entity: binary_sensor.network_powerline_network_network_problem
      name: ""
      icon: mdi:power-plug
      labels:
        "off": Healthy
        "on": Problem
      colors:
        "off": success
        "on": error
    - entity: sensor.network_powerline_network_adapters_online
      name: ""
      icon: mdi:connection
      labels:
        "2": 2/2
        "1": 1/2
        "0": 0/2
      colors:
        "2": success
        other: warning
    - entity: sensor.network_powerline_network_slowest_link
      name: ""
      icon: mdi:speedometer
      unit: true
      align: end
    spark:
      title: Last 24 h
      hours: 24
      unit: Mbit/s
      series:
      - entity: sensor.network_powerline_97_62_9f_tx_rate
        name: To AP
      - entity: sensor.network_powerline_97_62_8f_tx_rate
        name: To router
    items:
    - entity: binary_sensor.network_powerline_97_62_9f_status
      name: Router side
      icon: mdi:router-network
      hide_when:
      - "on"
      labels:
        "on": Online
        "off": Offline
      colors:
        "on": success
        "off": error
    - entity: binary_sensor.network_powerline_97_62_8f_status
      name: AP side
      icon: mdi:access-point
      hide_when:
      - "on"
      labels:
        "on": Online
        "off": Offline
      colors:
        "on": success
        "off": error
  - type: heading
    heading: Network devices
    icon: mdi:lan
    heading_style: title
  - type: custom:status-row-card
    grid_options:
      columns: 12
    layout: chips
    items:
    - entity: binary_sensor.network_d_link
      name: D-Link
      icon: mdi:wifi
      labels:
        "on": Online
        "off": Offline
      colors:
        "on": success
        "off": error
    - entity: binary_sensor.network_surasa
      name: Surasa
      icon: mdi:raspberry-pi
      labels:
        "on": Online
        "off": Offline
      colors:
        "on": success
        "off": error
- type: grid
  cards:
  - type: heading
    heading: Memory and storage
    icon: mdi:memory
    heading_style: title
  - type: custom:health-metric-card
    entity: sensor.system_monitor_memory_use
    name: Memory
    icon: mdi:memory
    color: "#6bb6ff"
    decimals: 1
    scale: 0.0009765625
    unit: GiB
    secondary:
      entity: sensor.system_monitor_memory_usage
      inline: true
      decimals: 0
      unit: " %"
    show_date: false
    chart:
      type: line
      days: 7
      scale: 0.0009765625
    delta:
      mode: range
      decimals: 1
    items:
    - entity: sensor.system_monitor_swap_usage
      name: Swap
      mode: now
      days: 7
      decimals: 0
      unit: "%"
      color: "#9fa8ff"
    popup:
      graphs:
      - name: Memory use
        entities:
        - sensor.system_monitor_memory_usage
        days: 7
      - name: Swap use
        entities:
        - sensor.system_monitor_swap_usage
        days: 7
    grid_options:
      columns: 12
  - type: custom:health-metric-card
    entity: sensor.system_monitor_disk_use
    name: Disk
    icon: mdi:harddisk
    color: "#8fd9c0"
    decimals: 1
    secondary:
      entity: sensor.system_monitor_disk_usage
      inline: true
      decimals: 1
      unit: " %"
    show_date: false
    chart:
      type: line
      days: 7
    delta:
      mode: absolute
      decimals: 1
    items:
    - entity: sensor.system_monitor_disk_free
      name: Free
      mode: now
      growth: true
      good: up
      days: 7
      decimals: 0
      color: "#8fd9c0"
    popup:
      graphs:
      - name: Disk used
        entities:
        - sensor.system_monitor_disk_use
        days: 7
      - name: Disk used (percent)
        entities:
        - sensor.system_monitor_disk_usage
        days: 7
    grid_options:
      columns: 12
  - type: custom:health-metric-card
    entity: sensor.zfs_tank_used_gib
    name: ZFS tank
    icon: mdi:database
    color: "#8fd9c0"
    decimals: 0
    secondary:
      entity: sensor.zfs_tank_used
      inline: true
      decimals: 1
      unit: " %"
    show_date: false
    chart:
      type: line
      days: 30
    delta:
      mode: absolute
      decimals: 1
    items:
    - entity: sensor.zfs_rpool_used
      name: rpool used
      mode: now
      growth: true
      days: 7
      decimals: 1
      unit: "%"
    - entity: sensor.zfs_tank_fragmentation
      name: tank frag
      mode: now
      growth: true
      days: 7
      decimals: 0
      unit: "%"
    - entity: sensor.zfs_rpool_fragmentation
      name: rpool frag
      mode: now
      growth: true
      days: 7
      decimals: 0
      unit: "%"
    popup:
      graphs:
      - name: Tank used
        entities:
        - entity: sensor.zfs_tank_used_gib
          name: tank
        days: 30
      - name: Pool usage (percent)
        entities:
        - entity: sensor.zfs_tank_used
          name: tank
        - entity: sensor.zfs_rpool_used
          name: rpool
        days: 30
      - name: Fragmentation
        entities:
        - entity: sensor.zfs_tank_fragmentation
          name: tank
        - entity: sensor.zfs_rpool_fragmentation
          name: rpool
        days: 30
    grid_options:
      columns: 12
  - type: conditional
    conditions:
    - condition: state
      entity: binary_sensor.zfs_pool_problem
      state: "on"
    card:
      type: tile
      entity: binary_sensor.zfs_pool_problem
      name: ZFS pool problem
    grid_options:
      columns: 12
- type: grid
  cards:
  - type: heading
    heading: Server power
    icon: mdi:flash
    heading_style: title
  - type: vertical-stack
    grid_options:
      columns: full
    card_mod:
      style: |
        :host {
          --vertical-stack-card-gap: 1px;
          --stack-card-gap: 1px;
          --ha-card-border-radius: 0;
          --ha-card-border-width: 0px;
          --ha-card-box-shadow: none;
          display: block;
          overflow: hidden;
          border-radius: 12px;
          background: var(--divider-color, rgba(127, 127, 127, 0.25));
          border: 1px solid var(--ha-card-border-color, var(--divider-color, rgba(127, 127, 127, 0.25)));
        }
    cards:
    - type: custom:status-row-card
      color: "#ffd86b"
      layout: chips
      min_width: 120px
      head:
      - entity: switch.power_monitor_1
        name: Socket
        icon: mdi:power-socket-eu
        hide_when:
        - "on"
      - entity: switch.power_monitor_1_child_lock
        name: Child lock
        icon: mdi:lock-open-variant
        hide_when:
        - "on"
      - entity: select.power_monitor_1_power_on_behavior
        name: After a power cut
        icon: mdi:power-settings
        hide_when:
        - "on"
        labels:
          "on": Turns on
          "off": Stays off
      spark:
        entity: sensor.power_monitor_1_power
        title: Server power, last 24 h
        hours: 24
        hero: true
      items:
      - entity: sensor.power_monitor_1_voltage
        name: Voltage
        icon: mdi:sine-wave
        unit: true
        tap: more-info
      - entity: sensor.power_monitor_1_current
        name: Current
        icon: mdi:current-ac
        unit: true
        tap: more-info
    - type: custom:health-metric-card
      entity: sensor.power_monitor_1_energy
      name: Energy today
      icon: mdi:lightning-bolt
      color: "#ffd86b"
      decimals: 2
      hero_from: chart
      show_date: false
      chart:
        type: bar
        days: 14
        stat: change
      popup:
        graphs:
        - name: Energy per day
          entities:
          - sensor.power_monitor_1_energy
          days: 30
          stat: change
          type: bar
- type: grid
  cards:
  - type: heading
    heading: Downloads
    icon: mdi:download
    heading_style: title
  - type: custom:health-metric-card
    entity: sensor.sabnzbd_karunagath_in_speed
    name: SABnzbd
    icon: mdi:download
    color: "#6bb6ff"
    decimals: 1
    show_date: false
    chart:
      type: line
      days: 7
      stat: max
    items:
    - entity: sensor.sabnzbd_karunagath_in_queue_count
      name: Queue
      mode: now
      range: false
      days: 7
      decimals: 0
      unit: ""
    - entity: sensor.sabnzbd_karunagath_in_left_to_download
      name: Left
      mode: now
      range: false
      days: 7
      decimals: 0
    popup:
      graphs:
      - name: Speed (daily peak)
        entities:
        - sensor.sabnzbd_karunagath_in_speed
        days: 7
        stat: max
      - name: Queue
        entities:
        - sensor.sabnzbd_karunagath_in_queue_count
        days: 7
    grid_options:
      columns: 12
  - type: custom:health-metric-card
    entity: sensor.sabnzbd_karunagath_in_overall_total
    name: SABnzbd today
    icon: mdi:cloud-download-outline
    color: "#8fd9c0"
    decimals: 1
    hero_from: chart
    show_date: false
    chart:
      type: bar
      days: 14
      stat: change
    popup:
      graphs:
      - name: Downloaded per day
        entities:
        - sensor.sabnzbd_karunagath_in_overall_total
        days: 30
        stat: change
        type: bar
    grid_options:
      columns: 12
  - type: custom:health-metric-card
    entity: sensor.slskd_download_speed
    name: Soulseek
    icon: mdi:music-note-plus
    color: "#f5c28b"
    decimals: 1
    show_date: false
    chart:
      type: line
      days: 7
      stat: max
    items:
    - entity: sensor.slskd_active_downloads
      name: Active
      mode: now
      range: false
      days: 7
      decimals: 0
      unit: ""
    - entity: sensor.slskd_queued_downloads
      name: Queued
      mode: now
      range: false
      days: 7
      decimals: 0
      unit: ""
    - entity: sensor.slskd_completed_downloads
      name: Done
      mode: now
      growth: true
      days: 7
      decimals: 0
      unit: ""
    popup:
      graphs:
      - name: Speed (daily peak)
        entities:
        - sensor.slskd_download_speed
        days: 7
        stat: max
      - name: Queued and active
        entities:
        - entity: sensor.slskd_queued_downloads
          name: Queued
        - entity: sensor.slskd_active_downloads
          name: Active
        days: 7
    grid_options:
      columns: 12
  - type: custom:download-control-card
    switch: switch.sabnzbd_downloading
    number: number.sabnzbd_karunagath_in_speedlimit
    color: "#6bb6ff"
    limit_label: Limit
    grid_options:
      columns: 12
  - type: conditional
    conditions:
    - condition: state
      entity: binary_sensor.sabnzbd_karunagath_in_warnings
      state: "on"
    card:
      type: tile
      entity: binary_sensor.sabnzbd_karunagath_in_warnings
      name: SABnzbd warnings
    grid_options:
      columns: 12
- type: grid
  cards:
  - type: heading
    heading: Requests & imports
    icon: mdi:movie-search-outline
    heading_style: title
  - type: custom:health-metric-card
    entity: sensor.seerr_total_requests
    name: Seerr
    icon: mdi:movie-open-plus-outline
    color: "#c9a7e8"
    decimals: 0
    show_date: false
    chart:
      type: line
      days: 7
    items:
    - entity: sensor.seerr_processing_requests
      name: Processing
      mode: now
      range: false
      decimals: 0
      unit: ""
    - entity: sensor.seerr_film_requests
      name: Movies
      mode: now
      range: false
      decimals: 0
      unit: ""
      chips:
      - entity: sensor.radarr_download_queue
        icon: mdi:download
        name: Downloading
        color: "#6fd0a8"
      - entity: sensor.radarr_movies_unreleased
        icon: mdi:calendar-clock
        name: Not released yet
        color: "#7fb2ff"
      - entity: sensor.radarr_movies_searching
        icon: mdi:magnify-close
        name: Released, nothing found
        color: "#f0b45a"
    - entity: sensor.seerr_tv_requests
      name: TV
      mode: now
      range: false
      decimals: 0
      unit: ""
      chips:
      - entity: sensor.sonarr_download_queue
        icon: mdi:download
        name: Downloading
        color: "#6fd0a8"
      - entity: sensor.sonarr_series_incomplete
        icon: mdi:magnify-close
        name: Episodes missing
        color: "#f0b45a"
      - entity: sensor.sonarr_series_complete
        icon: mdi:check
        name: Complete
        color: "#7bd88f"
    popup:
      graphs:
      - name: Total requests
        entities:
        - sensor.seerr_total_requests
        days: 7
      - name: Pending and processing
        entities:
        - entity: sensor.seerr_pending_requests
          name: Pending
        - entity: sensor.seerr_processing_requests
          name: Processing
        days: 7
      - name: Movies and TV
        entities:
        - entity: sensor.seerr_film_requests
          name: Movies
        - entity: sensor.seerr_tv_requests
          name: TV
        days: 7
      - name: Movies by state
        entities:
        - entity: sensor.radarr_download_queue
          name: Downloading
        - entity: sensor.radarr_movies_unreleased
          name: Not released yet
        - entity: sensor.radarr_movies_searching
          name: Released, nothing found
        days: 7
      - name: TV by state
        entities:
        - entity: sensor.sonarr_download_queue
          name: Downloading
        - entity: sensor.sonarr_series_incomplete
          name: Episodes missing
        - entity: sensor.sonarr_series_complete
          name: Complete
        days: 7
    grid_options:
      columns: 12
  - type: custom:health-metric-card
    entity: sensor.arr_queue_total
    name: Arr queues
    icon: mdi:package-down
    color: "#6bb6ff"
    decimals: 0
    show_date: false
    chart:
      type: line
      days: 7
    items:
    - entity: sensor.lidarr_download_queue
      name: Lidarr
      mode: now
      range: false
      days: 7
      decimals: 0
      unit: ""
    - entity: sensor.radarr_download_queue
      name: Radarr
      mode: now
      range: false
      days: 7
      decimals: 0
      unit: ""
    - entity: sensor.sonarr_download_queue
      name: Sonarr
      mode: now
      range: false
      days: 7
      decimals: 0
      unit: ""
    popup:
      graphs:
      - name: Queues
        entities:
        - entity: sensor.lidarr_download_queue
          name: Lidarr
        - entity: sensor.radarr_download_queue
          name: Radarr
        - entity: sensor.sonarr_download_queue
          name: Sonarr
        days: 7
    grid_options:
      columns: 12
  - type: conditional
    conditions:
    - condition: numeric_state
      entity: sensor.seerr_pending_requests
      above: 0
    card:
      type: tile
      entity: sensor.seerr_pending_requests
      name: Pending requests
      icon: mdi:clock-alert-outline
    grid_options:
      columns: 12
  - type: conditional
    conditions:
    - condition: numeric_state
      entity: sensor.seerr_open_issues
      above: 0
    card:
      type: tile
      entity: sensor.seerr_open_issues
      name: Open issues
      icon: mdi:alert-circle-outline
    grid_options:
      columns: 12
  - type: tile
    entity: event.seerr_last_media_event
    name: Last event
    grid_options:
      columns: 12
