bento:
  ha-card-border-radius: 20px
  ha-card-border-width: 0px
  ha-font-family-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
  modes:
    light:
      primary-background-color: "#F3F2EF"
      lovelace-background: "#F3F2EF"
      card-background-color: "#FFFFFF"
      ha-card-background: "#FFFFFF"
      primary-text-color: "#1D1D1F"
      secondary-text-color: "#5F6368"
      divider-color: "#E6E4DF"
      primary-color: "#1A4FD6"
      accent-color: "#1A4FD6"
      info-color: "#1A4FD6"
      success-color: "#16794A"
      warning-color: "#B45309"
      error-color: "#C62828"
      state-active-color: "#B7791F"
      state-light-active-color: "#B7791F"
      state-inactive-color: "#9AA0A6"
      ha-card-box-shadow: "0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04)"
    dark:
      primary-background-color: "#111214"
      lovelace-background: "#111214"
      card-background-color: "#1B1C1F"
      ha-card-background: "#1B1C1F"
      primary-text-color: "#ECEDEE"
      secondary-text-color: "#A1A4AA"
      divider-color: "#2A2C30"
      primary-color: "#7AA2FF"
      accent-color: "#7AA2FF"
      info-color: "#7AA2FF"
      success-color: "#4ADE80"
      warning-color: "#FBBF24"
      error-color: "#F87171"
      state-active-color: "#FCD34D"
      state-light-active-color: "#FCD34D"
      state-inactive-color: "#6B7076"
      ha-card-box-shadow: none
      ha-card-border-width: 1px
      ha-card-border-color: "#2A2C30"
