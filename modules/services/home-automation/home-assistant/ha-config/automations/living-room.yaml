# ── Living room ────────────────────────────────────────────────
- id: living_darkness
  alias: Living room — Darkness detection
  description: >-
    Dark while it is gloomy outside and the living room reads below 80 lux for 2 min.
  use_blueprint:
    path: local/darkness-detection.yaml
    input:
      occupancy_sensor: binary_sensor.living_room_occupancy_presence
      illuminance_sensor: sensor.living_room_occupancy_illuminance
      dark_below: 80
      light_entity: light.living_room_lights
      dark_boolean: input_boolean.living_room_is_dark

- id: living_room_lighting
  alias: Living room — Lighting
  description: >-
    Presence + darkness via the living room mmWave sensor; on from dark until bedtime while someone is home, dimmed to 20% after 30 min without presence, off when nobody is home. Brightness otherwise left to Adaptive Lighting.
  use_blueprint:
    path: local/room-presence-lighting.yaml
    input:
      light_entity: light.living_room_lights
      occupancy_sensor: binary_sensor.living_room_occupancy_presence
      motion_sensor: binary_sensor.living_room_occupancy_presence
      dark_boolean: input_boolean.living_room_is_dark
      block_entity: binary_sensor.tv_watching
      evening_hold: true
      bedtime_off_after_minutes: 15
      bedtime_block_players:
        - media_player.lg_webos_tv_oled77c35la
        - media_player.home_theater_2
      bedtime_extra_clear_sensor: binary_sensor.ranger_duo_ptz_person_occupancy
      adaptive_lighting_switch: switch.home_adaptive_lighting_home

- id: living_room_media_aware
  alias: Living room — Media-aware lighting
  description: >-
    Turns off living+dining lights when Litefin/Moonfin/Jellyfin/Apple TV plays;
    restores full brightness when the film stops or the TV leaves those apps
    (skips a room only if its presence sensor reads a definite off). On pause, dims living room to 20% at
    15s, then hands it back to Adaptive Lighting at 38s. Off during party mode.
  triggers:
  - entity_id: binary_sensor.tv_watching
    to: "on"
    not_from: [unavailable, unknown]
    trigger: state
    id: playing
  - entity_id: binary_sensor.tv_watching
    from: "on"
    to: "off"
    trigger: state
    id: ended
  conditions:
  - condition: state
    entity_id: input_boolean.party_mode
    state: "off"
  - condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.living_room_is_dark
      state: "on"
    - condition: state
      entity_id: input_boolean.dining_is_dark
      state: "on"
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: playing
      sequence:
      - target:
          entity_id:
          - light.living_room_lights
          - light.dining_lights
        data:
          transition: 2
        action: light.turn_off
    - conditions:
      - condition: trigger
        id: ended
      - condition: not
        conditions:
        - condition: state
          entity_id: media_player.lg_webos_tv_oled77c35la
          state: [paused, unavailable, unknown]
      - condition: state
        entity_id: schedule.sleep
        state: "off"
      sequence:
      - delay: "00:00:30"
      - if:
        - condition: not
          conditions:
          - condition: state
            entity_id: binary_sensor.living_room_occupancy_presence
            state: "off"
        then:
        - target:
            entity_id: light.living_room_lights
          data:
            transition: 60
          action: light.turn_on
      - target:
          entity_id: light.dining_lights
        data:
          transition: 60
        action: light.turn_on
    - conditions:
      - condition: trigger
        id: ended
      - condition: state
        entity_id: media_player.lg_webos_tv_oled77c35la
        state: paused
      - condition: state
        entity_id: schedule.sleep
        state: "off"
      sequence:
      - delay: "00:00:15"
      - repeat:
          for_each:
          - light.living_room_lights
          - light.dining_lights
          sequence:
          - if:
            - condition: template
              value_template: "{{ is_state(repeat.item, 'off') }}"
            then:
            - target:
                entity_id: "{{ repeat.item }}"
              data:
                brightness_pct: 20
                transition: 10
              action: light.turn_on
            - target:
                entity_id: switch.home_adaptive_lighting_home
              data:
                lights: "{{ repeat.item }}"
                manual_control: true
              action: adaptive_lighting.set_manual_control
      - delay: "00:00:23"
      - target:
          entity_id: switch.home_adaptive_lighting_home
        data:
          lights:
          - light.living_room_lights
          - light.dining_lights
          manual_control: false
        action: adaptive_lighting.set_manual_control
  mode: restart
