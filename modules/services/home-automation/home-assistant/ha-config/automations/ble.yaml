# ── BLE integration reload stopgap ──────────────────────────────
- id: ble_integrations_periodic_reload
  alias: "BLE integrations: periodic reload (range/stability stopgap)"
  description: >-
    Reloads the PlejD BLE integration every 30min — marginal range, it
    doesn't reconnect cleanly on its own.
  triggers:
  - trigger: time_pattern
    minutes: "/30"
  actions:
  - action: homeassistant.reload_config_entry
    target:
      entity_id: light.hallway_hall_lights
  mode: single
