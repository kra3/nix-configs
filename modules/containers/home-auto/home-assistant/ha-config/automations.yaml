# ── Living room ────────────────────────────────────────────────
- id: living_room_lighting
  alias: Living room — Lighting
  description: >-
    On at 30% when dark, off at sleep.
  triggers:
  - entity_id: input_boolean.hall_is_dark
    to: "on"
    trigger: state
    id: became_dark
  - entity_id: schedule.sleep
    to: "on"
    trigger: state
    id: sleep_started
  conditions:
  - condition: state
    entity_id: input_boolean.hall_is_dark
    state: "on"
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sleep_started
      sequence:
      - target:
          entity_id: light.living_room_lights
        data:
          brightness_pct: 15
          transition: 3
        action: light.turn_on
      - delay: "00:00:30"
      - target:
          entity_id: light.living_room_lights
        data:
          transition: 2
        action: light.turn_off
    default:
    - target:
        entity_id: light.living_room_lights
      data:
        brightness_pct: 30
        transition: 1
      action: light.turn_on
