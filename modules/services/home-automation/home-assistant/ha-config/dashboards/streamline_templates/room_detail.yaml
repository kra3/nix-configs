default:
- icon: mdi:door
- light: ""
- scene: ""
- comfort: ""
- temperature: ""
- humidity: ""
- dew: ""
- approx: ""
card:
  type: vertical-stack
  cards:
  - type: heading
    heading: "[[name]]"
    icon: "[[icon]]"
    heading_style: title
  - type: conditional
    conditions:
    - condition: state
      entity: "[[light]]"
      state_not: unavailable
    card:
      type: custom:mushroom-light-card
      entity: "[[light]]"
      name: Lights
      fill_container: true
      use_light_color: true
      show_brightness_control: true
      show_color_temp_control: true
      show_color_control: true
      collapsible_controls: true
      tap_action:
        action: toggle
      hold_action:
        action: more-info
  - type: conditional
    conditions:
    - condition: state
      entity: "[[scene]]"
      state_not: unavailable
    card:
      type: custom:scene-picker-card
      entity: "[[scene]]"
      name: Scene
  - type: conditional
    conditions:
    - condition: state
      entity: "[[light]]"
      state_not: unavailable
    - condition: state
      entity: binary_sensor.lights_in_manual_control
      state: "on"
    card:
      type: tile
      entity: script.lights_hand_back
      name: Hand all lights back
      icon: mdi:theme-light-dark
      hide_state: true
      tap_action:
        action: toggle
        confirmation:
          text: Hand every light back to Adaptive and reset the Living and Office scenes?
  - type: conditional
    conditions:
    - condition: state
      entity: "[[comfort]]"
      state_not: unavailable
    card:
      type: custom:climate-room-card
      name: Climate
      icon: mdi:home-thermometer
      comfort: "[[comfort]]"
      temperature: "[[temperature]]"
      humidity: "[[humidity]]"
      dew: "[[dew]]"
      approx: "[[approx]]"
  - type: conditional
    conditions:
    - condition: state
      entity: "[[temperature]]"
      state_not:
      - unavailable
      - unknown
    card:
      type: custom:health-metric-card
      entity: "[[temperature]]"
      name: Temperature
      icon: mdi:thermometer
      decimals: 1
      show_date: false
      chart:
        type: line
        days: 7
      delta:
        mode: range
        decimals: 1
        unit: auto
  - type: conditional
    conditions:
    - condition: state
      entity: "[[humidity]]"
      state_not:
      - unavailable
      - unknown
    card:
      type: custom:health-metric-card
      entity: "[[humidity]]"
      name: Humidity
      icon: mdi:water-percent
      decimals: 0
      show_date: false
      chart:
        type: line
        days: 7
      delta:
        mode: range
        decimals: 0
        unit: auto
  - type: custom:mushroom-template-card
    primary: Why is it on?
    icon: mdi:head-lightbulb-outline
    fill_container: true
    tap_action:
      action: fire-dom-event
      cc_detail:
        type: custom:streamline-card
        template: light_logic
        variables:
          room: "[[name]]"
