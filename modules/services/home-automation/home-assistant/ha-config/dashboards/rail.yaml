cc_slot: rail
type: grid
cards:
- type: custom:streamline-card
  template: home_hero
  grid_options:
    columns: full
  visibility:
  - condition: user
    users:
    - a1d4401b8b714ebb83f07c5316ab399c
    - 6edcc5a09c3144d684077ee362e7394a
- type: custom:streamline-card
  template: home_hero
  variables:
    name: Vasudha
  grid_options:
    columns: full
  visibility:
  - condition: not
    conditions:
    - condition: user
      users:
      - a1d4401b8b714ebb83f07c5316ab399c
      - 6edcc5a09c3144d684077ee362e7394a
- type: custom:alarmo-card
  entity: alarm_control_panel.vasudha_secure
  name: Alarm
  use_code_dialog: true
  states:
    armed_home:
      hide: true
    armed_custom_bypass:
      hide: true
  grid_options:
    columns: full
- type: tile
  entity: input_boolean.party_mode
  name: Party mode
  icon: mdi:party-popper
- type: tile
  entity: input_boolean.automations_paused
  name: Manual mode
  icon: mdi:pause-circle
  visibility:
  - condition: user
    users:
    - a1d4401b8b714ebb83f07c5316ab399c
- type: tile
  entity: input_boolean.bedroom_nap
  name: Bedroom nap
  icon: mdi:power-sleep
- type: custom:trip-card
  entity: sensor.arun_work_trips
  person: person.arun_karunagath
  direction: work
  hide_at: zone.work
  settings: &trip_settings
  - input_select.transit_max_changes
  - input_select.transit_modes
  - input_select.transit_walking
  visibility: &arun_only
  - condition: user
    users:
    - a1d4401b8b714ebb83f07c5316ab399c
- type: custom:trip-card
  entity: sensor.arun_home_trips
  person: person.arun_karunagath
  direction: home
  hide_at: zone.home
  settings: *trip_settings
  visibility: *arun_only
- type: custom:trip-card
  entity: sensor.arun_event_trips
  person: person.arun_karunagath
  calendars: &event_calendars
  - calendar.kuttunbn
  settings: *trip_settings
  visibility:
  - condition: user
    users:
    - a1d4401b8b714ebb83f07c5316ab399c
- type: custom:trip-card
  entity: sensor.anjali_work_trips
  person: person.anjalipc
  direction: work
  hide_at: zone.work_smil
  settings: *trip_settings
  visibility: &anjali_only
  - condition: user
    users:
    - 6edcc5a09c3144d684077ee362e7394a
- type: custom:trip-card
  entity: sensor.anjali_home_trips
  person: person.anjalipc
  direction: home
  hide_at: zone.home
  settings: *trip_settings
  visibility: *anjali_only
- type: custom:trip-card
  entity: sensor.anjali_event_trips
  person: person.anjalipc
  calendars: *event_calendars
  settings: *trip_settings
  visibility:
  - condition: user
    users:
    - 6edcc5a09c3144d684077ee362e7394a
