- id: light_scene_living
  alias: "Lights: living room scene"
  description: >-
    Applies the chosen scene to the living room bulbs and keeps Adaptive
    Lighting from overwriting it; Auto hands the bulbs back to Adaptive Lighting.
  triggers:
  - trigger: state
    entity_id: input_text.living_scene
  conditions:
  - condition: template
    value_template: "{{ trigger.from_state.state not in ['unavailable', 'unknown'] }}"
  variables:
    scene: "{{ trigger.to_state.state }}"
    bulbs:
    - light.living_room_light_1
    - light.living_room_light_2
    - light.living_room_light_3
    - light.living_room_light_4
    - light.living_room_light_5
  actions:
  - choose:
    - conditions: "{{ scene == 'Auto' }}"
      sequence:
      - action: adaptive_lighting.set_manual_control
        target:
          entity_id: switch.home_adaptive_lighting_home
        data:
          lights: "{{ bulbs }}"
          manual_control: false
      - action: adaptive_lighting.apply
        target:
          entity_id: switch.home_adaptive_lighting_home
        data:
          lights: "{{ bulbs }}"
          turn_on_lights: false
    - conditions: "{{ scene | regex_match('^[0-9a-f-]{36}$') }}"
      sequence:
      - action: adaptive_lighting.set_manual_control
        target:
          entity_id: switch.home_adaptive_lighting_home
        data:
          lights: "{{ bulbs }}"
          manual_control: true
      - action: scene_presets.apply_preset
        data:
          preset_id: "{{ scene }}"
          targets:
            entity_id: "{{ bulbs }}"
          transition: 2
  mode: queued

