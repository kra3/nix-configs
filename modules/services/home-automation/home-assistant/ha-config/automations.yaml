  mode: single

# ── Wake-up ────────────────────────────────────────────────────
- id: wakeup_lighting
  alias: Wake-up — Gradual lighting
  description: >-
    When sleep schedule ends, gradually brighten bedroom and hall
    over 10 minutes. Disarm Alarmo.
  triggers:
  - entity_id: schedule.sleep
    to: "off"
    trigger: state
  actions:
  - action: alarm_control_panel.alarm_disarm
    target:
      entity_id: alarm_control_panel.vasudha_secure
  - target:
      entity_id:
      - light.bedroom_wardrobe_lights
      - light.hall
    data:
      brightness_pct: 5
      transition: 1
    action: light.turn_on
  - delay: "00:02:00"
  - target:
      entity_id:
      - light.bedroom_wardrobe_lights
      - light.hall
    data:
      brightness_pct: 15
      transition: 60
    action: light.turn_on
  - delay: "00:03:00"
  - target:
      entity_id:
      - light.bedroom_wardrobe_lights
      - light.hall
    data:
      brightness_pct: 40
      transition: 60
    action: light.turn_on
  - delay: "00:05:00"
  - target:
      entity_id:
      - light.bedroom_wardrobe_lights
      - light.hall
    data:
      brightness_pct: 60
      transition: 60
    action: light.turn_on
  mode: single

