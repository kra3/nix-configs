timer:
  vacation_sim_step:
    duration: "00:20:00"
    restore: true

input_select:
  vacation_sim_phase:
    name: Vacation simulation phase
    icon: mdi:home-clock-outline
    options:
      - idle
      - evening
      - bedtime_wait
      - bedroom

template:
  - binary_sensor:
      - name: "Vacation simulation active"
        unique_id: vacation_simulation_active
        icon: mdi:home-clock-outline
        state: >-
          {{ is_state('alarm_control_panel.vasudha_secure', 'armed_vacation')
             and states('zone.home') | int(1) == 0 }}

script:
  vacation_sim_step:
    alias: "Vacation: switch to the next simulated light set"
    description: >-
      Lights the given set (by default one weighted by time of day, an
      empty set being a dark gap), switches the other simulated lights
      off, logs the step and schedules the next one. minutes 0 stops.
    fields:
      pick:
        description: Lights to turn on; omit for a random set.
        example: "['light.bedroom_wardrobe_lights']"
      minutes:
        description: Minutes until the next step; 0 turns the simulated lights off and cancels it.
        example: 15
    variables:
      sim_lights:
        - light.living_room_lights
        - light.dining_lights
        - light.kitchen_lights
        - light.office_room_light
        - light.bedroom_wardrobe_lights
        - light.hallway_hall_lights
      sets: >-
        {%- set h = now().hour -%}
        {%- if h < 12 -%}
          {{ [['light.kitchen_lights'], ['light.kitchen_lights', 'light.hallway_hall_lights'],
              ['light.kitchen_lights', 'light.dining_lights'], ['light.office_room_light'], []] }}
        {%- elif h < 17 -%}
          {{ [['light.office_room_light'], ['light.office_room_light'], ['light.living_room_lights'],
              ['light.kitchen_lights'], []] }}
        {%- elif h < 20 -%}
          {{ [['light.kitchen_lights', 'light.dining_lights'], ['light.kitchen_lights', 'light.dining_lights'],
              ['light.living_room_lights', 'light.kitchen_lights', 'light.hallway_hall_lights'],
              ['light.living_room_lights', 'light.dining_lights'], []] }}
        {%- else -%}
          {{ [['light.living_room_lights'], ['light.living_room_lights'],
              ['light.living_room_lights', 'light.hallway_hall_lights'],
              ['light.living_room_lights', 'light.dining_lights'],
              ['light.kitchen_lights', 'light.hallway_hall_lights'], []] }}
        {%- endif -%}
      lights: "{{ [] if minutes is defined and minutes | int == 0 else pick if pick is defined else sets | random }}"
      mins: >-
        {{ minutes | int if minutes is defined
           else (range(10, 41) | random if lights | count > 0 else range(5, 16) | random) }}
    sequence:
      - if: "{{ mins | int > 0 }}"
        then:
          - action: timer.start
            target:
              entity_id: timer.vacation_sim_step
            data:
              duration: "{{ mins | int * 60 }}"
        else:
          - action: timer.cancel
            target:
              entity_id: timer.vacation_sim_step
      - action: light.turn_off
        continue_on_error: true
        target:
          entity_id: "{{ sim_lights | reject('in', lights) | list }}"
        data:
          transition: 2
      - if: "{{ lights | count > 0 }}"
        then:
          - action: light.turn_on
            continue_on_error: true
            target:
              entity_id: "{{ lights }}"
      - action: logbook.log
        data:
          name: Vacation simulation
          message: >-
            {{ lights | map('state_attr', 'friendly_name') | join(', ') if lights else 'all dark' }}{{ ' for ' ~ mins ~ ' min' if mins | int > 0 else '' }}

automation:
  - id: vacation_presence_simulation
    alias: "Vacation: simulate presence with the lights"
    description: >-
      While binary_sensor.vacation_simulation_active is on (armed vacation,
      house empty): 0-40 min after it turns gloomy, lights a living,
      dining, kitchen, office or hall set weighted by time of day,
      changing every 10-40 min with occasional 5-15 min dark gaps. 0-40
      min after bedtime only the bedroom light comes on for 10-25 min,
      then the house stays dark until wake-up. Lights go off when it gets
      bright; nothing is touched once someone is home or it is disarmed.
      Turns all lights off when it takes over. Steps are logged.
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.vacation_sim_step
        id: step
      - entity_id: binary_sensor.gloomy_outside
        to: "on"
        trigger: state
        id: gloomy
      - entity_id: binary_sensor.gloomy_outside
        to: "off"
        trigger: state
        id: bright
      - entity_id: schedule.sleep
        to: "on"
        trigger: state
        id: bedtime
      - entity_id: schedule.sleep
        to: "off"
        trigger: state
        id: rederive
      - entity_id: binary_sensor.vacation_simulation_active
        not_from:
          - unknown
          - unavailable
        to:
          - "on"
          - "off"
        for: "00:00:30"
        trigger: state
        id: rederive
      - trigger: homeassistant
        event: start
        id: startup
    variables:
      active: "{{ is_state('binary_sensor.vacation_simulation_active', 'on') }}"
      evening: "{{ is_state('binary_sensor.gloomy_outside', 'on') and is_state('schedule.sleep', 'off') }}"
      phase: "{{ states('input_select.vacation_sim_phase') }}"
      jitter: "{{ (range(1, 41) | random) * 60 }}"
    actions:
      - choose:
          - conditions: "{{ not active }}"
            sequence:
              - action: timer.cancel
                target:
                  entity_id: timer.vacation_sim_step
              - action: input_select.select_option
                target:
                  entity_id: input_select.vacation_sim_phase
                data:
                  option: idle
          - conditions: "{{ trigger.id in ['rederive', 'startup'] }}"
            sequence:
              - condition: template
                value_template: "{{ trigger.id != 'startup' or is_state('timer.vacation_sim_step', 'idle') }}"
              - action: light.turn_off
                continue_on_error: true
                target:
                  entity_id: all
              - action: input_select.select_option
                target:
                  entity_id: input_select.vacation_sim_phase
                data:
                  option: "{{ 'evening' if evening else 'idle' }}"
              - if: "{{ evening }}"
                then:
                  - action: script.vacation_sim_step
                else:
                  - action: script.vacation_sim_step
                    data:
                      minutes: 0
          - conditions: "{{ trigger.id == 'gloomy' and phase == 'idle' and evening }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.vacation_sim_phase
                data:
                  option: evening
              - action: timer.start
                target:
                  entity_id: timer.vacation_sim_step
                data:
                  duration: "{{ jitter }}"
          - conditions: "{{ trigger.id == 'bright' and phase == 'evening' }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.vacation_sim_phase
                data:
                  option: idle
              - action: script.vacation_sim_step
                data:
                  minutes: 0
          - conditions: "{{ trigger.id == 'bedtime' and phase == 'evening' }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.vacation_sim_phase
                data:
                  option: bedtime_wait
              - action: timer.start
                target:
                  entity_id: timer.vacation_sim_step
                data:
                  duration: "{{ jitter }}"
          - conditions: "{{ trigger.id == 'step' and phase == 'evening' }}"
            sequence:
              - action: script.vacation_sim_step
          - conditions: "{{ trigger.id == 'step' and phase == 'bedtime_wait' }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.vacation_sim_phase
                data:
                  option: bedroom
              - action: script.vacation_sim_step
                data:
                  pick:
                    - light.bedroom_wardrobe_lights
                  minutes: "{{ range(10, 26) | random }}"
          - conditions: "{{ trigger.id == 'step' and phase == 'bedroom' }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.vacation_sim_phase
                data:
                  option: idle
              - action: script.vacation_sim_step
                data:
                  minutes: 0
    mode: queued
