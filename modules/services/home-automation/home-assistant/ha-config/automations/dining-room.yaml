# ── Dining room ────────────────────────────────────────────────
- id: dining_darkness
  alias: Dining room — Darkness detection
  description: >-
    Hysteresis darkness state machine for dining, using the house-wide
    average illuminance (dining has no illuminance sensor of its own)
    rather than hall_is_dark — dining is one of the brightest rooms, so
    gating it on the hall's dim interior PIR reading (which can read
    dark at midday, see hall.yaml) turned dining lights on in broad
    daylight. dark_below raised to 45 — blueprint's 30 default was slow to
    trip on cloudy-evening drops (stuck above 30 at 44 lux, occupied).
  use_blueprint:
    path: local/darkness-detection.yaml
    input:
      illuminance_sensor: sensor.average_illuminance
      occupancy_sensor: binary_sensor.ranger_duo_ptz_person_occupancy
      light_entity: light.dining_lights
      dark_boolean: input_boolean.dining_is_dark
      dark_below: 45

- id: dining_room_lighting
  alias: Dining room — Lighting
  description: >-
    Presence + darkness via ranger_duo_ptz's Frigate person detection
    (was hall_is_dark-only edge-triggered; motion PIR/PTZ verified firing
    reliably for this camera). Manual override via STYRBAR double-tap.
  use_blueprint:
    path: local/room-presence-lighting.yaml
    input:
      light_entity: light.dining_lights
      occupancy_sensor: binary_sensor.ranger_duo_ptz_person_occupancy
      motion_sensor: binary_sensor.ranger_duo_ptz_motion
      dark_boolean: input_boolean.dining_is_dark
      media_player_entity: media_player.lg_webos_tv_oled77c35la
