---
name: Refresh pin hashes

on:
  pull_request:
    paths:
      - modules/services/home-automation/home-assistant/ha-pins.json
      - modules/packages/sendspin-cli.json
      - flake.nix

permissions:
  contents: read

jobs:
  # Runs scripts from the PR branch, so it gets no secrets and a read-only token.
  compute:
    # Fork PRs get no secrets and a read-only token
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      - name: Recompute hashes
        run: .github/scripts/update-ha-pin-hashes.sh

      - name: Recompute sendspin-cli hashes
        run: .github/scripts/update-sendspin-hashes.sh

      - name: Refresh tsk lock entry
        run: nix flake update tsk

      # Only these data files cross to the privileged job
      - name: Upload refreshed data files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pin-hashes
          path: |
            modules/services/home-automation/home-assistant/ha-pins.json
            modules/packages/sendspin-cli.json
            flake.lock
          retention-days: 1

  # Holds GH_PAT but never executes anything from the PR tree: it only copies
  # the three data files over and commits them.
  commit:
    needs: compute
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download refreshed data files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pin-hashes
          path: ${{ runner.temp }}/pin-hashes

      - name: Commit refreshed hashes
        env:
          # A PAT push (unlike GITHUB_TOKEN) re-triggers the required checks
          GH_PAT: ${{ secrets.GH_PAT }}
          HEAD_REF: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
          ART: ${{ runner.temp }}/pin-hashes
        run: |
          set -euo pipefail
          for f in modules/services/home-automation/home-assistant/ha-pins.json modules/packages/sendspin-cli.json flake.lock; do
            [ -f "$ART/$f" ] && [ ! -L "$ART/$f" ] || { echo "missing or non-regular artifact file: $f" >&2; exit 1; }
            cp "$ART/$f" "$f"
          done
          if git diff --quiet; then
            echo "hashes already current"
            exit 0
          fi
          git config user.name "Flake Bot"
          git config user.email "actions@github.com"
          git commit -am "chore(deps): refresh pin hashes"
          git push "https://x-access-token:${GH_PAT}@github.com/${REPO}.git" "HEAD:refs/heads/${HEAD_REF}"
