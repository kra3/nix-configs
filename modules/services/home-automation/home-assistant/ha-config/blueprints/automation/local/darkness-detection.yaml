blueprint:
  name: Room darkness detection (hysteresis)
  description: >-
    Hysteresis darkness state machine for a room: turns a helper
    input_boolean on when illuminance drops below 30 lux for 2 min (or the
    sun goes below the horizon), and off when illuminance rises above 120
    lux for 2 min (or the sun rises), waiting for the room's occupancy
    sensor to clear before turning the light off. Factored out of the
    kitchen/hall automations, which were identical apart from entity names.
    The dark-below threshold/sustain tightens automatically (dark_below_daytime/
    dark_sustain_daytime) when the sun is up and weather.forecast_vasudha
    doesn't corroborate real cloud cover, so a clear-daytime sensor blip
    doesn't read as dark; unset, the tier is a no-op.
  domain: automation
  input:
    illuminance_sensor:
      name: Illuminance sensor
      selector:
        entity:
          domain: sensor
    occupancy_sensor:
      name: Occupancy sensor
      selector:
        entity:
          domain: binary_sensor
    light_entity:
      name: Light
      selector:
        entity:
          domain: light
    dark_boolean:
      name: '"Is dark" helper'
      selector:
        entity:
          domain: input_boolean
    dark_below:
      name: Dark threshold (lux)
      description: >-
        Illuminance below this, sustained 2 min, counts as dark. Default
        30 fits a room with a real window (confirmed via Prometheus
        history); a room whose sensor never reads much above its own
        ambient floor (e.g. hall/kitchen's Hue PIR units, which top out
        around 70 lux even at midday) needs this lowered, or every
        daytime motion event reads as dark.
      default: 30
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: lx
    bright_above:
      name: Bright threshold (lux)
      description: >-
        Illuminance above this, sustained 2 min, counts as bright.
        Default 120. In practice sun.sun crossing above_horizon usually
        drives the day-side transition; this only matters for rooms
        whose sensor can reliably exceed it.
      default: 120
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: lx
    dark_below_daytime:
      name: Dark threshold during clear daytime (lux)
      description: >-
        Stricter illuminance-below threshold used instead of dark_below
        when the sun is above the horizon and the forecast doesn't
        corroborate real cloud cover (see cloud_coverage_threshold) - guards
        against a daytime sensor blip (interior PIR briefly reading low
        with the sun clearly up) being treated as genuine darkness. Leave
        at the default to disable the daytime-specific tier entirely.
      default: 1000
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: lx
    dark_sustain_daytime:
      name: Dark sustain duration during clear daytime
      description: >-
        How long illuminance must stay below dark_below_daytime before
        counting as dark under the same clear-daytime condition. Default
        matches the always-on 2 min sustain, so rooms that don't override
        dark_below_daytime see no behavior change.
      default: "00:02:00"
      selector:
        duration: {}
    cloud_coverage_threshold:
      name: Cloud coverage corroboration threshold (%)
      description: >-
        weather.forecast_vasudha cloud coverage above this, while the sun
        is up, is treated as corroborating real daytime overcast/rain -
        keeps the lenient dark_below/2 min response instead of the
        stricter daytime tier. Same convention as automations/tv.yaml's
        backlight-on-overcast check.
      default: 70
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"

triggers:
  - entity_id: !input illuminance_sensor
    below: !input dark_below
    for: "00:02:00"
    trigger: numeric_state
    id: dark_lux_lenient
  - entity_id: !input illuminance_sensor
    below: !input dark_below_daytime
    for: !input dark_sustain_daytime
    trigger: numeric_state
    id: dark_lux_strict
  - entity_id: sun.sun
    to: below_horizon
    trigger: state
    id: dark
  - entity_id: !input illuminance_sensor
    above: !input bright_above
    for: "00:02:00"
    trigger: numeric_state
    id: bright
  - entity_id: sun.sun
    to: above_horizon
    trigger: state
    id: bright
  # Native trigger instead of a wait_for_trigger inside the bright branch —
  # an in-flight wait doesn't survive an HA restart, stranding the light on.
  - entity_id: !input occupancy_sensor
    to: "off"
    trigger: state
    id: occupancy_clear
  - trigger: homeassistant
    event: start
    id: startup
actions:
  # Trust each trigger's own threshold for sun.sun/bright — re-checking lux
  # there used to gate the sun-based trigger too, so a sensor that never
  # reads above 120 lux (kitchen/hall, confirmed via Prometheus) stayed
  # stuck dark. The two lux-based dark triggers instead gate here. HA's
  # trigger schema has no inline per-trigger condition, so night-or-
  # overcast vs. clear-daytime tiering has to live in this choose branch
  # rather than on the trigger itself.
  - choose:
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: dark
              - condition: and
                conditions:
                  - condition: trigger
                    id: dark_lux_lenient
                  - condition: or
                    conditions:
                      - condition: state
                        entity_id: sun.sun
                        state: below_horizon
                      - condition: numeric_state
                        entity_id: weather.forecast_vasudha
                        attribute: cloud_coverage
                        above: !input cloud_coverage_threshold
              - condition: and
                conditions:
                  - condition: trigger
                    id: dark_lux_strict
                  - condition: state
                    entity_id: sun.sun
                    state: above_horizon
                  - condition: not
                    conditions:
                      - condition: numeric_state
                        entity_id: weather.forecast_vasudha
                        attribute: cloud_coverage
                        above: !input cloud_coverage_threshold
        sequence:
          - target:
              entity_id: !input dark_boolean
            action: input_boolean.turn_on
      - conditions:
          - condition: trigger
            id: bright
        sequence:
          - target:
              entity_id: !input dark_boolean
            action: input_boolean.turn_off
          - if:
              - condition: state
                entity_id: !input occupancy_sensor
                state: "off"
              - condition: state
                entity_id: !input light_entity
                state: "on"
            then:
              - target:
                  entity_id: !input light_entity
                action: light.turn_off
      # occupancy_clear covers the live case (bright already, occupancy
      # just cleared); startup re-checks the same thing once on every HA
      # restart in case a prior clear was missed mid-restart.
      - conditions:
          - condition: trigger
            id: [occupancy_clear, startup]
          - condition: state
            entity_id: !input dark_boolean
            state: "off"
          - condition: state
            entity_id: !input occupancy_sensor
            state: "off"
          - condition: state
            entity_id: !input light_entity
            state: "on"
        sequence:
          - target:
              entity_id: !input light_entity
            action: light.turn_off
mode: restart
