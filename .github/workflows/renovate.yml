---
name: Renovate

on:
  schedule:
    # daily at 05:00 UTC (offset from flake-update.yml's 04:00 UTC)
    - cron: "0 5 * * *"
  workflow_dispatch: null

permissions:
  contents: write
  pull-requests: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.2.2
        with:
          configurationFile: renovate.json
          token: ${{ secrets.GH_PAT }}
        env:
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
          RENOVATE_PLATFORM: github
          # Lets postUpgradeTasks regenerate drv-lock.json on dependency-bump
          # branches so refactor-guard doesn't fail on every image update.
          RENOVATE_ALLOWED_COMMANDS: '["^nix develop --command just drv-lock$"]'
