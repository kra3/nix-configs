views:
- title: Home
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Rooms
      heading_style: title
      badges: []
    - type: area
      area: kitchen
    - type: area
      area: kitchen_dining_room
    - type: area
      area: dining_room
    - type: area
      area: living_room
    - type: area
      area: hall
    - type: area
      area: bedroom
    - type: area
      area: office
    - type: area
      area: front
    - type: area
      area: bathroom
    - type: area
      area: toilet
    - type: area
      area: laundry
  - type: grid
    cards:
    - type: heading
      heading_style: title
      heading: Environment
      badges:
      - type: entity
        show_state: true
        show_icon: true
        entity: sensor.average_temperature
      - type: entity
        show_state: true
        show_icon: true
        entity: sensor.average_humidity
      - type: entity
        show_state: true
        show_icon: true
        entity: sensor.average_illuminance
    - graph: line
      type: sensor
      entity: sensor.average_temperature
      detail: 2
      unit: C
      name: Temperature (Avg)
      hours_to_show: 168
    - graph: line
      type: sensor
      entity: sensor.average_humidity
      detail: 2
      name: Humidity (Avg)
      hours_to_show: 168
    - graph: line
      type: sensor
      entity: sensor.average_illuminance
      detail: 2
      name: Illuminance (Avg)
      hours_to_show: 168
    - chart_type: line
      period: hour
      type: statistics-graph
      entities:
      - sensor.average_temperature
      stat_types:
      - mean
      - min
      - max
    - type: statistics-graph
      entities:
      - sensor.average_humidity
      stat_types:
      - mean
      - min
      - max
    - type: statistics-graph
      entities:
      - sensor.average_illuminance
      stat_types:
      - mean
      - min
      - max
  - type: grid
    cards:
    - type: heading
      heading: Security
      heading_style: title
      badges:
      - type: entity
        entity: lock.yale_front_door
      - type: entity
        entity: binary_sensor.house_exits_open_status
    - type: entities
      title: Open door/window
      show_header_toggle: false
      entities:
      - entity: binary_sensor.yale_front_door_door
        name: Front Door
      - entity: binary_sensor.hallway_door_contact_contact
        name: Hallway Door
      - entity: binary_sensor.patio_door_contact_contact
        name: Patio Door
      - entity: binary_sensor.living_room_window_left_contact_contact
        name: Living Room Window (L)
      - entity: binary_sensor.living_room_window_right_contact_contact
        name: Living Room Window (R)
      - entity: binary_sensor.bedroom_window_left_contact_contact
        name: Bedroom Window (L)
      - entity: binary_sensor.bedroom_window_right_contact_contact
        name: Bedroom Window (R)
      - entity: binary_sensor.kitchen_dining_window_left_contact_contact
        name: Kitchen Dining Window
    - type: custom:alarmo-card
      entity: alarm_control_panel.vasudha_secure
      name: ''
      keep_keypad_visible: false
      button_scale_actions: 1
      button_scale_keypad: 1
      states:
      - arm_home
      - arm_away
      show_messages: true
      show_ready_indicator: true
      show_bypassed_sensors: true
      use_code_dialog: false
      hide_keypad: false
    - type: button
      entity: script.alarm_force_arm_night
      name: Force Arm Night
      icon: mdi:shield-lock
      show_state: false
  - type: grid
    cards:
    - type: heading
      heading: Media Server
      heading_style: title
      badges:
      - type: entity
        entity: media_player.lg_webos_tv_oled77c35la
      - type: entity
        entity: media_player.home_theater_2
      icon: mdi:plex
    - type: media-control
      entity: media_player.lg_webos_tv_oled77c35la
      grid_options:
        columns: full
        rows: 2
    - type: media-control
      entity: media_player.home_theater
    - type: media-control
      entity: media_player.home_theater_2
  - type: grid
    cards:
    - type: todo-list
      entity: todo.shopping_list
      title: Shopping List
      hide_completed: true
    - show_current: true
      show_forecast: true
      type: weather-forecast
      entity: weather.forecast_vasudha
      forecast_type: daily
      secondary_info_attribute: wind_speed
      forecast_slots: 7
      tap_action:
        action: more-info
  badges:
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: person.anjalipc
    color: ''
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: person.arun_karunagath
    color: ''
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: alarm_control_panel.vasudha_secure
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: lock.yale_front_door
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.waste_truck_type
    color: ''
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.hue_pir_hallway_temperature
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: weather.forecast_vasudha
    state_content:
    - temperature
    - state
    - wind_speed
    - uv_index
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.sun_next_rising
    color: ''
    visibility:
    - condition: state
      entity: sun.sun
      state: below_horizon
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.sun_next_dusk
    color: ''
    visibility:
    - condition: state
      entity: sun.sun
      state: above_horizon
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.moon_phase
    color: ''
  - type: entity
    entity: sensor.season
  cards: []
