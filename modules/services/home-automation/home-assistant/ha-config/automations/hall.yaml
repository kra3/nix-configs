# ── Hall ───────────────────────────────────────────────────────
- id: hall_darkness
  alias: Hall — Darkness detection
  description: >-
    Hysteresis darkness state machine for hall.
    ON: lux < 10 sustained 2 min AND sun below horizon.
    OFF: lux > 30 sustained 2 min AND sun above horizon; turns off light.
    Thresholds lowered from the blueprint's 30/120 defaults - this room's
    Hue PIR tops out around 70 lux even at midday, so 120 was unreachable.
  use_blueprint:
    path: local/darkness-detection.yaml
    input:
      illuminance_sensor: sensor.hue_pir_hallway_illuminance
      occupancy_sensor: binary_sensor.hue_pir_hallway_occupancy
      light_entity: light.hall
      dark_boolean: input_boolean.hall_is_dark
      dark_below: 10
      bright_above: 30

- id: hall_lighting
  alias: Hall — Lighting
  description: >-
    Motion-tiered brightness instead of Adaptive Lighting's brightness
    curve: hall is a transit space, not somewhere to linger, so it
    doesn't need AL's daytime-brightness levels at night. 45% on
    motion, 80% if occupancy stays continuously on for 2 min
    (lingering, not passing through), 15% ambient instead of fully off
    once occupancy's been clear for 2 min — including immediately at
    dusk if already unoccupied. Off immediately at bedtime. Both
    dim-down paths suppressed during input_boolean.party_mode, same as
    the room-presence-lighting blueprint this replaces. Suppressed
    entirely while Alarmo is pending/triggered so it can't undo
    security.yaml's alarm-response lighting on the next motion event.
  triggers:
  - entity_id: binary_sensor.hue_pir_hallway_occupancy
    to: "on"
    trigger: state
    id: motion
  - entity_id: binary_sensor.hue_pir_hallway_occupancy
    to: "on"
    for: "00:02:00"
    trigger: state
    id: persistent
  - entity_id: input_boolean.hall_is_dark
    to: "on"
    trigger: state
    id: became_dark
  - entity_id: binary_sensor.hue_pir_hallway_occupancy
    to: "off"
    for: "00:02:00"
    trigger: state
    id: clear
  - entity_id: schedule.sleep
    to: "on"
    trigger: state
    id: sleep_started
  # Re-derives whichever branch below should currently apply — the
  # persistent/clear triggers' `for: 2m` only arm on a fresh transition,
  # so an HA restart landing mid-state would otherwise strand the
  # brightness at whatever it was until the next occupancy change.
  - trigger: homeassistant
    event: start
    id: startup
  conditions:
  - condition: state
    entity_id: input_boolean.hall_is_dark
    state: "on"
  - condition: not
    conditions:
    - condition: state
      entity_id: alarm_control_panel.vasudha_secure
      state:
      - pending
      - triggered
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sleep_started
      - condition: not
        conditions:
        - condition: state
          entity_id: input_boolean.party_mode
          state: "on"
      sequence:
      - target:
          entity_id: light.hall
        data:
          transition: 2
        action: light.turn_off
    - conditions:
      - condition: trigger
        id: persistent
      sequence:
      - target:
          entity_id: light.hall
        data:
          brightness_pct: 80
          transition: 1
        action: light.turn_on
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: motion
        - condition: trigger
          id: became_dark
      - condition: state
        entity_id: binary_sensor.hue_pir_hallway_occupancy
        state: "on"
      sequence:
      - target:
          entity_id: light.hall
        data:
          brightness_pct: 45
          transition: 1
        action: light.turn_on
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: clear
        - condition: trigger
          id: became_dark
      - condition: state
        entity_id: binary_sensor.hue_pir_hallway_occupancy
        state: "off"
      - condition: not
        conditions:
        - condition: state
          entity_id: input_boolean.party_mode
          state: "on"
      sequence:
      - target:
          entity_id: light.hall
        data:
          brightness_pct: 15
          transition: 3
        action: light.turn_on
    - conditions:
      - condition: trigger
        id: startup
      - condition: state
        entity_id: schedule.sleep
        state: "on"
      - condition: not
        conditions:
        - condition: state
          entity_id: input_boolean.party_mode
          state: "on"
      sequence:
      - target:
          entity_id: light.hall
        data:
          transition: 2
        action: light.turn_off
    - conditions:
      - condition: trigger
        id: startup
      - condition: state
        entity_id: binary_sensor.hue_pir_hallway_occupancy
        state: "on"
      - condition: template
        value_template: >-
          {{ (as_timestamp(now()) - as_timestamp(states.binary_sensor.hue_pir_hallway_occupancy.last_changed)) >= 120 }}
      sequence:
      - target:
          entity_id: light.hall
        data:
          brightness_pct: 80
          transition: 1
        action: light.turn_on
    - conditions:
      - condition: trigger
        id: startup
      - condition: state
        entity_id: binary_sensor.hue_pir_hallway_occupancy
        state: "on"
      sequence:
      - target:
          entity_id: light.hall
        data:
          brightness_pct: 45
          transition: 1
        action: light.turn_on
    - conditions:
      - condition: trigger
        id: startup
      - condition: state
        entity_id: binary_sensor.hue_pir_hallway_occupancy
        state: "off"
      - condition: template
        value_template: >-
          {{ (as_timestamp(now()) - as_timestamp(states.binary_sensor.hue_pir_hallway_occupancy.last_changed)) >= 120 }}
      - condition: not
        conditions:
        - condition: state
          entity_id: input_boolean.party_mode
          state: "on"
      sequence:
      - target:
          entity_id: light.hall
        data:
          brightness_pct: 15
          transition: 3
        action: light.turn_on
  mode: restart
