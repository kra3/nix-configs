# ── Away mode ──────────────────────────────────────────────────
- id: everyone_left_home
  alias: Everyone left home
  description: >-
    When all tracked persons leave the home zone for 5 min, turn off all
    lights and arm Alarmo away. Alarmo silently refuses if a sensor's
    open (same as the bedtime arm in sleep.yaml), so this checks the
    result and notifies either way — don't claim "alarm armed" if it
    didn't.
  triggers:
  - entity_id:
    - person.anjalipc
    - person.arun_karunagath
    trigger: state
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: person.anjalipc
      state: home
    - condition: state
      entity_id: person.arun_karunagath
      state: home
  actions:
  - delay: "00:05:00"
  - condition: not
    conditions:
    - condition: state
      entity_id: person.anjalipc
      state: home
    - condition: state
      entity_id: person.arun_karunagath
      state: home
  - action: light.turn_off
    target:
      entity_id: all
  - action: alarm_control_panel.alarm_arm_away
    target:
      entity_id: alarm_control_panel.vasudha_secure
    data:
      code: !secret alarm_code
  - delay: "00:00:05"
  - choose:
    - conditions:
      - condition: state
        entity_id: alarm_control_panel.vasudha_secure
        state: armed_away
      sequence:
      - action: script.notify_all_phones
        data:
          title: Home
          message: Everyone left — lights off, alarm armed
    default:
    - action: script.notify_all_phones
      data:
        title: Home
        message: >-
          Everyone left, lights off — but the alarm didn't arm, still
          open: {{ state_attr('binary_sensor.house_exits_open_status', 'open_names') }}
  mode: single

- id: notify_open_exits_on_leave
  alias: Notify if door/window left open when leaving
  description: >-
    When everyone leaves home and a tracked door/window is still open
    5 min later, notify both phones which one(s).
  triggers:
  - entity_id: binary_sensor.house_exits_open_status
    to: "on"
    trigger: state
  - entity_id:
    - person.anjalipc
    - person.arun_karunagath
    trigger: state
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: person.anjalipc
      state: home
    - condition: state
      entity_id: person.arun_karunagath
      state: home
  - condition: state
    entity_id: binary_sensor.house_exits_open_status
    state: "on"
  actions:
  - delay: "00:05:00"
  - condition: not
    conditions:
    - condition: state
      entity_id: person.anjalipc
      state: home
    - condition: state
      entity_id: person.arun_karunagath
      state: home
  - condition: state
    entity_id: binary_sensor.house_exits_open_status
    state: "on"
  - action: script.notify_all_phones
    data:
      title: Home
      message: >-
        Left home with something open:
        {{ state_attr('binary_sensor.house_exits_open_status', 'open_names') }}
  mode: single
