# ── TV ─────────────────────────────────────────────────────────
- id: tv_power_on
  alias: TV — Power on + backlight
  description: WoL if TV is off; turn on ambient backlight if dark or overcast
  triggers:
  - device_id: 346b2b9e49e306b3d7e24530babb842c
    domain: webostv
    type: webostv.turn_on
    trigger: device
  actions:
  - if:
    - condition: device
      device_id: 346b2b9e49e306b3d7e24530babb842c
      domain: media_player
      entity_id: d82eff522a62e356a89979d2dd74f5df
      type: is_off
    then:
    - action: wake_on_lan.send_magic_packet
      data:
        mac: 20:28:bc:b7:ff:3e
        broadcast_port: 7
  - if:
    - condition: or
      conditions:
      - condition: template
        value_template: >-
          {{ state_attr('sun.sun', 'elevation') | float(0)
             < states('input_number.light_on_sun_elevation_threshold') | float(0) }}
      - condition: template
        value_template: >-
          {{ state_attr('weather.forecast_vasudha', 'cloud_coverage') | float(0) > 70 }}
    then:
    - type: turn_on
      device_id: 5c2c4c65f834231378af61d835ec513a
      entity_id: light.tv_backlight
      domain: light
  mode: single

- id: tv_backlight_off
  alias: TV — Backlight off
  description: Turn off ambient backlight when TV powers off
  triggers:
  - device_id: 346b2b9e49e306b3d7e24530babb842c
    domain: media_player
    entity_id: d82eff522a62e356a89979d2dd74f5df
    type: turned_off
    trigger: device
  actions:
  - type: turn_off
    device_id: 5c2c4c65f834231378af61d835ec513a
    entity_id: light.tv_backlight
    domain: light
  mode: single

# ── Garage ─────────────────────────────────────────────────────
- id: garage_remote_toggle
  alias: 'Garage: handheld remote pressed (RF Bridge)'
  description: ''
  triggers:
  - topic: tele/rfbridge/RESULT
    trigger: mqtt
  conditions:
  - condition: template
    value_template: >-
      {% set d = (trigger.payload_json.get('RfRaw', {}).get('Data', '')
                  if trigger.payload_json is defined else '') %}
      {{ '281818' in d }}
  actions:
  - target:
      entity_id: cover.garage_door
    action: cover.toggle
  mode: single

# ── Kitchen ────────────────────────────────────────────────────
- id: kitchen_darkness
  alias: Kitchen — Darkness detection
  description: >-
    Hysteresis darkness state machine for kitchen.
    ON: lux < 30 sustained 2 min AND sun below horizon.
    OFF: lux > 120 sustained 2 min AND sun above horizon; turns off light.
  triggers:
  - entity_id: sensor.hue_pir_kitchen_illuminance
    below: 30
    for: "00:02:00"
    trigger: numeric_state
    id: dark
  - entity_id: sun.sun
    to: below_horizon
    trigger: state
    id: dark
  - entity_id: sensor.hue_pir_kitchen_illuminance
    above: 120
    for: "00:02:00"
    trigger: numeric_state
    id: bright
  - entity_id: sun.sun
    to: above_horizon
    trigger: state
    id: bright
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: dark
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      - condition: numeric_state
        entity_id: sensor.hue_pir_kitchen_illuminance
        below: 30
      sequence:
      - target:
          entity_id: input_boolean.kitchen_is_dark
        action: input_boolean.turn_on
    - conditions:
      - condition: trigger
        id: bright
      - condition: state
        entity_id: sun.sun
        state: above_horizon
      - condition: numeric_state
        entity_id: sensor.hue_pir_kitchen_illuminance
        above: 120
      sequence:
      - target:
          entity_id: input_boolean.kitchen_is_dark
        action: input_boolean.turn_off
      - if:
        - condition: state
          entity_id: light.kitchen_lights
          state: "on"
        then:
        - wait_for_trigger:
          - entity_id: binary_sensor.hue_pir_kitchen_occupancy
            to: "off"
            trigger: state
        - target:
            entity_id: light.kitchen_lights
          action: light.turn_off
  mode: restart

- id: kitchen_lighting
  alias: Kitchen — Lighting
  description: >-
    Dark → on. No motion → progressive dim. Sleep → off.
    Motion during sleep → brief 15% then off.
  triggers:
  - entity_id: input_boolean.kitchen_is_dark
    to: "on"
    trigger: state
    id: became_dark
  - entity_id: binary_sensor.hue_pir_kitchen_occupancy
    from: "off"
    to: "on"
    trigger: state
    id: motion
  - entity_id: schedule.sleep
    to: "on"
    trigger: state
    id: sleep_started
  conditions:
  - condition: state
    entity_id: input_boolean.kitchen_is_dark
    state: "on"
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sleep_started
      sequence:
      - target:
          entity_id: light.kitchen_lights
        data:
          brightness_pct: 15
          transition: 3
        action: light.turn_on
      - delay: "00:00:30"
      - target:
          entity_id: light.kitchen_lights
        data:
          transition: 2
        action: light.turn_off
    - conditions:
      - condition: trigger
        id: motion
      - condition: state
        entity_id: schedule.sleep
        state: "on"
      sequence:
      - target:
          entity_id: light.kitchen_lights
        data:
          brightness_pct: 15
          transition: 1
        action: light.turn_on
      - wait_for_trigger:
        - entity_id: binary_sensor.hue_pir_kitchen_occupancy
          to: "off"
          trigger: state
      - delay: "00:01:00"
      - target:
          entity_id: light.kitchen_lights
        data:
          transition: 1
        action: light.turn_off
    default:
    - target:
        entity_id: light.kitchen_lights
      data:
        brightness_pct: 100
        transition: 0.8
      action: light.turn_on
    - wait_for_trigger:
      - entity_id: binary_sensor.hue_pir_kitchen_occupancy
        to: "off"
        trigger: state
    - delay: "00:05:00"
    - target:
        entity_id: light.kitchen_lights
      data:
        brightness_pct: 50
        transition: 2
      action: light.turn_on
    - delay: "00:05:00"
    - target:
        entity_id: light.kitchen_lights
      data:
        brightness_pct: 15
        transition: 2
      action: light.turn_on
  mode: restart

