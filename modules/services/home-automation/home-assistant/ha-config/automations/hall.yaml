# ── Hall ───────────────────────────────────────────────────────
- id: hall_darkness
  alias: Hall — Darkness detection
  description: >-
    Dark while it is gloomy outside and the hall reads below 10 lux for 2 min.
  use_blueprint:
    path: local/darkness-detection.yaml
    input:
      illuminance_sensor: sensor.hall_illuminance_filtered
      occupancy_sensor: binary_sensor.hue_pir_hallway_occupancy
      light_entity: light.hallway_hall_lights
      dark_boolean: input_boolean.hall_is_dark
      dark_below: 10

- id: hall_lighting
  alias: Hall — Lighting
  description: >-
    Motion-tiered brightness (45% on motion, 80% if lingering 2min, 15%
    ambient once clear 2min, off at bedtime) instead of Adaptive
    Lighting. Suppressed during party_mode and while Alarmo is
    pending/triggered.
  triggers:
  - entity_id: binary_sensor.hue_pir_hallway_occupancy
    to: "on"
    trigger: state
    id: motion
  - entity_id: binary_sensor.hue_pir_hallway_occupancy
    to: "on"
    for: "00:02:00"
    trigger: state
    id: persistent
  - entity_id: input_boolean.hall_is_dark
    to: "on"
    trigger: state
    id: became_dark
  - entity_id: binary_sensor.hue_pir_hallway_occupancy
    to: "off"
    for: "00:02:00"
    trigger: state
    id: clear
  - entity_id: schedule.sleep
    to: "on"
    trigger: state
    id: sleep_started
  # Re-derives whichever branch below should currently apply — the
  # persistent/clear triggers' `for: 2m` only arm on a fresh transition,
  # so an HA restart landing mid-state would otherwise strand the
  # brightness at whatever it was until the next occupancy change.
  - trigger: homeassistant
    event: start
    id: startup
  conditions:
  - condition: state
    entity_id: input_boolean.hall_is_dark
    state: "on"
  - condition: not
    conditions:
    - condition: state
      entity_id: alarm_control_panel.vasudha_secure
      state:
      - pending
      - triggered
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sleep_started
      - condition: not
        conditions:
        - condition: state
          entity_id: input_boolean.party_mode
          state: "on"
      sequence:
      - target:
          entity_id: light.hallway_hall_lights
        data:
          transition: 2
        action: light.turn_off
    - conditions:
      - condition: trigger
        id: persistent
      sequence:
      - target:
          entity_id: light.hallway_hall_lights
        data:
          brightness_pct: 80
          transition: 1
        action: light.turn_on
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: motion
        - condition: trigger
          id: became_dark
      - condition: state
        entity_id: binary_sensor.hue_pir_hallway_occupancy
        state: "on"
      sequence:
      - target:
          entity_id: light.hallway_hall_lights
        data:
          brightness_pct: 45
          transition: 1
        action: light.turn_on
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: clear
        - condition: trigger
          id: became_dark
      - condition: state
        entity_id: binary_sensor.hue_pir_hallway_occupancy
        state: "off"
      - condition: not
        conditions:
        - condition: state
          entity_id: input_boolean.party_mode
          state: "on"
      sequence:
      - target:
          entity_id: light.hallway_hall_lights
        data:
          brightness_pct: 15
          transition: 3
        action: light.turn_on
    - conditions:
      - condition: trigger
        id: startup
      - condition: state
        entity_id: schedule.sleep
        state: "on"
      - condition: not
        conditions:
        - condition: state
          entity_id: input_boolean.party_mode
          state: "on"
      sequence:
      - target:
          entity_id: light.hallway_hall_lights
        data:
          transition: 2
        action: light.turn_off
    - conditions:
      - condition: trigger
        id: startup
      - condition: state
        entity_id: binary_sensor.hue_pir_hallway_occupancy
        state: "on"
      - condition: template
        value_template: >-
          {%- from 'elapsed.jinja' import elapsed_ge -%}
          {{ elapsed_ge('binary_sensor.hue_pir_hallway_occupancy', 120) }}
      sequence:
      - target:
          entity_id: light.hallway_hall_lights
        data:
          brightness_pct: 80
          transition: 1
        action: light.turn_on
    - conditions:
      - condition: trigger
        id: startup
      - condition: state
        entity_id: binary_sensor.hue_pir_hallway_occupancy
        state: "on"
      sequence:
      - target:
          entity_id: light.hallway_hall_lights
        data:
          brightness_pct: 45
          transition: 1
        action: light.turn_on
    - conditions:
      - condition: trigger
        id: startup
      - condition: state
        entity_id: binary_sensor.hue_pir_hallway_occupancy
        state: "off"
      - condition: template
        value_template: >-
          {%- from 'elapsed.jinja' import elapsed_ge -%}
          {{ elapsed_ge('binary_sensor.hue_pir_hallway_occupancy', 120) }}
      - condition: not
        conditions:
        - condition: state
          entity_id: input_boolean.party_mode
          state: "on"
      sequence:
      - target:
          entity_id: light.hallway_hall_lights
        data:
          brightness_pct: 15
          transition: 3
        action: light.turn_on
  mode: restart
