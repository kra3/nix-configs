# Estimated price for a variable E.ON contract: Nord Pool SE4 month average plus fixed E.ON and grid costs, with VAT; device cost is month kWh at that price.
input_number:
  electricity_spot_sum:
    name: Spot price sum this month
    min: 0
    max: 1000000
    step: 0.0001
    mode: box
  electricity_spot_count:
    name: Spot price samples this month
    min: 0
    max: 100000
    step: 1
    mode: box
  electricity_spot_prev_avg:
    name: Spot average last month
    min: 0
    max: 100
    step: 0.0001
    mode: box
  electricity_month_marker:
    name: Month the price helpers were last rolled over
    min: 0
    max: 12
    step: 1
    mode: box

input_text:
  washer_cost_history:
    name: Washer cost by month
    max: 255
  dryer_cost_history:
    name: Dryer cost by month
    max: 255
  sutala_cost_history:
    name: Sutala cost by month
    max: 255

utility_meter:
  washer_energy_week:
    source: sensor.washer_power_monitor_energy
    cycle: weekly
  washer_energy_month:
    source: sensor.washer_power_monitor_energy
    cycle: monthly
  dryer_energy_week:
    source: sensor.dryer_power_monitor_energy
    cycle: weekly
  dryer_energy_month:
    source: sensor.dryer_power_monitor_energy
    cycle: monthly
  sutala_energy_week:
    source: sensor.power_monitor_1_energy
    cycle: weekly
  sutala_energy_month:
    source: sensor.power_monitor_1_energy
    cycle: monthly

template:
  - sensor:
      - name: "Electricity Spot Month Average"
        unique_id: electricity_spot_month_average
        unit_of_measurement: SEK/kWh
        icon: mdi:chart-bell-curve
        state: >-
          {% set n = states('input_number.electricity_spot_count') | float(0) %}
          {% set prev = states('input_number.electricity_spot_prev_avg') | float(0) %}
          {% if n >= 96 %}{{ (states('input_number.electricity_spot_sum') | float(0) / n) | round(4) }}
          {% elif prev > 0 %}{{ prev }}
          {% else %}{{ states('sensor.nord_pool_se4_current_price') | float(0) }}{% endif %}

      - name: "Electricity Price per kWh"
        unique_id: electricity_price_per_kwh
        unit_of_measurement: SEK/kWh
        icon: mdi:cash
        state: "{{ ((states('sensor.electricity_spot_month_average') | float(0) * 1.09 + 0.06 + 0.734 + 0.36) * 1.25) | round(4) }}"
        attributes:
          includes: Month average spot plus 9 % E.ON variable costs, 6 öre påslag, 73.4 öre grid transfer, 36 öre energy tax and 25 % VAT

      - name: "Washer Cost"
        unique_id: washer_cost
        device_class: monetary
        unit_of_measurement: SEK
        state: "{% from 'laundry.jinja' import month %}{{ month('washer') }}"
        attributes:
          week: "{% from 'laundry.jinja' import week %}{{ week('washer') }}"
          quarter: "{% from 'laundry.jinja' import quarter %}{{ quarter('washer') }}"
          last_month: "{% from 'laundry.jinja' import last_month %}{{ last_month('washer') }}"

      - name: "Dryer Cost"
        unique_id: dryer_cost
        device_class: monetary
        unit_of_measurement: SEK
        state: "{% from 'laundry.jinja' import month %}{{ month('dryer') }}"
        attributes:
          week: "{% from 'laundry.jinja' import week %}{{ week('dryer') }}"
          quarter: "{% from 'laundry.jinja' import quarter %}{{ quarter('dryer') }}"
          last_month: "{% from 'laundry.jinja' import last_month %}{{ last_month('dryer') }}"

      - name: "Sutala Cost"
        unique_id: sutala_cost
        device_class: monetary
        unit_of_measurement: SEK
        state: "{% from 'laundry.jinja' import month %}{{ month('sutala') }}"
        attributes:
          week: "{% from 'laundry.jinja' import week %}{{ week('sutala') }}"
          quarter: "{% from 'laundry.jinja' import quarter %}{{ quarter('sutala') }}"
          last_month: "{% from 'laundry.jinja' import last_month %}{{ last_month('sutala') }}"

