---
name: Renovate

on:
  schedule:
    # 4x/day (offset from flake-update.yml's 04:00 UTC) so the default
    # prHourlyLimit:2 doesn't strand extra updates for a full day
    - cron: "0 5,11,17,23 * * *"
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          configurationFile: renovate.json
          token: ${{ secrets.GH_PAT }}
        env:
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
          RENOVATE_PLATFORM: github
