# ── Living room ────────────────────────────────────────────────
- id: living_darkness
  alias: Living room — Darkness detection
  description: >-
    Hysteresis darkness state machine for living room, using house-wide
    average illuminance (no local sensor). dark_below/dark_below_daytime
    pinned to 45.
  use_blueprint:
    path: local/darkness-detection.yaml
    input:
      illuminance_sensor: sensor.average_illuminance
      occupancy_sensor: binary_sensor.ranger_duo_fxd_person_occupancy
      light_entity: light.living_room_lights
      dark_boolean: input_boolean.living_room_is_dark
      dark_below: 45
      dark_below_daytime: 45
      dark_sustain_daytime: "00:15:00"

- id: living_room_lighting
  alias: Living room — Lighting
  description: >-
    Presence + darkness via ranger_duo_fxd's Frigate person detection.
    KNOWN ISSUE: motion sensor rarely fires, so occupancy rarely
    populates for turn-on.
  use_blueprint:
    path: local/room-presence-lighting.yaml
    input:
      light_entity: light.living_room_lights
      occupancy_sensor: binary_sensor.ranger_duo_fxd_person_occupancy
      motion_sensor: binary_sensor.ranger_duo_fxd_motion
      dark_boolean: input_boolean.living_room_is_dark
      media_player_entity: media_player.lg_webos_tv_oled77c35la

- id: living_room_media_aware
  alias: Living room — Media-aware lighting
  description: >-
    Turns off living+dining lights when Stremio/Jellyfin/Apple TV plays;
    restores full brightness on stop (skips a room only if its presence
    sensor reads a definite off). On pause, dims living room to 20% at
    15s, then hands it back to Adaptive Lighting at 38s.
  triggers:
  - entity_id: media_player.lg_webos_tv_oled77c35la
    to: playing
    trigger: state
    id: playing
  # Genuine-stop states only — `from: playing` also caught pause/buffering blips.
  - entity_id: media_player.lg_webos_tv_oled77c35la
    to:
    - "off"
    - idle
    - standby
    trigger: state
    id: not_playing
  - entity_id: media_player.lg_webos_tv_oled77c35la
    to: paused
    trigger: state
    id: paused
  - entity_id: media_player.lg_webos_tv_oled77c35la
    from: playing
    to: "on"
    trigger: state
    id: paused
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.living_room_is_dark
      state: "on"
    - condition: state
      entity_id: input_boolean.dining_is_dark
      state: "on"
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: playing
      - condition: template
        value_template: >-
          {{ state_attr('media_player.lg_webos_tv_oled77c35la', 'source')
             in ['Stremio', 'Jellyfin', 'Apple TV'] }}
      sequence:
      - target:
          entity_id:
          - light.living_room_lights
          - light.dining_lights
        data:
          transition: 2
        action: light.turn_off
    - conditions:
      - condition: trigger
        id: not_playing
      - condition: state
        entity_id: schedule.sleep
        state: "off"
      sequence:
      - delay: "00:00:30"
      - if:
        - condition: not
          conditions:
          - condition: state
            entity_id: binary_sensor.ranger_duo_fxd_person_occupancy
            state: "off"
        then:
        - target:
            entity_id: light.living_room_lights
          data:
            transition: 60
          action: light.turn_on
      - if:
        - condition: not
          conditions:
          - condition: state
            entity_id: binary_sensor.ranger_duo_ptz_person_occupancy
            state: "off"
        then:
        - target:
            entity_id: light.dining_lights
          data:
            transition: 60
          action: light.turn_on
    - conditions:
      - condition: trigger
        id: paused
      - condition: state
        entity_id: schedule.sleep
        state: "off"
      sequence:
      - delay: "00:00:15"
      - if:
        - condition: state
          entity_id: light.living_room_lights
          state: "off"
        then:
        - target:
            entity_id: light.living_room_lights
          data:
            brightness_pct: 20
            transition: 10
          action: light.turn_on
        - target:
            entity_id: switch.home_adaptive_lighting_home
          data:
            lights: light.living_room_lights
            manual_control: true
          action: adaptive_lighting.set_manual_control
      - delay: "00:00:23"
      - target:
          entity_id: switch.home_adaptive_lighting_home
        data:
          lights: light.living_room_lights
          manual_control: false
        action: adaptive_lighting.set_manual_control
  mode: restart

- id: living_room_bedtime_lights_off
  alias: Living room — Lights off (bedtime, no presence)
  description: >-
    Turns off living+dining lights once past bedtime with no presence
    for 15 minutes and nothing playing on the TV or home theater.
  triggers:
  - id: presence_clear
    trigger: template
    value_template: >-
      {{ is_state('binary_sensor.ranger_duo_fxd_person_occupancy', 'off')
         and is_state('binary_sensor.ranger_duo_ptz_person_occupancy', 'off') }}
    for: "00:15:00"
  - id: sleep_start
    trigger: state
    entity_id: schedule.sleep
    to: "on"
  conditions:
  - condition: state
    entity_id: schedule.sleep
    state: "on"
  - condition: template
    value_template: >-
      {{ is_state('binary_sensor.ranger_duo_fxd_person_occupancy', 'off')
         and is_state('binary_sensor.ranger_duo_ptz_person_occupancy', 'off')
         and now() - states.binary_sensor.ranger_duo_fxd_person_occupancy.last_changed
             >= timedelta(minutes=15)
         and now() - states.binary_sensor.ranger_duo_ptz_person_occupancy.last_changed
             >= timedelta(minutes=15) }}
  - condition: template
    value_template: >-
      {{ states('media_player.lg_webos_tv_oled77c35la') != 'playing'
         and states('media_player.home_theater_2') != 'playing' }}
  actions:
  - target:
      entity_id:
      - light.living_room_lights
      - light.dining_lights
    data:
      transition: 5
    action: light.turn_off
  mode: single
