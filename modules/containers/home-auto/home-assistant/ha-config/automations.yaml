- id: '1762614514623'
  alias: Hall — Baseline DIM when dark
  description: ''
  triggers:
  - entity_id: input_boolean.hall_is_dark
    to: 'on'
    trigger: state
  actions:
  - target:
      entity_id: light.hall
    data:
      brightness_pct: 15
      transition: 1
    action: light.turn_on
  mode: single
- id: '1762614586108'
  alias: Hall — Night motion stays DIM
  description: ''
  triggers:
  - entity_id: binary_sensor.hue_pir_hall
    from: 'off'
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.hall_is_dark
    state: 'on'
  - condition: state
    entity_id: schedule.sleep
    state: 'on'
  actions:
  - target:
      entity_id: light.hall
    data:
      brightness_pct: 10
      transition: 0.5
    action: light.turn_on
  mode: restart
- id: '1762614757780'
  alias: Hall — Motion boost then cooldown to DIM (before sleeptime)
  description: ''
  triggers:
  - entity_id:
    - binary_sensor.hue_pir_hall
    from:
    - 'off'
    to:
    - 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.hall_is_dark
    state: 'on'
  - condition: state
    entity_id: schedule.sleep
    state:
    - 'off'
  actions:
  - target:
      entity_id: light.hall
    data:
      brightness_pct: 55
      transition: 0.3
    action: light.turn_on
  - wait_for_trigger:
    - entity_id: binary_sensor.hue_pir_hall
      to: 'off'
      trigger: state
  - wait_for_trigger:
    - entity_id: binary_sensor.hue_pir_hall
      to: 'on'
      trigger: state
    timeout: 00:00:10
    continue_on_timeout: true
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not wait.completed }}'
      sequence:
      - target:
          entity_id: light.hall
        data:
          brightness_pct: 15
          transition: 0.8
        action: light.turn_on
    default: []
  mode: restart
