---
name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      - name: nix flake check
        run: nix flake check

  eval-hosts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      - name: Evaluate hosts' drvPaths
        run: |
          echo "nixosConfigurations.sutala:"
          nix eval --raw .#nixosConfigurations.sutala.config.system.build.toplevel.drvPath
          echo
          echo "darwinConfigurations.mac-work.system:"
          nix eval --raw .#darwinConfigurations.mac-work.system.drvPath
          echo


  fetch-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      - name: Build claude-code (catches upstream release 404s)
        run: nix build --no-link --inputs-from . llm-agents#claude-code

  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      - name: actionlint
        run: nix run nixpkgs#actionlint

      - name: zizmor
        run: nix run nixpkgs#zizmor -- --offline --min-severity medium .github/workflows

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      # Scans the tree, not history: a leaked value stays in old commits forever, so the
      # fix for a historical hit is rotation, not a permanently red check.
      - name: Scan tree for secrets
        run: nix run --inputs-from . nixpkgs#gitleaks -- dir --no-banner --redact --config .gitleaks.toml .
