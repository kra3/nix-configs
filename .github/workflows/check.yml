---
name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: nix flake check
        run: nix flake check

  eval-hosts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Evaluate hosts' drvPaths
        run: |
          echo "nixosConfigurations.sutala:"
          nix eval --raw .#nixosConfigurations.sutala.config.system.build.toplevel.drvPath
          echo
          echo "darwinConfigurations.mac-work.system:"
          nix eval --raw .#darwinConfigurations.mac-work.system.drvPath
          echo

