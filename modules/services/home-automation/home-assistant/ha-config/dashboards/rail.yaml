cc_slot: rail
type: grid
cards:
- type: custom:streamline-card
  template: home_hero
  grid_options:
    columns: full
  visibility:
  - condition: user
    users:
    - a1d4401b8b714ebb83f07c5316ab399c
    - 6edcc5a09c3144d684077ee362e7394a
- type: custom:streamline-card
  template: home_hero
  variables:
    name: Vasudha
  grid_options:
    columns: full
  visibility:
  - condition: not
    conditions:
    - condition: user
      users:
      - a1d4401b8b714ebb83f07c5316ab399c
      - 6edcc5a09c3144d684077ee362e7394a
- type: custom:mushroom-template-card
  entity: weather.forecast_vasudha
  primary: >-
    {%- set s = states('weather.forecast_vasudha') -%}{{ {'partlycloudy': 'Partly cloudy', 'clear-night': 'Clear night', 'lightning-rainy': 'Thunder and rain', 'snowy-rainy': 'Sleet', 'windy-variant': 'Windy'}.get(s, s | replace('-', ' ') | capitalize) }}{{ ' · ' ~ (state_attr('weather.forecast_vasudha', 'temperature') | round(0) | int) ~ '°' if state_attr('weather.forecast_vasudha', 'temperature') is number else '' }}
  secondary: "{{ states('sensor.next_rain') }}"
  tap_action:
    action: fire-dom-event
    cc_detail:
      type: weather-forecast
      entity: weather.forecast_vasudha
      forecast_type: hourly
      show_current: true
      show_forecast: true
      secondary_info_attribute: wind_speed
      forecast_slots: 5
      tap_action:
        action: more-info
  grid_options:
    columns: full
  visibility:
  - condition: screen
    media_query: "(min-width: 820px)"
- type: custom:mushroom-chips-card
  alignment: start
  chips:
  - type: template
    entity: person.arun_karunagath
    picture: "{{ state_attr('person.arun_karunagath', 'entity_picture') }}"
    content: >-
      {% set e = states('sensor.arun_eta_home') %}{% set s = states('person.arun_karunagath') %}Arun · {{ '≈ ' ~ (e | int) ~ ' min' if s != 'home' and e | is_number else ('Away' if s == 'not_home' else s | title) }}
  - type: template
    entity: person.anjalipc
    picture: "{{ state_attr('person.anjalipc', 'entity_picture') }}"
    content: >-
      {% set e = states('sensor.anjali_eta_home') %}{% set s = states('person.anjalipc') %}Anjali · {{ '≈ ' ~ (e | int) ~ ' min' if s != 'home' and e | is_number else ('Away' if s == 'not_home' else s | title) }}
  grid_options:
    columns: full
  visibility:
  - condition: screen
    media_query: "(min-width: 820px)"
- type: custom:trip-card
  entity: sensor.arun_work_trips
  person: person.arun_karunagath
  direction: work
  hide_at: zone.work
  settings: &trip_settings
  - input_select.transit_max_changes
  - input_select.transit_modes
  - input_select.transit_walking
  visibility: &arun_only
  - condition: user
    users:
    - a1d4401b8b714ebb83f07c5316ab399c
- type: custom:trip-card
  entity: sensor.arun_home_trips
  person: person.arun_karunagath
  direction: home
  hide_at: zone.home
  settings: *trip_settings
  visibility: *arun_only
- type: custom:trip-card
  entity: sensor.arun_event_trips
  person: person.arun_karunagath
  calendars: &event_calendars
  - calendar.kuttunbn
  settings: *trip_settings
  visibility:
  - condition: user
    users:
    - a1d4401b8b714ebb83f07c5316ab399c
- type: custom:trip-card
  entity: sensor.anjali_work_trips
  person: person.anjalipc
  direction: work
  hide_at: zone.work_smil
  settings: *trip_settings
  visibility: &anjali_only
  - condition: user
    users:
    - 6edcc5a09c3144d684077ee362e7394a
- type: custom:trip-card
  entity: sensor.anjali_home_trips
  person: person.anjalipc
  direction: home
  hide_at: zone.home
  settings: *trip_settings
  visibility: *anjali_only
- type: custom:trip-card
  entity: sensor.anjali_event_trips
  person: person.anjalipc
  calendars: *event_calendars
  settings: *trip_settings
  visibility:
  - condition: user
    users:
    - 6edcc5a09c3144d684077ee362e7394a
- type: custom:attention-pills-card
  entity: sensor.attention
  grid_options:
    columns: full
- type: custom:mushroom-template-card
  entity: input_boolean.automations_paused
  primary: Automations paused
  secondary: Hand back
  icon: mdi:pause-circle
  icon_color: warning
  tap_action:
    action: perform-action
    perform_action: input_boolean.turn_off
    target:
      entity_id: input_boolean.automations_paused
  grid_options:
    columns: full
  visibility:
  - condition: user
    users:
    - a1d4401b8b714ebb83f07c5316ab399c
  - condition: state
    entity: input_boolean.automations_paused
    state: "on"
