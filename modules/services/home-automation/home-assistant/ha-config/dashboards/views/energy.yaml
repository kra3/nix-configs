type: sections
title: Energy
path: dash-energy
icon: mdi:flash
max_columns: 2
sections:
- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Now
    icon: mdi:flash
    heading_style: title
  - type: custom:health-metric-card
    entity: sensor.electricity_price_per_kwh
    name: Price per kWh
    icon: mdi:cash
    color: "#79c0ff"
    decimals: 2
    show_date: false
    card_mod:
      style: |
        ha-card { height: 100%; }
    chart:
      type: line
      days: 30
      stat: max
    breakdown:
    - {name: Spot, attribute: spot, color: "#79c0ff"}
    - {name: Variable, attribute: variable, color: "#7fdbca"}
    - {name: Påslag, attribute: markup, color: "#c3e88d"}
    - {name: Grid, attribute: grid, color: "#ffd86b"}
    - {name: Tax, attribute: tax, color: "#ff9f6b"}
    - {name: VAT, attribute: vat, color: "#c792ea"}
    grid_options:
      columns: 10
  - type: custom:popup-tile-card
    title: Electricity price
    width: 900px
    grid_options:
      columns: 14
    inline: &price_timeline
      type: custom:price-timeline-card
      price: sensor.electricity_price_timeline
      theme: theme
      slider: true
      currency:
        name: Öre
        symbol: öre
    popup:
      <<: *price_timeline
      view: graph
      slider: true
      cheap_times: true
      day_switch: false
  - type: custom:health-metric-card
    entity: sensor.energy_cost_today
    name: Energy today
    card_mod: &full_height
      style: |
        ha-card { height: 100%; }
    icon: mdi:cash-clock
    color: "#7fdbca"
    unit: kr
    decimals: 2
    show_date: false
    chart:
      type: bar
      days: 14
      stat: max
    secondary:
    - entity: sensor.energy_used_today
      unit: " kWh"
      decimals: 1
    - entity: sensor.home_power_estimate
      prefix: "Now "
      unit: " W"
    grid_options:
      columns: 12
  - type: custom:health-metric-card
    entity: sensor.energy_cost_month
    name: This month
    card_mod: *full_height
    icon: mdi:calendar-month
    color: "#7fdbca"
    unit: kr
    decimals: 2
    show_date: false
    chart:
      type: line
      days: 30
      stat: max
    secondary:
      entity: sensor.energy_used_month
      unit: " kWh"
      decimals: 1
    popup:
      title: Electricity cost
      graphs:
      - name: Cost per day (month view) or per month, fees included
        entities:
        - sensor.energy_cost_today
        monthly: sensor.energy_cost_month
        stat: max
        type: bar
        unit: kr
        decimals: 0
        days: 30
        ranges: [30, 90, 180, 365]
    grid_options:
      columns: 12
