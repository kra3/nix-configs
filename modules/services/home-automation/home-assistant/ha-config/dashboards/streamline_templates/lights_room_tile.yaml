default:
- icon: mdi:door
- scene: ""
- comfort: ""
- temperature: ""
- humidity: ""
- dew: ""
- approx: ""
card:
  type: custom:mushroom-light-card
  entity: "[[light]]"
  name: "[[name]]"
  icon: "[[icon]]"
  fill_container: true
  use_light_color: true
  show_brightness_control: true
  collapsible_controls: true
  icon_tap_action:
    action: toggle
  tap_action:
    action: fire-dom-event
    cc_detail:
      type: custom:streamline-card
      template: room_detail
      variables:
        name: "[[name]]"
        icon: "[[icon]]"
        light: "[[light]]"
        scene: "[[scene]]"
        comfort: "[[comfort]]"
        temperature: "[[temperature]]"
        humidity: "[[humidity]]"
        dew: "[[dew]]"
        approx: "[[approx]]"
  hold_action:
    action: toggle
