# ── Sleep routine ──────────────────────────────────────────────
- id: sleep_tv_off
  alias: Sleep — TV off if idle
  description: >-
    Turn off TV when sleep schedule starts, but only if it hasn't been
    playing anything for the last 15 minutes (a momentary non-playing
    state, e.g. between episodes, shouldn't trigger a shutdown).
    Skipped during party mode; catches up when it ends.
  triggers:
  - entity_id: schedule.sleep
    to: "on"
    trigger: state
    id: sleep_start
  - trigger: event
    event_type: modes_ended
    id: resumed
  conditions:
  - condition: state
    entity_id: input_boolean.party_mode
    state: "off"
  - condition: state
    entity_id: schedule.sleep
    state: "on"
  - condition: template
    value_template: >-
      {{ states('media_player.lg_webos_tv_oled77c35la') not in ['playing', 'off']
         and (trigger.id == 'resumed'
              or now() - states.media_player.lg_webos_tv_oled77c35la.last_changed
                 >= timedelta(minutes=15)) }}
  actions:
  - action: media_player.turn_off
    target:
      entity_id: media_player.lg_webos_tv_oled77c35la
  mode: single

- id: sleep_alarmo_arm_home
  alias: Sleep — Arm Alarmo (night)
  description: Arms night at bedtime if disarmed, or 10 min after a resident arrives home during the sleep schedule (sleep_night_rearm_after_arrival, or the entry auto-disarm); on refusal a critical alert to Arun and speech in the occupied rooms, escalated after 10 min. Skipped during party mode; catches up when it ends.
  triggers:
  - entity_id: schedule.sleep
    to: "on"
    trigger: state
  - trigger: event
    event_type: modes_ended
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.alarm_night_rearm
  conditions:
  - condition: numeric_state
    entity_id: zone.home
    above: 0
  - condition: state
    entity_id: input_boolean.party_mode
    state: "off"
  - condition: state
    entity_id: schedule.sleep
    state: "on"
  - condition: state
    entity_id: alarm_control_panel.vasudha_secure
    state: disarmed
  actions:
  - action: alarm_control_panel.alarm_arm_night
    target:
      entity_id: alarm_control_panel.vasudha_secure
    data:
      code: !secret alarm_code
  - delay: "00:00:05"
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: alarm_control_panel.vasudha_secure
        state: armed_night
    then:
    - action: script.notify_all_phones
      data:
        title: Alarm not armed
        critical: true
        message: >-
          Couldn't arm for the night — still open:
          {{ state_attr('binary_sensor.house_exits_open_status', 'open_names') }}.
          Force-arm from the dashboard if needed.
    - variables:
        spoken: >-
          Alarm not armed. These are still open.
          {{ (state_attr('binary_sensor.house_exits_open_status', 'open_names') | replace(' (L)', ' left') | replace(' (R)', ' right') | replace(', ', '. ')) ~ '.' }}
    - action: script.announce_home
      continue_on_error: true
      data:
        message: "{{ spoken }}"
    - action: timer.start
      target:
        entity_id: timer.alarm_arm_escalation
  mode: single
  max_exceeded: silent

- id: sleep_night_rearm_after_arrival
  alias: Sleep — Start the night re-arm timer when a resident arrives
  description: >-
    During the sleep schedule each arrival (re)starts timer.alarm_night_rearm;
    sleep_alarmo_arm_home re-arms night when it finishes if still disarmed.
  triggers:
  - entity_id:
    - person.arun_karunagath
    - person.anjalipc
    not_from:
    - unknown
    - unavailable
    to: home
    trigger: state
  conditions:
  - condition: state
    entity_id: schedule.sleep
    state: "on"
  actions:
  - action: timer.start
    target:
      entity_id: timer.alarm_night_rearm
  mode: single

# ── Wake-up ────────────────────────────────────────────────────
- id: sleep_alarmo_disarm_morning
  alias: Sleep — Disarm Alarmo (morning)
  description: >-
    Disarms armed_night when the sleep schedule ends (or on startup or
    when party or manual mode ends, if it ended meanwhile), only if someone's
    home.
  triggers:
  - entity_id: schedule.sleep
    to: "off"
    trigger: state
  - trigger: homeassistant
    event: start
  - trigger: event
    event_type: modes_ended
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: person.arun_karunagath
      state: home
    - condition: state
      entity_id: person.anjalipc
      state: home
  - condition: state
    entity_id: schedule.sleep
    state: "off"
  - condition: state
    entity_id: alarm_control_panel.vasudha_secure
    state: armed_night
  actions:
  - action: alarm_control_panel.alarm_disarm
    target:
      entity_id: alarm_control_panel.vasudha_secure
    data:
      code: !secret alarm_code
  mode: single
  max_exceeded: silent
