- id: living_room_media_aware
  alias: Living room — Media-aware lighting
  description: >-
    Turn off living + dining lights when watching content on
    Stremio, Jellyfin, or Apple TV. Restore when stopped.
  triggers:
  - entity_id: media_player.lg_webos_tv_oled77c35la
    to: playing
    trigger: state
    id: playing
  - entity_id: media_player.lg_webos_tv_oled77c35la
    from: playing
    trigger: state
    id: not_playing
  conditions:
  - condition: state
    entity_id: input_boolean.hall_is_dark
    state: "on"
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: playing
      - condition: template
        value_template: >-
          {{ state_attr('media_player.lg_webos_tv_oled77c35la', 'source')
             in ['Stremio', 'Jellyfin', 'Apple TV'] }}
      sequence:
      - target:
          entity_id:
          - light.living_room_lights
          - light.dining_lights
        data:
          transition: 2
        action: light.turn_off
    - conditions:
      - condition: trigger
        id: not_playing
      - condition: state
        entity_id: schedule.sleep
        state: "off"
      sequence:
      - delay: "00:00:30"
      - target:
          entity_id: light.living_room_lights
        data:
          brightness_pct: 30
          transition: 60
        action: light.turn_on
      - target:
          entity_id: light.dining_lights
        data:
          brightness_pct: 20
          transition: 60
        action: light.turn_on
  mode: restart

