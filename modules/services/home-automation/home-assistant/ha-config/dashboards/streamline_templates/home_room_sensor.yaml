default:
- temperature: ""
- humidity: ""
- illuminance: ""
- comfort: ""
card:
  type: vertical-stack
  card_mod:
    style: |
      :host { --vertical-stack-card-gap: 0px; --stack-card-gap: 0px; height: 100%; }
  cards:
  - type: custom:streamline-card
    template: home_room_status
    variables:
      presence: "[[presence]]"
      comfort: "[[comfort]]"
  - type: custom:mushroom-template-card
    entity: "[[presence]]"
    primary: "[[name]]"
    secondary: >-
      {{ ('Occupied' if is_state('[[presence]]', 'on') else 'Clear') ~ ' · ' ~ relative_time(states['[[presence]]'].last_changed) }}
    icon: "[[icon]]"
    icon_color: primary
    color: primary
    card_mod:
      style: |
        {% set badge = (1 if is_state('[[presence]]', 'on') else 0) + (3 if states('[[comfort]]') in ['Cool', 'Cold', 'Warm', 'Hot', 'Humid', 'Dry'] else 0) %}
        ha-card {
          border-bottom: none;
          border-radius: var(--ha-card-border-radius, 12px) var(--ha-card-border-radius, 12px) 0 0;
          box-shadow: none;
          min-height: 59px;
        }
        :host {
          --mush-spacing: 12px;
          --mush-card-primary-font-size: 14.5px;
          --mush-card-secondary-font-size: 12px;
        }
        mushroom-state-item { padding-right: {{ badge * 18 }}px; }
  - type: custom:streamline-card
    template: home_room_stats
    variables:
      temperature: "[[temperature]]"
      humidity: "[[humidity]]"
      illuminance: "[[illuminance]]"
      comfort: "[[comfort]]"
