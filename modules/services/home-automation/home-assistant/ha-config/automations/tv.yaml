# ── TV ─────────────────────────────────────────────────────────
- id: tv_power_on
  alias: TV — Power on + backlight + HT
  description: >-
    WoL if TV is off; turn on ambient backlight if dark or overcast; turn on
    the home theater and switch it to TV audio.
  triggers:
  # webostv.turn_on only fires when HA's own turn_on service is called (confirmed
  # against webostv/media_player.py) -- never on remote/CEC power-on, so the
  # backlight never followed real-world use. This state trigger covers that.
  - device_id: 346b2b9e49e306b3d7e24530babb842c
    domain: webostv
    type: webostv.turn_on
    trigger: device
  - entity_id: media_player.lg_webos_tv_oled77c35la
    from: "off"
    not_to:
    - "off"
    - unavailable
    - unknown
    trigger: state
  actions:
  - if:
    - condition: state
      entity_id: media_player.lg_webos_tv_oled77c35la
      state: "off"
    then:
    - repeat:
        count: 5
        sequence:
        - if:
          - condition: state
            entity_id: media_player.lg_webos_tv_oled77c35la
            state: "off"
          then:
          - action: wake_on_lan.send_magic_packet
            data:
              mac: 20:28:bc:b7:ff:3e
              broadcast_address: 192.168.1.255
              broadcast_port: 7
          - delay: 3
  - if:
    - condition: template
      value_template: >-
        {{ state_attr('media_player.ma_home_theater', 'group_members') | default([], true) | count > 1 }}
    then:
    - action: media_player.unjoin
      continue_on_error: true
      target:
        entity_id: media_player.ma_home_theater
  - alias: Pause other streams on the home theater
    repeat:
      for_each:
      - media_player.ma_home_theater
      - media_player.home_theater
      sequence:
      - if:
        - condition: template
          value_template: "{{ is_state(repeat.item, 'playing') }}"
        then:
        - action: "{{ 'media_player.media_stop' if repeat.item == 'media_player.home_theater' else 'media_player.media_pause' }}"
          continue_on_error: true
          target:
            entity_id: "{{ repeat.item }}"
  - if:
    - condition: or
      conditions:
      - condition: template
        value_template: >-
          {{ state_attr('sun.sun', 'elevation') | float(0)
             < states('input_number.light_on_sun_elevation_threshold') | float(0) }}
      - condition: template
        value_template: >-
          {{ states('sensor.openweathermap_cloud_coverage') | float(0) > 70 }}
    then:
    - action: light.turn_on
      target:
        entity_id: light.tv_backlight
  - action: media_player.turn_on
    target:
      entity_id: media_player.home_theater_2
  # Denon needs a moment after power-on before it accepts a source select
  # (same slow-to-respond behavior already worked around in front-door.yaml).
  - delay: "00:00:03"
  - if:
    - condition: template
      value_template: >-
        {{ state_attr('media_player.home_theater_2', 'source') != 'PlayStation 5' }}
    then:
    - action: media_player.select_source
      target:
        entity_id: media_player.home_theater_2
      data:
        source: TV Audio
  - alias: Open YouTube when the TV boots into Live TV
    wait_template: "{{ is_state('media_player.lg_webos_tv_oled77c35la', 'on') }}"
    timeout: "00:01:00"
    continue_on_timeout: false
  - delay: "00:00:05"
  - if:
    - condition: template
      value_template: "{{ state_attr('media_player.lg_webos_tv_oled77c35la', 'source') == 'Live TV' }}"
    then:
    - action: media_player.select_source
      target:
        entity_id: media_player.lg_webos_tv_oled77c35la
      data:
        source: YouTube AdFree
  mode: restart

- id: tv_ht_on_when_playing
  alias: TV — HT on when playback starts
  description: >-
    Turn the home theater back on with TV Audio when the TV starts playing
    while it is off (it powers off with the TV, and a resume does not always
    go through the TV's off state).
  triggers:
  - entity_id: media_player.lg_webos_tv_oled77c35la
    to: playing
    trigger: state
  conditions:
  - condition: state
    entity_id: media_player.home_theater_2
    state: "off"
  actions:
  - action: media_player.turn_on
    target:
      entity_id: media_player.home_theater_2
  - delay: "00:00:05"
  - action: media_player.select_source
    target:
      entity_id: media_player.home_theater_2
    data:
      source: TV Audio
  mode: single

- id: tv_backlight_off
  alias: TV — Backlight off + HT
  description: >-
    Turns off backlight when TV powers off; also turns off the home
    theater, but only if its source was TV Audio or PS5 passthrough.
  triggers:
  - trigger: state
    entity_id: media_player.lg_webos_tv_oled77c35la
    to: "off"
    for: "00:02:00"
  actions:
  - action: light.turn_off
    target:
      entity_id: light.tv_backlight
  - if:
    - condition: template
      value_template: >-
        {{ state_attr('media_player.home_theater_2', 'source')
           in ['PlayStation 5', 'TV Audio'] }}
    then:
    - action: media_player.turn_off
      target:
        entity_id: media_player.home_theater_2
  mode: single

- id: tv_off_at_bedtime
  alias: TV — Off at bedtime if idle
  description: >-
    Turn off TV when sleep schedule starts, but only if it hasn't been
    playing anything for the last 15 minutes (a momentary non-playing
    state, e.g. between episodes, shouldn't trigger a shutdown).
    Skipped during party mode; catches up when it ends.
  triggers:
  - entity_id: schedule.sleep
    to: "on"
    trigger: state
    id: sleep_start
  - trigger: event
    event_type: modes_ended
    id: resumed
  conditions:
  - condition: state
    entity_id: input_boolean.party_mode
    state: "off"
  - condition: state
    entity_id: schedule.sleep
    state: "on"
  - condition: template
    value_template: >-
      {{ states('media_player.lg_webos_tv_oled77c35la') not in ['playing', 'off']
         and (trigger.id == 'resumed'
              or now() - states.media_player.lg_webos_tv_oled77c35la.last_changed
                 >= timedelta(minutes=15)) }}
  actions:
  - action: media_player.turn_off
    target:
      entity_id: media_player.lg_webos_tv_oled77c35la
  mode: single

- id: tv_media_off_when_armed_away
  alias: TV — Media and home theater off when armed away
  description: >-
    Stops all media and turns off the receiver and the TV once armed away or
    vacation, however it was armed, or when the house empties while already
    armed.
  triggers:
  - entity_id: alarm_control_panel.vasudha_secure
    to:
    - armed_away
    - armed_vacation
    trigger: state
  - trigger: numeric_state
    entity_id: zone.home
    below: 1
  conditions:
  - condition: state
    entity_id: alarm_control_panel.vasudha_secure
    state:
    - armed_away
    - armed_vacation
  - condition: template
    value_template: >-
      {{ trigger.entity_id != 'zone.home'
         or (trigger.from_state is not none
             and trigger.from_state.state not in ['unknown', 'unavailable']) }}
  actions:
  - action: media_player.media_stop
    target:
      entity_id: all
    continue_on_error: true
  - action: media_player.turn_off
    target:
      entity_id:
      - media_player.home_theater_2
      - media_player.lg_webos_tv_oled77c35la
    continue_on_error: true
  mode: single
