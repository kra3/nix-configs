streamline_templates: !include_dir_named streamline_templates/
views:
- title: Home
  path: home
  sections:
  - type: grid
    cards:
    - type: custom:streamline-card
      template: home_hero
      grid_options:
        columns: full
      visibility:
      - condition: user
        users:
        - a1d4401b8b714ebb83f07c5316ab399c
        - 6edcc5a09c3144d684077ee362e7394a
    - type: custom:streamline-card
      template: home_hero
      variables:
        name: Vasudha
      grid_options:
        columns: full
      visibility:
      - condition: not
        conditions:
        - condition: user
          users:
          - a1d4401b8b714ebb83f07c5316ab399c
          - 6edcc5a09c3144d684077ee362e7394a
    - type: custom:alarmo-card
      entity: alarm_control_panel.vasudha_secure
      name: Alarm
      use_code_dialog: true
      states:
        armed_home:
          hide: true
        armed_vacation:
          hide: true
        armed_custom_bypass:
          hide: true
      grid_options:
        columns: full
    - type: tile
      entity: input_boolean.party_mode
      name: Party mode
      icon: mdi:party-popper
    - type: tile
      entity: input_boolean.automations_paused
      name: Manual mode
      icon: mdi:pause-circle
  - type: grid
    cards:
    - type: heading
      heading: Active Rooms
      heading_style: title
    - type: tile
      entity: light.kitchen_lights
      name: Kitchen
      area: kitchen
      features:
      - type: light-brightness
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: binary_sensor.hue_pir_kitchen_occupancy
          state: "on"
        - condition: state
          entity: light.kitchen_lights
          state: "on"
        - condition: user
          users:
          - 6edcc5a09c3144d684077ee362e7394a
    - type: tile
      entity: light.kitchen_dining_lights
      name: Kitchen Dining
      area: kitchen_dining_room
      features:
      - type: light-brightness
      visibility:
      - condition: state
        entity: light.kitchen_dining_lights
        state: "on"
    - type: tile
      entity: light.dining_lights
      name: Dining Room
      area: dining_room
      features:
      - type: light-brightness
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: binary_sensor.ranger_duo_ptz_person_occupancy
          state: "on"
        - condition: state
          entity: light.dining_lights
          state: "on"
    - type: tile
      entity: light.living_room_lights
      name: Living Room
      area: living_room
      features:
      - type: light-brightness
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: binary_sensor.ranger_duo_fxd_person_occupancy
          state: "on"
        - condition: state
          entity: light.living_room_lights
          state: "on"
        - condition: state
          entity: media_player.lg_webos_tv_oled77c35la
          state: playing
        - condition: user
          users:
          - 6edcc5a09c3144d684077ee362e7394a
    - type: tile
      entity: light.tv_backlight
      name: TV Backlight
      area: living_room
      features:
      - type: light-brightness
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: light.tv_backlight
          state: "on"
        - condition: state
          entity: media_player.lg_webos_tv_oled77c35la
          state: playing
    - type: tile
      entity: light.hall
      name: Hall
      area: hall
      features:
      - type: light-brightness
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: binary_sensor.hue_pir_hallway_occupancy
          state: "on"
        - condition: state
          entity: light.hall
          state: "on"
    - type: custom:streamline-card
      template: home_room
      variables:
        room: bedroom
        name: Bedroom
        icon: mdi:bed
        light: light.bedroom_wardrobe_lights
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: binary_sensor.bedroom_occupancy_presence
          state: "on"
        - condition: state
          entity: light.bedroom_wardrobe_lights
          state: "on"
    - type: tile
      entity: light.office_room_light
      name: Office
      area: office
      features:
      - type: light-brightness
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: light.office_room_light
          state: "on"
        - condition: user
          users:
          - a1d4401b8b714ebb83f07c5316ab399c
    - type: custom:streamline-card
      template: home_room
      variables:
        room: bathroom
        name: Bathroom
        icon: mdi:shower
      visibility:
      - condition: state
        entity: binary_sensor.bathroom_occupancy_presence
        state: "on"
    - type: custom:streamline-card
      template: home_room
      variables:
        room: laundry
        name: Laundry
        icon: mdi:washing-machine
      visibility:
      - condition: state
        entity: binary_sensor.laundry_occupancy_presence
        state: "on"
    - type: tile
      entity: lock.front_door
      name: Front
      area: front
    - type: tile
      entity: switch.front_entrance_double_switch_left
      name: Main Entrance
      area: front
      visibility:
      - condition: state
        entity: switch.front_entrance_double_switch_left
        state: "on"
    - type: tile
      entity: switch.front_entrance_double_switch_right
      name: Street Light
      area: front
      visibility:
      - condition: state
        entity: switch.front_entrance_double_switch_right
        state: "on"
    - type: custom:streamline-card
      template: home_room
      variables:
        room: toilet
        name: Toilet
        icon: mdi:toilet
      visibility:
      - condition: state
        entity: binary_sensor.toilet_occupancy_presence
        state: "on"
  - type: grid
    cards:
    - show_current: true
      show_forecast: true
      type: weather-forecast
      entity: weather.forecast_vasudha
      forecast_type: daily
      secondary_info_attribute: wind_speed
      forecast_slots: 7
      tap_action:
        action: more-info
    - type: heading
      heading: Media
      heading_style: title
    - type: custom:mushroom-template-card
      primary: Media activity
      secondary: >-
        {% set q = states('sensor.sabnzbd_karunagath_in_queue_count') | int(0) %}
        {% set p = states('sensor.seerr_pending_requests') | int(0) %}
        {% set parts = [] %}
        {% if q > 0 %}{% set parts = parts + [q ~ ' downloading'] %}{% endif %}
        {% if p > 0 %}{% set parts = parts + [p ~ ' pending requests'] %}{% endif %}
        {{ parts | join(' · ') }}
      icon: mdi:download
      tap_action:
        action: navigate
        navigation_path: /dashboard-home/media
      visibility:
      - condition: or
        conditions:
        - condition: numeric_state
          entity: sensor.sabnzbd_karunagath_in_queue_count
          above: 0
        - condition: numeric_state
          entity: sensor.seerr_pending_requests
          above: 0
      grid_options:
        columns: full
    - type: custom:mini-media-player
      entity: media_player.lg_webos_tv_oled77c35la
      name: TV
      artwork: cover
      info: short
      hide:
        source: true
        power: true
        shuffle: true
        repeat: true
      visibility:
      - condition: state
        entity: media_player.lg_webos_tv_oled77c35la
        state: [playing, paused]
    - type: custom:mini-media-player
      entity: media_player.ma_home_theater
      name: Living room
      artwork: cover
      info: scroll
      hide:
        source: true
        power: true
        shuffle: true
        repeat: true
      visibility:
      - condition: state
        entity: media_player.ma_home_theater
        state: [playing, paused]
    - type: custom:mini-media-player
      entity: media_player.kitchen
      name: Kitchen
      artwork: cover
      info: scroll
      hide:
        source: true
        power: true
        shuffle: true
        repeat: true
      visibility:
      - condition: state
        entity: media_player.kitchen
        state: [playing, paused]
    - type: tile
      entity: media_player.lg_webos_tv_oled77c35la
      name: Watch TV
      icon: mdi:television-play
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: media_player.turn_on
        target:
          entity_id: media_player.lg_webos_tv_oled77c35la
      grid_options:
        columns: 6
      visibility:
      - condition: state
        entity: media_player.lg_webos_tv_oled77c35la
        state_not: [playing, paused]
      - condition: state
        entity: media_player.ma_home_theater
        state_not: [playing, paused]
      - condition: state
        entity: media_player.kitchen
        state_not: [playing, paused]
    - type: tile
      entity: media_player.ma_home_theater
      name: Play music
      icon: mdi:music
      hide_state: true
      tap_action:
        action: navigate
        navigation_path: /media-browser
      grid_options:
        columns: 6
      visibility:
      - condition: state
        entity: media_player.lg_webos_tv_oled77c35la
        state_not: [playing, paused]
      - condition: state
        entity: media_player.ma_home_theater
        state_not: [playing, paused]
      - condition: state
        entity: media_player.kitchen
        state_not: [playing, paused]
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Climate
      heading_style: title
    - type: custom:streamline-card
      template: home_climate
      variables:
        entity: sensor.average_temperature
        name: Temperature
        icon: mdi:thermometer
        color: "#ff9f6b"
        decimals: 1
      grid_options:
        columns: 8
      visibility:
      - condition: screen
        media_query: "(min-width: 700px)"
    - type: custom:streamline-card
      template: home_climate
      variables:
        entity: sensor.average_humidity
        name: Humidity
        icon: mdi:water-percent
        color: "#6bb6ff"
        decimals: 0
      grid_options:
        columns: 8
      visibility:
      - condition: screen
        media_query: "(min-width: 700px)"
    - type: custom:streamline-card
      template: home_climate
      variables:
        entity: sensor.average_illuminance
        name: Illuminance
        icon: mdi:brightness-5
        color: "#ffd86b"
        decimals: 0
      grid_options:
        columns: 8
      visibility:
      - condition: screen
        media_query: "(min-width: 700px)"
    - type: custom:streamline-card
      template: home_climate
      variables:
        entity: sensor.average_temperature
        name: Temperature
        icon: mdi:thermometer
        color: "#ff9f6b"
        decimals: 1
      grid_options:
        columns: 12
      visibility:
      - condition: screen
        media_query: "(max-width: 699px)"
    - type: custom:streamline-card
      template: home_climate
      variables:
        entity: sensor.average_humidity
        name: Humidity
        icon: mdi:water-percent
        color: "#6bb6ff"
        decimals: 0
      grid_options:
        columns: 12
      visibility:
      - condition: screen
        media_query: "(max-width: 699px)"
    - type: custom:streamline-card
      template: home_climate
      variables:
        entity: sensor.average_illuminance
        name: Illuminance
        icon: mdi:brightness-5
        color: "#ffd86b"
        decimals: 0
      grid_options:
        columns: 12
      visibility:
      - condition: screen
        media_query: "(max-width: 699px)"
  - type: grid
    cards:
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: todo.shopping_list
        above: 0
      card:
        type: todo-list
        entity: todo.shopping_list
        title: Shopping List
        hide_completed: true
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: todo.shopping_list
        below: 1
      card:
        type: custom:popup-tile-card
        entity: todo.shopping_list
        name: Shopping list
        icon: mdi:cart-outline
        unit: items
        popup:
          type: todo-list
          entity: todo.shopping_list
          title: Shopping List
          hide_completed: true
  badges:
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: person.anjalipc
    color: ''
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: person.arun_karunagath
    color: ''
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: lock.front_door
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.waste_truck_type
    color: ''
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.hue_pir_hallway_temperature
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.sun_next_rising
    color: ''
    visibility:
    - condition: state
      entity: sun.sun
      state: below_horizon
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.sun_next_dusk
    color: ''
    visibility:
    - condition: state
      entity: sun.sun
      state: above_horizon
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.moon_phase
    color: ''
  - type: entity
    entity: sensor.season
  cards: []
- title: Cameras
  path: cameras
  icon: mdi:cctv
  sections:
  - type: grid
    cards:
    - type: custom:advanced-camera-card
      cameras:
      - camera_entity: camera.ranger_duo_fxd
        live_provider: go2rtc
      - camera_entity: camera.ranger_duo_ptz
        live_provider: go2rtc
      - camera_entity: camera.ranger_uno
        live_provider: go2rtc
      live:
        display:
          mode: grid
      view:
        dim: true
      menu:
        buttons:
          microphone:
            enabled: true
      status_bar:
        style: overlay
      image:
        mode: camera
      grid_options:
        columns: full
    - type: heading
      heading: Person detected
      heading_style: subtitle
    - type: tile
      entity: binary_sensor.ranger_duo_fxd_person_occupancy
      name: Living Room
      area: living_room
      grid_options:
        columns: 4
    - type: tile
      entity: binary_sensor.ranger_duo_ptz_person_occupancy
      name: Dining Room
      area: dining_room
      grid_options:
        columns: 4
    - type: tile
      entity: binary_sensor.ranger_uno_person_occupancy
      name: Office Room
      area: office
      grid_options:
        columns: 4
- title: Media
  path: media
  icon: mdi:play-circle
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Players
      heading_style: title
    - type: custom:mini-media-player
      entity: media_player.lg_webos_tv_oled77c35la
      name: TV
      toggle_power: false
      artwork: cover
      info: scroll
      hide:
        source: true
      idle_view:
        when_idle: true
        when_standby: true
      shortcuts:
        attribute: source
        hide_when_off: true
        label: Apps
        list:
        - name: YouTube
          type: source
          id: YouTube AdFree
        - name: Stremio
          type: source
          id: Stremio
        - name: SVT Play
          type: source
          id: SVT Play
        - name: Breezyfin
          type: source
          id: Breezyfin
        - name: Litefin
          type: source
          id: Litefin
        - name: PS5
          type: source
          id: PlayStation 5
        - name: Live TV
          type: source
          id: Live TV
    - type: custom:mini-media-player
      entity: media_player.home_theater
      name: Now playing
      max_volume: 64
      artwork: material
      info: scroll
      hide:
        power: true
        source: true
        volume: true
        mute: true
        shuffle: true
        repeat: true
      visibility:
      - condition: state
        entity: media_player.home_theater
        state: [playing, paused]
    - type: custom:mini-media-player
      entity: media_player.home_theater_2
      name: Home theater
      toggle_power: false
      max_volume: 64
      hide:
        source: true
        controls: true
      sound_mode: full
      idle_view:
        when_idle: true
        when_standby: true
      shortcuts:
        attribute: source
        hide_when_off: true
        label: Input or radio
        list:
        - name: TV
          type: source
          id: TV Audio
        - name: Bluetooth
          type: source
          id: Bluetooth
        - name: HEOS (Net)
          type: source
          id: HEOS Music
        - name: PS5
          type: source
          id: PlayStation 5
        - name: HitCity
          type: service
          id: media_player.select_source
          data:
            entity_id: media_player.home_theater
            source: HitCity (Malmö)
        - name: BBC World Service
          type: service
          id: media_player.select_source
          data:
            entity_id: media_player.home_theater
            source: BBC World Service
        - name: Radio Relax International
          type: service
          id: media_player.select_source
          data:
            entity_id: media_player.home_theater
            source: Radio Relax International
        - name: AIR Kochi FM 102.3
          type: service
          id: media_player.select_source
          data:
            entity_id: media_player.home_theater
            source: AIR KOCHI FM 102.3 | (Classical Indian)
        - name: AIR FM Rainbow 101.3
          type: service
          id: media_player.select_source
          data:
            entity_id: media_player.home_theater
            source: AIR FM Rainbow 101.3 (Indian Music)
    - type: custom:mini-media-player
      entity: media_player.kitchen
      name: Kitchen
      artwork: material
      info: scroll
      hide:
        power: true
      idle_view:
        when_idle: true
  - type: grid
    cards:
    - type: heading
      heading: Jellyfin
      heading_style: title
    - type: tile
      entity: sensor.media_play_active_clients
      name: Watching now
      grid_options:
        columns: 12
    - type: custom:auto-entities
      card:
        type: grid
        columns: 1
        square: false
      card_param: cards
      show_empty: false
      filter:
        include:
        - domain: media_player
          state: /^(playing|paused)$/
          options:
            type: tile
            state_content:
            - media_title
            - state
        exclude:
        - entity_id: media_player.*webos*
        - entity_id: media_player.*oled77c35la*
        - entity_id: media_player.*home_theater*
        - entity_id: media_player.*lg_smart_tv*
        - entity_id: media_player.ma_*
        - entity_id: media_player.kitchen
      grid_options:
        columns: 12
  - type: grid
    cards:
    - type: heading
      heading: Requests
      heading_style: title
    - type: tile
      entity: sensor.seerr_pending_requests
      name: Pending
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.seerr_processing_requests
      name: Processing
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.seerr_open_issues
      name: Open issues
      grid_options:
        columns: 4
    - type: tile
      entity: event.seerr_last_media_event
      name: Last event
      grid_options:
        columns: 12
  - type: grid
    cards:
    - type: heading
      heading: Downloads
      heading_style: title
    - type: tile
      entity: sensor.sabnzbd_karunagath_in_status
      name: Status
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.sabnzbd_karunagath_in_speed
      name: Speed
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.sabnzbd_karunagath_in_queue_count
      name: Queue
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.sabnzbd_karunagath_in_left_to_download
      name: Left to download
      grid_options:
        columns: 6
    - type: tile
      entity: number.sabnzbd_karunagath_in_speedlimit
      name: Speed limit
      features:
      - type: numeric-input
        style: slider
      grid_options:
        columns: 12
    - type: tile
      entity: button.sabnzbd_karunagath_in_pause
      name: Pause
      icon: mdi:pause
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.sabnzbd_karunagath_in_pause
      grid_options:
        columns: 6
    - type: tile
      entity: button.sabnzbd_karunagath_in_resume
      name: Resume
      icon: mdi:play
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.sabnzbd_karunagath_in_resume
      grid_options:
        columns: 6
    - type: tile
      entity: binary_sensor.sabnzbd_karunagath_in_warnings
      name: Warnings
      grid_options:
        columns: 12
  - type: grid
    cards:
    - type: heading
      heading: Upcoming
      heading_style: title
    - type: calendar
      initial_view: listWeek
      entities:
      - calendar.sonarr
      - calendar.radarr
      grid_options:
        columns: 12
  - type: grid
    cards:
    - type: heading
      heading: Storage
      heading_style: title
    - type: gauge
      entity: sensor.media_disk_used
      name: Media disk used
      min: 0
      max: 100
      severity:
        green: 0
        yellow: 75
        red: 90
      grid_options:
        columns: 6
        rows: auto
    - type: tile
      entity: sensor.radarr_disk_space_movies
      name: Free space
      grid_options:
        columns: 6
    - type: tile
      entity: binary_sensor.radarr_health
      name: Radarr health
      grid_options:
        columns: 12
- type: sections
  title: Health
  path: health-arun
  icon: mdi:scale-bathroom
  visible:
  - user: a1d4401b8b714ebb83f07c5316ab399c
  cards: []
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Body composition
      heading_style: title
    - type: custom:streamline-card
      template: health_body
      variables:
        date_entity: input_datetime.withings_arun_last_weigh_in
        w: kra
      grid_options:
        columns: 12
    - type: heading
      heading: Sleep and vitals
      heading_style: title
    - type: custom:streamline-card
      template: health_sleep
      variables:
        p: meghanadha
      grid_options:
        columns: 12
    - type: custom:streamline-card
      template: health_line_delta
      variables:
        color: "#f48fb1"
        days: 30
        entity: sensor.meghanadha_heart_rate_variability
        good: up
        icon: mdi:pulse
        name: Heart rate variability
        popup: "Heart rate variability (ms)"
        popup_days: 30
      grid_options:
        columns: 6
    - type: custom:streamline-card
      template: health_line_delta
      variables:
        color: "#5ec4c4"
        days: 90
        decimals: 1
        delta_unit: ""
        entity: sensor.meghanadha_vo2_max
        good: up
        icon: mdi:run-fast
        name: VO2 max
        popup: "VO2 max"
        popup_days: 180
      grid_options:
        columns: 6
    - type: custom:streamline-card
      template: health_line_delta
      variables:
        color: "#6bb8ff"
        days: 30
        entity: sensor.meghanadha_blood_oxygen
        good: up
        icon: mdi:water-percent
        name: Blood oxygen
        popup: "Blood oxygen (%)"
        popup_days: 90
      grid_options:
        columns: 6
  - type: grid
    cards:
    - type: heading
      heading: Past 7 days
      heading_style: title
    - type: custom:streamline-card
      template: health_cumulative
      variables:
        above: -1
        color: "#f2c14e"
        decimals: 0
