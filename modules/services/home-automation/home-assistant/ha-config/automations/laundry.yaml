# ── Laundry ─────────────────────────────────────────────────────
- id: laundry_cycle_finished
  alias: "Laundry: cycle finished"
  description: Marks a machine as waiting to be emptied when its cycle ends, counts the cycle, and tells whoever is home.
  trigger:
    - platform: state
      entity_id: binary_sensor.washer_running
      from: "on"
      to: "off"
      id: washer
    - platform: state
      entity_id: binary_sensor.dryer_running
      from: "on"
      to: "off"
      id: dryer
  action:
    - action: input_boolean.turn_on
      target:
        entity_id: "input_boolean.{{ trigger.id }}_unemptied"
    - action: counter.increment
      target:
        entity_id: "counter.{{ trigger.id }}_care"
    - action: script.laundry_notify
      data:
        machine: "{{ trigger.id }}"
  mode: queued

- id: laundry_cycle_started
  alias: "Laundry: cycle started"
  description: >-
    A new cycle clears the waiting-to-be-emptied flag, records its start for the
    cycle log, and (for the dryer) notes how long the washed laundry waited and
    clears the washer's flag as a fallback for a missed door event.
  trigger:
    - platform: state
      entity_id: binary_sensor.washer_running
      to: "on"
      id: washer
    - platform: state
      entity_id: binary_sensor.dryer_running
      to: "on"
      id: dryer
  action:
    - variables:
        started: "{{ as_timestamp(now()) - 30 }}"
        washer_end: "{{ as_timestamp(states('sensor.washer_last_cycle'), 0) }}"
        dryer_end: "{{ as_timestamp(states('sensor.dryer_last_cycle'), 0) }}"
    - action: input_boolean.turn_off
      target:
        entity_id: "input_boolean.{{ trigger.id }}_unemptied"
    - action: input_datetime.set_datetime
      target:
        entity_id: "input_datetime.{{ trigger.id }}_cycle_start"
      data:
        datetime: "{{ started | timestamp_custom('%Y-%m-%d %H:%M:%S') }}"
    - action: input_number.set_value
      target:
        entity_id: "input_number.{{ trigger.id }}_cycle_start_kwh"
      data:
        value: "{{ states('sensor.' ~ trigger.id ~ '_power_monitor_energy') | float(0) }}"
    - if:
        - condition: template
          value_template: >-
            {{ trigger.id == 'dryer' and washer_end > dryer_end
               and 0 <= (started - washer_end) / 60 <= 1440 }}
      then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.washer_unemptied
        - action: input_number.set_value
          target:
            entity_id: input_number.laundry_gap_minutes
          data:
            value: "{{ ((started - washer_end) / 60) | round(0) }}"
  mode: queued

- id: laundry_door_emptied
  alias: "Laundry: door opened"
  description: Opening a machine's door a minute after its cycle ended counts as emptying it.
  trigger:
    - platform: state
      entity_id: binary_sensor.washing_machine_vibration
      to: "on"
      id: washer
    - platform: state
      entity_id: binary_sensor.dryer_vibration
      to: "on"
      id: dryer
  condition:
    - condition: template
      value_template: "{{ is_state('input_boolean.' ~ trigger.id ~ '_unemptied', 'on') }}"
    - condition: template
      value_template: >-
        {% set r = states['binary_sensor.' ~ trigger.id ~ '_running'] %}
        {{ r.state == 'off' and (now() - r.last_changed).total_seconds() > 60 }}
  action:
    - action: input_boolean.turn_off
      target:
        entity_id: "input_boolean.{{ trigger.id }}_unemptied"
  mode: queued

- id: laundry_emptying_reminder
  alias: "Laundry: emptying reminder"
  description: Reminds after 30 minutes and again after 2 hours if a machine is still waiting to be emptied.
  trigger:
    - platform: state
      entity_id: input_boolean.washer_unemptied
      to: "on"
      for: "00:30:00"
      id: washer
    - platform: state
      entity_id: input_boolean.washer_unemptied
      to: "on"
      for: "02:00:00"
      id: washer
    - platform: state
      entity_id: input_boolean.dryer_unemptied
      to: "on"
      for: "00:30:00"
      id: dryer
    - platform: state
      entity_id: input_boolean.dryer_unemptied
      to: "on"
      for: "02:00:00"
      id: dryer
  action:
    - action: script.laundry_notify
      data:
        machine: "{{ trigger.id }}"
        reminder: true
  mode: queued

- id: laundry_morning_delivery
  alias: "Laundry: deliver after sleep"
  description: Delivers what finished during the night once the sleep schedule ends.
  trigger:
    - platform: state
      entity_id: schedule.sleep
      from: "on"
      to: "off"
  action:
    - repeat:
        for_each:
          - washer
          - dryer
        sequence:
          - if:
              - condition: template
                value_template: "{{ is_state('input_boolean.' ~ repeat.item ~ '_unemptied', 'on') }}"
            then:
              - action: script.laundry_notify
                data:
                  machine: "{{ repeat.item }}"
  mode: single

- id: laundry_dryer_cycle_check
  alias: "Laundry: dryer cycle check"
  description: >-
    Compares a finished dryer cycle with the median of the previous ones (needs
    five): far less energy and time suggests it stopped early, far more suggests
    a clogged filter.
  trigger:
    - platform: state
      entity_id: sensor.dryer_last_cycle
  condition:
    - condition: template
      value_template: "{{ (state_attr('sensor.dryer_last_cycle', 'cycles') or []) | length >= 6 }}"
  action:
    - variables:
        cycles: "{{ state_attr('sensor.dryer_last_cycle', 'cycles') }}"
        last: "{{ cycles[0] }}"
        med_kwh: >-
          {% set k = cycles[1:] | map(attribute='kwh') | map('float') | sort %}
          {{ k[(k | length) // 2] }}
        med_min: >-
          {% set m = cycles[1:] | map(attribute='minutes') | map('float') | sort %}
          {{ m[(m | length) // 2] }}
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ med_kwh > 0 and last.kwh | float < 0.5 * med_kwh and last.minutes | float < 0.6 * med_min }}"
          sequence:
            - action: script.laundry_notify
              data:
                machine: dryer
                text: Dryer cycle was much shorter than usual. If it stopped before the clothes were dry, check whether the water container is full.
        - conditions:
            - condition: template
              value_template: "{{ med_kwh > 0 and last.kwh | float > 1.4 * med_kwh and last.minutes | float > 1.3 * med_min }}"
          sequence:
            - action: script.laundry_notify
              data:
                machine: dryer
                text: "Dryer cycle used {{ ((last.kwh | float / med_kwh - 1) * 100) | round(0) | int }} % more energy than usual. Check the lint filter and the heat exchanger."
  mode: queued

- id: laundry_care_due
  alias: "Laundry: care due"
  description: Reminds when a machine has done enough cycles since its last care; the counter resets from the Laundry view.
  trigger:
    - platform: numeric_state
      entity_id: counter.washer_care
      above: 39
      id: washer
    - platform: numeric_state
      entity_id: counter.dryer_care
      above: 29
      id: dryer
  action:
    - action: script.laundry_notify
      data:
        machine: "{{ trigger.id }}"
        text: >-
          {% if trigger.id == 'washer' %}40 washes since the drum was last cleaned. Run a drum clean programme.
          {% else %}30 dryer cycles since the filters were last cared for. Rinse the filters and check the heat exchanger.{% endif %}
  mode: queued

- id: laundry_standby_check
  alias: "Laundry: standby draw"
  description: Warns if an idle machine keeps drawing more than a standby amount.
  trigger:
    - platform: numeric_state
      entity_id: sensor.washer_power_monitor_power
      above: 6
      for: "00:30:00"
      id: washer
    - platform: numeric_state
      entity_id: sensor.dryer_power_monitor_power
      above: 6
      for: "00:30:00"
      id: dryer
  condition:
    - condition: template
      value_template: "{{ is_state('binary_sensor.' ~ trigger.id ~ '_running', 'off') }}"
  action:
    - action: script.laundry_notify
      data:
        machine: "{{ trigger.id }}"
        text: "{{ trigger.id | capitalize }} has drawn {{ states('sensor.' ~ trigger.id ~ '_power_monitor_power') }} W for half an hour while idle (normally about 2 W)."
  mode: queued
