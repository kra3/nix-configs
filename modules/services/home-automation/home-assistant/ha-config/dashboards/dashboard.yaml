views:
- title: Home
  path: home
  sections:
  - type: grid
    cards:
    - type: custom:mushroom-template-card
      primary: >-
        {%- if is_state('sensor.dashboard_presence_state', 'away') -%}
          Away
        {%- elif is_state('sensor.dashboard_presence_state', 'home_both') -%}
          Everyone's home
        {%- else -%}
          Home
        {%- endif -%}
      secondary: >-
        {{ states('sensor.dashboard_time_period') | title }}{% if states('sensor.dashboard_eta') not in ['none', 'unknown', 'unavailable'] %} · {{ states('sensor.dashboard_eta') }}{% endif %}
      icon: >-
        {% if is_state('sensor.dashboard_presence_state', 'away') %}mdi:home-export-outline{% else %}mdi:home-heart{% endif %}
      grid_options:
        columns: full
      visibility:
      - condition: user
        users:
        - a1d4401b8b714ebb83f07c5316ab399c
        - 6edcc5a09c3144d684077ee362e7394a
    - type: custom:mushroom-template-card
      primary: "Vasudha"
      secondary: >-
        {{ states('sensor.dashboard_presence_state') | replace('_', ' ') | title }} · {{ states('sensor.dashboard_time_period') | title }}
      icon: mdi:home
      grid_options:
        columns: full
      visibility:
      - condition: not
        conditions:
        - condition: user
          users:
          - a1d4401b8b714ebb83f07c5316ab399c
          - 6edcc5a09c3144d684077ee362e7394a
  - type: grid
    cards:
    - type: heading
      heading: Active Rooms
      heading_style: title
    - type: tile
      entity: light.kitchen_lights
      name: Kitchen
      area: kitchen
      features:
      - type: light-brightness
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: binary_sensor.hue_pir_kitchen_occupancy
          state: "on"
        - condition: state
          entity: light.kitchen_lights
          state: "on"
        - condition: user
          users:
          - 6edcc5a09c3144d684077ee362e7394a
    - type: tile
      entity: light.kitchen_dining_lights
      name: Kitchen Dining
      area: kitchen_dining_room
      features:
      - type: light-brightness
      visibility:
      - condition: state
        entity: light.kitchen_dining_lights
        state: "on"
    - type: tile
      entity: light.dining_lights
      name: Dining Room
      area: dining_room
      features:
      - type: light-brightness
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: binary_sensor.ranger_duo_ptz_person_occupancy
          state: "on"
        - condition: state
          entity: light.dining_lights
          state: "on"
    - type: tile
      entity: light.living_room_lights
      name: Living Room
      area: living_room
      features:
      - type: light-brightness
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: binary_sensor.ranger_duo_fxd_person_occupancy
          state: "on"
        - condition: state
          entity: light.living_room_lights
          state: "on"
        - condition: state
          entity: media_player.lg_webos_tv_oled77c35la
          state: playing
        - condition: user
          users:
          - 6edcc5a09c3144d684077ee362e7394a
    - type: tile
      entity: light.tv_backlight
      name: TV Backlight
      area: living_room
      features:
      - type: light-brightness
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: light.tv_backlight
          state: "on"
        - condition: state
          entity: media_player.lg_webos_tv_oled77c35la
          state: playing
    - type: tile
      entity: light.hall
      name: Hall
      area: hall
      features:
      - type: light-brightness
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: binary_sensor.hue_pir_hallway_occupancy
          state: "on"
        - condition: state
          entity: light.hall
          state: "on"
    - type: tile
      entity: light.bedroom_wardrobe_lights
      name: Bedroom
      area: bedroom
      features:
      - type: light-brightness
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: binary_sensor.bedroom_occupancy_presence
          state: "on"
        - condition: state
          entity: light.bedroom_wardrobe_lights
          state: "on"
    - type: tile
      entity: light.office_room_light
      name: Office
      area: office
      features:
      - type: light-brightness
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: light.office_room_light
          state: "on"
        - condition: user
          users:
          - a1d4401b8b714ebb83f07c5316ab399c
    - type: tile
      entity: sensor.bathroom_occupancy_temperature
      name: Bathroom
      area: bathroom
      visibility:
      - condition: state
        entity: binary_sensor.bathroom_occupancy_presence
        state: "on"
    - type: tile
      entity: sensor.laundry_occupancy_temperature
      name: Laundry
      area: laundry
      visibility:
      - condition: state
        entity: binary_sensor.laundry_occupancy_presence
        state: "on"
    - type: tile
      entity: lock.front_door
      name: Front
      area: front
    - type: tile
      entity: switch.front_entrance_double_switch_left
      name: Main Entrance
      area: front
      visibility:
      - condition: state
        entity: switch.front_entrance_double_switch_left
        state: "on"
    - type: tile
      entity: switch.front_entrance_double_switch_right
      name: Street Light
      area: front
      visibility:
      - condition: state
        entity: switch.front_entrance_double_switch_right
        state: "on"
    - type: tile
      entity: sensor.toilet_occupancy_temperature
      name: Toilet
      area: toilet
  - type: grid
    cards:
    - type: heading
      heading: Right Now
      heading_style: title
      badges:
      - type: entity
        entity: binary_sensor.dashboard_alert_security
        show_state: false
        visibility:
        - condition: state
          entity: binary_sensor.dashboard_alert_security
          state: "on"
      - type: entity
        entity: binary_sensor.dashboard_alert_device_health
        show_state: false
        visibility:
        - condition: state
          entity: binary_sensor.dashboard_alert_device_health
          state: "on"
      - type: entity
        entity: binary_sensor.dashboard_alert_override_active
        show_state: false
        visibility:
        - condition: state
          entity: binary_sensor.dashboard_alert_override_active
          state: "on"
      - type: entity
        entity: binary_sensor.dashboard_alert_crisis
        show_state: false
        visibility:
        - condition: state
          entity: binary_sensor.dashboard_alert_crisis
          state: "on"
    - type: tile
      entity: alarm_control_panel.vasudha_secure
      name: Alarm
      features:
      - type: alarm-modes
        modes:
        - armed_night
        - armed_away
        - disarmed
      grid_options:
        columns: full
    - type: vertical-stack
      cards:
      - type: heading
        heading: Needs attention
        heading_style: subtitle
      - type: conditional
        conditions:
        - condition: state
          entity: binary_sensor.dashboard_alert_security
          state: "on"
        card:
          type: custom:mushroom-template-card
          primary: Open door/window
          secondary: >-
            {{ state_attr('binary_sensor.house_exits_open_status', 'open_names') or 'Unknown' }}
          icon: mdi:door-open
          icon_color: red
          tap_action:
            action: more-info
            entity: binary_sensor.house_exits_open_status
      - type: conditional
        conditions:
        - condition: state
          entity: binary_sensor.dashboard_alert_security
          state: "on"
        - condition: state
          entity: alarm_control_panel.vasudha_secure
          state: disarmed
        card:
          type: custom:mushroom-template-card
          primary: Force arm for the night
          icon: mdi:shield-lock
          icon_color: amber
          tap_action:
            action: call-service
            service: script.alarm_force_arm_night
            confirmation:
              text: Force-arm for the night, bypassing any open sensors?
      - type: conditional
        conditions:
        - condition: state
          entity: binary_sensor.house_exits_open_status
          state: "on"
        - condition: state
          entity: binary_sensor.dashboard_alert_security
          state: "off"
        card:
          type: custom:mushroom-template-card
          primary: Open (FYI, not armed)
          secondary: >-
            {{ state_attr('binary_sensor.house_exits_open_status', 'open_names') or 'Unknown' }}
          icon: mdi:door-open
          icon_color: blue
          tap_action:
            action: more-info
            entity: binary_sensor.house_exits_open_status
      - type: conditional
        conditions:
        - condition: state
          entity: binary_sensor.dashboard_alert_device_health
          state: "on"
        card:
          type: custom:mushroom-template-card
          primary: Device unavailable
          secondary: >-
            {{ state_attr('binary_sensor.dashboard_alert_device_health', 'unavailable_names') or 'Unknown' }}
          icon: mdi:alert-circle
          icon_color: orange
          tap_action:
            action: more-info
            entity: binary_sensor.dashboard_alert_device_health
      - type: conditional
        conditions:
        - condition: state
          entity: input_boolean.party_mode
          state: "on"
        card:
          type: tile
          entity: input_boolean.party_mode
          icon: mdi:party-popper
      - type: conditional
        conditions:
        - condition: state
          entity: input_boolean.automations_paused
          state: "on"
        card:
          type: tile
          entity: input_boolean.automations_paused
          icon: mdi:pause-circle
      - type: conditional
        conditions:
        - condition: state
          entity: binary_sensor.dashboard_alert_crisis
          state: "on"
        card:
          type: custom:mushroom-template-card
          primary: Crisis information
          secondary: >-
            {{ state_attr('binary_sensor.dashboard_alert_crisis', 'headlines') or 'Unknown' }}
          icon: mdi:alert
          icon_color: red
          tap_action:
            action: more-info
            entity: binary_sensor.dashboard_alert_crisis
      - type: markdown
        content: "Nothing needs attention right now."
        visibility:
        - condition: and
          conditions:
          - condition: state
            entity: binary_sensor.dashboard_alert_security
            state: "off"
          - condition: state
            entity: binary_sensor.dashboard_alert_device_health
            state: "off"
          - condition: state
            entity: binary_sensor.dashboard_alert_override_active
            state: "off"
          - condition: state
            entity: binary_sensor.house_exits_open_status
            state: "off"
          - condition: state
            entity: binary_sensor.dashboard_alert_crisis
            state: "off"
    - type: sensor
      graph: line
      entity: sensor.average_temperature
      name: Temperature
      icon: mdi:thermometer
      detail: 2
      hours_to_show: 168
      grid_options:
        columns: 4
    - type: sensor
      graph: line
      entity: sensor.average_humidity
      name: Humidity
      icon: mdi:water-percent
      detail: 2
      hours_to_show: 168
      grid_options:
        columns: 4
    - type: sensor
      graph: line
      entity: sensor.average_illuminance
      name: Illuminance
      icon: mdi:brightness-6
      detail: 2
      hours_to_show: 168
      grid_options:
        columns: 4
  - type: grid
    cards:
    - type: heading
      heading: Media
      heading_style: title
    - type: custom:mini-media-player
      entity: media_player.lg_webos_tv_oled77c35la
      visibility:
      - condition: state
        entity: sensor.dashboard_active_media_player
        state: media_player.lg_webos_tv_oled77c35la
    - type: custom:mini-media-player
      entity: media_player.home_theater
      visibility:
      - condition: state
        entity: sensor.dashboard_active_media_player
        state: media_player.home_theater
    - type: custom:mini-media-player
      entity: media_player.home_theater_2
      visibility:
      - condition: state
        entity: sensor.dashboard_active_media_player
        state: media_player.home_theater_2
  - type: grid
    cards:
    - type: todo-list
      entity: todo.shopping_list
      title: Shopping List
      hide_completed: true
    - show_current: true
      show_forecast: true
      type: weather-forecast
      entity: weather.forecast_vasudha
      forecast_type: daily
      secondary_info_attribute: wind_speed
      forecast_slots: 7
      tap_action:
        action: more-info
  badges:
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: person.anjalipc
    color: ''
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: person.arun_karunagath
    color: ''
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: alarm_control_panel.vasudha_secure
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: lock.front_door
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.waste_truck_type
    color: ''
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.hue_pir_hallway_temperature
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: weather.forecast_vasudha
    state_content:
    - temperature
    - state
    - wind_speed
    - uv_index
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.sun_next_rising
    color: ''
    visibility:
    - condition: state
      entity: sun.sun
      state: below_horizon
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.sun_next_dusk
    color: ''
    visibility:
    - condition: state
      entity: sun.sun
      state: above_horizon
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.moon_phase
    color: ''
  - type: entity
    entity: sensor.season
  cards: []
- title: Cameras
  path: cameras
  icon: mdi:cctv
  sections:
  - type: grid
    cards:
    - type: custom:advanced-camera-card
      cameras:
      - camera_entity: camera.ranger_duo_fxd
        live_provider: go2rtc
      - camera_entity: camera.ranger_duo_ptz
        live_provider: go2rtc
      - camera_entity: camera.ranger_uno
        live_provider: go2rtc
      live:
        display:
          mode: grid
      view:
        dim: true
      menu:
        buttons:
          microphone:
            enabled: true
      status_bar:
        style: overlay
      image:
        mode: camera
      grid_options:
        columns: full
    - type: heading
      heading: Person detected
      heading_style: subtitle
    - type: tile
      entity: binary_sensor.ranger_duo_fxd_person_occupancy
      name: Living Room
      area: living_room
      grid_options:
        columns: 4
    - type: tile
      entity: binary_sensor.ranger_duo_ptz_person_occupancy
      name: Dining Room
      area: dining_room
      grid_options:
        columns: 4
    - type: tile
      entity: binary_sensor.ranger_uno_person_occupancy
      name: Office Room
      area: office
      grid_options:
        columns: 4
- title: Media
  path: media
  icon: mdi:play-circle
  sections:
  - type: grid
    cards:
    - type: custom:mini-media-player
      entity: media_player.lg_webos_tv_oled77c35la
    - type: custom:mini-media-player
      entity: media_player.home_theater
    - type: custom:mini-media-player
      entity: media_player.home_theater_2
  - type: grid
    cards:
    - type: heading
      heading: Media Acquisition
      heading_style: title
    - type: tile
      entity: sensor.media_play_active_clients
      name: Jellyfin watching
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.sonarr_upcoming
      name: Sonarr upcoming
      grid_options:
        columns: 4
    - type: tile
      entity: binary_sensor.radarr_health
      name: Radarr health
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.radarr_disk_space_movies
      name: Movies disk space
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.sabnzbd_karunagath_in_queue
      name: SABnzbd queue
      grid_options:
        columns: 4
    - type: tile
      entity: binary_sensor.sabnzbd_karunagath_in_warnings
      name: SABnzbd warnings
      grid_options:
        columns: 4
- title: Lights
  path: dash-lights
  icon: mdi:lightbulb-group
  strategy:
    type: light
- title: Security
  path: dash-security
  icon: mdi:shield-home
  strategy:
    type: security
- title: Climate
  path: dash-climate
  icon: mdi:thermostat
  strategy:
    type: climate
- type: sections
  title: System Health
  path: system-health
  icon: mdi:server
  cards: []
  sections:
  - type: grid
    cards:
    - type: vertical-stack
      cards:
      - type: heading
        icon: mdi:server
        heading_style: title
        heading: Sutala (Intel Comet Lake)
      - type: heading
        icon: mdi:camera-timer
        heading: Last Boot
        heading_style: subtitle
        badges:
        - type: entity
          entity: sensor.system_monitor_last_boot
      - show_name: false
        show_icon: true
        show_state: true
        type: glance
        entities:
        - entity: sensor.system_monitor_processor_use
        - entity: sensor.system_monitor_memory_usage
        - entity: sensor.system_monitor_disk_usage
        - entity: sensor.system_monitor_swap_usage
        state_color: true
      grid_options:
        columns: 18
        rows: auto
  - type: grid
    cards:
    - type: vertical-stack
      cards:
      - type: heading
        icon: mdi:cpu-64-bit
        heading_style: title
        heading: CPU
      - type: heading
        icon: mdi:cpu-64-bit
        heading: Use / Temp
        heading_style: subtitle
        badges:
        - type: entity
          entity: sensor.system_monitor_processor_use
        - type: entity
          entity: sensor.system_monitor_processor_temperature
      - square: true
        type: grid
        cards:
        - type: gauge
          entity: sensor.system_monitor_load_1m
          name: 1m
          min: 0
          max: 8
          severity:
            green: 0
            yellow: 4
            red: 6.5
        - type: gauge
          entity: sensor.system_monitor_load_5m
          name: 5m
          min: 0
          max: 8
          severity:
            green: 0
            yellow: 4
            red: 6.5
        - type: gauge
          entity: sensor.system_monitor_load_15m
          name: 15m
          min: 0
          max: 8
          severity:
            green: 0
            yellow: 4
            red: 6.5
        columns: 3
      grid_options:
        columns: 14
        rows: auto
    - type: vertical-stack
      cards:
      - type: heading
        icon: mdi:memory
        heading_style: title
        heading: Memory
      - type: heading
        icon: mdi:memory
        heading_style: subtitle
        heading: Memory
        badges:
        - type: entity
          entity: sensor.system_monitor_memory_use
        - type: entity
          entity: sensor.system_monitor_memory_free
      - type: gauge
        entity: sensor.system_monitor_memory_usage
        name: RAM
        min: 0
        max: 100
        needle: false
        severity:
          green: 0
          yellow: 55
          red: 85
      grid_options:
        columns: 6
        rows: auto
    - type: vertical-stack
      cards:
      - type: heading
        icon: mdi:harddisk
        heading_style: title
        heading: Storage
      - type: heading
        icon: mdi:harddisk
        heading_style: subtitle
        heading: Used / Free
        badges:
        - type: entity
          entity: sensor.system_monitor_disk_use
        - type: entity
          entity: sensor.system_monitor_disk_free
      - type: gauge
        entity: sensor.system_monitor_disk_usage
        max: 100
        min: 0
        name: /
        needle: false
        severity:
          green: 0
          yellow: 60
          red: 85
      grid_options:
        columns: 6
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: Power Monitor
      heading_style: title
    - type: tile
      entity: switch.power_monitor_1
    - type: tile
      entity: sensor.power_monitor_1_power
    - type: tile
      entity: select.power_monitor_1_power_on_behavior
    - type: tile
      entity: sensor.power_monitor_1_energy
    - type: tile
      entity: sensor.power_monitor_1_voltage
    - type: tile
      entity: sensor.power_monitor_1_current
    - type: tile
      entity: switch.power_monitor_1_child_lock
  visible:
  - user: a1d4401b8b714ebb83f07c5316ab399c
- title: Maintenance
  path: dash-maintenance
  icon: mdi:wrench
  strategy:
    type: maintenance
