views:
- title: Home
  sections:
  - type: grid
    cards:
    - type: custom:mushroom-template-card
      primary: >-
        {%- if is_state('sensor.dashboard_presence_state', 'away') -%}
          Away
        {%- elif is_state('sensor.dashboard_presence_state', 'home_both') -%}
          Everyone's home
        {%- else -%}
          Home
        {%- endif -%}
      secondary: >-
        {{ states('sensor.dashboard_time_period') | title }}{% if states('sensor.dashboard_eta') not in ['none', 'unknown', 'unavailable'] %} · {{ states('sensor.dashboard_eta') }}{% endif %}
      icon: >-
        {% if is_state('sensor.dashboard_presence_state', 'away') %}mdi:home-export-outline{% else %}mdi:home-heart{% endif %}
      grid_options:
        columns: full
      visibility:
      - condition: user
        users:
        - a1d4401b8b714ebb83f07c5316ab399c
    - type: custom:mushroom-template-card
      primary: >-
        {%- if is_state('sensor.dashboard_presence_state', 'away') -%}
          Away
        {%- elif is_state('sensor.dashboard_presence_state', 'home_both') -%}
          Everyone's home
        {%- else -%}
          Home
        {%- endif -%}
      secondary: >-
        {{ states('sensor.dashboard_time_period') | title }}{% if states('sensor.dashboard_eta') not in ['none', 'unknown', 'unavailable'] %} · {{ states('sensor.dashboard_eta') }}{% endif %}
      icon: >-
        {% if is_state('sensor.dashboard_presence_state', 'away') %}mdi:home-export-outline{% else %}mdi:home-heart{% endif %}
      grid_options:
        columns: full
      visibility:
      - condition: user
        users:
        - 6edcc5a09c3144d684077ee362e7394a
    - type: custom:mushroom-template-card
      primary: "Vasudha"
      secondary: >-
        {{ states('sensor.dashboard_presence_state') | replace('_', ' ') | title }} · {{ states('sensor.dashboard_time_period') | title }}
      icon: mdi:home
      grid_options:
        columns: full
      visibility:
      - condition: not
        conditions:
        - condition: user
          users:
          - a1d4401b8b714ebb83f07c5316ab399c
          - 6edcc5a09c3144d684077ee362e7394a
  - type: grid
    cards:
    - type: heading
      heading: Rooms
      heading_style: title
      badges: []
    - type: area
      area: kitchen
    - type: area
      area: kitchen_dining_room
    - type: area
      area: dining_room
    - type: area
      area: living_room
    - type: area
      area: hall
    - type: area
      area: bedroom
    - type: area
      area: office
    - type: area
      area: front
    - type: area
      area: bathroom
    - type: area
      area: toilet
    - type: area
      area: laundry
  - type: grid
    cards:
    - type: heading
      heading: Right Now
      heading_style: title
      badges:
      - type: entity
        entity: binary_sensor.dashboard_alert_security
        show_state: false
        visibility:
        - condition: state
          entity: binary_sensor.dashboard_alert_security
          state: "on"
      - type: entity
        entity: binary_sensor.dashboard_alert_device_health
        show_state: false
        visibility:
        - condition: state
          entity: binary_sensor.dashboard_alert_device_health
          state: "on"
      - type: entity
        entity: binary_sensor.dashboard_alert_override_active
        show_state: false
        visibility:
        - condition: state
          entity: binary_sensor.dashboard_alert_override_active
          state: "on"
    - type: entities
      title: Needs attention
      show_header_toggle: false
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: binary_sensor.dashboard_alert_security
          state: "on"
        - condition: state
          entity: binary_sensor.dashboard_alert_device_health
          state: "on"
        - condition: state
          entity: binary_sensor.dashboard_alert_override_active
          state: "on"
      entities:
      - entity: binary_sensor.house_exits_open_status
        name: Open door/window
        visibility:
        - condition: state
          entity: binary_sensor.dashboard_alert_security
          state: "on"
      - entity: alarm_control_panel.vasudha_secure
        visibility:
        - condition: state
          entity: binary_sensor.dashboard_alert_security
          state: "on"
      - entity: binary_sensor.dashboard_alert_device_health
        name: Device unavailable
        visibility:
        - condition: state
          entity: binary_sensor.dashboard_alert_device_health
          state: "on"
      - entity: input_boolean.party_mode
        visibility:
        - condition: state
          entity: binary_sensor.dashboard_alert_override_active
          state: "on"
      - entity: input_boolean.automations_paused
        visibility:
        - condition: state
          entity: binary_sensor.dashboard_alert_override_active
          state: "on"
    - type: markdown
      content: "Nothing needs attention right now."
      visibility:
      - condition: and
        conditions:
        - condition: state
          entity: binary_sensor.dashboard_alert_security
          state: "off"
        - condition: state
          entity: binary_sensor.dashboard_alert_device_health
          state: "off"
        - condition: state
          entity: binary_sensor.dashboard_alert_override_active
          state: "off"
    - type: entity
      entity: sensor.average_temperature
      name: Temperature
    - type: entity
      entity: sensor.average_humidity
      name: Humidity
    - type: entity
      entity: sensor.average_illuminance
      name: Illuminance
  - type: grid
    cards:
    - type: heading
      heading: Media Server
      heading_style: title
      badges:
      - type: entity
        entity: media_player.lg_webos_tv_oled77c35la
      - type: entity
        entity: media_player.home_theater_2
      icon: mdi:plex
    - type: media-control
      entity: media_player.lg_webos_tv_oled77c35la
      grid_options:
        columns: full
        rows: 2
    - type: media-control
      entity: media_player.home_theater
    - type: media-control
      entity: media_player.home_theater_2
  - type: grid
    cards:
    - type: todo-list
      entity: todo.shopping_list
      title: Shopping List
      hide_completed: true
    - show_current: true
      show_forecast: true
      type: weather-forecast
      entity: weather.forecast_vasudha
      forecast_type: daily
      secondary_info_attribute: wind_speed
      forecast_slots: 7
      tap_action:
        action: more-info
  badges:
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: person.anjalipc
    color: ''
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: person.arun_karunagath
    color: ''
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: alarm_control_panel.vasudha_secure
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: lock.yale_front_door
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.waste_truck_type
    color: ''
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.hue_pir_hallway_temperature
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: weather.forecast_vasudha
    state_content:
    - temperature
    - state
    - wind_speed
    - uv_index
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.sun_next_rising
    color: ''
    visibility:
    - condition: state
      entity: sun.sun
      state: below_horizon
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.sun_next_dusk
    color: ''
    visibility:
    - condition: state
      entity: sun.sun
      state: above_horizon
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.moon_phase
    color: ''
  - type: entity
    entity: sensor.season
  cards: []
