# ── Manual mode ────────────────────────────────────────────────
- id: automations_paused_sync
  alias: "Manual mode: pause/resume automations"
  description: >-
    Pauses/resumes the automations listed in managed_aliases (matched
    by alias, not entity_id) via input_boolean.automations_paused.
    Security, Frigate gating, and notification automations excluded.
  triggers:
  - entity_id: input_boolean.automations_paused
    trigger: state
  - trigger: homeassistant
    event: start
  variables:
    managed_aliases:
    - "Kitchen — Darkness detection"
    - "Kitchen — Lighting"
    - "Hall — Darkness detection"
    - "Hall — Lighting"
    - "Bedroom — Darkness detection"
    - "Bedroom — Lighting"
    - "Bedroom — Nap"
    - "Living room — Darkness detection"
    - "Living room — Lighting"
    - "Living room — Media-aware lighting"
    - "Living room — Lights off (bedtime, no presence)"
    - "Dining room — Darkness detection"
    - "Dining room — Lighting"
    - "Front Door: Knock Lights"
    - "Front Door: Entrance light on open (dark)"
    - "TV — Power on + backlight + HT"
    - "TV — Backlight off + HT"
    - "Sleep — TV off if idle"
    - "Sleep — Arm Alarmo (night)"
    - "Sleep — Disarm Alarmo (morning)"
    - "Wake-up — Gradual lighting"
    - "Exterior — Front street light (dusk to sleep)"
    - "Exterior — Front street light on door vibration (sleep)"
    - "Everyone left home"
    - "Adaptive Lighting: sync sleep mode with schedule.sleep"
    targets: >-
      {{ states.automation
         | selectattr('attributes.friendly_name', 'in', managed_aliases)
         | map(attribute='entity_id') | list }}
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.automations_paused
      state: "on"
    then:
    - action: automation.turn_off
      target:
        entity_id: "{{ targets }}"
    else:
    - action: automation.turn_on
      target:
        entity_id: "{{ targets }}"
    - event: automations_resumed
  mode: single
