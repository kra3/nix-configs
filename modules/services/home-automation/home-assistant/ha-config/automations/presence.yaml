# ── Away mode ──────────────────────────────────────────────────
- id: everyone_left_home
  alias: Everyone left home
  description: >-
    When the last tracked person leaves the home zone, notify immediately
    if an exit is already open, then wait out
    timer.everyone_left_home_confirm (5 min, restore: true) before turning
    off all lights and arming Alarmo away — an HA restart mid-countdown
    just resumes instead of needing a startup-trigger workaround. Trigger
    is zone.home crossing below 1, not a raw person-entity state trigger —
    the latter fires on every GPS/attribute update even while already
    away, and combined with mode: restart that kept resetting the confirm
    timer for hours before it ever got to run. Alarmo silently refuses to
    arm if a sensor's open (same as the bedtime arm in sleep.yaml), so
    this checks the result and notifies either way — don't claim "alarm
    armed" if it didn't. Force-arm is a dashboard button (dashboard.yaml)
    for that case.
  triggers:
  - trigger: numeric_state
    entity_id: zone.home
    below: 1
    id: left
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.everyone_left_home_confirm
    id: timer_finished
  conditions:
  - condition: numeric_state
    entity_id: zone.home
    below: 1
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: left
      sequence:
      - action: timer.start
        target:
          entity_id: timer.everyone_left_home_confirm
      - if:
        - condition: state
          entity_id: binary_sensor.house_exits_open_status
          state: "on"
        then:
        - action: script.notify_all_phones
          data:
            title: Home
            message: >-
              Everyone left — won't auto-arm, still open:
              {{ state_attr('binary_sensor.house_exits_open_status', 'open_names') }}.
              Force-arm from the dashboard if needed.
    - conditions:
      - condition: trigger
        id: timer_finished
      sequence:
      - action: light.turn_off
        target:
          entity_id: all
      - action: alarm_control_panel.alarm_arm_away
        target:
          entity_id: alarm_control_panel.vasudha_secure
        data:
          code: !secret alarm_code
      - delay: "00:00:05"
      - choose:
        - conditions:
          - condition: state
            entity_id: alarm_control_panel.vasudha_secure
            state: armed_away
          sequence:
          - action: script.notify_all_phones
            data:
              title: Home
              message: Everyone left — lights off, alarm armed
        default:
        - action: script.notify_all_phones
          data:
            title: Home
            message: >-
              Everyone left, lights off — but the alarm didn't arm, still
              open: {{ state_attr('binary_sensor.house_exits_open_status', 'open_names') }}
  mode: restart
