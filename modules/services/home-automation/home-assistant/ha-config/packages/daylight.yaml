homeassistant:
  customize:
    input_number.daylight_gloomy_below_day:
      default: 5
    input_number.daylight_gloomy_below_evening:
      default: 15
    input_number.daylight_clear_above:
      default: 22
    input_number.daylight_evening_offset:
      default: 60
    input_number.living_room_dark_below:
      default: 80
    input_number.bedroom_dark_below:
      default: 50
    input_number.kitchen_dark_below:
      default: 10
    input_number.hall_dark_below:
      default: 10

# House-wide daylight: the windowed rooms' median lux against its own 24 h peak, so "Gloomy outside" follows the season and the weather.
# Until the peak covers 90 % of its window (fresh DB, renamed entity), an absolute 100 lx reference stands in for the ratio.
template:
  - sensor:
      - name: "Daylight fraction"
        unique_id: daylight_fraction
        icon: mdi:sun-compass
        state_class: measurement
        state: >-
          {% set r = states('sensor.daylight_reference_5_min') %}
          {% set p = states('sensor.daylight_peak_24h') %}
          {% if is_number(r) and is_number(p) and p | float > 0 %}{{ [r | float / p | float, 1] | min | round(3) }}{% else %}{{ none }}{% endif %}

  - binary_sensor:
      - name: "Daylight evening rule"
        unique_id: daylight_evening_rule
        icon: mdi:weather-sunset-down
        state: >-
          {% set s = state_attr('sun.sun', 'next_setting') %}
          {% set n = s | as_datetime if s else none %}
          {{ is_state('sun.sun', 'below_horizon') or (n is not none and now() >= n - timedelta(minutes=states('input_number.daylight_evening_offset') | float(60))) }}

      - name: "Gloomy outside"
        unique_id: gloomy_outside
        icon: mdi:weather-cloudy
        delay_on: "00:02:00"
        delay_off: "00:10:00"
        state: >-
          {% set e = state_attr('sun.sun', 'elevation') | float(0) %}
          {% set f = states('sensor.daylight_fraction') %}
          {% set r = states('sensor.daylight_reference_5_min') %}
          {% set warm = state_attr('sensor.daylight_peak_24h', 'age_coverage_ratio') | float(0) >= 0.9 %}
          {% set g = states('input_number.daylight_gloomy_below_' ~ ('evening' if is_state('binary_sensor.daylight_evening_rule', 'on') else 'day')) | float(15 if is_state('binary_sensor.daylight_evening_rule', 'on') else 5) / 100 %}
          {% if e < 0 %}true{% elif not warm and is_number(r) %}{{ r | float < 100 }}{% elif not is_number(f) %}{{ this.state == 'on' }}{% elif this.state == 'on' %}{{ f | float < ([states('input_number.daylight_clear_above') | float(22), g * 100 + 2] | max) / 100 }}{% else %}{{ f | float < g }}{% endif %}

sensor:
  - platform: min_max
    name: "Daylight reference"
    unique_id: daylight_reference
    type: median
    entity_ids:
      - sensor.bedroom_occupancy_illuminance
      - sensor.bathroom_occupancy_illuminance
      - sensor.laundry_occupancy_illuminance
      - sensor.toilet_occupancy_illuminance

  - platform: statistics
    name: "Daylight reference 5 min"
    unique_id: daylight_reference_5min
    entity_id: sensor.daylight_reference
    state_characteristic: median
    max_age:
      minutes: 5
    keep_last_sample: true
    sampling_size: 100

  - platform: statistics
    name: "Daylight peak 24h"
    unique_id: daylight_peak_24h
    entity_id: sensor.daylight_reference_5_min
    state_characteristic: value_max
    max_age:
      hours: 24
    sampling_size: 10000

input_number:
  daylight_gloomy_below_evening:
    name: Gloomy below, evening
    icon: mdi:weather-cloudy
    mode: slider
    min: 5
    max: 30
    step: 1
    unit_of_measurement: "%"
  daylight_gloomy_below_day:
    name: Gloomy below, day
    icon: mdi:weather-cloudy
    mode: slider
    min: 1
    max: 30
    step: 1
    unit_of_measurement: "%"
  daylight_evening_offset:
    name: Evening starts before sunset
    icon: mdi:weather-sunset-down
    mode: slider
    min: 0
    max: 180
    step: 15
    unit_of_measurement: min
  daylight_clear_above:
    name: Clear above
    icon: mdi:weather-partly-cloudy
    mode: slider
    min: 10
    max: 40
    step: 1
    unit_of_measurement: "%"
  living_room_dark_below:
    name: Living room dark below
    mode: slider
    min: 0
    max: 300
    step: 5
    unit_of_measurement: lx
  bedroom_dark_below:
    name: Bedroom dark below
    mode: slider
    min: 0
    max: 300
    step: 5
    unit_of_measurement: lx
  kitchen_dark_below:
    name: Kitchen dark below
    mode: slider
    min: 0
    max: 100
    step: 1
    unit_of_measurement: lx
  hall_dark_below:
    name: Hall dark below
    mode: slider
    min: 0
    max: 100
    step: 1
    unit_of_measurement: lx

input_boolean:
  lighting_defaults_v2:
    name: Lighting defaults applied
    icon: mdi:check
