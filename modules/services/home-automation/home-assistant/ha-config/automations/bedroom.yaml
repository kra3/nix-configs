# ── Bedroom ────────────────────────────────────────────────────
- id: bedroom_darkness
  alias: Bedroom — Darkness detection
  description: >-
    Dark while it is gloomy outside and the bedroom reads below 50 lux for 2 min.
  use_blueprint:
    path: local/darkness-detection.yaml
    input:
      illuminance_sensor: sensor.bedroom_occupancy_illuminance
      occupancy_sensor: binary_sensor.bedroom_occupancy_presence
      light_entity: light.bedroom_wardrobe_lights
      dark_boolean: input_boolean.bedroom_is_dark
      dark_below: 50
      hold_entity: timer.wakeup_lighting

- id: bedroom_lighting
  alias: Bedroom — Lighting
  description: >-
    Presence + darkness, but no motion-reaction once sleep starts
    (react_during_sleep: false — see blueprint). Brightness left to AL.
  use_blueprint:
    path: local/room-presence-lighting.yaml
    input:
      light_entity: light.bedroom_wardrobe_lights
      occupancy_sensor: binary_sensor.bedroom_occupancy_presence
      motion_sensor: binary_sensor.bedroom_occupancy_presence
      dark_boolean: input_boolean.bedroom_is_dark
      react_during_sleep: false
      long_clear_sensor: input_boolean.bedroom_is_dark
      long_clear_minutes: 10
      nap_boolean: input_boolean.bedroom_nap

- id: bedroom_nap
  alias: Bedroom — Nap
  description: Nap on turns the light off; it ends after the bedroom is empty for 45 min or when sleep hours start.
  triggers:
  - entity_id: input_boolean.bedroom_nap
    to: "on"
    trigger: state
    id: start
  - entity_id: binary_sensor.bedroom_occupancy_presence
    to: "off"
    for: "00:45:00"
    trigger: state
    id: end
  - entity_id: schedule.sleep
    to: "on"
    trigger: state
    id: end
  - entity_id: input_boolean.bedroom_nap
    to: "on"
    for: "00:45:00"
    trigger: state
    id: recheck
  - trigger: homeassistant
    event: start
    id: startup
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: start
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.bedroom_wardrobe_lights
        data:
          transition: 2
    - conditions:
      - condition: state
        entity_id: input_boolean.bedroom_nap
        state: "on"
      - condition: or
        conditions:
        - condition: trigger
          id: end
        - condition: state
          entity_id: schedule.sleep
          state: "on"
        - condition: state
          entity_id: binary_sensor.bedroom_occupancy_presence
          state: "off"
          for: "00:45:00"
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bedroom_nap
  mode: queued

- id: wakeup_lighting
  alias: Wake-up — Gradual lighting
  description: >-
    Ramps the bedroom light 5%→100% over the 15 minutes before the sleep
    schedule ends, warming 2000K→3500K like a sunrise. Then hands the light
    back to Adaptive Lighting and keeps it on if the room is dark, else turns
    it off.
  triggers:
  - trigger: template
    # next_event is the end of the current on-block; hours 1-11 skip the midnight split (00:00 local)
    value_template: >-
      {% set n = state_attr('schedule.sleep', 'next_event') %}
      {{ is_state('schedule.sleep', 'on') and n is not none
         and 1 <= as_local(n).hour < 12
         and (n - now()).total_seconds() <= 900 }}
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: alarm_control_panel.vasudha_secure
      state:
      - armed_away
      - armed_vacation
  actions:
  - action: timer.start
    target:
      entity_id: timer.wakeup_lighting
  # Adaptive Lighting would otherwise reset the ramp to its own brightness.
  - action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.home_adaptive_lighting_home
      lights: light.bedroom_wardrobe_lights
      manual_control: true
  - target:
      entity_id: light.bedroom_wardrobe_lights
    data:
      brightness_pct: 5
      color_temp_kelvin: 2000
      transition: 1
    action: light.turn_on
  - delay: "00:03:00"
  - target:
      entity_id: light.bedroom_wardrobe_lights
    data:
      brightness_pct: 15
      color_temp_kelvin: 2200
      transition: 60
    action: light.turn_on
  - delay: "00:04:00"
  - target:
      entity_id: light.bedroom_wardrobe_lights
    data:
      brightness_pct: 40
      color_temp_kelvin: 2700
      transition: 60
    action: light.turn_on
  - delay: "00:04:00"
  - target:
      entity_id: light.bedroom_wardrobe_lights
    data:
      brightness_pct: 70
      color_temp_kelvin: 3200
      transition: 60
    action: light.turn_on
  - delay: "00:03:00"
  - target:
      entity_id: light.bedroom_wardrobe_lights
    data:
      brightness_pct: 100
      color_temp_kelvin: 3500
      transition: 60
    action: light.turn_on
  - delay: "00:01:00"
  - action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.home_adaptive_lighting_home
      lights: light.bedroom_wardrobe_lights
      manual_control: false
  - if:
    - condition: state
      entity_id: input_boolean.bedroom_is_dark
      state: "on"
    then:
    - action: adaptive_lighting.apply
      data:
        entity_id: switch.home_adaptive_lighting_home
        lights: light.bedroom_wardrobe_lights
        turn_on_lights: false
    else:
    - action: light.turn_off
      target:
        entity_id: light.bedroom_wardrobe_lights
  - action: timer.cancel
    target:
      entity_id: timer.wakeup_lighting
  mode: restart
