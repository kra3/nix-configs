- type: grid
  column_span: 1
  cards:
  - type: heading
    heading: Cost, estimated
    icon: mdi:cash
    heading_style: title
  - type: custom:plug-cost-card
    grid_options:
      columns: full
    price: sensor.electricity_price_per_kwh
    devices:
    - name: Lights
      icon: mdi:lightbulb-group
      entity: sensor.lights_cost
      energy: sensor.lights_energy
      color: "#c3e88d"
      popup:
        graphs:
        - name: Energy per day
          entities:
          - sensor.lights_energy
          stat: change
          type: bar
          days: 30
    - name: Devices
      icon: mdi:television
      entity: sensor.devices_cost
      energy: sensor.devices_energy
      color: "#c792ea"
      popup:
        graphs:
        - name: Energy per day
          entities:
          - sensor.estimated_devices_energy
          stat: change
          type: bar
          days: 30
    - name: Washer
      icon: mdi:washing-machine
      entity: sensor.washer_cost
      energy: sensor.washer_energy
      color: "#6ab7ff"
      popup:
        graphs:
        - name: Energy per day
          entities:
          - sensor.washer_power_monitor_energy
          stat: change
          type: bar
          days: 30
    - name: Dryer
      icon: mdi:tumble-dryer
      entity: sensor.dryer_cost
      energy: sensor.dryer_energy
      color: "#ffb06b"
      popup:
        graphs:
        - name: Energy per day
          entities:
          - sensor.dryer_power_monitor_energy
          stat: change
          type: bar
          days: 30
    - name: Home server
      icon: mdi:flash
      entity: sensor.sutala_cost
      energy: sensor.sutala_energy
      color: "#ffd86b"
      popup:
        graphs:
        - name: Energy per day
          entities:
          - sensor.power_monitor_1_energy
          stat: change
          type: bar
          days: 30
