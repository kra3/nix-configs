# ── Bedroom ────────────────────────────────────────────────────
- id: bedroom_darkness
  alias: Bedroom — Darkness detection
  description: >-
    Hysteresis darkness state machine for bedroom.
    ON: lux < 50 sustained 2 min AND sun below horizon.
    OFF: lux > 120 sustained 2 min AND sun above horizon; turns off light.
    dark_below raised from the blueprint's 30 default - bedroom's own
    sensor floors around 20-24 lux overnight, so 30 left almost no
    margin and lagged real dusk (confirmed via Prometheus: sat in the
    30-90 lux range for a good while before finally crossing under 30).
  use_blueprint:
    path: local/darkness-detection.yaml
    input:
      illuminance_sensor: sensor.bedroom_occupancy_illuminance
      occupancy_sensor: binary_sensor.bedroom_occupancy_presence
      light_entity: light.bedroom_wardrobe_lights
      dark_boolean: input_boolean.bedroom_is_dark
      dark_below: 50

- id: bedroom_lighting
  alias: Bedroom — Lighting
  description: >-
    Presence + darkness, but no motion-reaction once sleep starts
    (react_during_sleep: false — see blueprint). Brightness left to AL.
  use_blueprint:
    path: local/room-presence-lighting.yaml
    input:
      light_entity: light.bedroom_wardrobe_lights
      occupancy_sensor: binary_sensor.bedroom_occupancy_presence
      dark_boolean: input_boolean.bedroom_is_dark
      react_during_sleep: false
