notify_all_phones:
  alias: "Notify: all phones"
  description: >-
    Fan out a plain notification to both phones and the iPad via notify.send_message.
    The old per-device notify.mobile_app_* services were removed by the
    mobile_app integration's move to entity-based notify (HA 2026.9), and
    the replacement doesn't support actionable buttons (data.actions) —
    anything needing a tappable action belongs on the dashboard instead.
  fields:
    title:
      required: false
      selector:
        text:
    message:
      required: true
      selector:
        text:
  sequence:
  - action: notify.send_message
    target:
      entity_id:
      - notify.meghanadha
      - notify.anjalis_iphone
      - notify.hiranyagarbha
    data:
      title: "{{ title | default(omit) }}"
      message: "{{ message }}"

frigate_sync_detect_to_alarm_state:
  alias: "Frigate: sync detect/audio switches to alarm state"
  description: >-
    Shared by frigate_detect_gate_by_alarm (on alarm state change) and
    frigate_detect_resync_on_restart (on Frigate MQTT reconnect) so the
    armed_away/disarmed-or-armed_night switch lists only live in one place.
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: alarm_control_panel.vasudha_secure
        state: armed_away
      sequence:
      - action: switch.turn_on
        target:
          entity_id:
          - switch.ranger_duo_fxd_detect
          - switch.ranger_duo_ptz_detect
          - switch.ranger_uno_detect
          - switch.ranger_uno_audio_detection
      - if:
        - condition: not
          conditions:
          - condition: state
            entity_id: media_player.lg_webos_tv_oled77c35la
            state: playing
        then:
        - action: switch.turn_on
          target:
            entity_id:
            - switch.ranger_duo_fxd_audio_detection
            - switch.ranger_duo_ptz_audio_detection
    - conditions:
      - condition: state
        entity_id: alarm_control_panel.vasudha_secure
        state:
        - disarmed
        - armed_night
      sequence:
      - action: switch.turn_off
        target:
          entity_id:
          - switch.ranger_duo_fxd_detect
          - switch.ranger_duo_fxd_audio_detection
          - switch.ranger_duo_ptz_detect
          - switch.ranger_duo_ptz_audio_detection
          - switch.ranger_uno_detect
          - switch.ranger_uno_audio_detection

alarm_force_arm_night:
  alias: "Alarm: force arm night (bypass open sensors)"
  description: >-
    Arms night mode via alarmo.arm's force option, which auto-bypasses
    any currently-open sensor instead of refusing to arm.
  sequence:
  - action: alarmo.arm
    data:
      entity_id: alarm_control_panel.vasudha_secure
      mode: night
      force: true
      code: !secret alarm_code

alarm_force_arm_away:
  alias: "Alarm: force arm away (bypass open sensors)"
  description: >-
    Arms away mode via alarmo.arm's force option, which auto-bypasses
    any currently-open sensor instead of refusing to arm.
  sequence:
  - action: alarmo.arm
    data:
      entity_id: alarm_control_panel.vasudha_secure
      mode: away
      force: true
      code: !secret alarm_code

lights_hand_back:
  alias: "Lights: hand back to Adaptive"
  description: Resets both room scenes to Auto and returns every light to Adaptive Lighting.
  sequence:
  - action: input_text.set_value
    target:
      entity_id:
      - input_text.living_scene
      - input_text.office_scene
    data:
      value: Auto
  - action: adaptive_lighting.set_manual_control
    target:
      entity_id: switch.home_adaptive_lighting_home
    data:
      manual_control: false
  - action: adaptive_lighting.apply
    target:
      entity_id: switch.home_adaptive_lighting_home
    data:
      turn_on_lights: false
  mode: single

lights_all_off:
  alias: "Lights: all off"
  description: Turns off every light and the Focus and Shelf light plugs.
  sequence:
  - action: light.turn_off
    target:
      entity_id: all
  - action: switch.turn_off
    target:
      entity_id:
      - switch.hue_light_switch_1
      - switch.hue_light_switch_2
  mode: single
