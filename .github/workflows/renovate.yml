---
name: Renovate

on:
  schedule:
    # 4x/day (offset from flake-update.yml's 04:00 UTC) so the default
    # prHourlyLimit:2 doesn't strand extra updates for a full day
    - cron: "0 5,11,17,23 * * *"
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@ebcbb513d07ead4d9c0c2139064301db05e84a3e # v46.3.15
        with:
          configurationFile: renovate.json
          token: ${{ secrets.GH_PAT }}
        env:
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
          RENOVATE_PLATFORM: github
