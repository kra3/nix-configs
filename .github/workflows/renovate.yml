---
name: Renovate

on:
  schedule:
    # 4x/day (offset from flake-update.yml's 04:00 UTC) so the default
    # prHourlyLimit:2 doesn't strand extra updates for a full day
    - cron: "0 5,11,17,23 * * *"
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          configurationFile: renovate.json
          token: ${{ secrets.GH_PAT }}
        env:
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
          RENOVATE_PLATFORM: github
