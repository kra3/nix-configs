      - b5b637523ec9028be8de65b52f617c0d
      include_button: disable_button_trigger

# ── Away mode ──────────────────────────────────────────────────
- id: everyone_left_home
  alias: Everyone left home
  description: >-
    When all tracked persons leave the home zone, wait out
    timer.everyone_left_home_confirm (5 min, restore: true) before turning
    off all lights and arming Alarmo away — an HA restart mid-countdown
    just resumes instead of needing a startup-trigger workaround. Alarmo
    silently refuses if a sensor's open (same as the bedtime arm in
    sleep.yaml), so this checks the result and notifies either way —
    don't claim "alarm armed" if it didn't.
  triggers:
  - entity_id:
    - person.anjalipc
    - person.arun_karunagath
    trigger: state
    id: left
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.everyone_left_home_confirm
    id: timer_finished
  conditions:
  - condition: numeric_state
    entity_id: zone.home
    below: 1
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: left
      sequence:
      - action: timer.start
        target:
          entity_id: timer.everyone_left_home_confirm
    - conditions:
      - condition: trigger
        id: timer_finished
      sequence:
      - action: light.turn_off
        target:
          entity_id: all
      - action: alarm_control_panel.alarm_arm_away
        target:
          entity_id: alarm_control_panel.vasudha_secure
        data:
          code: !secret alarm_code
      - delay: "00:00:05"
      - choose:
        - conditions:
          - condition: state
            entity_id: alarm_control_panel.vasudha_secure
            state: armed_away
          sequence:
          - action: script.notify_all_phones
            data:
              title: Home
              message: Everyone left — lights off, alarm armed
        default:
        - action: script.notify_all_phones
          data:
            title: Home
            message: >-
              Everyone left, lights off — but the alarm didn't arm, still
              open: {{ state_attr('binary_sensor.house_exits_open_status', 'open_names') }}
  mode: restart

- id: notify_open_exits_on_leave
  alias: Notify if door/window left open when leaving
  description: >-
    When everyone leaves home and a tracked door/window is still open,
    wait out timer.exit_open_notify (5 min, restore: true) before
    notifying both phones which one(s) — an HA restart mid-countdown just
    resumes instead of needing a startup-trigger workaround.
  triggers:
  - entity_id: binary_sensor.house_exits_open_status
    to: "on"
    trigger: state
    id: exit_open
  - entity_id:
    - person.anjalipc
    - person.arun_karunagath
    trigger: state
    id: left
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.exit_open_notify
    id: timer_finished
  conditions:
  - condition: numeric_state
    entity_id: zone.home
    below: 1
  - condition: state
    entity_id: binary_sensor.house_exits_open_status
    state: "on"
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: timer_finished
      sequence:
      - action: script.notify_all_phones
        data:
          title: Home
          message: >-
            Left home with something open:
            {{ state_attr('binary_sensor.house_exits_open_status', 'open_names') }}
    default:
    - action: timer.start
      target:
        entity_id: timer.exit_open_notify
  mode: restart
