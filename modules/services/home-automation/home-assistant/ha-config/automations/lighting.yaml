# ── House-wide lighting ──────────────────────────────────────────
- id: adaptive_lighting_sleep_mode_sync
  alias: "Adaptive Lighting: sync sleep mode with schedule.sleep"
  description: Mirrors schedule.sleep onto Adaptive Lighting's sleep-mode switch. Skipped during party mode; catches up when it ends.
  triggers:
  - entity_id: schedule.sleep
    trigger: state
  - trigger: event
    event_type: modes_ended
  - trigger: homeassistant
    event: start
  conditions:
  - "{{ states('schedule.sleep') in ['on', 'off'] and (is_state('schedule.sleep', 'off') or is_state('input_boolean.party_mode', 'off')) }}"
  actions:
  - action: "switch.turn_{{ states('schedule.sleep') }}"
    target:
      entity_id: switch.adaptive_lighting_home_adaptive_lighting_sleep_mode_home
  mode: single

- id: modes_adaptive_lighting
  alias: "Modes: Adaptive Lighting off during party or manual mode"
  description: Lights stay as they are while party or manual mode is on; Adaptive Lighting resumes when neither is.
  triggers:
  - entity_id:
    - input_boolean.party_mode
    - input_boolean.automations_paused
    trigger: state
  - trigger: homeassistant
    event: start
  actions:
  - action: "switch.turn_{{ 'off' if is_state('input_boolean.party_mode', 'on') or is_state('input_boolean.automations_paused', 'on') else 'on' }}"
    target:
      entity_id: switch.home_adaptive_lighting_home
  mode: queued

- id: light_scene_reset
  alias: "Lights: scenes back to Auto when the room empties"
  description: >-
    Returns a room to Auto once its presence sensor has cleared, and both rooms
    when sleep starts, so the next arrival gets normal lighting.
  triggers:
  - trigger: state
    entity_id: binary_sensor.room_presence_living
    to: "off"
    id: living
  - trigger: state
    entity_id: binary_sensor.room_presence_office
    to: "off"
    id: office
  - trigger: state
    entity_id: schedule.sleep
    to: "on"
    id: sleep
  actions:
  - repeat:
      for_each:
      - living
      - office
      sequence:
      - if:
        - condition: template
          value_template: >-
            {{ (trigger.id == 'sleep' or trigger.id == repeat.item)
               and not is_state('input_text.' ~ repeat.item ~ '_scene', 'Auto') }}
        then:
        - action: input_text.set_value
          target:
            entity_id: "input_text.{{ repeat.item }}_scene"
          data:
            value: Auto
  mode: queued

- id: light_scene_apply
  alias: "Lights: apply room scene"
  description: >-
    Applies the chosen scene to a room's bulbs and keeps Adaptive Lighting
    from overwriting it; Auto hands the bulbs back to Adaptive Lighting.
  triggers:
  - trigger: state
    entity_id: input_text.living_scene
    id: living
  - trigger: state
    entity_id: input_text.office_scene
    id: office
  conditions:
  - condition: template
    value_template: "{{ trigger.from_state.state not in ['unavailable', 'unknown'] }}"
  variables:
    scene: "{{ trigger.to_state.state }}"
    bulbs: >-
      {{ {'living': ['light.living_room_light_1', 'light.living_room_light_2',
                     'light.living_room_light_3', 'light.living_room_light_4',
                     'light.living_room_light_5'],
          'office': ['light.office_room_light']}[trigger.id] }}
  actions:
  - choose:
    - conditions: "{{ scene == 'Auto' }}"
      sequence:
      - action: adaptive_lighting.set_manual_control
        target:
          entity_id: switch.home_adaptive_lighting_home
        data:
          lights: "{{ bulbs }}"
          manual_control: false
      - action: adaptive_lighting.apply
        target:
          entity_id: switch.home_adaptive_lighting_home
        data:
          lights: "{{ bulbs }}"
          turn_on_lights: false
    - conditions: "{{ scene | regex_match('^[0-9a-f-]{36}$') }}"
      sequence:
      - action: adaptive_lighting.set_manual_control
        target:
          entity_id: switch.home_adaptive_lighting_home
        data:
          lights: "{{ bulbs }}"
          manual_control: true
      - action: scene_presets.apply_preset
        data:
          preset_id: "{{ scene }}"
          targets:
            entity_id: "{{ bulbs }}"
          transition: 2
  mode: queued
