type: custom:command-centre
title: Security
path: dash-security
icon: mdi:shield-home
max_columns: 4
sections:
- !include ../rail.yaml
- type: grid
  column_span: 4
  cards:
  - type: custom:security-status-card
    exclude:
    - binary_sensor.house_exits_open_status
    - lock.front_front_door_nw
    - binary_sensor.front_front_door_nw_door
    - lock.yale_front_door
    - lock.yale_front_door_secure_mode
    - binary_sensor.yale_front_door_door
    warn:
    - entity: binary_sensor.front_door_ble_degraded
      label: Front door lock on cloud fallback
      icon: mdi:bluetooth-off
    area_override:
      camera.ranger_duo_fxd: Living Room
      binary_sensor.ranger_duo_fxd_person_occupancy: Living Room
      binary_sensor.living_room_person_occupancy: Living Room
      binary_sensor.dining_room_person_occupancy: Dining Room
      binary_sensor.hallway_person_occupancy: Hallway
      image.ranger_duo_fxd_person: Living Room
    grid_options:
      columns: full
- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Cameras
    icon: mdi:cctv
    heading_style: title
  - type: custom:advanced-camera-card
    cameras: &sec_cams
    - &cam_fxd
      camera_entity: camera.ranger_duo_fxd
      live_provider: go2rtc
      triggers:
        entities:
        - binary_sensor.ranger_duo_fxd_person_occupancy
        reviews:
          severities:
          - high
    - &cam_ptz
      camera_entity: camera.ranger_duo_ptz
      live_provider: go2rtc
      triggers:
        entities:
        - binary_sensor.ranger_duo_ptz_person_occupancy
        reviews:
          severities:
          - high
    - &cam_uno
      camera_entity: camera.ranger_uno
      live_provider: go2rtc
      triggers:
        entities:
        - binary_sensor.ranger_uno_person_occupancy
        reviews:
          severities:
          - high
    live:
      display:
        mode: grid
    view:
      dim: true
      triggers:
        filter_selected_camera: false
        show_trigger_status: true
        untrigger_delay_seconds: 20
        actions:
          trigger: live
          untrigger: default
    menu:
      buttons:
        microphone:
          enabled: true
        clips:
          enabled: true
        reviews:
          enabled: true
        ptz_controls:
          enabled: true
        ptz_home:
          enabled: true
        screenshot:
          enabled: true
        pip:
          enabled: true
        download:
          enabled: false
        folders:
          enabled: false
        gallery:
          enabled: false
        camera_ui:
          enabled: false
    overrides:
    - conditions:
      - condition: screen
        media_query: "(max-width: 700px)"
      merge:
        live.display:
          mode: single
    automations:
    - triggers:
      - trigger: state
        entity_id: alarm_control_panel.vasudha_secure
        to: triggered
      actions:
      - action: custom:advanced-camera-card-action
        advanced_camera_card_action: live
      - action: custom:advanced-camera-card-action
        advanced_camera_card_action: display_mode_select
        display_mode: grid
    status_bar:
      style: overlay
    image:
      mode: camera
    grid_options:
      columns: full
  - type: custom:streamline-card
    template: camera_tile
    variables:
      camera: camera.ranger_duo_fxd
      person: binary_sensor.ranger_duo_fxd_person_occupancy
    grid_options:
      columns: 4
  - type: custom:streamline-card
    template: camera_tile
    variables:
      camera: camera.ranger_duo_ptz
      person: binary_sensor.ranger_duo_ptz_person_occupancy
    grid_options:
      columns: 4
  - type: custom:streamline-card
    template: camera_tile
    variables:
      camera: camera.ranger_uno
      person: binary_sensor.ranger_uno_person_occupancy
    grid_options:
      columns: 4
  - type: custom:popup-tile-card
    entity: camera.ranger_uno
    name: Recent events
    icon: mdi:history
    subtitle: Reviews and clips
    title: Recent events
    width: 900px
    popup:
      type: custom:advanced-camera-card
      cameras:
      - <<: *cam_fxd
        dependencies:
          all_cameras: true
      - <<: *cam_ptz
        dependencies:
          all_cameras: true
      - <<: *cam_uno
        dependencies:
          all_cameras: true
      view:
        default: reviews
        camera_select: current
      status_bar:
        style: overlay
    grid_options:
      columns: full
- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Floor plan
    icon: mdi:floor-plan
    heading_style: title
  - type: custom:streamline-card
    template: floor_plan
    variables:
      layer: security
    grid_options:
      columns: full
- type: grid
  cards:
  - type: heading
    heading: Locks
    icon: mdi:lock
    heading_style: title
  - type: custom:auto-entities
    card:
      type: grid
      columns: 1
      square: false
    card_param: cards
    show_empty: false
    filter:
      include:
      - domain: lock
        state: /^(locked|unlocked|locking|unlocking|jammed|open|opening)$/
        options:
          type: tile
          state_content:
          - state
          - area_name
          features:
          - type: lock-commands
          tap_action:
            action: fire-dom-event
            cc_detail:
              type: vertical-stack
              cards:
              - type: tile
                entity: this.entity_id
                state_content:
                - state
                - area_name
                features:
                - type: lock-commands
              - type: logbook
                hours_to_show: 24
                target:
                  entity_id: this.entity_id
      exclude:
      - entity_id: lock.front_front_door_nw
      - entity_id: lock.yale_front_door
      - entity_id: lock.yale_front_door_secure_mode
    grid_options:
      columns: 12
  - type: custom:auto-entities
    card:
      type: entities
      title: Not reporting
      show_header_toggle: false
    show_empty: false
    filter:
      include:
      - domain: binary_sensor
        attributes:
          device_class: door
        state: /^(unknown|unavailable)$/
      - domain: binary_sensor
        attributes:
          device_class: window
        state: /^(unknown|unavailable)$/
      - domain: binary_sensor
        attributes:
          device_class: garage_door
        state: /^(unknown|unavailable)$/
      - domain: binary_sensor
        attributes:
          device_class: opening
        state: /^(unknown|unavailable)$/
      - domain: lock
        state: /^(unknown|unavailable)$/
      exclude:
      - entity_id: lock.front_front_door_nw
      - entity_id: binary_sensor.front_front_door_nw_door
      - entity_id: lock.yale_front_door
      - entity_id: lock.yale_front_door_secure_mode
      - entity_id: binary_sensor.yale_front_door_door
    grid_options:
      columns: 12
- type: grid
  column_span: 3
  cards:
  - type: heading
    heading: Activity
    icon: mdi:history
    heading_style: title
  - type: custom:auto-entities
    card:
      type: logbook
      hours_to_show: 24
    show_empty: false
    filter:
      include:
      - domain: binary_sensor
        attributes:
          device_class: door

      - domain: binary_sensor
        attributes:
          device_class: window

      - domain: binary_sensor
        attributes:
          device_class: garage_door

      - domain: binary_sensor
        attributes:
          device_class: opening

      - domain: lock
      - domain: alarm_control_panel
      exclude:
      - entity_id: binary_sensor.house_exits_open_status
      - entity_id: lock.front_front_door_nw
      - entity_id: binary_sensor.front_front_door_nw_door
      - entity_id: lock.yale_front_door
      - entity_id: lock.yale_front_door_secure_mode
      - entity_id: binary_sensor.yale_front_door_door
    grid_options:
      columns: full
