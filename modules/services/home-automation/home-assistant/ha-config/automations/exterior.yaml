# ── Exterior lighting ─────────────────────────────────────────
- id: exterior_front_light
  alias: Exterior — Front street light (dusk to sleep)
  description: >-
    Turn on front street light at sunset, off at sleep schedule. During
    sleep, door vibration turns it on for 5min via
    timer.exterior_front_light_pulse. Startup re-derives state in case an HA
    restart missed the sleep_started edge, keeping a running pulse.
  triggers:
  - entity_id: sun.sun
    to: below_horizon
    trigger: state
    id: dusk
  - entity_id: schedule.sleep
    to: "on"
    trigger: state
    id: sleep_started
  - trigger: homeassistant
    event: start
    id: startup
  - entity_id: binary_sensor.front_door_knock_vibration
    to: "on"
    trigger: state
    id: vibration
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.exterior_front_light_pulse
    id: pulse_done
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: dusk
      sequence:
      - target:
          entity_id: switch.front_entrance_double_switch_right
        action: switch.turn_on
    - conditions:
      - condition: trigger
        id: sleep_started
      sequence:
      - target:
          entity_id: switch.front_entrance_double_switch_right
        action: switch.turn_off
    - conditions:
      - condition: trigger
        id: vibration
      - condition: state
        entity_id: schedule.sleep
        state: "on"
      sequence:
      - target:
          entity_id: switch.front_entrance_double_switch_right
        action: switch.turn_on
      - target:
          entity_id: timer.exterior_front_light_pulse
        action: timer.start
    - conditions:
      - condition: trigger
        id: pulse_done
      sequence:
      - target:
          entity_id: switch.front_entrance_double_switch_right
        action: switch.turn_off
    - conditions:
      - condition: trigger
        id: startup
      - condition: state
        entity_id: schedule.sleep
        state: "on"
      - condition: not
        conditions:
        - condition: state
          entity_id: timer.exterior_front_light_pulse
          state: active
      sequence:
      - target:
          entity_id: switch.front_entrance_double_switch_right
        action: switch.turn_off
    - conditions:
      - condition: trigger
        id: startup
      - condition: state
        entity_id: schedule.sleep
        state: "off"
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      sequence:
      - target:
          entity_id: switch.front_entrance_double_switch_right
        action: switch.turn_on
  mode: restart
