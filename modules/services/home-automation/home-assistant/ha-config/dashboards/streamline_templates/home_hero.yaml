default:
- name: ""
card:
  type: custom:home-hero-card
  name: "[[name]]"
  presence: sensor.dashboard_presence_state
  period: sensor.dashboard_time_period
  eta: sensor.dashboard_eta
  alarm: alarm_control_panel.vasudha_secure
  alarm_detail:
    type: custom:alarmo-card
    entity: alarm_control_panel.vasudha_secure
    name: Alarm
    use_code_dialog: true
    states:
      armed_home:
        hide: true
      armed_custom_bypass:
        hide: true
  weather: weather.forecast_vasudha
  weather_detail:
    type: weather-forecast
    entity: weather.forecast_vasudha
    forecast_type: daily
    show_current: true
    show_forecast: true
    secondary_info_attribute: wind_speed
    forecast_slots: 5
    tap_action:
      action: more-info
  sun: sun.sun
  sun_detail:
    type: custom:horizon-card
  moon: sensor.moon_phase
  season: sensor.season
  pills:
  - label: Force arm for the night
    icon: mdi:shield-lock
    color: amber
    when:
    - entity: binary_sensor.dashboard_alert_security
      state: "on"
    - entity: alarm_control_panel.vasudha_secure
      state: disarmed
    - entity: schedule.sleep
      state: "on"
    tap:
      service: script.alarm_force_arm_night
      confirm: Force-arm for the night, bypassing any open sensors?
  - label: Force arm away
    icon: mdi:shield-lock
    color: amber
    when:
    - entity: binary_sensor.dashboard_alert_security
      state: "on"
    - entity: alarm_control_panel.vasudha_secure
      state: disarmed
    - entity: zone.home
      below: 1
    tap:
      service: script.alarm_force_arm_away
      confirm: Force-arm away, bypassing any open sensors?
  - label: Crisis information
    icon: mdi:alert
    color: red
    when:
    - entity: binary_sensor.dashboard_alert_crisis
      state: "on"
    detail:
      entity: binary_sensor.dashboard_alert_crisis
      attr: headlines
    tap:
      more_info: binary_sensor.dashboard_alert_crisis
  - label: Override active
    icon: mdi:hand-back-right
    color: blue
    when:
    - entity: binary_sensor.dashboard_alert_override_active
      state: "on"
    tap:
      more_info: binary_sensor.dashboard_alert_override_active
  - label: System
    icon: mdi:server
    color: orange
    when:
    - entity: binary_sensor.dashboard_alert_system
      state: "on"
    - user: a1d4401b8b714ebb83f07c5316ab399c
    detail:
      entity: binary_sensor.dashboard_alert_system
      attr: reasons
    tap:
      navigate: /dashboard-admin/system
