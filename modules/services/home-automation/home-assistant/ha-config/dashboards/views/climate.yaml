type: custom:command-centre
title: Climate
path: dash-climate
subview: true
back_path: /dashboard-home/home
icon: mdi:thermostat
max_columns: 3
sections:
- !include ../rail.yaml
- type: grid
  column_span: 3
  cards:
  - type: custom:status-row-card
    grid_options:
      columns: full
    items:
    - entity: sensor.home_comfort
      name: Comfort
      icon: mdi:home-thermometer-outline
      hint: Rooms outside your comfort range, or indoor humidity above today's ceiling
      colors:
        All comfortable: success
        No data: inactive
        other: warning
    - entity: sensor.ventilation_advice
      name: Ventilation
      icon: mdi:window-open-variant
      hint: Rooms holding more moisture than the outside air, past the moisture limit
      color_attribute: action
      colors:
        air_out: info
        air_out_briefly: info
        keep_closed: info
        not_needed: inactive
      hints:
        air_out: These rooms hold more moisture than the outside air can take away; open a window there
        air_out_briefly: Open a window in these rooms, but keep it short; it is much colder outside
        keep_closed: The outside air is more humid than inside
        not_needed: Every room is within the moisture limit of the outside air
    - entity: sensor.open_doors_and_windows
      name: Open
      icon: mdi:window-open
      hint: Doors and windows that currently read open
      colors:
        All closed: inactive
        other: info
    - entity: sensor.rooms_not_reporting
      name: Sensors
      icon: mdi:access-point-network
      hint: Whether every room sensor is sending data
      colors:
        All reporting: success
        other: warning
- type: grid
  column_span: 1
  cards:
  - type: heading
    heading: Rooms
    icon: mdi:floor-plan
    heading_style: title
  - type: custom:climate-room-card
    name: Living Room
    icon: mdi:sofa
    comfort: sensor.living_room_comfort
    temperature: sensor.living_room_occupancy_temperature
    humidity: sensor.living_room_occupancy_humidity
    dew: sensor.living_room_dew_point
    grid_options:
      columns: full
  - type: custom:climate-room-card
    name: Bedroom
    icon: mdi:bed
    comfort: sensor.bedroom_comfort
    temperature: sensor.bedroom_occupancy_temperature
    humidity: sensor.bedroom_occupancy_humidity
    dew: sensor.bedroom_dew_point
    grid_options:
      columns: full
  - type: custom:climate-room-card
    name: Bathroom
    icon: mdi:shower
    comfort: sensor.bathroom_comfort
    temperature: sensor.bathroom_occupancy_temperature
    humidity: sensor.bathroom_occupancy_humidity
    dew: sensor.bathroom_dew_point
    grid_options:
      columns: full
  - type: custom:climate-room-card
    name: Laundry
    icon: mdi:washing-machine
    comfort: sensor.laundry_comfort
    temperature: sensor.laundry_occupancy_temperature
    humidity: sensor.laundry_occupancy_humidity
    dew: sensor.laundry_dew_point
    grid_options:
      columns: full
  - type: custom:climate-room-card
    name: Toilet
    icon: mdi:toilet
    comfort: sensor.toilet_comfort
    temperature: sensor.toilet_occupancy_temperature
    humidity: sensor.toilet_occupancy_humidity
    dew: sensor.toilet_dew_point
    grid_options:
      columns: full
  - type: custom:climate-room-card
    name: Hall
    icon: mdi:door
    comfort: sensor.hall_comfort
    temperature: sensor.hue_pir_hallway_temperature
    approx: true
    grid_options:
      columns: full
  - type: custom:climate-room-card
    name: Kitchen
    icon: mdi:speaker
    comfort: sensor.kitchen_comfort
    temperature: sensor.hue_pir_kitchen_temperature
    approx: true
    grid_options:
      columns: full
- type: grid
  column_span: 1
  cards:
  - type: heading
    heading: Indoor · house average
    icon: mdi:home-thermometer
    heading_style: title
  - type: custom:health-metric-card
    entity: sensor.average_temperature
    name: Temperature
    icon: mdi:thermometer
    color: "#ff9f6b"
    decimals: 1
    show_date: false
    chart:
      type: line
      days: 7
    delta:
      mode: range
      decimals: 1
      label: 7 d
    items:
    - entity: sensor.average_humidity
      name: Humidity
      mode: now
      days: 7
      decimals: 0
      rangeLabel: 7 d
      color: "#6bb6ff"
    - entity: sensor.indoor_dew_point
      name: Dew point
      mode: now
      days: 7
      decimals: 1
      rangeLabel: 7 d
      color: "#8fd9c0"
    popup:
      graphs:
      - name: Temperature
        entities:
        - sensor.average_temperature
        days: 7
      - name: Humidity
        entities:
        - sensor.average_humidity
        days: 7
      - name: Dew point
        entities:
        - sensor.indoor_dew_point
        days: 7
    grid_options:
      columns: full
  - type: heading
    heading: Outdoor
    icon: mdi:weather-partly-cloudy
    heading_style: title
  - type: custom:health-metric-card
    entity: sensor.openweathermap_temperature
    name: Temperature
    icon: mdi:thermometer
    color: "#9fa8ff"
    decimals: 1
    show_date: false
    chart:
      type: line
      days: 7
    delta:
      mode: range
      decimals: 1
      label: 7 d
    items:
    - entity: sensor.openweathermap_humidity
      name: Humidity
      mode: now
      days: 7
      decimals: 0
      rangeLabel: 7 d
      color: "#6bb6ff"
    - entity: sensor.openweathermap_apparent_temperature
      name: Feels like
      mode: now
      days: 7
      decimals: 1
      rangeLabel: 7 d
      color: "#ff9f6b"
    - entity: sensor.outdoor_dew_point
      name: Dew point
      mode: now
      days: 7
      decimals: 1
      rangeLabel: 7 d
      color: "#8fd9c0"
    popup:
      graphs:
      - name: Temperature
        entities:
        - sensor.openweathermap_temperature
        days: 7
      - name: Humidity
        entities:
        - sensor.openweathermap_humidity
        days: 7
    grid_options:
      columns: full
- type: grid
  column_span: 1
  cards:
  - type: heading
    heading: Forecast
    icon: mdi:weather-cloudy-clock
    heading_style: title
  - type: custom:mushroom-template-card
    entity: sensor.low_today
    primary: Low today
    secondary: >-
      {% set lo = states('sensor.low_today') %}{% set t = states('sensor.average_temperature') %}{% if is_number(lo) and is_number(t) %}{{ lo }} °C · {% if t | float > lo | float %}{{ (t | float - lo | float) | round(1) }} °C cooler than inside{% else %}not cooler than inside{% endif %}{% else %}No forecast{% endif %}
    icon: mdi:weather-night
    icon_color: blue
    tap_action:
      action: none
    grid_options:
      columns: full
  - type: custom:mushroom-template-card
    entity: sensor.airing_window
    primary: >-
      {% set w = states('sensor.airing_window') %}{{ 'No good time to air out in the next 24 h' if w in ['No good window', 'unavailable', 'unknown'] else 'Air out ' ~ w }}
    secondary: >-
      {{ state_attr('sensor.airing_window', 'note') or '' }}
    icon: mdi:window-open-variant
    icon_color: >-
      {{ 'grey' if states('sensor.airing_window') in ['No good window', 'unavailable', 'unknown'] else 'blue' }}
    multiline_secondary: true
    tap_action:
      action: none
    grid_options:
      columns: full
  - type: custom:apexcharts-card
    header:
      show: true
      title: Outdoor temperature, next 24 h
      show_states: false
    graph_span: 24h
    span:
      start: hour
    now:
      show: false
    apex_config:
      chart:
        height: 170
      legend:
        show: true
        position: bottom
      yaxis:
        decimalsInFloat: 0
    series:
    - entity: sensor.airing_window
      name: Outdoor
      color: "#9fa8ff"
      stroke_width: 3
      data_generator: |
        return entity.attributes.hours.map((h) => [new Date(h.t).getTime(), h.temp]);
    - entity: sensor.airing_window
      name: Comfort low
      color: "#43a047"
      stroke_width: 1
      stroke_dash: 5
      data_generator: |
        return entity.attributes.hours.map((h) => [new Date(h.t).getTime(), entity.attributes.low]);
    - entity: sensor.airing_window
      name: Comfort high
      color: "#ffa600"
      stroke_width: 1
      stroke_dash: 5
      data_generator: |
        return entity.attributes.hours.map((h) => [new Date(h.t).getTime(), entity.attributes.high]);
    grid_options:
      columns: full
  - type: weather-forecast
    entity: weather.forecast_vasudha
    forecast_type: daily
    show_current: false
    grid_options:
      columns: full
      rows: auto
- type: grid
  column_span: 1
  cards:
  - type: heading
    heading: Comfort
    icon: mdi:tune
    heading_style: title
  - type: custom:comfort-card
    grid_options:
      columns: full
    season: sensor.season
    low: input_number.climate_temp_low
    high: input_number.climate_temp_high
    high_summer: input_number.climate_temp_high_summer
    guideline_min: sensor.guideline_temp_min
    guideline_max: sensor.guideline_temp_max
    scale: [14, 30]
    night_offset: input_number.climate_night_offset
    humidity:
      entity: sensor.average_humidity
      ceiling: sensor.humidity_ceiling
    advanced:
    - name: Moisture limit
      effect: "Swedish winter guideline (Folkhälsomyndigheten): at most 3 g/m³ more water vapour indoors than outdoors."
      when:
        entity: sensor.season
        state_not: summer
      now: >-
        Now: surplus {{ states('sensor.moisture_surplus') }} g/m³, 24 h average {{ states('sensor.moisture_surplus_24h') }} g/m³.
      entities:
      - entity: input_number.climate_moisture_limit
