          entity: sensor.system_monitor_last_boot
      - show_name: false
        show_icon: true
        show_state: true
        type: glance
        entities:
        - entity: sensor.system_monitor_processor_use
        - entity: sensor.system_monitor_memory_usage
        - entity: sensor.system_monitor_disk_usage
        - entity: sensor.system_monitor_swap_usage
        state_color: true
      grid_options:
        columns: 18
        rows: auto
  - type: grid
    cards:
    - type: vertical-stack
      cards:
      - type: heading
        icon: mdi:cpu-64-bit
        heading_style: title
        heading: CPU
      - type: heading
        icon: mdi:cpu-64-bit
        heading: Use / Temp
        heading_style: subtitle
        badges:
        - type: entity
          entity: sensor.system_monitor_processor_use
        - type: entity
          entity: sensor.system_monitor_processor_temperature
      - square: true
        type: grid
        cards:
        - type: gauge
          entity: sensor.system_monitor_load_1m
          name: 1m
          min: 0
          max: 8
          severity:
            green: 0
            yellow: 4
            red: 6.5
        - type: gauge
          entity: sensor.system_monitor_load_5m
          name: 5m
          min: 0
          max: 8
          severity:
            green: 0
            yellow: 4
            red: 6.5
        - type: gauge
          entity: sensor.system_monitor_load_15m
          name: 15m
          min: 0
          max: 8
          severity:
            green: 0
            yellow: 4
            red: 6.5
        columns: 3
      grid_options:
        columns: 14
        rows: auto
    - type: vertical-stack
      cards:
