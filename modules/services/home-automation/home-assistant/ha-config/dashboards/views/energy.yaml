type: custom:command-centre
title: Energy
path: dash-energy
icon: mdi:flash
max_columns: 2
cc_rail: collapsed
sections:
- !include ../rail.yaml
- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Now
    icon: mdi:flash
    heading_style: title
  - type: custom:mushroom-template-card
    primary: Laundry
    secondary: "{{ states('sensor.washer_status') }} · {{ states('sensor.dryer_status') }}"
    icon: mdi:washing-machine
    tap_action:
      action: navigate
      navigation_path: /dashboard-home/dash-laundry
    grid_options:
      columns: full
  - type: custom:health-metric-card
    entity: sensor.electricity_price_per_kwh
    name: Price per kWh
    icon: mdi:cash
    color: "#79c0ff"
    decimals: 2
    show_date: false
    card_mod:
      style: |
        ha-card { height: 100%; }
    chart:
      type: line
      days: 30
      stat: max
    breakdown:
    - {name: Spot, attribute: spot, color: "#79c0ff"}
    - {name: Variable, attribute: variable, color: "#7fdbca"}
    - {name: Påslag, attribute: markup, color: "#c3e88d"}
    - {name: Grid, attribute: grid, color: "#ffd86b"}
    - {name: Tax, attribute: tax, color: "#ff9f6b"}
    - {name: VAT, attribute: vat, color: "#c792ea"}
    grid_options:
      columns: 12
  - type: custom:popup-tile-card
    title: Electricity price
    width: 900px
    grid_options:
      columns: 14
    inline: &price_timeline
      type: custom:price-timeline-card
      price: sensor.electricity_price_timeline
      theme: theme
      slider: true
      currency:
        name: Öre
        symbol: öre
    popup:
      <<: *price_timeline
      view: graph
      cheap_times: true
      day_switch: false
  - type: custom:health-metric-card
    entity: sensor.energy_cost_today
    name: Energy today
    card_mod: &full_height
      style: |
        ha-card { height: 100%; }
    icon: mdi:cash-clock
    color: "#7fdbca"
    unit: kr
    decimals: 2
    show_date: false
    chart:
      type: bar
      days: 14
      stat: max
    secondary:
    - entity: sensor.energy_used_today
      unit: " kWh"
      decimals: 1
    - entity: sensor.home_power_estimate
      prefix: "Now "
      unit: " W"
    grid_options:
      columns: 12
  - type: custom:health-metric-card
    entity: sensor.energy_cost_month
    name: This month
    card_mod: *full_height
    icon: mdi:calendar-month
    color: "#7fdbca"
    unit: kr
    decimals: 2
    show_date: false
    chart:
      type: line
      days: 30
      stat: max
    secondary:
      entity: sensor.energy_used_month
      unit: " kWh"
      decimals: 1
    popup:
      title: Electricity cost
      graphs:
      - name: Cost per day (month view) or per month, fees included
        entities:
        - sensor.energy_cost_today
        monthly: sensor.energy_cost_month
        stat: max
        type: bar
        unit: kr
        decimals: 0
        days: 30
        ranges: [30, 90, 180, 365]
    grid_options:
      columns: 12
- type: grid
  column_span: 1
  cards:
  - type: heading
    heading: Cost today by device (approx.)
    icon: mdi:cash-clock
    heading_style: title
  - type: custom:cost-list-card
    top: 5
    grid_options:
      columns: full
    entities:
    - {entity: sensor.cost_today_all_lights, name: All lights, power: sensor.lights_power}
    - {entity: sensor.cost_today_bedroom, name: Bedroom lights, power: sensor.lights_bedroom_power}
    - {entity: sensor.cost_today_kitchen, name: Kitchen lights, power: sensor.lights_kitchen_power}
    - {entity: sensor.cost_today_kitchen_dining, name: Kitchen dining lights, power: sensor.lights_kitchen_dining_power}
    - {entity: sensor.cost_today_dining_room, name: Dining room lights, power: sensor.lights_dining_room_power}
    - {entity: sensor.cost_today_living_room, name: Living room lights, power: sensor.lights_living_room_power}
    - {entity: sensor.cost_today_office, name: Office lights, power: sensor.lights_office_power}
    - {entity: sensor.cost_today_hall, name: Hall lights, power: sensor.lights_hall_power}
    - {entity: sensor.cost_today_tv, name: TV, power: sensor.lg_tv_power}
    - {entity: sensor.cost_today_receiver, name: Receiver, power: sensor.marantz_nr1711_power}
    - {entity: sensor.cost_today_camera_duo, name: Camera Duo, power: sensor.camera_duo_power}
    - {entity: sensor.cost_today_camera_uno, name: Camera Uno, power: sensor.camera_uno_power}
    - {entity: sensor.cost_today_fridge, name: Fridge, power: sensor.fridge_power}
    - {entity: sensor.cost_today_kitchen_speaker, name: Kitchen speaker, power: sensor.kitchen_speaker_power}
    - {entity: sensor.cost_today_hob, name: Hob, power: sensor.hob_power}
    - {entity: sensor.cost_today_oven, name: Oven, power: sensor.oven_power}
    - {entity: sensor.cost_today_dishwasher, name: Dishwasher, power: sensor.dishwasher_power}
    - {entity: sensor.cost_today_microwave, name: Microwave, power: sensor.microwave_power}
    - {entity: sensor.cost_today_hood, name: Hood, power: sensor.hood_power}
- type: grid
  column_span: 1
  cards:
  - type: heading
    heading: Cost, estimated
    icon: mdi:cash
    heading_style: title
  - type: custom:plug-cost-card
    grid_options:
      columns: full
    price: sensor.electricity_price_per_kwh
    devices:
    - name: Lights
      icon: mdi:lightbulb-group
      entity: sensor.lights_cost
      energy: sensor.lights_energy
      color: var(--success-color)
      popup:
        graphs:
        - name: Energy per day
          entities:
          - sensor.lights_energy
          stat: change
          type: bar
          days: 30
    - name: Devices
      icon: mdi:television
      entity: sensor.devices_cost
      energy: sensor.devices_energy
      color: var(--primary-color)
      popup:
        graphs:
        - name: Energy per day
          entities:
          - sensor.estimated_devices_energy
          stat: change
          type: bar
          days: 30
    - name: Washer
      icon: mdi:washing-machine
      entity: sensor.washer_cost
      energy: sensor.washer_energy
      color: color-mix(in srgb, var(--info-color) 55%, var(--secondary-text-color))
      popup:
        graphs:
        - name: Energy per day
          entities:
          - sensor.washer_power_monitor_energy
          stat: change
          type: bar
          days: 30
    - name: Dryer
      icon: mdi:tumble-dryer
      entity: sensor.dryer_cost
      energy: sensor.dryer_energy
      color: var(--warning-color)
      popup:
        graphs:
        - name: Energy per day
          entities:
          - sensor.dryer_power_monitor_energy
          stat: change
          type: bar
          days: 30
    - name: Home server
      icon: mdi:flash
      entity: sensor.sutala_cost
      energy: sensor.sutala_energy
      color: var(--state-active-color)
      popup:
        graphs:
        - name: Energy per day
          entities:
          - sensor.power_monitor_1_energy
          stat: change
          type: bar
          days: 30
