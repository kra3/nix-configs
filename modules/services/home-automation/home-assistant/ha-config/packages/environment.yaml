sensor:
  - platform: min_max
    name: "Average Temperature"
    type: mean
    round_digits: 1
    entity_ids:
      - sensor.hue_pir_kitchen_temperature
      - sensor.hue_pir_hallway_temperature
      - sensor.bathroom_occupancy_temperature
      - sensor.bedroom_occupancy_temperature
      - sensor.laundry_occupancy_temperature
      - sensor.toilet_occupancy_temperature

  - platform: min_max
    name: "Average Humidity"
    type: mean
    round_digits: 1
    entity_ids:
      - sensor.bathroom_occupancy_humidity
      - sensor.bedroom_occupancy_humidity
      - sensor.laundry_occupancy_humidity
      - sensor.toilet_occupancy_humidity

  - platform: min_max
    name: "Average Illuminance"
    type: mean
    round_digits: 1
    entity_ids:
      - sensor.hue_pir_kitchen_illuminance
      - sensor.hue_pir_hallway_illuminance
      - sensor.bathroom_occupancy_illuminance
      - sensor.bedroom_occupancy_illuminance
      - sensor.laundry_occupancy_illuminance
      - sensor.toilet_occupancy_illuminance

input_boolean:
  bedroom_is_dark:
    name: Bedroom is dark
  dining_is_dark:
    name: Dining is dark
  living_room_is_dark:
    name: Living room is dark
  hall_is_dark:
    name: Hall is dark
  kitchen_is_dark:
    name: Kitchen is dark
  party_mode:
    name: Party mode
    icon: mdi:party-popper
  automations_paused:
    name: Automations paused (manual mode)
    icon: mdi:pause-octagon

input_number:
  light_on_sun_elevation_threshold:
    name: Light-on sun elevation threshold
    icon: mdi:weather-sunset
    min: -10
    max: 10
    step: 0.5
    initial: 4
    unit_of_measurement: "°"

schedule:
  sleep:
    name: Sleep
    icon: mdi:sleep
    # HA schedule ranges can't cross midnight, so overnight windows are split into a morning tail + evening start.
    monday: &weekday_night
      - from: "00:00:00"
        to: "07:00:00"
      - from: "22:30:00"
        to: "23:59:59"
    tuesday: *weekday_night
    wednesday: *weekday_night
    thursday: *weekday_night
    friday:
      - from: "00:00:00"
        to: "07:00:00"
      - from: "23:00:00"
        to: "23:59:59"
    saturday:
      - from: "00:00:00"
        to: "08:30:00"
      - from: "23:00:00"
        to: "23:59:59"
    sunday:
      - from: "00:00:00"
        to: "08:30:00"
      - from: "22:30:00"
        to: "23:59:59"

template:
  - binary_sensor:
      - name: "House Exits Open Status"
        device_class: opening
        state: >-
          {{ is_state('binary_sensor.front_door_open', 'on')
             or is_state('binary_sensor.hallway_door_contact_contact', 'on')
             or is_state('binary_sensor.patio_door_contact_contact', 'on')
             or is_state('binary_sensor.living_room_window_left_contact_contact', 'on')
             or is_state('binary_sensor.living_room_window_right_contact_contact', 'on')
             or is_state('binary_sensor.bedroom_window_left_contact_contact', 'on')
             or is_state('binary_sensor.bedroom_window_right_contact_contact', 'on')
             or is_state('binary_sensor.kitchen_dining_window_left_contact_contact', 'on') }}
        attributes:
          open_names: >-
            {%- set mapping = {
              'binary_sensor.front_door_open': 'Front Door',
              'binary_sensor.hallway_door_contact_contact': 'Hallway Door',
              'binary_sensor.patio_door_contact_contact': 'Patio Door',
              'binary_sensor.living_room_window_left_contact_contact': 'Living Room Window (L)',
              'binary_sensor.living_room_window_right_contact_contact': 'Living Room Window (R)',
              'binary_sensor.bedroom_window_left_contact_contact': 'Bedroom Window (L)',
              'binary_sensor.bedroom_window_right_contact_contact': 'Bedroom Window (R)',
              'binary_sensor.kitchen_dining_window_left_contact_contact': 'Kitchen Dining Window'
            } -%}
            {%- set ns = namespace(open=[]) -%}
            {%- for entity, label in mapping.items() -%}
              {%- if is_state(entity, 'on') -%}
                {%- set ns.open = ns.open + [label] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.open | join(', ') }}
