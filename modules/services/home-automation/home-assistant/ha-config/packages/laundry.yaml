# Washer and dryer cycle state from the plug power readings; "done" is remembered until emptied or the next start.
input_boolean:
  washer_unemptied:
    name: Washer waiting to be emptied
    icon: mdi:washing-machine-alert
  dryer_unemptied:
    name: Dryer waiting to be emptied
    icon: mdi:tumble-dryer

input_datetime:
  washer_cycle_start:
    name: Washer cycle start
    has_date: true
    has_time: true
  dryer_cycle_start:
    name: Dryer cycle start
    has_date: true
    has_time: true

input_number:
  washer_cycle_start_kwh:
    name: Washer energy at cycle start
    min: 0
    max: 1000000
    step: 0.001
    mode: box
  dryer_cycle_start_kwh:
    name: Dryer energy at cycle start
    min: 0
    max: 1000000
    step: 0.001
    mode: box

counter:
  washer_care:
    name: Washes since drum clean
    icon: mdi:washing-machine-alert
  dryer_care:
    name: Dryer cycles since filter care
    icon: mdi:tumble-dryer
  dryer_water:
    name: Dryer cycles since water emptied
    icon: mdi:cup-water

template:
  - binary_sensor:
      - name: "Washer Running"
        unique_id: washer_running
        device_class: running
        state: "{% set p = states('sensor.washer_power_monitor_power') %}{{ p | float > 10 if is_number(p) else this.state == 'on' }}"
        delay_on: "00:00:30"
        delay_off: "00:03:00"

      - name: "Dryer Running"
        unique_id: dryer_running
        device_class: running
        state: "{% set p = states('sensor.dryer_power_monitor_power') %}{{ p | float > 10 if is_number(p) else this.state == 'on' }}"
        delay_on: "00:00:30"
        delay_off: "00:03:00"

  - sensor:
      - name: "Washer Status"
        unique_id: washer_status
        icon: mdi:washing-machine
        state: >-
          {% if is_state('binary_sensor.washer_running', 'on') %}Running
          {% elif is_state('input_boolean.washer_unemptied', 'on') %}Done
          {% elif is_number(states('sensor.washer_power_monitor_power')) %}Idle
          {% else %}Unknown{% endif %}

      - name: "Dryer Status"
        unique_id: dryer_status
        icon: mdi:tumble-dryer
        state: >-
          {% if is_state('binary_sensor.dryer_running', 'on') %}Running
          {% elif is_state('input_boolean.dryer_unemptied', 'on') %}Done
          {% elif is_number(states('sensor.dryer_power_monitor_power')) %}Idle
          {% else %}Unknown{% endif %}

  - trigger:
      - platform: state
        entity_id: binary_sensor.washer_running
        from: "on"
        to: "off"
    sensor:
      - name: "Washer Last Cycle"
        unique_id: washer_last_cycle
        device_class: timestamp
        state: "{{ (now() - timedelta(minutes=3)).isoformat() }}"
        attributes:
          cycles: "{% from 'laundry.jinja' import cycles %}{{ cycles('washer') }}"

  - trigger:
      - platform: state
        entity_id: binary_sensor.dryer_running
        from: "on"
        to: "off"
    sensor:
      - name: "Dryer Last Cycle"
        unique_id: dryer_last_cycle
        device_class: timestamp
        state: "{{ (now() - timedelta(minutes=3)).isoformat() }}"
        attributes:
          cycles: "{% from 'laundry.jinja' import cycles %}{{ cycles('dryer') }}"

  - trigger:
      - trigger: state
        entity_id:
          - sensor.washer_power_monitor_power
          - binary_sensor.washer_running
    sensor:
      - name: "Washer Phase"
        unique_id: washer_phase
        icon: mdi:washing-machine
        state: "{% from 'laundry.jinja' import phase_step %}{{ (phase_step('washer', this) | from_json).phase }}"
        attributes:
          memory: "{% from 'laundry.jinja' import phase_step %}{{ phase_step('washer', this) | from_json }}"

  - trigger:
      - trigger: state
        entity_id:
          - sensor.dryer_power_monitor_power
          - binary_sensor.dryer_running
    sensor:
      - name: "Dryer Phase"
        unique_id: dryer_phase
        icon: mdi:tumble-dryer
        state: "{% from 'laundry.jinja' import phase_step %}{{ (phase_step('dryer', this) | from_json).phase }}"
        attributes:
          memory: "{% from 'laundry.jinja' import phase_step %}{{ phase_step('dryer', this) | from_json }}"
