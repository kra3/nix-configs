homeassistant:
  name: Vasudha
  time_zone: Europe/Stockholm
  unit_system: metric
  temperature_unit: C
  country: SE
  currency: SEK
  language: en-GB
  internal_url: "http://192.168.1.33:8123"
  external_url: "https://ha.karunagath.in"
  latitude: !secret homeassistant_latitude
  longitude: !secret homeassistant_longitude
  packages: !include_dir_named packages

default_config:

network:

# Removed http: block — now configured via Home Assistant UI (Settings > System > Network)
# If you need to re-add settings, configure them via the UI or re-add here and restart HA.

wake_on_lan:

bluetooth:

battery_notes:

ffmpeg:

stream:

prometheus:
  namespace: ha

logger:

# Noisy, high-frequency entities already covered by Prometheus/Grafana for
# long-term graphing — excluded here to keep the recorder DB small.
recorder:
  db_url: !secret recorder_db_url
  include:
    entities:
      - sensor.average_illuminance
  exclude:
    entity_globs:
      - sensor.*_illuminance
      - sensor.daylight_reference
      - binary_sensor.*_occupancy
      - switch.ranger_*_detect
      - switch.ranger_*_audio_detection

rest_command:
  announce_hallway:
    url: http://10.3.2.1:8098/say
    method: post
    content_type: application/json
    payload: '{"text": {{ message | tojson }}}'
    timeout: 60
  chime_hallway:
    url: http://10.3.2.1:8098/play
    method: post
    content_type: application/json
    payload: '{"url": "http://10.3.2.10:8123/local/sounds/doorbell-chimes.mp3"}'
    timeout: 60
  siren_hallway:
    url: http://10.3.2.1:8098/siren
    method: post
    content_type: application/json
    payload: '{"seconds": 10}'
    timeout: 60

automation: !include_dir_merge_list automations/
script: !include scripts.yaml

lovelace: !include lovelace.yaml
