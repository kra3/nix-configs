rest:
  - resource: "http://10.3.255.2:9090/api/v1/query?query=100%20%2A%20zfs_pool_allocated_bytes%20%2F%20zfs_pool_size_bytes"
    scan_interval: 300
    sensor:
      - name: ZFS tank used
        unique_id: zfs_tank_used
        unit_of_measurement: "%"
        state_class: measurement
        value_template: >-
          {% set r = value_json.data.result | selectattr('metric.pool', 'eq', 'tank') | list %}
          {{ (r[0].value[1] | float) | round(1) if r else none }}
      - name: ZFS rpool used
        unique_id: zfs_rpool_used
        unit_of_measurement: "%"
        state_class: measurement
        value_template: >-
          {% set r = value_json.data.result | selectattr('metric.pool', 'eq', 'rpool') | list %}
          {{ (r[0].value[1] | float) | round(1) if r else none }}
  - resource: "http://10.3.255.2:9090/api/v1/query?query=100%20%2A%20zfs_pool_fragmentation_ratio"
    scan_interval: 1800
    sensor:
      - name: ZFS tank fragmentation
        unique_id: zfs_tank_fragmentation
        unit_of_measurement: "%"
        state_class: measurement
        value_template: >-
          {% set r = value_json.data.result | selectattr('metric.pool', 'eq', 'tank') | list %}
          {{ (r[0].value[1] | float) | round(1) if r else none }}
      - name: ZFS rpool fragmentation
        unique_id: zfs_rpool_fragmentation
        unit_of_measurement: "%"
        state_class: measurement
        value_template: >-
          {% set r = value_json.data.result | selectattr('metric.pool', 'eq', 'rpool') | list %}
          {{ (r[0].value[1] | float) | round(1) if r else none }}
  - resource: "http://10.3.255.2:9090/api/v1/query?query=max%28zfs_pool_health%29"
    scan_interval: 300
    binary_sensor:
      - name: ZFS pool problem
        unique_id: zfs_pool_problem
        device_class: problem
        value_template: >-
          {% set r = value_json.data.result %}
          {{ (r[0].value[1] | float(0) > 0) if r else none }}
