blueprint:
  name: Room presence lighting (dark + occupied → on)
  description: >-
    On while occupied and dark, off after both occupancy_sensor and
    motion_sensor have been clear for 2 min (debounced via the triggers'
    own `for:`, not a timer sequence — a flickery sensor can't reset it
    back to full brightness), off immediately at bedtime. motion_sensor
    exists to stop a strict/classified occupancy_sensor (e.g. Frigate
    person detection) from cutting the light while someone's sitting
    mostly still — pass a broader, more readily-tripped motion signal
    there (occupancy_sensor itself is fine if the room has no such
    signal, making this a no-op); it only ever suppresses the off, never
    causes an on. Leave on_brightness/sleep_brightness unset for a light
    Adaptive Lighting manages — a bare turn_on lets AL supply
    brightness/color-temp instead. Both off-paths are suppressed while
    input_boolean.party_mode is on. With evening_hold, the light stays on
    from dark until bedtime while binary_sensor.anyone_home is on, dims
    after dim_after_minutes without presence, and goes off when nobody is
    home.
  domain: automation
  input:
    light_entity:
      name: Light
      selector:
        entity:
          domain: light
    occupancy_sensor:
      name: Occupancy sensor
      selector:
        entity:
          domain: binary_sensor
    motion_sensor:
      name: Motion sensor (off-inhibitor)
      description: >-
        Broader/more sensitive motion signal than occupancy_sensor — the
        light's off-timer only fires once both this and occupancy_sensor
        have been clear for 2 min. Pass the same entity as
        occupancy_sensor for a room with no separate raw-motion signal;
        checking one entity's state twice is a no-op.
      selector:
        entity:
          domain: binary_sensor
    dark_boolean:
      name: '"Is dark" helper'
      selector:
        entity:
          domain: input_boolean
    on_brightness:
      name: On brightness (%)
      description: >-
        Leave unset for a light Adaptive Lighting manages — see the
        blueprint description.
      default: null
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    react_during_sleep:
      name: React to motion during sleep hours
      description: >-
        If off, this room's light won't turn on for motion once
        schedule.sleep starts — it only reacts before bedtime. Use this
        for a room where the occupancy sensor can't tell "getting up"
        from "still there" (e.g. a bedroom PIR and someone in bed) —
        otherwise every shift in bed would flash the light on.
      default: true
      selector:
        boolean:
    sleep_brightness:
      name: Sleep-hours brightness (%)
      description: >-
        Only used when "React to motion during sleep hours" is on.
        Leave unset for a light Adaptive Lighting manages — its own
        sleep-mode switch (wired to schedule.sleep separately) already
        handles this, with a warmer color temp too, not just dimmer.
      default: null
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    media_player_entity:
      name: Defer to media player (optional)
      description: >-
        If set, skips turn-on (not turn-off) while this player is
        playing/buffering on one of media_sources. Any other state
        (paused, TV just on) or app (YouTube, ...) does not block.
      default: ""
      selector:
        entity:
          domain: media_player
    media_sources:
      name: Media sources that defer lighting
      description: Player `source` names that block turn-on (see media_player_entity).
      default:
        - Litefin
        - Moonfin
        - Jellyfin
        - Apple TV
      selector:
        text:
          multiple: true
    nap_boolean:
      name: Nap helper (optional)
      description: >-
        While this input_boolean is on, the room is treated as in sleep
        hours (no motion reaction unless "React to motion during sleep
        hours" is on).
      default: ""
      selector:
        entity:
          domain: input_boolean
    evening_hold:
      name: Hold on in the evening
      description: >-
        For living areas: skip the 2 min off, keep the light on from dark
        until bedtime while someone is home, dim it after
        "Dim after (min)" without presence, and turn it off when nobody is
        home.
      default: false
      selector:
        boolean:
    dim_after_minutes:
      name: Dim after (min)
      default: 30
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: min
    dim_brightness:
      name: Dim brightness (%)
      default: 20
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    adaptive_lighting_switch:
      name: Adaptive Lighting switch (optional)
      description: >-
        Needed with evening_hold on an Adaptive Lighting light: taken over
        for the dim level, handed back when presence returns.
      default: ""
      selector:
        entity:
          domain: switch
    prolonged_presence_sensor:
      name: Prolonged-presence sensor (optional)
      description: >-
        If this sensor has been on for "Prolonged after (min)" when the room
        goes clear, the off debounce is "Prolonged clear delay (min)" instead
        of 2 min. Leave empty to always use 2 min.
      default: ""
      selector:
        entity:
          domain: binary_sensor
    prolonged_after_minutes:
      name: Prolonged after (min)
      default: 7
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: min
    prolonged_clear_minutes:
      name: Prolonged clear delay (min)
      default: 5
      selector:
        number:
          min: 2
          max: 60
          unit_of_measurement: min

trigger_variables:
  prolonged_sensor: !input prolonged_presence_sensor
  prolonged_after: !input prolonged_after_minutes
  prolonged_clear: !input prolonged_clear_minutes

triggers:
  - entity_id: !input occupancy_sensor
    to: "on"
    trigger: state
    id: motion
  - entity_id: !input dark_boolean
    to: "on"
    trigger: state
    id: became_dark
  - entity_id: !input occupancy_sensor
    to: "off"
    for: >-
      {%- set long = prolonged_sensor != '' and is_state(prolonged_sensor, 'on') and (now() - states[prolonged_sensor].last_changed).total_seconds() >= prolonged_after * 60 -%}
      {{ '00:%02d:00' % prolonged_clear if long else '00:02:00' }}
    trigger: state
    id: clear
  - entity_id: !input motion_sensor
    to: "off"
    for: >-
      {%- set long = prolonged_sensor != '' and is_state(prolonged_sensor, 'on') and (now() - states[prolonged_sensor].last_changed).total_seconds() >= prolonged_after * 60 -%}
      {{ '00:%02d:00' % prolonged_clear if long else '00:02:00' }}
    trigger: state
    id: motion_clear
  - entity_id: schedule.sleep
    to: "on"
    trigger: state
    id: sleep_started
  - entity_id: binary_sensor.anyone_home
    to: "off"
    trigger: state
    id: away
  - entity_id: binary_sensor.anyone_home
    to: "on"
    trigger: state
    id: arrive
  - trigger: time_pattern
    minutes: "/1"
    id: tick
  # Re-derives whichever branch below should currently apply — the
  # "clear" trigger's `for: 2m` only arms on a fresh transition, so an
  # HA restart landing while occupancy is already clear (or already
  # sleep/motion) would otherwise strand the light until the next
  # transition instead of just fixing it now.
  - trigger: homeassistant
    event: start
    id: startup
  # fired by manual-mode.yaml on resume and by the alarm lights hand-back
  - trigger: event
    event_type: automations_resumed
    id: startup

conditions:
  - condition: state
    entity_id: !input dark_boolean
    state: "on"

variables:
  on_brightness: !input on_brightness
  sleep_brightness: !input sleep_brightness
  react_during_sleep: !input react_during_sleep
  occupancy_sensor: !input occupancy_sensor
  motion_sensor: !input motion_sensor
  media_player_entity: !input media_player_entity
  media_sources: !input media_sources
  media_blocks: >-
    {{ media_player_entity not in [none, ''] and
       is_state(media_player_entity, ['playing', 'buffering']) and
       state_attr(media_player_entity, 'source') in media_sources }}
  nap_boolean: !input nap_boolean
  asleep: "{{ is_state('schedule.sleep', 'on') or (nap_boolean != '' and is_state(nap_boolean, 'on')) }}"
  evening_hold: !input evening_hold
  dim_brightness: !input dim_brightness
  dim_after_minutes: !input dim_after_minutes
  al_switch: !input adaptive_lighting_switch
  light_entity: !input light_entity
  home: "{{ is_state('binary_sensor.anyone_home', 'on') }}"
  away: "{{ evening_hold and not home and not is_state('alarm_control_panel.vasudha_secure', 'armed_vacation') }}"
  handback: "{{ evening_hold and al_switch != '' }}"

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: sleep_started
          - condition: not
            conditions:
              - condition: state
                entity_id: input_boolean.party_mode
                state: "on"
        sequence:
          - target:
              entity_id: !input light_entity
            data:
              transition: 2
            action: light.turn_off
      - conditions:
          - condition: trigger
            id: [away, startup, tick]
          - condition: template
            value_template: "{{ away }}"
          - condition: state
            entity_id: !input light_entity
            state: "on"
          - condition: not
            conditions:
              - condition: state
                entity_id: input_boolean.party_mode
                state: "on"
        sequence:
          - target:
              entity_id: !input light_entity
            data:
              transition: 2
            action: light.turn_off
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: motion
              - condition: trigger
                id: became_dark
              - condition: trigger
                id: arrive
          - condition: template
            value_template: "{{ not away }}"
          - condition: or
            conditions:
              - condition: state
                entity_id: !input occupancy_sensor
                state: "on"
              - condition: template
                value_template: "{{ evening_hold and home }}"
          - condition: or
            conditions:
              - condition: not
                conditions:
                  - condition: template
                    value_template: "{{ asleep }}"
              - condition: template
                value_template: "{{ react_during_sleep }}"
          - condition: template
            value_template: "{{ not media_blocks }}"
          - condition: or
            conditions:
              - condition: not
                conditions:
                  - condition: trigger
                    id: arrive
              - condition: template
                value_template: "{{ evening_hold and not asleep }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ handback }}"
            then:
              - action: adaptive_lighting.set_manual_control
                data:
                  entity_id: "{{ al_switch }}"
                  lights: "{{ light_entity }}"
                  manual_control: false
          - target:
              entity_id: !input light_entity
            data: >-
              {%- set b = sleep_brightness if is_state('schedule.sleep', 'on') else on_brightness -%}
              {{ {'transition': 1} if b is none else {'brightness_pct': b, 'transition': 1} }}
            action: light.turn_on
      - conditions:
          - condition: trigger
            id: [clear, motion_clear]
          - condition: template
            value_template: "{{ not evening_hold }}"
          - condition: state
            entity_id: !input occupancy_sensor
            state: "off"
          - condition: state
            entity_id: !input motion_sensor
            state: "off"
          - condition: not
            conditions:
              - condition: state
                entity_id: input_boolean.party_mode
                state: "on"
        sequence:
          - target:
              entity_id: !input light_entity
            data:
              transition: 1
            action: light.turn_off
      - conditions:
          - condition: trigger
            id: tick
          - condition: template
            value_template: "{{ evening_hold and home and not asleep }}"
          - condition: state
            entity_id: !input light_entity
            state: "on"
          - condition: state
            entity_id: !input occupancy_sensor
            state: "off"
          - condition: state
            entity_id: !input motion_sensor
            state: "off"
          - condition: template
            value_template: >-
              {%- from 'elapsed.jinja' import elapsed_ge -%}
              {{ (elapsed_ge(occupancy_sensor, dim_after_minutes | int * 60) | bool)
                 and (elapsed_ge(motion_sensor, dim_after_minutes | int * 60) | bool)
                 and (state_attr(light_entity, 'brightness') | int(0)) > dim_brightness | int * 2.55 + 8 }}
          - condition: not
            conditions:
              - condition: state
                entity_id: input_boolean.party_mode
                state: "on"
        sequence:
          - if:
              - condition: template
                value_template: "{{ handback }}"
            then:
              - action: adaptive_lighting.set_manual_control
                data:
                  entity_id: "{{ al_switch }}"
                  lights: "{{ light_entity }}"
                  manual_control: true
          - target:
              entity_id: !input light_entity
            data:
              brightness_pct: "{{ dim_brightness | int }}"
              transition: 5
            action: light.turn_on
      - conditions:
          - condition: trigger
            id: startup
          - condition: template
            value_template: "{{ asleep }}"
          - condition: or
            conditions:
              - condition: template
                value_template: "{{ not react_during_sleep }}"
              - condition: state
                entity_id: !input occupancy_sensor
                state: "off"
          - condition: not
            conditions:
              - condition: state
                entity_id: input_boolean.party_mode
                state: "on"
        sequence:
          - target:
              entity_id: !input light_entity
            data:
              transition: 2
            action: light.turn_off
      - conditions:
          - condition: trigger
            id: startup
          - condition: template
            value_template: "{{ not away }}"
          - condition: state
            entity_id: !input occupancy_sensor
            state: "on"
          - condition: or
            conditions:
              - condition: not
                conditions:
                  - condition: template
                    value_template: "{{ asleep }}"
              - condition: template
                value_template: "{{ react_during_sleep }}"
          - condition: template
            value_template: "{{ not media_blocks }}"
        sequence:
          - target:
              entity_id: !input light_entity
            data: >-
              {%- set b = sleep_brightness if is_state('schedule.sleep', 'on') else on_brightness -%}
              {{ {'transition': 1} if b is none else {'brightness_pct': b, 'transition': 1} }}
            action: light.turn_on
      - conditions:
          - condition: trigger
            id: startup
          - condition: template
            value_template: "{{ not evening_hold }}"
          - condition: state
            entity_id: !input occupancy_sensor
            state: "off"
          - condition: state
            entity_id: !input motion_sensor
            state: "off"
          - condition: template
            value_template: >-
              {%- from 'elapsed.jinja' import elapsed_ge -%}
              {{ elapsed_ge(occupancy_sensor, 120) and elapsed_ge(motion_sensor, 120) }}
          - condition: not
            conditions:
              - condition: state
                entity_id: input_boolean.party_mode
                state: "on"
        sequence:
          - target:
              entity_id: !input light_entity
            data:
              transition: 1
            action: light.turn_off
mode: restart
