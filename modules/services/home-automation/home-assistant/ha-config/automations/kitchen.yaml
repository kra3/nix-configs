# ── Kitchen ────────────────────────────────────────────────────
- id: kitchen_darkness
  alias: Kitchen — Darkness detection
  description: >-
    Dark while it is gloomy outside and the kitchen reads below 10 lux for 2 min.
  use_blueprint:
    path: local/darkness-detection.yaml
    input:
      illuminance_sensor: sensor.kitchen_illuminance_filtered
      occupancy_sensor: binary_sensor.hue_pir_kitchen_occupancy
      light_entity: light.kitchen_lights
      dark_boolean: input_boolean.kitchen_is_dark
      dark_below: 10

- id: kitchen_lighting
  alias: Kitchen — Lighting
  description: >-
    Presence + darkness; brightness left to Adaptive Lighting. Off after 2 min
    without motion, or 5 min once presence has lasted 7 min or more.
  use_blueprint:
    path: local/room-presence-lighting.yaml
    input:
      light_entity: light.kitchen_lights
      occupancy_sensor: binary_sensor.hue_pir_kitchen_occupancy
      motion_sensor: binary_sensor.hue_pir_kitchen_occupancy
      dark_boolean: input_boolean.kitchen_is_dark
      prolonged_presence_sensor: binary_sensor.room_presence_kitchen

- id: kitchen_cooking_boost
  alias: Kitchen — Full brightness while cooking
  description: >-
    After 2.5 min of continuous presence the kitchen lights go to 100 % and the
    kitchen-dining lights come on with them when it is dark; when the room empties or
    the lights go off, Adaptive Lighting takes over again and kitchen-dining goes off.
    If the lights come back on while presence is still held, the boost is applied again.
  triggers:
  - trigger: state
    entity_id: binary_sensor.room_presence_kitchen
    to: "on"
    for: "00:02:30"
    id: boost
  - trigger: state
    entity_id: light.kitchen_lights
    to: "on"
    id: boost
  - trigger: state
    entity_id: binary_sensor.room_presence_kitchen
    to: "off"
    id: release
  - trigger: state
    entity_id: light.kitchen_lights
    to: "off"
    id: release
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: boost
      - condition: state
        entity_id: binary_sensor.room_presence_kitchen
        state: "on"
        for: "00:02:30"
      - condition: state
        entity_id: light.kitchen_lights
        state: "on"
      - condition: state
        entity_id: schedule.sleep
        state: "off"
      sequence:
      - action: adaptive_lighting.set_manual_control
        target:
          entity_id: switch.home_adaptive_lighting_home
        data:
          lights: light.kitchen_lights
          manual_control: true
      - action: light.turn_on
        target:
          entity_id: light.kitchen_lights
        data:
          brightness_pct: 100
          transition: 5
      - if:
        - condition: state
          entity_id: input_boolean.kitchen_is_dark
          state: "on"
        then:
        - action: adaptive_lighting.set_manual_control
          target:
            entity_id: switch.home_adaptive_lighting_home
          data:
            lights: light.kitchen_dining_lights
            manual_control: true
        - action: light.turn_on
          target:
            entity_id: light.kitchen_dining_lights
          data:
            brightness_pct: 100
            transition: 5
    - conditions:
      - condition: trigger
        id: release
      sequence:
      - action: adaptive_lighting.set_manual_control
        target:
          entity_id: switch.home_adaptive_lighting_home
        data:
          lights:
          - light.kitchen_lights
          - light.kitchen_dining_lights
          manual_control: false
      - action: light.turn_off
        target:
          entity_id: light.kitchen_dining_lights
        data:
          transition: 5
