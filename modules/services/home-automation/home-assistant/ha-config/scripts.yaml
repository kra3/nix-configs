notify_all_phones:
  alias: "Notify: all phones"
  description: >-
    Fan out a plain notification to both phones via notify.send_message.
    The old per-device notify.mobile_app_* services were removed by the
    mobile_app integration's move to entity-based notify (HA 2026.9), and
    the replacement doesn't support actionable buttons (data.actions) —
    anything needing a tappable action belongs on the dashboard instead.
  fields:
    title:
      required: false
      selector:
        text:
    message:
      required: true
      selector:
        text:
  sequence:
  - action: notify.send_message
    target:
      entity_id:
      - notify.iphone
      - notify.anjalis_iphone
    data:
      title: "{{ title | default(omit) }}"
      message: "{{ message }}"

alarm_force_arm_night:
  alias: "Alarm: force arm night (bypass open sensors)"
  description: >-
    Arms night mode via alarmo.arm's force option, which auto-bypasses
    any currently-open sensor instead of refusing to arm.
  sequence:
  - action: alarmo.arm
    data:
      entity_id: alarm_control_panel.vasudha_secure
      mode: night
      force: true
      code: !secret alarm_code
