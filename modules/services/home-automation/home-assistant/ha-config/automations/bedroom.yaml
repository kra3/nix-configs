# ── Bedroom ────────────────────────────────────────────────────
- id: bedroom_darkness
  alias: Bedroom — Darkness detection
  description: >-
    Dark while it is gloomy outside and the bedroom reads below 50 lux for 2 min.
  use_blueprint:
    path: local/darkness-detection.yaml
    input:
      illuminance_sensor: sensor.bedroom_occupancy_illuminance
      occupancy_sensor: binary_sensor.bedroom_occupancy_presence
      light_entity: light.bedroom_wardrobe_lights
      dark_boolean: input_boolean.bedroom_is_dark
      dark_below: 50

- id: bedroom_lighting
  alias: Bedroom — Lighting
  description: >-
    Presence + darkness, but no motion-reaction once sleep starts
    (react_during_sleep: false — see blueprint). Brightness left to AL.
  use_blueprint:
    path: local/room-presence-lighting.yaml
    input:
      light_entity: light.bedroom_wardrobe_lights
      occupancy_sensor: binary_sensor.bedroom_occupancy_presence
      motion_sensor: binary_sensor.bedroom_occupancy_presence
      dark_boolean: input_boolean.bedroom_is_dark
      react_during_sleep: false
