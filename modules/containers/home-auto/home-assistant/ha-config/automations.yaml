- id: '1733346573361'
  alias: remote control
  description: ''
  use_blueprint:
    path: lsismeiro/ikea_e2001_e2002.yaml
    input:
      integration: ZHA
      controller_device: f3322a89a337bba1ad201cc86046ee2c
      helper_last_controller_event: input_text.dining_remote_control_last_event
      action_button_left_short: []
      action_button_up_short:
      - action: light.turn_on
        metadata: {}
        data:
          color_temp: 474
        target:
          area_id: living_room
          entity_id: light.living_room_ceiling_lights
      action_button_down_short:
      - action: light.turn_on
        metadata: {}
        data:
          color_temp: 179
        target:
          area_id: living_room
          entity_id: light.living_room_ceiling_lights
      helper_debounce_delay: 30
      button_down_double_press: true
      button_up_double_press: true
      button_right_double_press: true
      button_left_double_press: true
      action_button_left_double: []
      action_button_right_double: []
      action_button_up_double:
      - action: light.turn_on
        metadata: {}
        data: {}
        target:
          area_id: dining_room
          entity_id: light.dining_room_ceiling_lights
      action_button_down_double:
      - action: light.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: light.dining_room_ceiling_lights
          area_id: dining_room
- id: '1733346957071'
  alias: Hook - Living room ceiling lights
  description: ''
  use_blueprint:
    path: EPMatt/light.yaml
    input:
      controller_device: f3322a89a337bba1ad201cc86046ee2c
      controller_model: IKEA E2001/E2002 STYRBAR Remote control
      light: light.living_room_ceiling_lights
      light_color_mode: Auto
      min_brightness: 75
