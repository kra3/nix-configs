# ── Living room ────────────────────────────────────────────────
- id: living_darkness
  alias: Living room — Darkness detection
  description: >-
    Hysteresis darkness state machine for living room, using the
    house-wide average illuminance (living room has no illuminance
    sensor of its own) rather than hall_is_dark — same fix as
    dining_darkness, for the same reason: living room is one of the
    brightest rooms, so gating it on the hall's dim interior PIR
    turned its lights on in broad daylight. dark_below/dark_below_daytime
    pinned to 45, matching dining_darkness (same sensor) — left at the
    blueprint's 1000 default, normal daytime dips in average_illuminance
    read as dark and got stuck on (bright_above's trigger needs a fresh
    below→above crossing to clear it, which lux never dropped low enough
    to produce).
  use_blueprint:
    path: local/darkness-detection.yaml
    input:
      illuminance_sensor: sensor.average_illuminance
      occupancy_sensor: binary_sensor.ranger_duo_fxd_person_occupancy
      light_entity: light.living_room_lights
      dark_boolean: input_boolean.living_room_is_dark
      dark_below: 45
      dark_below_daytime: 45
      dark_sustain_daytime: "00:15:00"

- id: living_room_lighting
  alias: Living room — Lighting
  description: >-
    Presence + darkness via ranger_duo_fxd's Frigate person detection.
    KNOWN ISSUE: ranger_duo_fxd's motion sensor is barely firing (verified
    2026-09-04 — one event all day despite confirmed presence), so
    Frigate's detect-on-motion gate rarely enables long enough for
    person_occupancy to populate. Needs a Frigate motion-mask/sensitivity
    tuning pass before this reliably turns lights on; shipped anyway
    since darkness-edge-only was equally unreliable.
  use_blueprint:
    path: local/room-presence-lighting.yaml
    input:
      light_entity: light.living_room_lights
      occupancy_sensor: binary_sensor.ranger_duo_fxd_person_occupancy
      motion_sensor: binary_sensor.ranger_duo_fxd_motion
      dark_boolean: input_boolean.living_room_is_dark
      media_player_entity: media_player.lg_webos_tv_oled77c35la

- id: living_room_media_aware
  alias: Living room — Media-aware lighting
  description: >-
    Turn off living + dining lights when watching content on
    Stremio, Jellyfin, or Apple TV. Restore when stopped, unless a
    room's presence sensor already reports it empty — otherwise this
    would flicker the light back on right before living_room_lighting/
    dining_room_lighting's own occupancy-clear branch turns it off
    again. Only skips on a definite "off"; unknown/unavailable still
    restores, since the underlying Frigate person_occupancy sensors
    are known to false-negative (see living_room_lighting's KNOWN ISSUE).
    Darkness gate is either room's own boolean now (was hall_is_dark) -
    living and dining each have their own since both moved to
    sensor.average_illuminance. Pause dims living room lights to 20%
    after a 38s buffer (avoids flicker on brief pause/buffering) rather
    than restoring full brightness, and hands the light to Adaptive
    Lighting's manual_control so it doesn't immediately re-adapt the
    brightness back up; AL reclaims it automatically on the light's
    next off->on transition (i.e. when not_playing's plain turn_on
    fires on a genuine stop).
  triggers:
  - entity_id: media_player.lg_webos_tv_oled77c35la
    to: playing
    trigger: state
    id: playing
  # Genuine-stop states only — `from: playing` also caught pause/buffering blips.
  - entity_id: media_player.lg_webos_tv_oled77c35la
    to:
    - "off"
    - idle
    - standby
    trigger: state
    id: not_playing
  - entity_id: media_player.lg_webos_tv_oled77c35la
    to: paused
    trigger: state
    id: paused
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.living_room_is_dark
      state: "on"
    - condition: state
      entity_id: input_boolean.dining_is_dark
      state: "on"
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: playing
      - condition: template
        value_template: >-
          {{ state_attr('media_player.lg_webos_tv_oled77c35la', 'source')
             in ['Stremio', 'Jellyfin', 'Apple TV'] }}
      sequence:
      - target:
          entity_id:
          - light.living_room_lights
          - light.dining_lights
        data:
          transition: 2
        action: light.turn_off
    - conditions:
      - condition: trigger
        id: not_playing
      - condition: state
        entity_id: schedule.sleep
        state: "off"
      sequence:
      - delay: "00:00:30"
      - if:
        - condition: not
          conditions:
          - condition: state
            entity_id: binary_sensor.ranger_duo_fxd_person_occupancy
            state: "off"
        then:
        - target:
            entity_id: light.living_room_lights
          data:
            transition: 60
          action: light.turn_on
      - if:
        - condition: not
          conditions:
          - condition: state
            entity_id: binary_sensor.ranger_duo_ptz_person_occupancy
            state: "off"
        then:
        - target:
            entity_id: light.dining_lights
          data:
            transition: 60
          action: light.turn_on
    - conditions:
      - condition: trigger
        id: paused
      - condition: state
        entity_id: schedule.sleep
        state: "off"
      sequence:
      - delay: "00:00:38"
      - if:
        - condition: state
          entity_id: light.living_room_lights
          state: "off"
        - condition: not
          conditions:
          - condition: state
            entity_id: binary_sensor.ranger_duo_fxd_person_occupancy
            state: "off"
        then:
        - target:
            entity_id: light.living_room_lights
          data:
            brightness_pct: 20
            transition: 10
          action: light.turn_on
        - target:
            entity_id: switch.home_adaptive_lighting_home
          data:
            lights: light.living_room_lights
            manual_control: true
          action: adaptive_lighting.set_manual_control
  mode: restart
