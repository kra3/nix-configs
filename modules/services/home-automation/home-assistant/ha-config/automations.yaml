      - condition: trigger
        id: sleep_started
      sequence:
      - target:
          entity_id: switch.front_entrance_double_switch_right
        action: switch.turn_off
  mode: single

# ── Front Door Management ──────────────────────────────────────
- id: front_door_knock_announcements
  alias: "Front Door: Knock TTS & Notifications"
  description: Plays TTS and sends notifications when someone knocks at the front door.
  trigger:
    - platform: state
      entity_id: binary_sensor.front_door_knock_vibration
      to: "on"
  action:
    # 1. Wait 2 seconds to let contact/lock sensor state settle
    - delay: "00:00:02"

    # 2. Check if this was a valid knock (door is closed, and was not recently opened/closed/locked/unlocked)
    - if:
        - condition: state
          entity_id: binary_sensor.yale_front_door_door
          state: "off"
        - condition: template
          value_template: "{{ (as_timestamp(now()) - as_timestamp(states.binary_sensor.yale_front_door_door.last_changed)) > 15 }}"
        - condition: template
          value_template: "{{ (as_timestamp(now()) - as_timestamp(states.lock.yale_front_door.last_changed | default(now()))) > 15 }}"
      then:
        # Determine Presence
        - variables:
            anjali_home: "{{ is_state('person.anjalipc', 'home') }}"
            arun_home: "{{ is_state('person.arun_karunagath', 'home') }}"
            anyone_home: "{{ anjali_home or arun_home }}"

        # If someone home: Play Announcement on HT and Notify present people
        - if:
            - condition: template
              value_template: "{{ anyone_home }}"
          then:
            # Toggle TV pause
            - if:
                - condition: state
                  entity_id: media_player.lg_webos_tv_oled77c35la
                  state: "playing"
              then:
                - action: media_player.media_play_pause
                  target: { entity_id: media_player.lg_webos_tv_oled77c35la }
            
            # Snapshot Denon (HT_2) source
            - action: input_text.set_value
              target: { entity_id: input_text.doorbell_return_source }
              data:
                value: "{{ state_attr('media_player.home_theater_2', 'source') }}"
            
            # Announce
            - action: music_assistant.play_announcement
              target: { entity_id: media_player.ma_home_theater }
              data:
                url: "https://ha.karunagath.in/local/sounds/doorbell-chimes.mp3"
                announce_volume: 60
            # - action: tts.speak
            #   target: { entity_id: tts.google_ai_tts }
            #   data:
            #     media_player_entity_id: media_player.ma_home_theater
            #     message: "Someone is knocking at the front door."
            #     cache: true
            
            # Restore HT_2 (Denon) source
            - delay: "00:00:10"
            - action: media_player.select_source
              target: { entity_id: media_player.home_theater_2 }
              data:
                source: "{{ states('input_text.doorbell_return_source') }}"

            # Resume TV
            - if:
                - condition: state
                  entity_id: media_player.lg_webos_tv_oled77c35la
                  state: "paused"
              then:
                - action: media_player.media_play_pause
                  target: { entity_id: media_player.lg_webos_tv_oled77c35la }

            # Notify present people
            - if:
                - condition: template
                  value_template: "{{ anjali_home }}"
              then:
                - action: notify.mobile_app_anjalis_iphone
                  data: { title: "Front Door", message: "Someone is knocking at the front door." }
            - if:
                - condition: template
                  value_template: "{{ arun_home }}"
              then:
                - action: notify.mobile_app_iphone
                  data: { title: "Front Door", message: "Someone is knocking at the front door." }
          
          # If no one home: Notify all phones
          else:
            - action: notify.all_phones
              data: { title: "Front Door", message: "Someone is knocking at the front door." }

        # Cooldown delay to prevent rapid back-to-back announcements
        - delay: "00:00:30"
  mode: single

- id: front_door_knock_lights
  alias: "Front Door: Knock Lights"
  description: Handles smart lighting logic for the front entrance when someone knocks.
  trigger:
    - platform: state
      entity_id: binary_sensor.front_door_knock_vibration
      to: "on"
  action:
    # 1. Wait 2 seconds to let contact/lock sensor state settle
    - delay: "00:00:02"

    # 2. Check if this was a valid knock (door is closed, and was not recently opened/closed/locked/unlocked)
    - if:
        - condition: state
          entity_id: binary_sensor.yale_front_door_door
          state: "off"
        - condition: template
          value_template: "{{ (as_timestamp(now()) - as_timestamp(states.binary_sensor.yale_front_door_door.last_changed)) > 15 }}"
        - condition: template
          value_template: "{{ (as_timestamp(now()) - as_timestamp(states.lock.yale_front_door.last_changed | default(now()))) > 15 }}"
      then:
        # Was gated on schedule.sleep (fixed clock, not sun-relative) —
        # turned this on in broad Swedish-summer daylight. Use sun.sun.
        - if:
            - condition: state
              entity_id: sun.sun
              state: below_horizon
          then:
            - action: switch.turn_on
              target:
                entity_id: switch.front_entrance_double_switch_right
                
        # Entrance Light: Turn on only if motion detected after knock (someone going to the door)
        - wait_for_trigger:
            - platform: state
              entity_id: binary_sensor.hue_pir_hallway_occupancy
              to: "on"
          timeout: "00:02:00"
        - if:
            - condition: template
              value_template: "{{ wait.trigger is not none }}"
          then:
            - action: switch.turn_on
              target:
                entity_id: switch.front_entrance_double_switch_left
                
        # Auto-off logic
        - wait_for_trigger:
            - platform: state
              entity_id: binary_sensor.yale_front_door_door
              to: "on"
          timeout: "00:10:00"
          
        - if:
            - condition: template
              value_template: "{{ wait.trigger is none }}"
          then:
            # No door open within 10 mins of knock - turn off both lights
            - action: switch.turn_off
              target:
                entity_id:
                  - switch.front_entrance_double_switch_right
                  - switch.front_entrance_double_switch_left
          else:
            # Door was opened! Now wait for it to be closed.
            - wait_for_trigger:
                - platform: state
                  entity_id: binary_sensor.yale_front_door_door
                  to: "off"
            # 10 min delay after door close before turning off
            - delay: "00:10:00"
            - action: switch.turn_off
              target:
                entity_id:
                  - switch.front_entrance_double_switch_right
                  - switch.front_entrance_double_switch_left
  mode: restart

# ── BLE integration reload stopgap ──────────────────────────────
- id: ble_integrations_periodic_reload
  alias: "BLE integrations: periodic reload (range/stability stopgap)"
  description: >-
    PlejD and Fresh Intellivent Sky both talk to sutala over BLE with
    marginal range (PlejD mesh measured ~-91dBm; Fresh Intellivent's
    device isn't even reliably in scan range). Neither integration
    recovers cleanly from a dropped/stale connection on its own
    (PlejD: github.com/thomasloven/hass-plejd issues #153/#154/#161).
    Force a periodic reload of both so they retry a fresh connection
    instead of getting stuck. This is a stopgap, not a fix for the
    underlying signal/range issue — consider an ESPHome Bluetooth
    proxy near the devices if this isn't enough.
  triggers:
  - trigger: time_pattern
    minutes: "/30"
  actions:
  - action: homeassistant.reload_config_entry
    data:
      entry_id: 01JE7EG5ZJEQBM1887Q1VCEGCR # PlejD (Salviegatan 4)
  - action: homeassistant.reload_config_entry
    data:
      entry_id: 01JE7F2D803DDWPQ63RP0VY71P # Fresh Intellivent Sky (Fresh kitchen fan)
  mode: single

# ── Away mode ──────────────────────────────────────────────────
- id: everyone_left_home
  alias: Everyone left home
  description: >-
    When all tracked persons leave the home zone for 5 min,
    turn off all lights, arm Alarmo away, and notify both phones.
  triggers:
  - entity_id:
    - person.anjalipc
    - person.arun_karunagath
    trigger: state
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: person.anjalipc
      state: home
    - condition: state
      entity_id: person.arun_karunagath
      state: home
  actions:
  - delay: "00:05:00"
  - condition: not
    conditions:
    - condition: state
      entity_id: person.anjalipc
      state: home
    - condition: state
      entity_id: person.arun_karunagath
      state: home
  - action: light.turn_off
    target:
      entity_id: all
  - action: alarm_control_panel.alarm_arm_away
    target:
      entity_id: alarm_control_panel.vasudha_secure
    data:
      code: !secret alarm_code
  - action: notify.mobile_app_anjalis_iphone
    data:
      title: Home
      message: Everyone left — lights off, alarm armed
  - action: notify.mobile_app_iphone
    data:
      title: Home
      message: Everyone left — lights off, alarm armed
  mode: single

- id: notify_open_exits_on_leave
  alias: Notify if door/window left open when leaving
  description: >-
    When everyone leaves home and a tracked door/window is still open
    5 min later, notify both phones which one(s).
  triggers:
  - entity_id: binary_sensor.house_exits_open_status
    to: "on"
    trigger: state
  - entity_id:
    - person.anjalipc
    - person.arun_karunagath
    trigger: state
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: person.anjalipc
      state: home
    - condition: state
      entity_id: person.arun_karunagath
      state: home
  - condition: state
    entity_id: binary_sensor.house_exits_open_status
    state: "on"
  actions:
  - delay: "00:05:00"
  - condition: not
    conditions:
    - condition: state
      entity_id: person.anjalipc
      state: home
    - condition: state
      entity_id: person.arun_karunagath
      state: home
  - condition: state
    entity_id: binary_sensor.house_exits_open_status
    state: "on"
  - variables:
      exit_mapping:
        binary_sensor.yale_front_door_door: Front Door
        binary_sensor.hallway_door_contact_contact: Hallway Door
        binary_sensor.patio_door_contact_contact: Patio Door
        binary_sensor.living_room_window_left_contact_contact: Living Room Window (L)
        binary_sensor.living_room_window_right_contact_contact: Living Room Window (R)
        binary_sensor.bedroom_window_left_contact_contact: Bedroom Window (L)
        binary_sensor.bedroom_window_right_contact_contact: Bedroom Window (R)
        binary_sensor.kitchen_dining_window_left_contact_contact: Kitchen Dining Window
      open_exits: >-
        {%- set ns = namespace(open=[]) -%}
        {%- for entity, label in exit_mapping.items() -%}
          {%- if is_state(entity, 'on') -%}
            {%- set ns.open = ns.open + [label] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.open | join(', ') }}
  - action: notify.all_phones
    data:
      title: Home
      message: "Left home with something open: {{ open_exits }}"
  mode: single

# ── Waste collection ────────────────────────────────────────────
- id: waste_collection_reminder
  alias: "Waste collection: evening-before reminder"
  description: >-
    Evening-before reminder, triggered off the VA Syd calendar event
    (not the sensor) so it fires once per real collection.
  triggers:
  - trigger: calendar
    entity_id: calendar.va_syd_sophamntning
    event: start
    offset: "-12:00:00"
  actions:
  - action: notify.all_phones
    data:
      title: Waste collection tomorrow
      message: "{{ trigger.calendar_event.summary }}"
  mode: queued

# ── Security ───────────────────────────────────────────────────
- id: alarm_pending_or_triggered_lights
  alias: "Security: lights on when alarm pending or triggered"
  description: >-
    Lights on when Alarmo goes pending/triggered and it's dark. Alarmo
    itself already owns the entry-delay (60s, armed_away) via its own
    sensor config — this only adds the light response.
  triggers:
  - entity_id: alarm_control_panel.vasudha_secure
    to:
    - pending
    - triggered
    trigger: state
  conditions:
  - condition: state
    entity_id: sun.sun
    state: below_horizon
  actions:
  - action: light.turn_on
    target:
      entity_id:
      - light.kitchen_lights
      - light.hall
      - light.bedroom_wardrobe_lights
      - light.living_room_lights
      - light.dining_lights
      - light.kitchen_dining_lights
      - light.office_room_light
  mode: single

# ── Manual mode ────────────────────────────────────────────────
- id: automations_paused_sync
  alias: "Manual mode: pause/resume automations"
  description: >-
    Disables the automations in managed_aliases below while
    input_boolean.automations_paused is on (re-enables on off) — matched
    by alias text since HA appends a numeric suffix on any entity_id
    slug collision (automation.tv_backlight_off_2 already has one), so
    a hardcoded entity_id list would silently miss entries. Security
    lights, Frigate gating, and pure-notification automations are
    intentionally excluded. Blunt pause/resume, not per-automation
    memory — resume re-enables everything on the list regardless of
    prior state.
  triggers:
  - entity_id: input_boolean.automations_paused
    trigger: state
  - trigger: homeassistant
    event: start
  variables:
    managed_aliases:
    - "Kitchen — Darkness detection"
    - "Kitchen — Lighting"
    - "Hall — Darkness detection"
    - "Hall — Lighting"
    - "Bedroom — Darkness detection"
    - "Bedroom — Lighting"
    - "Living room — Lighting"
    - "Living room — Media-aware lighting"
    - "Dining room — Lighting"
    - "TV — Power on + backlight"
    - "TV — Backlight off"
    - "Sleep — TV off if idle"
    - "Sleep — Arm Alarmo (night)"
    - "Exterior — Front street light (dusk to sleep)"
    - "Everyone left home"
    - "Adaptive Lighting: sync sleep mode with schedule.sleep"
    targets: >-
      {{ states.automation
         | selectattr('attributes.friendly_name', 'in', managed_aliases)
         | map(attribute='entity_id') | list }}
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.automations_paused
      state: "on"
    then:
    - action: automation.turn_off
      target:
        entity_id: "{{ targets }}"
    else:
    - action: automation.turn_on
      target:
        entity_id: "{{ targets }}"
  mode: single

# ── Frigate detect/audio gating by alarm state ──────────────────
# All 3 cameras are interior. Object + audio detection only needs to
# run continuously while armed away; while armed night or disarmed
# (someone's home) interior person-tracking is redundant, so it's
# gated off and only re-enabled briefly on actual motion. This is a
# CPU/GPU optimization (frigate.detector:openvino + per-camera
# frigate.process were the top consumers per PR #48) built on top of
# the existing motion-mask/fps tuning in nvr.nix.
- id: frigate_detect_gate_by_alarm
  alias: "Frigate: baseline detect/audio by alarm state"
  description: >-
    Force full detect+audio on when armed away; force it off when
    armed night or disarmed. Runs on every alarm state change.
  triggers:
  - trigger: state
    entity_id: alarm_control_panel.vasudha_secure
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: alarm_control_panel.vasudha_secure
        state: armed_away
      sequence:
      - action: switch.turn_on
        target:
          entity_id:
          - switch.ranger_duo_fxd_detect
          - switch.ranger_duo_fxd_audio_detection
          - switch.ranger_duo_ptz_detect
          - switch.ranger_duo_ptz_audio_detection
          - switch.ranger_uno_detect
          - switch.ranger_uno_audio_detection
    - conditions:
      - condition: state
        entity_id: alarm_control_panel.vasudha_secure
        state:
        - disarmed
        - armed_night
      sequence:
      - action: switch.turn_off
        target:
          entity_id:
          - switch.ranger_duo_fxd_detect
          - switch.ranger_duo_fxd_audio_detection
          - switch.ranger_duo_ptz_detect
          - switch.ranger_duo_ptz_audio_detection
          - switch.ranger_uno_detect
          - switch.ranger_uno_audio_detection
  mode: single

- id: frigate_detect_on_motion_when_home
  alias: "Frigate: enable detect on motion when armed night/disarmed"
  description: >-
    Temporarily re-enable a camera's detect+audio when its (always-on)
    motion sensor fires while armed night or disarmed.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.ranger_duo_fxd_motion
    - binary_sensor.ranger_duo_ptz_motion
    - binary_sensor.ranger_uno_motion
    to: "on"
  conditions:
  - condition: state
    entity_id: alarm_control_panel.vasudha_secure
    state:
    - disarmed
    - armed_night
  actions:
  - variables:
      cam: "{{ trigger.entity_id.split('.')[1] | regex_replace('_motion$', '') }}"
  - action: switch.turn_on
    target:
      entity_id:
      - "switch.{{ cam }}_detect"
      - "switch.{{ cam }}_audio_detection"
  mode: parallel

- id: frigate_detect_off_after_motion_when_home
  alias: "Frigate: disable detect after motion cooldown (home)"
  description: >-
    Turn a camera's detect+audio back off once its motion sensor has
    been clear for 5 minutes, while armed night or disarmed.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.ranger_duo_fxd_motion
    - binary_sensor.ranger_duo_ptz_motion
    - binary_sensor.ranger_uno_motion
    to: "off"
    for:
      minutes: 5
  conditions:
  - condition: state
    entity_id: alarm_control_panel.vasudha_secure
    state:
    - disarmed
    - armed_night
  actions:
  - variables:
      cam: "{{ trigger.entity_id.split('.')[1] | regex_replace('_motion$', '') }}"
  - action: switch.turn_off
    target:
      entity_id:
      - "switch.{{ cam }}_detect"
      - "switch.{{ cam }}_audio_detection"
  mode: parallel

- id: frigate_detect_resync_on_restart
  alias: "Frigate: resync detect/audio baseline after restart"
  description: >-
    Frigate's detect/audio switches are in-memory only (not persisted
    across process restarts — every reconnect republishes them ON from
    the static YAML config). Re-apply the alarm-state baseline as soon
    as Frigate reconnects to MQTT so a nix deploy or crash doesn't
    silently leave detection running while armed night/disarmed.
  triggers:
  - trigger: mqtt
    topic: frigate/available
    payload: online
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: alarm_control_panel.vasudha_secure
        state: armed_away
      sequence:
      - action: switch.turn_on
        target:
          entity_id:
          - switch.ranger_duo_fxd_detect
          - switch.ranger_duo_fxd_audio_detection
          - switch.ranger_duo_ptz_detect
          - switch.ranger_duo_ptz_audio_detection
          - switch.ranger_uno_detect
          - switch.ranger_uno_audio_detection
    - conditions:
      - condition: state
        entity_id: alarm_control_panel.vasudha_secure
        state:
        - disarmed
        - armed_night
      sequence:
      - action: switch.turn_off
        target:
          entity_id:
          - switch.ranger_duo_fxd_detect
          - switch.ranger_duo_fxd_audio_detection
          - switch.ranger_duo_ptz_detect
          - switch.ranger_duo_ptz_audio_detection
          - switch.ranger_uno_detect
          - switch.ranger_uno_audio_detection
  mode: single
