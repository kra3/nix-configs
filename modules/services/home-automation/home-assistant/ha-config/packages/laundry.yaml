# Washer and dryer cycle state from the plug power readings; "done" is remembered until emptied or the next start.
input_boolean:
  washer_unemptied:
    name: Washer waiting to be emptied
    icon: mdi:washing-machine-alert
  dryer_unemptied:
    name: Dryer waiting to be emptied
    icon: mdi:tumble-dryer

input_datetime:
  washer_cycle_start:
    name: Washer cycle start
    has_date: true
    has_time: true
  dryer_cycle_start:
    name: Dryer cycle start
    has_date: true
    has_time: true

input_number:
  washer_cycle_start_kwh:
    name: Washer energy at cycle start
    min: 0
    max: 1000000
    step: 0.001
    mode: box
  dryer_cycle_start_kwh:
    name: Dryer energy at cycle start
    min: 0
    max: 1000000
    step: 0.001
    mode: box
  laundry_gap_minutes:
    name: Washer to dryer wait
    min: 0
    max: 1440
    step: 1
    unit_of_measurement: min
    mode: box

counter:
  washer_care:
    name: Washes since drum clean
    icon: mdi:washing-machine-alert
  dryer_care:
    name: Dryer cycles since filter care
    icon: mdi:tumble-dryer

template:
  - binary_sensor:
      - name: "Washer Running"
        unique_id: washer_running
        device_class: running
        state: "{{ states('sensor.washer_power_monitor_power') | float > 10 }}"
        availability: "{{ is_number(states('sensor.washer_power_monitor_power')) }}"
        delay_on: "00:00:30"
        delay_off: "00:03:00"

      - name: "Dryer Running"
        unique_id: dryer_running
        device_class: running
        state: "{{ states('sensor.dryer_power_monitor_power') | float > 10 }}"
        availability: "{{ is_number(states('sensor.dryer_power_monitor_power')) }}"
        delay_on: "00:00:30"
        delay_off: "00:03:00"

  - sensor:
      - name: "Washer Status"
        unique_id: washer_status
        icon: mdi:washing-machine
        state: >-
          {% if is_state('binary_sensor.washer_running', 'on') %}Running
          {% elif is_state('input_boolean.washer_unemptied', 'on') %}Done
          {% elif is_number(states('sensor.washer_power_monitor_power')) %}Idle
          {% else %}Unknown{% endif %}

      - name: "Dryer Status"
        unique_id: dryer_status
        icon: mdi:tumble-dryer
        state: >-
          {% if is_state('binary_sensor.dryer_running', 'on') %}Running
          {% elif is_state('input_boolean.dryer_unemptied', 'on') %}Done
          {% elif is_number(states('sensor.dryer_power_monitor_power')) %}Idle
          {% else %}Unknown{% endif %}

  - trigger:
      - platform: state
        entity_id: binary_sensor.washer_running
        from: "on"
        to: "off"
    sensor:
      - name: "Washer Last Cycle"
        unique_id: washer_last_cycle
        device_class: timestamp
        state: "{{ (now() - timedelta(minutes=3)).isoformat() }}"
        attributes:
          cycles: >-
            {% set start = state_attr('input_datetime.washer_cycle_start', 'timestamp') | float(0) %}
            {% set end = as_timestamp(now()) - 180 %}
            {% set kwh = [states('sensor.washer_power_monitor_energy') | float(0) - states('input_number.washer_cycle_start_kwh') | float(0), 0] | max %}
            {% set e = {'start': start | timestamp_custom('%a %d %b %H:%M'), 'minutes': (((end - start) / 60) | round(0) | int) if start > 0 else 0, 'kwh': kwh | round(2), 'cost': (kwh * states('sensor.electricity_price_per_kwh') | float(0)) | round(2)} %}
            {{ ([e] + (state_attr('sensor.washer_last_cycle', 'cycles') or []))[:10] }}

  - trigger:
      - platform: state
        entity_id: binary_sensor.dryer_running
        from: "on"
        to: "off"
    sensor:
      - name: "Dryer Last Cycle"
        unique_id: dryer_last_cycle
        device_class: timestamp
        state: "{{ (now() - timedelta(minutes=3)).isoformat() }}"
        attributes:
          cycles: >-
            {% set start = state_attr('input_datetime.dryer_cycle_start', 'timestamp') | float(0) %}
            {% set end = as_timestamp(now()) - 180 %}
            {% set kwh = [states('sensor.dryer_power_monitor_energy') | float(0) - states('input_number.dryer_cycle_start_kwh') | float(0), 0] | max %}
            {% set e = {'start': start | timestamp_custom('%a %d %b %H:%M'), 'minutes': (((end - start) / 60) | round(0) | int) if start > 0 else 0, 'kwh': kwh | round(2), 'cost': (kwh * states('sensor.electricity_price_per_kwh') | float(0)) | round(2)} %}
            {{ ([e] + (state_attr('sensor.dryer_last_cycle', 'cycles') or []))[:10] }}
