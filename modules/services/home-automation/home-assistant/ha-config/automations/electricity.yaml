# ── Electricity price ───────────────────────────────────────────
- id: electricity_spot_remember
  alias: "Electricity: remember month average"
  description: Keeps the last E.ON month-average spot for the current month, so the month rollover can price the month that just ended.
  trigger:
    - platform: state
      entity_id: sensor.e_on_se4_month_average_spot
  condition:
    - condition: template
      value_template: >-
        {{ is_number(trigger.to_state.state)
           and trigger.to_state.attributes.Month is defined
           and trigger.to_state.attributes.Month[:7] == now().strftime('%Y-%m') }}
  action:
    - action: input_number.set_value
      target:
        entity_id: input_number.electricity_spot_last
      data:
        value: "{{ trigger.to_state.state }}"
  mode: queued

- id: electricity_month_rollover
  alias: "Electricity: month rollover"
  description: >-
    On the first run of a new month, stores last month's cost per device at the
    last seen month-average price. The first run after install only records the
    month.
  trigger:
    - platform: time
      at: "00:00:20"
    - platform: homeassistant
      event: start
  condition:
    - condition: template
      value_template: "{{ states('input_number.electricity_month_marker') | int(0) != now().month }}"
  action:
    - if:
        - condition: template
          value_template: "{{ states('input_number.electricity_month_marker') | int(0) != 0 }}"
      then:
        - variables:
            price: "{{ ((states('input_number.electricity_spot_last') | float(0) * 1.09 + 0.06 + 0.734 + 0.36) * 1.25) | round(4) }}"
        - repeat:
            for_each:
              - washer
              - dryer
              - sutala
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: "input_text.{{ repeat.item }}_cost_history"
                data:
                  value: >-
                    {% set kwh = state_attr('sensor.' ~ repeat.item ~ '_energy_month', 'last_period') | float(0) %}
                    {% set old = states('input_text.' ~ repeat.item ~ '_cost_history').split(',') | select('match', '^[0-9.]+$') | list %}
                    {{ ([(kwh * price) | round(2) | string] + old)[:12] | join(',') }}
    - action: input_number.set_value
      target:
        entity_id: input_number.electricity_month_marker
      data:
        value: "{{ now().month }}"
  mode: single
