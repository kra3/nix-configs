- type: sections
  title: System Health
  path: system-health
  icon: mdi:server
  cards: []
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Compute
      icon: mdi:cpu-64-bit
      heading_style: title
      badges:
      - type: entity
        entity: sensor.system_monitor_last_boot
    - type: custom:health-metric-card
      entity: sensor.system_monitor_processor_use
      name: CPU
      icon: mdi:cpu-64-bit
      color: "#ff9f6b"
      decimals: 0
      show_date: false
      chart:
        type: line
        days: 7
      delta:
        mode: range
        decimals: 0
      items:
      - entity: sensor.system_monitor_processor_temperature
        name: Temperature
        mode: now
        days: 7
        decimals: 0
        unit: "°C"
        color: "#ff7b7b"
      - entity: sensor.system_monitor_load_1m
        name: Load 1 min
        mode: now
        days: 7
        decimals: 2
        unit: ""
        color: "#c9a7e8"
      popup:
        graphs:
        - name: CPU use
          entities:
          - sensor.system_monitor_processor_use
          days: 7
        - name: Temperature
          entities:
          - sensor.system_monitor_processor_temperature
          days: 7
        - name: Load average
          entities:
          - entity: sensor.system_monitor_load_1m
            name: 1 min
          - entity: sensor.system_monitor_load_5m
            name: 5 min
          - entity: sensor.system_monitor_load_15m
            name: 15 min
          days: 7
      grid_options:
        columns: 12
  - type: grid
    cards:
    - type: heading
      heading: Memory and storage
      icon: mdi:memory
      heading_style: title
    - type: custom:health-metric-card
      entity: sensor.system_monitor_memory_usage
      name: Memory
      icon: mdi:memory
      color: "#6bb6ff"
      decimals: 0
      show_date: false
      chart:
        type: line
        days: 7
      delta:
        mode: range
        decimals: 0
      items:
      - entity: sensor.system_monitor_memory_use
        name: Used
        mode: now
        days: 7
        decimals: 1
        scale: 0.0009765625
        unit: GiB
        color: "#6bb6ff"
      - entity: sensor.system_monitor_swap_usage
        name: Swap
        mode: now
        days: 7
        decimals: 0
        color: "#9fa8ff"
      popup:
        graphs:
        - name: Memory use
          entities:
          - sensor.system_monitor_memory_usage
          days: 7
        - name: Swap use
          entities:
          - sensor.system_monitor_swap_usage
          days: 7
      grid_options:
        columns: 12
    - type: custom:health-metric-card
      entity: sensor.system_monitor_disk_usage
      name: Disk
      icon: mdi:harddisk
      color: "#8fd9c0"
      decimals: 0
      show_date: false
      chart:
        type: line
        days: 7
      delta:
        mode: range
        decimals: 0
      items:
      - entity: sensor.system_monitor_disk_use
        name: Used
        mode: now
        days: 7
        decimals: 0
        color: "#8fd9c0"
      - entity: sensor.system_monitor_disk_free
        name: Free
        mode: now
        days: 7
        decimals: 0
        color: "#8fd9c0"
      popup:
        graphs:
        - name: Disk use
          entities:
          - sensor.system_monitor_disk_usage
          days: 7
      grid_options:
        columns: 12
    - type: custom:health-metric-card
      entity: sensor.zfs_tank_used
      name: ZFS tank
      icon: mdi:database
      color: "#8fd9c0"
      decimals: 0
      show_date: false
      chart:
        type: line
        days: 30
      delta:
        mode: range
        decimals: 0
      items:
      - entity: sensor.zfs_rpool_used
        name: rpool used
        mode: now
        days: 7
        decimals: 0
        unit: "%"
      - entity: sensor.zfs_tank_fragmentation
        name: tank frag
        mode: now
        days: 7
        decimals: 0
        unit: "%"
      - entity: sensor.zfs_rpool_fragmentation
        name: rpool frag
        mode: now
        days: 7
        decimals: 0
        unit: "%"
      popup:
        graphs:
        - name: Pool usage
          entities:
          - entity: sensor.zfs_tank_used
            name: tank
          - entity: sensor.zfs_rpool_used
            name: rpool
          days: 30
        - name: Fragmentation
          entities:
          - entity: sensor.zfs_tank_fragmentation
            name: tank
          - entity: sensor.zfs_rpool_fragmentation
            name: rpool
          days: 30
      grid_options:
        columns: 12
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.zfs_pool_problem
        state: "on"
      card:
        type: tile
        entity: binary_sensor.zfs_pool_problem
        name: ZFS pool problem
      grid_options:
        columns: 12
  - type: grid
    cards:
    - type: heading
      heading: Power monitor
      icon: mdi:flash
      heading_style: title
    - type: custom:health-metric-card
      entity: sensor.power_monitor_1_power
      name: Power
      icon: mdi:flash
      color: "#ffd86b"
      decimals: 0
      show_date: false
      chart:
        type: line
        days: 7
      delta:
        mode: range
        decimals: 0
      items:
      - entity: sensor.power_monitor_1_voltage
        name: Voltage
        mode: now
        days: 7
        decimals: 0
        color: "#c9a7e8"
      - entity: sensor.power_monitor_1_current
        name: Current
        mode: now
        days: 7
        decimals: 2
        color: "#ff9f6b"
      popup:
        graphs:
        - name: Power
          entities:
          - sensor.power_monitor_1_power
          days: 7
        - name: Voltage
          entities:
          - sensor.power_monitor_1_voltage
          days: 7
        - name: Current
          entities:
          - sensor.power_monitor_1_current
          days: 7
      grid_options:
        columns: 12
    - type: custom:health-metric-card
      entity: sensor.power_monitor_1_energy
      name: Energy today
      icon: mdi:lightning-bolt
      color: "#ffd86b"
      decimals: 2
      hero_from: chart
      show_date: false
      chart:
        type: bar
        days: 14
        stat: change
      popup:
        graphs:
        - name: Energy per day
          entities:
          - sensor.power_monitor_1_energy
          days: 30
          stat: change
          type: bar
      grid_options:
        columns: 12
    - type: entities
      show_header_toggle: false
      entities:
      - entity: switch.power_monitor_1
        name: Power
      - entity: switch.power_monitor_1_child_lock
        name: Child lock
      - entity: select.power_monitor_1_power_on_behavior
        name: Power-on behavior
      grid_options:
        columns: 12
