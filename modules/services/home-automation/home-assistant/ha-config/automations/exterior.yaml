# ── Exterior lighting ─────────────────────────────────────────
- id: exterior_front_light
  alias: Exterior — Front street light (dusk to sleep)
  description: >-
    Turn on front street light at sunset, off at sleep schedule. Startup
    re-derives state in case an HA restart missed the sleep_started edge.
  triggers:
  - entity_id: sun.sun
    to: below_horizon
    trigger: state
    id: dusk
  - entity_id: schedule.sleep
    to: "on"
    trigger: state
    id: sleep_started
  - trigger: homeassistant
    event: start
    id: startup
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: dusk
      sequence:
      - target:
          entity_id: switch.front_entrance_double_switch_right
        action: switch.turn_on
    - conditions:
      - condition: trigger
        id: sleep_started
      sequence:
      - target:
          entity_id: switch.front_entrance_double_switch_right
        action: switch.turn_off
    - conditions:
      - condition: trigger
        id: startup
      - condition: state
        entity_id: schedule.sleep
        state: "on"
      sequence:
      - target:
          entity_id: switch.front_entrance_double_switch_right
        action: switch.turn_off
    - conditions:
      - condition: trigger
        id: startup
      - condition: state
        entity_id: schedule.sleep
        state: "off"
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      sequence:
      - target:
          entity_id: switch.front_entrance_double_switch_right
        action: switch.turn_on
  mode: single

- id: exterior_front_light_vibration
  alias: Exterior — Front street light on door vibration (sleep)
  description: Street light on door vibration during sleep hours for 5min, restarted by further vibration.
  triggers:
  - entity_id: binary_sensor.front_door_knock_vibration
    to: "on"
    trigger: state
  conditions:
  - condition: state
    entity_id: schedule.sleep
    state: "on"
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.front_entrance_double_switch_right
  - delay: "00:05:00"
  - action: switch.turn_off
    target:
      entity_id: switch.front_entrance_double_switch_right
  mode: restart
