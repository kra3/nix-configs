# ── Hall ───────────────────────────────────────────────────────
- id: hall_darkness
  alias: Hall — Darkness detection
  description: >-
    Dark while it is gloomy outside and the hall reads below 10 lux for 2 min.
  use_blueprint:
    path: local/darkness-detection.yaml
    input:
      illuminance_sensor: sensor.hall_illuminance_filtered
      occupancy_sensor: binary_sensor.hue_pir_hallway_occupancy
      light_entity: light.hallway_hall_lights
      dark_boolean: input_boolean.hall_is_dark
      dark_below: 10

- id: hall_lighting
  alias: Hall — Lighting
  description: >-
    45 % on motion, 80 % after 2 min, 15 % once clear 2 min; night light during
    sleep hours; off while nobody is home or the alarm is pending/triggered.
  use_blueprint:
    path: local/room-presence-lighting.yaml
    input:
      light_entity: light.hallway_hall_lights
      occupancy_sensor: binary_sensor.hue_pir_hallway_occupancy
      motion_sensor: binary_sensor.hue_pir_hallway_occupancy
      dark_boolean: input_boolean.hall_is_dark
      on_brightness: 45
      sustained_brightness: 80
      clear_brightness: 15
      off_when_away: true
      adaptive_lighting_switch: switch.home_adaptive_lighting_home
