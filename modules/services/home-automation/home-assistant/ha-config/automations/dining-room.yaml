# ── Dining room ────────────────────────────────────────────────
- id: dining_darkness
  alias: Dining room — Darkness detection
  description: >-
    Dark while it is gloomy outside (no local sensor).
  use_blueprint:
    path: local/darkness-detection.yaml
    input:
      occupancy_sensor: binary_sensor.dining_room_person_occupancy
      light_entity: light.dining_lights
      dark_boolean: input_boolean.dining_is_dark

- id: dining_room_lighting
  alias: Dining room — Lighting
  description: >-
    Presence + darkness via ranger_duo_ptz's Frigate person detection.
    Manual override via STYRBAR double-tap.
    On from dark until bedtime while someone is home, dimmed to 20% after 30 min without presence, off when nobody is home.
  use_blueprint:
    path: local/room-presence-lighting.yaml
    input:
      light_entity: light.dining_lights
      occupancy_sensor: binary_sensor.dining_room_person_occupancy
      motion_sensor: binary_sensor.room_presence_dining
      dark_boolean: input_boolean.dining_is_dark
      block_entity: binary_sensor.tv_watching
      evening_hold: true
      bedtime_off_after_minutes: 15
      night_off_after_minutes: 3
      bedtime_block_players:
        - media_player.lg_webos_tv_oled77c35la
        - media_player.home_theater_2
      bedtime_extra_clear_sensor: binary_sensor.living_room_occupancy_presence
      adaptive_lighting_switch: switch.home_adaptive_lighting_home

- id: dining_meal_boost
  alias: Dining room — Full brightness while seated
  description: >-
    Dining lights to 100 % while seated in the evening, unless a film is playing on the TV.
  use_blueprint:
    path: local/presence-brightness-boost.yaml
    input:
      light_entity: light.dining_lights
      presence_sensor: binary_sensor.room_presence_dining
      dark_boolean: input_boolean.dining_is_dark
      block_entity: binary_sensor.tv_watching
