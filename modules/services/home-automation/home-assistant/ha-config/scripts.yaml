notify_all_phones:
  alias: "Notify: all phones"
  description: >-
    Notifies the phones; critical (iOS critical alert, via mobile_app actions) goes to Arun only unless escalated.
  fields:
    title:
      required: false
      selector:
        text:
    message:
      required: true
      selector:
        text:
    critical:
      required: false
      default: false
      selector:
        boolean:
    escalated:
      required: false
      default: false
      selector:
        boolean:
  sequence:
  - if: "{{ critical | default(false) }}"
    then:
    - parallel:
      - &critical_push
        action: notify.mobile_app_meghanadha
        continue_on_error: true
        data:
          title: "{{ title | default(omit) }}"
          message: "{{ message }}"
          data:
            push:
              interruption-level: critical
              sound:
                name: default
                critical: 1
                volume: 1.0
      - <<: *critical_push
        action: notify.mobile_app_hiranyagarbha
    - if: "{{ escalated | default(false) }}"
      then:
      - <<: *critical_push
        action: notify.mobile_app_anjalis_iphone
    else:
    - action: notify.send_message
      target:
        entity_id:
        - notify.meghanadha
        - notify.anjalis_iphone
        - notify.hiranyagarbha
      data:
        title: "{{ title | default(omit) }}"
        message: "{{ message }}"
  mode: parallel

frigate_sync_detect_to_alarm_state:
  alias: "Frigate: sync detect/audio switches to alarm state"
  description: >-
    Shared by frigate_detect_gate_by_alarm (on alarm state change) and
    frigate_detect_resync_on_restart (on Frigate MQTT reconnect) so the
    armed_away/disarmed-or-armed_night switch lists only live in one place.
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: alarm_control_panel.vasudha_secure
        state: armed_away
      sequence:
      - action: switch.turn_on
        target:
          entity_id:
          - switch.ranger_duo_fxd_detect
          - switch.ranger_duo_ptz_detect
          - switch.ranger_uno_detect
          - switch.ranger_uno_audio_detection
      - if:
        - condition: not
          conditions:
          - condition: state
            entity_id: media_player.lg_webos_tv_oled77c35la
            state: playing
        then:
        - action: switch.turn_on
          target:
            entity_id:
            - switch.ranger_duo_fxd_audio_detection
            - switch.ranger_duo_ptz_audio_detection
    - conditions:
      - condition: state
        entity_id: alarm_control_panel.vasudha_secure
        state:
        - disarmed
        - armed_night
      sequence:
      - action: switch.turn_off
        target:
          entity_id:
          - switch.ranger_duo_fxd_detect
          - switch.ranger_duo_fxd_audio_detection
          - switch.ranger_duo_ptz_detect
          - switch.ranger_duo_ptz_audio_detection
          - switch.ranger_uno_detect
          - switch.ranger_uno_audio_detection

alarm_force_arm_night:
  alias: "Alarm: force arm night (bypass open sensors)"
  description: >-
    Arms night mode via alarmo.arm's force option, which auto-bypasses
    any currently-open sensor instead of refusing to arm.
  sequence:
  - action: alarmo.arm
    data:
      entity_id: alarm_control_panel.vasudha_secure
      mode: night
      force: true
      code: !secret alarm_code

alarm_force_arm_away:
  alias: "Alarm: force arm away (bypass open sensors)"
  description: >-
    Arms away mode via alarmo.arm's force option, which auto-bypasses
    any currently-open sensor instead of refusing to arm.
  sequence:
  - action: alarmo.arm
    data:
      entity_id: alarm_control_panel.vasudha_secure
      mode: away
      force: true
      code: !secret alarm_code

announce_hallway:
  alias: "Announce: hallway speaker"
  description: Speaks a message through the hallway camera speaker using local Piper TTS.
  fields:
    message:
      required: true
      selector:
        text:
  sequence:
  - action: rest_command.announce_hallway
    data:
      message: "{{ message }}"
  mode: queued

alarm_speakers_prepare:
  alias: "Alarm speakers: prepare"
  description: Saves the home theater state, then powers the receiver on in multi-channel stereo at 50 %.
  sequence:
  - if: "{{ states('input_text.alarm_speakers_restore') in ['', 'unknown'] }}"
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.alarm_speakers_restore
      data:
        value: >-
          {{ state_attr('media_player.ma_home_theater', 'volume_level') }}|{{ states('media_player.home_theater_2') }}|{{ state_attr('media_player.home_theater_2', 'source') }}|{{ state_attr('media_player.home_theater_2', 'sound_mode') }}
  - if: "{{ is_state('media_player.home_theater_2', 'off') }}"
    then:
    - action: media_player.turn_on
      target:
        entity_id: media_player.home_theater_2
    - wait_template: "{{ not is_state('media_player.home_theater_2', 'off') }}"
      timeout: "00:00:20"
      continue_on_timeout: true
  - action: media_player.select_sound_mode
    continue_on_error: true
    target:
      entity_id: media_player.home_theater_2
    data:
      sound_mode: MCH STEREO
  - action: media_player.volume_set
    continue_on_error: true
    target:
      entity_id: media_player.ma_home_theater
    data:
      volume_level: 0.5
  mode: restart

alarm_speakers_play:
  alias: "Alarm speakers: play"
  description: Plays a sound URL on the home theater (as set by prepare) and the kitchen at 65 %.
  fields:
    url:
      required: true
      selector:
        text:
  sequence:
  - parallel:
    - action: music_assistant.play_announcement
      continue_on_error: true
      target:
        entity_id: media_player.ma_home_theater
      data:
        url: "{{ url }}"
        use_pre_announce: false
    - action: music_assistant.play_announcement
      continue_on_error: true
      target:
        entity_id: media_player.kitchen
      data:
        url: "{{ url }}"
        use_pre_announce: false
        announce_volume: 65
  mode: parallel

alarm_speakers_restore:
  alias: "Alarm speakers: put back"
  description: Restores the home theater volume, sound mode, source and power from the saved state.
  sequence:
  - delay: "00:00:03"
  - variables:
      saved: "{{ states('input_text.alarm_speakers_restore').split('|') }}"
  - if: "{{ saved | count == 4 }}"
    then:
    - if: "{{ saved[0] not in ['None', ''] }}"
      then:
      - action: media_player.volume_set
        continue_on_error: true
        target:
          entity_id: media_player.ma_home_theater
        data:
          volume_level: "{{ saved[0] | float }}"
    - if: "{{ saved[1] == 'off' }}"
      then:
      - action: media_player.turn_off
        continue_on_error: true
        target:
          entity_id: media_player.home_theater_2
      else:
      - if: "{{ saved[3] not in ['None', ''] }}"
        then:
        - action: media_player.select_sound_mode
          continue_on_error: true
          target:
            entity_id: media_player.home_theater_2
          data:
            sound_mode: "{{ saved[3] }}"
      - if: "{{ saved[2] not in ['None', ''] }}"
        then:
        - action: media_player.select_source
          continue_on_error: true
          target:
            entity_id: media_player.home_theater_2
          data:
            source: "{{ saved[2] }}"
    - action: input_text.set_value
      target:
        entity_id: input_text.alarm_speakers_restore
      data:
        value: ""
  mode: single

lights_hand_back:
  alias: "Lights: hand back to Adaptive"
  description: Resets both room scenes to Auto and returns every light to Adaptive Lighting.
  sequence:
  - action: input_text.set_value
    target:
      entity_id:
      - input_text.living_scene
      - input_text.office_scene
    data:
      value: Auto
  - action: adaptive_lighting.set_manual_control
    target:
      entity_id: switch.home_adaptive_lighting_home
    data:
      manual_control: false
  - action: adaptive_lighting.apply
    target:
      entity_id: switch.home_adaptive_lighting_home
    data:
      turn_on_lights: false
  mode: single

lights_all_off:
  alias: "Lights: all off"
  description: Turns off every light and the Focus and Shelf light plugs.
  sequence:
  - action: light.turn_off
    target:
      entity_id: all
  - action: switch.turn_off
    target:
      entity_id:
      - switch.hue_light_switch_1
      - switch.hue_light_switch_2
  mode: single
