# ── Front Door Management ──────────────────────────────────────
- id: front_door_knock_announcements
  alias: "Front Door: Knock TTS & Notifications"
  description: >-
    On a double knock, notifies whoever's home and plays a chime on the
    hallway camera and kitchen speakers (or notifies everyone, if the house
    is empty).
  trigger:
    - platform: event
      event_type: front_door_knock
  action:
    - variables:
        anjali_home: "{{ is_state('person.anjalipc', 'home') }}"
        arun_home: "{{ is_state('person.arun_karunagath', 'home') }}"
        anyone_home: "{{ anjali_home or arun_home }}"

    # If someone home: notify present people and chime
    - if:
        - condition: template
          value_template: "{{ anyone_home }}"
      then:
        - if:
            - condition: template
              value_template: "{{ anjali_home }}"
          then:
            - action: notify.send_message
              target: { entity_id: notify.anjalis_iphone }
              data: { title: "Front Door", message: "Someone is knocking at the front door." }
        - if:
            - condition: template
              value_template: "{{ arun_home }}"
          then:
            - action: notify.send_message
              target: { entity_id: notify.meghanadha }
              data: { title: "Front Door", message: "Someone is knocking at the front door." }
        - parallel:
          - action: rest_command.chime_hallway
            continue_on_error: true
          - action: music_assistant.play_announcement
            continue_on_error: true
            target:
              entity_id: media_player.kitchen
            data:
              url: http://10.3.2.1:8098/chime.wav
              use_pre_announce: false
              announce_volume: 60

      # If no one home: notify all phones
      else:
        - action: script.notify_all_phones
          data: { title: "Front Door", message: "Someone is knocking at the front door." }
  mode: single
  max_exceeded: silent

- id: front_door_knock_detect
  alias: "Front Door: Knock detect"
  description: Fires front_door_knock on two short vibration pulses within 20s, ignoring door/lock activity and long pulses.
  trigger:
    - platform: state
      entity_id: binary_sensor.front_door_knock_vibration
      to: "on"
  action:
    - delay: "00:00:02"
    # Door closed, and not recently opened/closed/locked/unlocked
    - condition: state
      entity_id: binary_sensor.front_door_open
      state: "off"
    - condition: template
      value_template: "{{ (as_timestamp(now()) - as_timestamp(states.binary_sensor.front_door_open.last_changed)) > 15 }}"
    - condition: template
      value_template: "{{ (as_timestamp(now()) - as_timestamp(states.lock.front_door.last_changed | default(now()))) > 15 }}"
    - wait_for_trigger:
        - platform: state
          entity_id: binary_sensor.front_door_knock_vibration
          to: "off"
      timeout: "00:00:06"
      continue_on_timeout: false
    - wait_for_trigger:
        - platform: state
          entity_id: binary_sensor.front_door_knock_vibration
          to: "on"
      timeout: "00:00:20"
      continue_on_timeout: false
    - wait_for_trigger:
        - platform: state
          entity_id: binary_sensor.front_door_knock_vibration
          to: "off"
      timeout: "00:00:08"
      continue_on_timeout: false
    - event: front_door_knock
    - delay: "00:00:30"
  mode: single
  max_exceeded: silent

- id: front_door_knock_lights
  alias: "Front Door: Knock Lights"
  description: Entrance light on a double knock in the dark once hall motion follows; 5min timer, door open cancels.
  trigger:
    - platform: event
      event_type: front_door_knock
      id: knock
    - platform: state
      entity_id: binary_sensor.front_door_open
      to: "on"
      id: door_open
    - platform: event
      event_type: timer.finished
      event_data:
        entity_id: timer.front_door_knock_auto_off
      id: timer_finished
  action:
    - choose:
        - conditions:
            - condition: trigger
              id: knock
          sequence:
            - wait_for_trigger:
                - platform: state
                  entity_id: binary_sensor.hue_pir_hallway_occupancy
                  to: "on"
              timeout: "00:02:00"
            - if:
                - condition: template
                  value_template: "{{ wait.trigger is not none }}"
                - condition: state
                  entity_id: binary_sensor.front_door_area_dark
                  state: "on"
              then:
                - action: switch.turn_on
                  target:
                    entity_id: switch.front_entrance_double_switch_left
                - action: timer.start
                  target:
                    entity_id: timer.front_door_knock_auto_off
        - conditions:
            - condition: trigger
              id: door_open
          sequence:
            - action: timer.cancel
              target:
                entity_id: timer.front_door_knock_auto_off
        - conditions:
            - condition: trigger
              id: timer_finished
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.front_entrance_double_switch_left
  mode: restart

- id: front_door_open_entrance_light
  alias: "Front Door: Entrance light on open (dark)"
  description: >-
    Turns on entrance light when the front door opens in the dark; off
    via timer.front_door_entrance_light_off (5min after close,
    restart-safe). Falls back to unlock-as-open-proxy when BLE degraded.
  triggers:
  - entity_id: binary_sensor.front_door_open
    to: "on"
    trigger: state
    id: door_open
  - entity_id: binary_sensor.front_door_open
    to: "off"
    trigger: state
    id: door_close
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.front_door_entrance_light_off
    id: timer_finished
  - entity_id: lock.front_front_door_nw
    to: "unlocked"
    trigger: state
    id: unlock_fallback
  actions:
  - choose:
      - conditions:
          - condition: trigger
            id: door_open
          - condition: state
            entity_id: binary_sensor.front_door_area_dark
            state: "on"
        sequence:
          - action: timer.cancel
            target:
              entity_id: timer.front_door_entrance_light_off
          - action: switch.turn_on
            target:
              entity_id: switch.front_entrance_double_switch_left
      - conditions:
          - condition: trigger
            id: unlock_fallback
          - condition: state
            entity_id: binary_sensor.front_door_ble_degraded
            state: "on"
          - condition: state
            entity_id: binary_sensor.front_door_area_dark
            state: "on"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.front_entrance_double_switch_left
          - action: timer.start
            target:
              entity_id: timer.front_door_entrance_light_off
      - conditions:
          - condition: trigger
            id: door_close
          - condition: state
            entity_id: switch.front_entrance_double_switch_left
            state: "on"
        sequence:
          - action: timer.start
            target:
              entity_id: timer.front_door_entrance_light_off
      - conditions:
          - condition: trigger
            id: timer_finished
        sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.front_entrance_double_switch_left
  mode: restart
