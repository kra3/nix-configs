# ── Sleep routine ──────────────────────────────────────────────
- id: sleep_tv_off
  alias: Sleep — TV off if idle
  description: >-
    Turn off TV when sleep schedule starts, but only if nobody
    is actively watching (not playing).
  triggers:
  - entity_id: schedule.sleep
    to: "on"
    trigger: state
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: media_player.lg_webos_tv_oled77c35la
      state: playing
  actions:
  - action: media_player.turn_off
    target:
      entity_id: media_player.lg_webos_tv_oled77c35la
  mode: single

- id: sleep_alarmo_arm_home
  alias: Sleep — Arm Alarmo (home)
  description: >-
    Arm Alarmo in home mode when sleep schedule starts.
  triggers:
  - entity_id: schedule.sleep
    to: "on"
    trigger: state
  actions:
  - action: alarm_control_panel.alarm_arm_home
    target:
      entity_id: alarm_control_panel.vasudha_secure
  mode: single

# ── Wake-up ────────────────────────────────────────────────────
- id: wakeup_lighting
  alias: Wake-up — Gradual lighting
  description: >-
    When sleep schedule ends, gradually brighten bedroom and hall
    over 10 minutes. Disarm Alarmo.
  triggers:
  - entity_id: schedule.sleep
    to: "off"
    trigger: state
  actions:
  - action: alarm_control_panel.alarm_disarm
    target:
      entity_id: alarm_control_panel.vasudha_secure
  - target:
      entity_id:
      - light.bedroom_wardrobe_lights
      - light.hall
    data:
      brightness_pct: 5
      transition: 1
    action: light.turn_on
  - delay: "00:02:00"
  - target:
      entity_id:
      - light.bedroom_wardrobe_lights
      - light.hall
    data:
      brightness_pct: 15
      transition: 60
    action: light.turn_on
  - delay: "00:03:00"
  - target:
      entity_id:
      - light.bedroom_wardrobe_lights
      - light.hall
    data:
      brightness_pct: 40
      transition: 60
    action: light.turn_on
  - delay: "00:05:00"
  - target:
      entity_id:
      - light.bedroom_wardrobe_lights
      - light.hall
    data:
      brightness_pct: 60
      transition: 60
    action: light.turn_on
  mode: single

# ── Exterior lighting ─────────────────────────────────────────
- id: exterior_front_light
  alias: Exterior — Front street light (dusk to sleep)
  description: >-
    Turn on front street light at sunset, off at sleep schedule.
  triggers:
  - entity_id: sun.sun
    to: below_horizon
    trigger: state
    id: dusk
  - entity_id: schedule.sleep
    to: "on"
    trigger: state
    id: sleep_started
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: dusk
      sequence:
      - target:
          entity_id: switch.front_entrance_double_switch_right
        action: switch.turn_on
    - conditions:
      - condition: trigger
        id: sleep_started
      sequence:
      - target:
          entity_id: switch.front_entrance_double_switch_right
        action: switch.turn_off
  mode: single

