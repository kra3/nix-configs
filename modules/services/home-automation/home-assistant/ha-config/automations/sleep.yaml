# ── Sleep routine ──────────────────────────────────────────────
- id: sleep_tv_off
  alias: Sleep — TV off if idle
  description: >-
    Turn off TV when sleep schedule starts, but only if it hasn't been
    playing anything for the last 15 minutes (a momentary non-playing
    state, e.g. between episodes, shouldn't trigger a shutdown).
  triggers:
  - entity_id: schedule.sleep
    to: "on"
    trigger: state
  conditions:
  - condition: template
    value_template: >-
      {{ states('media_player.lg_webos_tv_oled77c35la') != 'playing'
         and now() - states.media_player.lg_webos_tv_oled77c35la.last_changed
             >= timedelta(minutes=15) }}
  actions:
  - action: media_player.turn_off
    target:
      entity_id: media_player.lg_webos_tv_oled77c35la
  mode: single

- id: sleep_alarmo_arm_home
  alias: Sleep — Arm Alarmo (night)
  description: Arms night at bedtime if disarmed; on refusal a critical alert to Arun and the hallway speaker, escalated after 10 min.
  triggers:
  - entity_id: schedule.sleep
    to: "on"
    trigger: state
  conditions:
  - condition: state
    entity_id: alarm_control_panel.vasudha_secure
    state: disarmed
  actions:
  - action: alarm_control_panel.alarm_arm_night
    target:
      entity_id: alarm_control_panel.vasudha_secure
    data:
      code: !secret alarm_code
  - delay: "00:00:05"
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: alarm_control_panel.vasudha_secure
        state: armed_night
    then:
    - action: script.notify_all_phones
      data:
        title: Alarm not armed
        critical: true
        message: >-
          Couldn't arm for the night — still open:
          {{ state_attr('binary_sensor.house_exits_open_status', 'open_names') }}.
          Force-arm from the dashboard if needed.
    - action: script.announce_hallway
      continue_on_error: true
      data:
        message: >-
          Alarm not armed. Still open:
          {{ state_attr('binary_sensor.house_exits_open_status', 'open_names') | replace('(', '') | replace(')', '') }}.
    - action: timer.start
      target:
        entity_id: timer.alarm_arm_escalation
  mode: single

# ── Wake-up ────────────────────────────────────────────────────
- id: sleep_alarmo_disarm_morning
  alias: Sleep — Disarm Alarmo (morning)
  description: >-
    Disarms Alarmo when the sleep schedule ends (or on HA startup if it
    ended while still armed_night), only if someone's home.
  triggers:
  - id: schedule_off
    entity_id: schedule.sleep
    to: "off"
    trigger: state
  - id: startup
    trigger: homeassistant
    event: start
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: person.arun_karunagath
      state: home
    - condition: state
      entity_id: person.anjalipc
      state: home
  - condition: or
    conditions:
    - condition: trigger
      id: schedule_off
    - condition: and
      conditions:
      - condition: trigger
        id: startup
      - condition: state
        entity_id: schedule.sleep
        state: "off"
      - condition: state
        entity_id: alarm_control_panel.vasudha_secure
        state: armed_night
  actions:
  - action: alarm_control_panel.alarm_disarm
    target:
      entity_id: alarm_control_panel.vasudha_secure
    data:
      code: !secret alarm_code
  mode: single

- id: wakeup_lighting
  alias: Wake-up — Gradual lighting
  description: >-
    When sleep schedule ends, ramps bedroom+hall lights 5%→15%→40%→60%
    over 10 minutes.
  triggers:
  - entity_id: schedule.sleep
    to: "off"
    # skips the 23:59:59 midnight split
    for: "00:00:30"
    trigger: state
  actions:
  - target:
      entity_id:
      - light.bedroom_wardrobe_lights
      - light.hallway_hall_lights
    data:
      brightness_pct: 5
      transition: 1
    action: light.turn_on
  - delay: "00:02:00"
  - target:
      entity_id:
      - light.bedroom_wardrobe_lights
      - light.hallway_hall_lights
    data:
      brightness_pct: 15
      transition: 60
    action: light.turn_on
  - delay: "00:03:00"
  - target:
      entity_id:
      - light.bedroom_wardrobe_lights
      - light.hallway_hall_lights
    data:
      brightness_pct: 40
      transition: 60
    action: light.turn_on
  - delay: "00:05:00"
  - target:
      entity_id:
      - light.bedroom_wardrobe_lights
      - light.hallway_hall_lights
    data:
      brightness_pct: 60
      transition: 60
    action: light.turn_on
  mode: restart
