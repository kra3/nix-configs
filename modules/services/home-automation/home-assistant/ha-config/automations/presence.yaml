# ── Presence notifications ─────────────────────────────────────
# Replaces the core notify_leaving_zone blueprint, which addresses the
# phone by device_id and resolves the notify call through the same
# legacy mobile_app service-name path that broke everything else in
# this file — entity targeting sidesteps both problems.
- id: person_left_home
  alias: "Presence: tell the other resident someone left"
  description: Notify the other resident when Arun or Anjali leaves home.
  triggers:
  - entity_id: [person.arun_karunagath, person.anjalipc]
    from: home
    trigger: state
  actions:
  - action: script.notify
    data:
      to:
      - "{{ 'person.anjalipc' if trigger.entity_id == 'person.arun_karunagath' else 'person.arun_karunagath' }}"
      message: "{{ state_attr(trigger.entity_id, 'friendly_name') }} has left Home"
  mode: queued

# ── Battery ────────────────────────────────────────────────────
- id: '1733595301092'
  alias: Low Battery Notifications & Actions
  description: >-
    Blackshome blueprint: notifies (persistent + push) on low-battery
    devices, evening-scheduled.
  use_blueprint:
    path: Blackshome/low-battery-notifications-and-actions.yaml
    input:
      include_time: time_disabled
      time: '20:10:00'
      include_persistent_notification: enable_persistent_notification
      include_easy_notify: enable_easy_notify
      notify_device:
      - 7d2ced08f79e7e4330780e78d679c86a
      - b5b637523ec9028be8de65b52f617c0d
      include_button: disable_button_trigger

# ── Away mode ──────────────────────────────────────────────────
- id: everyone_left_home
  alias: Everyone left home
  description: >-
    When the last tracked person leaves, starts a 5min confirm timer
    (timer.everyone_left_home_confirm, restart-safe); when it finishes with
    nobody home it fires the everyone_left event, which
    alarm_arm_away_when_everyone_left and modes_end_when_everyone_left act on.
  triggers:
  - trigger: numeric_state
    entity_id: zone.home
    below: 1
    id: left
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.everyone_left_home_confirm
    id: timer_finished
  conditions:
  - condition: numeric_state
    entity_id: zone.home
    below: 1
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: left
      sequence:
      - action: timer.start
        target:
          entity_id: timer.everyone_left_home_confirm
    - conditions:
      - condition: trigger
        id: timer_finished
      sequence:
      - event: everyone_left
  mode: restart
