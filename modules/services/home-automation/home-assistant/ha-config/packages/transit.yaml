input_boolean:
  transit_hide_slower:
    name: Hide slower trips
    icon: mdi:filter-outline

input_select:
  transit_max_changes:
    name: Max changes
    icon: mdi:swap-horizontal
    options:
    - Any
    - At most 2
    - At most 1
    - None
  transit_modes:
    name: Travel by
    icon: mdi:train-bus
    options:
    - All
    - Trains
    - Buses and trams
  transit_walking:
    name: Max walking
    icon: mdi:walk
    options:
    - Up to 1 km
    - Up to 2 km
    - Up to 500 m

template:
- trigger:
  - trigger: event
    event_type: transit_trips
    event_data:
      person: person.arun_karunagath
  sensor:
  - name: Arun trips
    unique_id: transit_trips_arun
    icon: mdi:train-bus
    device_class: timestamp
    state: "{{ now().isoformat() }}"
    attributes: &trip_attributes
      ok: "{{ trigger.event.data.ok }}"
      origin: "{{ trigger.event.data.origin }}"
      destination: "{{ trigger.event.data.destination }}"
      trips: "{{ trigger.event.data.trips }}"
- trigger:
  - trigger: event
    event_type: transit_trips
    event_data:
      person: person.anjalipc
  sensor:
  - name: Anjali trips
    unique_id: transit_trips_anjali
    icon: mdi:train-bus
    device_class: timestamp
    state: "{{ now().isoformat() }}"
    attributes: *trip_attributes
