# ── Office ───────────────────────────────────────────────────────
- id: light_scene_office
  alias: "Lights: office scene"
  description: >-
    Applies the chosen scene to the office light and keeps Adaptive Lighting
    from overwriting it; Auto hands the light back to Adaptive Lighting.
  triggers:
  - trigger: state
    entity_id: input_text.office_scene
  conditions:
  - condition: template
    value_template: "{{ trigger.from_state.state not in ['unavailable', 'unknown'] }}"
  variables:
    scene: "{{ trigger.to_state.state }}"
    bulbs:
    - light.office_room_light
  actions:
  - choose:
    - conditions: "{{ scene == 'Auto' }}"
      sequence:
      - action: adaptive_lighting.set_manual_control
        target:
          entity_id: switch.home_adaptive_lighting_home
        data:
          lights: "{{ bulbs }}"
          manual_control: false
      - action: adaptive_lighting.apply
        target:
          entity_id: switch.home_adaptive_lighting_home
        data:
          lights: "{{ bulbs }}"
          turn_on_lights: false
    - conditions: "{{ scene | regex_match('^[0-9a-f-]{36}$') }}"
      sequence:
      - action: adaptive_lighting.set_manual_control
        target:
          entity_id: switch.home_adaptive_lighting_home
        data:
          lights: "{{ bulbs }}"
          manual_control: true
      - action: scene_presets.apply_preset
        data:
          preset_id: "{{ scene }}"
          targets:
            entity_id: "{{ bulbs }}"
          transition: 2
  mode: queued
