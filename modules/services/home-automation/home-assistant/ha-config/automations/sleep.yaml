# ── Sleep routine ──────────────────────────────────────────────
- id: sleep_tv_off
  alias: Sleep — TV off if idle
  description: >-
    Turn off TV when sleep schedule starts, but only if it hasn't been
    playing anything for the last 15 minutes (a momentary non-playing
    state, e.g. between episodes, shouldn't trigger a shutdown).
    Skipped during party mode; catches up when it ends.
  triggers:
  - entity_id: schedule.sleep
    to: "on"
    trigger: state
    id: sleep_start
  - trigger: event
    event_type: modes_ended
    id: resumed
  conditions:
  - condition: state
    entity_id: input_boolean.party_mode
    state: "off"
  - condition: state
    entity_id: schedule.sleep
    state: "on"
  - condition: template
    value_template: >-
      {{ states('media_player.lg_webos_tv_oled77c35la') not in ['playing', 'off']
         and (trigger.id == 'resumed'
              or now() - states.media_player.lg_webos_tv_oled77c35la.last_changed
                 >= timedelta(minutes=15)) }}
  actions:
  - action: media_player.turn_off
    target:
      entity_id: media_player.lg_webos_tv_oled77c35la
  mode: single

- id: sleep_alarmo_arm_home
  alias: Sleep — Arm Alarmo (night)
  description: Arms night at bedtime if disarmed; on refusal a critical alert to Arun and speech in the occupied rooms, escalated after 10 min. Skipped during party mode; catches up when it ends.
  triggers:
  - entity_id: schedule.sleep
    to: "on"
    trigger: state
  - trigger: event
    event_type: modes_ended
  conditions:
  - condition: numeric_state
    entity_id: zone.home
    above: 0
  - condition: state
    entity_id: input_boolean.party_mode
    state: "off"
  - condition: state
    entity_id: schedule.sleep
    state: "on"
  - condition: state
    entity_id: alarm_control_panel.vasudha_secure
    state: disarmed
  actions:
  - action: alarm_control_panel.alarm_arm_night
    target:
      entity_id: alarm_control_panel.vasudha_secure
    data:
      code: !secret alarm_code
  - delay: "00:00:05"
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: alarm_control_panel.vasudha_secure
        state: armed_night
    then:
    - action: script.notify_all_phones
      data:
        title: Alarm not armed
        critical: true
        message: >-
          Couldn't arm for the night — still open:
          {{ state_attr('binary_sensor.house_exits_open_status', 'open_names') }}.
          Force-arm from the dashboard if needed.
    - variables:
        spoken: >-
          Alarm not armed. These are still open.
          {{ (state_attr('binary_sensor.house_exits_open_status', 'open_names') | replace(' (L)', ' left') | replace(' (R)', ' right') | replace(', ', '. ')) ~ '.' }}
    - action: script.announce_home
      continue_on_error: true
      data:
        message: "{{ spoken }}"
    - action: timer.start
      target:
        entity_id: timer.alarm_arm_escalation
  mode: single

# ── Wake-up ────────────────────────────────────────────────────
- id: sleep_alarmo_disarm_morning
  alias: Sleep — Disarm Alarmo (morning)
  description: >-
    Disarms armed_night when the sleep schedule ends (or on startup or
    when party or manual mode ends, if it ended meanwhile), only if someone's
    home.
  triggers:
  - entity_id: schedule.sleep
    to: "off"
    trigger: state
  - trigger: homeassistant
    event: start
  - trigger: event
    event_type: modes_ended
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: person.arun_karunagath
      state: home
    - condition: state
      entity_id: person.anjalipc
      state: home
  - condition: state
    entity_id: schedule.sleep
    state: "off"
  - condition: state
    entity_id: alarm_control_panel.vasudha_secure
    state: armed_night
  actions:
  - action: alarm_control_panel.alarm_disarm
    target:
      entity_id: alarm_control_panel.vasudha_secure
    data:
      code: !secret alarm_code
  mode: single

- id: wakeup_lighting
  alias: Wake-up — Gradual lighting
  description: >-
    Ramps the bedroom light 5%→100% over the 15 minutes before the sleep
    schedule ends, warming 2000K→3500K like a sunrise. Then hands the light
    back to Adaptive Lighting and keeps it on if the room is dark, else turns
    it off.
  triggers:
  - trigger: template
    # next_event is the end of the current on-block; hours 1-11 skip the midnight split (00:00 local)
    value_template: >-
      {% set n = state_attr('schedule.sleep', 'next_event') %}
      {{ is_state('schedule.sleep', 'on') and n is not none
         and 1 <= as_local(n).hour < 12
         and (n - now()).total_seconds() <= 900 }}
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: alarm_control_panel.vasudha_secure
      state:
      - armed_away
      - armed_vacation
  actions:
  # Adaptive Lighting would otherwise reset the ramp to its own brightness.
  - action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.home_adaptive_lighting_home
      lights: light.bedroom_wardrobe_lights
      manual_control: true
  - target:
      entity_id: light.bedroom_wardrobe_lights
    data:
      brightness_pct: 5
      color_temp_kelvin: 2000
      transition: 1
    action: light.turn_on
  - delay: "00:03:00"
  - target:
      entity_id: light.bedroom_wardrobe_lights
    data:
      brightness_pct: 15
      color_temp_kelvin: 2200
      transition: 60
    action: light.turn_on
  - delay: "00:04:00"
  - target:
      entity_id: light.bedroom_wardrobe_lights
    data:
      brightness_pct: 40
      color_temp_kelvin: 2700
      transition: 60
    action: light.turn_on
  - delay: "00:04:00"
  - target:
      entity_id: light.bedroom_wardrobe_lights
    data:
      brightness_pct: 70
      color_temp_kelvin: 3200
      transition: 60
    action: light.turn_on
  - delay: "00:03:00"
  - target:
      entity_id: light.bedroom_wardrobe_lights
    data:
      brightness_pct: 100
      color_temp_kelvin: 3500
      transition: 60
    action: light.turn_on
  - delay: "00:01:00"
  - action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.home_adaptive_lighting_home
      lights: light.bedroom_wardrobe_lights
      manual_control: false
  - if:
    - condition: state
      entity_id: input_boolean.bedroom_is_dark
      state: "on"
    then:
    - action: adaptive_lighting.apply
      data:
        entity_id: switch.home_adaptive_lighting_home
        lights: light.bedroom_wardrobe_lights
        turn_on_lights: false
    else:
    - action: light.turn_off
      target:
        entity_id: light.bedroom_wardrobe_lights
  mode: restart
