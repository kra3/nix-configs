type: sections
title: Lights
path: dash-lights
icon: mdi:lightbulb-group
max_columns: 2
sections:
- type: grid
  column_span: 2
  cards:
  - type: custom:mode-switch-card
    name: House mode
    grid_options:
      columns: full
    modes:
    - name: Automatic
      icon: mdi:home-automation
      hint: Lights, TV and doors react by themselves.
    - name: Party
      icon: mdi:party-popper
      entity: input_boolean.party_mode
      hint: Room lights stay as you set them and bedtime waits until the party ends. Ends at wake-up or when everyone leaves.
    - name: Paused
      icon: mdi:pause-circle
      entity: input_boolean.automations_paused
      tone: warning
      confirm: Pause the lighting, TV, door and bedtime automations (this includes arming the alarm at night)?
      hint: Lighting, Adaptive Lighting, TV, door and bedtime automations are off, including arming the alarm at night. Ends at wake-up or when everyone leaves.
- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Floor plan
    icon: mdi:floor-plan
    heading_style: title
  - type: custom:streamline-card
    template: floor_plan
    variables:
      layer: lights
    grid_options:
      columns: full
- type: grid
  column_span: 1
  cards:
  - type: heading
    heading: Why lights are on
    icon: mdi:lightbulb-question
    heading_style: title
  - type: custom:light-logic-card
    outside:
      gloomy: binary_sensor.gloomy_outside
      fraction: sensor.daylight_fraction
      reference: sensor.daylight_reference_5_min
      peak: sensor.daylight_peak_24h
      sun: sun.sun
      gloomy_below_day: input_number.daylight_gloomy_below_day
      gloomy_below_evening: input_number.daylight_gloomy_below_evening
      clear_above: input_number.daylight_clear_above
      evening_rule: binary_sensor.daylight_evening_rule
      evening_offset: input_number.daylight_evening_offset
    house:
      paused: input_boolean.automations_paused
      party: input_boolean.party_mode
      sleep: schedule.sleep
      alarm: alarm_control_panel.vasudha_secure
      home: binary_sensor.anyone_home
      adaptive: switch.home_adaptive_lighting_home
    rooms:
    - name: Living
      light: light.living_room_lights
      dark: input_boolean.living_room_is_dark
      occupancy: binary_sensor.living_room_occupancy_presence
      lux: sensor.living_room_occupancy_illuminance
      threshold: input_number.living_room_dark_below
      block: binary_sensor.tv_watching
      evening_hold: true
    - name: Dining
      light: light.dining_lights
      dark: input_boolean.dining_is_dark
      occupancy: binary_sensor.dining_room_person_occupancy
      block: binary_sensor.tv_watching
      evening_hold: true
    - name: Kitchen
      light: light.kitchen_lights
      dark: input_boolean.kitchen_is_dark
      occupancy: binary_sensor.hue_pir_kitchen_occupancy
      lux: sensor.kitchen_illuminance_filtered
      threshold: input_number.kitchen_dark_below
      hint: "Off 2 min after motion stops; 5 min from 17:00 to 21:00 or once someone has been there 7 min"
    - name: Bedroom
      light: light.bedroom_wardrobe_lights
      dark: input_boolean.bedroom_is_dark
      occupancy: binary_sensor.bedroom_occupancy_presence
      lux: sensor.bedroom_occupancy_illuminance
      threshold: input_number.bedroom_dark_below
      hint: "Turns off 10 min after the room clears while it is dark; ignores motion in sleep hours and naps"
      nap: input_boolean.bedroom_nap
      sleep_off: true
    - name: Office
      light: light.office_room_light
      dark: input_boolean.office_is_dark
      occupancy: binary_sensor.room_presence_office
    - name: Hall
      light: light.hallway_hall_lights
      dark: input_boolean.hall_is_dark
      occupancy: binary_sensor.hue_pir_hallway_occupancy
      lux: sensor.hall_illuminance_filtered
      threshold: input_number.hall_dark_below
      away_off: true
      hint: "45 % on motion, 80 % after 2 min, 15 % once clear for 2 min; night light in sleep hours; off when nobody is home"
    grid_options:
      columns: full
- type: grid
  column_span: 1
  cards:
  - type: heading
    heading: Rooms
    icon: mdi:lightbulb-group
    heading_style: title
  - type: conditional
    conditions:
    - condition: state
      entity: binary_sensor.lights_any_on
      state: "on"
    card:
      type: tile
      entity: sensor.lights_summary
      name: All lights off
      icon: mdi:lightbulb-off
      state_content: state
      tap_action:
        action: perform-action
        perform_action: script.lights_all_off
    grid_options:
      columns: full
  - type: conditional
    conditions:
    - condition: state
      entity: binary_sensor.lights_in_manual_control
      state: "on"
    card:
      type: tile
      entity: script.lights_hand_back
      name: Hand back to Adaptive
      icon: mdi:theme-light-dark
      hide_state: true
      tap_action:
        action: toggle
    grid_options:
      columns: full
  - type: grid
    columns: 2
    square: false
    grid_options:
      columns: full
    cards:
    - type: custom:mushroom-light-card
      entity: light.dining_lights
      name: Dining Room
      fill_container: true
      use_light_color: true
      show_brightness_control: true
      collapsible_controls: true
      tap_action:
        action: more-info
      hold_action:
        action: toggle
    - type: custom:mushroom-light-card
      entity: light.living_room_lights
      name: Living Room
      fill_container: true
      use_light_color: true
      show_brightness_control: true
      show_color_temp_control: true
      show_color_control: true
      collapsible_controls: true
      tap_action:
        action: more-info
      hold_action:
        action: toggle
    - type: custom:mushroom-light-card
      entity: light.bedroom_wardrobe_lights
      name: Wardrobe
      fill_container: true
      use_light_color: true
      show_brightness_control: true
      collapsible_controls: true
      tap_action:
        action: more-info
      hold_action:
        action: toggle
    - type: custom:mushroom-light-card
      entity: light.kitchen_dining_lights
      name: Kitchen Dining
      fill_container: true
      use_light_color: true
      show_brightness_control: true
      collapsible_controls: true
      tap_action:
        action: more-info
      hold_action:
        action: toggle
    - type: custom:mushroom-light-card
      entity: light.kitchen_lights
      name: Kitchen
      fill_container: true
      use_light_color: true
      show_brightness_control: true
      show_color_temp_control: true
      collapsible_controls: true
      tap_action:
        action: more-info
      hold_action:
        action: toggle
    - type: custom:mushroom-light-card
      entity: light.office_room_light
      name: Office
      icon: mdi:ceiling-light
      fill_container: true
      use_light_color: true
      show_brightness_control: true
      show_color_temp_control: true
      show_color_control: true
      collapsible_controls: true
      tap_action:
        action: more-info
      hold_action:
        action: toggle
    - type: custom:mushroom-light-card
      entity: light.hallway_hall_lights
      name: Hall
      fill_container: true
      use_light_color: true
      show_brightness_control: true
      collapsible_controls: true
      tap_action:
        action: more-info
      hold_action:
        action: toggle
    - type: custom:mushroom-entity-card
      entity: switch.front_entrance_double_switch_left
      name: Entrance
      icon: mdi:ceiling-light
      fill_container: true
      icon_color: orange
      primary_info: name
      secondary_info: state
      tap_action:
        action: toggle
  - type: heading
    heading: Accessories
    heading_style: subtitle
  - type: grid
    columns: 3
    square: false
    grid_options:
      columns: full
    cards:
    - type: custom:mushroom-entity-card
      entity: light.tv_backlight
      name: TV Backlight
      layout: vertical
      fill_container: true
      icon_color: orange
      primary_info: name
      secondary_info: state
    - type: custom:mushroom-entity-card
      entity: switch.hue_light_switch_1
      name: Focus light
      icon: mdi:lamp
      layout: vertical
      fill_container: true
      icon_color: orange
      primary_info: name
      secondary_info: state
    - type: custom:mushroom-entity-card
      entity: switch.hue_light_switch_2
      name: Shelf lights
      icon: mdi:led-strip-variant
      layout: vertical
      fill_container: true
      icon_color: orange
      primary_info: name
      secondary_info: state
  - type: heading
    heading: Outdoor
    heading_style: subtitle
  - type: custom:mushroom-entity-card
    entity: switch.front_entrance_double_switch_right
    name: Street Light
    icon: mdi:coach-lamp
    icon_color: orange
    primary_info: name
    secondary_info: state
    tap_action:
      action: toggle
    grid_options:
      columns: full
- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Scenes
    heading_style: subtitle
  - type: custom:scene-picker-card
    rooms:
    - name: Living Room
      entity: input_text.living_scene
    - name: Office
      entity: input_text.office_scene
    toggles_label: Whole house
    toggles:
    - entity: switch.home_adaptive_lighting_home
      name: Adaptive colour
      icon: mdi:theme-light-dark
      hints:
        "on": Warm and dim in the evening, bright and cool by day
        "off": Lights stay exactly as you set them
    - entity: switch.adaptive_lighting_home_adaptive_lighting_sleep_mode_home
      name: Sleep lighting
      icon: mdi:sleep
      hints:
        "on": Very dim and warm, for night walks
        "off": Switches on by itself at bedtime
    grid_options:
      columns: full
