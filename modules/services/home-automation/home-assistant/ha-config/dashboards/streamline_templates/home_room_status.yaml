default:
- comfort: ""
card:
  type: custom:mushroom-chips-card
  alignment: end
  chips:
  - type: template
    icon: >-
      {{ {'Cool':'mdi:snowflake','Cold':'mdi:snowflake','Warm':'mdi:fire','Hot':'mdi:fire','Humid':'mdi:water','Dry':'mdi:water-off'}.get(states('[[comfort]]'), '') }}
    content: >-
      {{ states('[[comfort]]') if states('[[comfort]]') in ['Cool', 'Cold', 'Warm', 'Hot', 'Humid', 'Dry'] else '' }}
    icon_color: >-
      {{ {'Cool':'blue','Cold':'blue','Warm':'orange','Hot':'red','Humid':'orange','Dry':'orange'}.get(states('[[comfort]]'), 'disabled') }}
  - type: template
    icon: "{{ 'mdi:account' if is_state('[[presence]]', 'on') else '' }}"
    icon_color: primary
  card_mod:
    style: |
      :host(streamline-card) {
        display: flex;
        justify-content: flex-end;
        height: 0;
        overflow: visible;
        padding: 0 12px;
        box-sizing: border-box;
        width: 100%;
        position: relative;
        z-index: 1;
        --mush-chip-background: transparent;
        --mush-chip-border-width: 0;
        --mush-chip-box-shadow: none;
        --mush-chip-height: 20px;
        --mush-chip-padding: 0;
        --mush-chip-spacing: 8px;
        --mush-chip-font-size: 12px;
        --mush-chip-font-weight: 500;
        --mush-chip-icon-size: 16px;
      }
      ha-card { background: none; border: none; box-shadow: none; top: 12px; }
      .chip-container { flex-direction: column !important; align-items: flex-end !important; gap: 0 !important; }
      .chip-container > mushroom-template-chip:nth-of-type(1) { order: 2; transform: translateY(var(--room-comfort-shift, -3px)); }
      .chip-container > mushroom-template-chip:nth-of-type(2) { order: 1; }
      {% if states('[[comfort]]') not in ['Cool', 'Cold', 'Warm', 'Hot', 'Humid', 'Dry'] %}
      .chip-container > mushroom-template-chip:nth-of-type(1) { display: none; }
      {% endif %}
      {% if not is_state('[[presence]]', 'on') %}
      .chip-container > mushroom-template-chip:nth-of-type(2) { visibility: hidden; }
      {% endif %}
