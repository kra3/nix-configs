type: custom:command-centre
title: Energy
path: dash-energy
icon: mdi:flash
max_columns: 2
sections:
- !include ../rail.yaml
- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Now
    icon: mdi:flash
    heading_style: title
  - type: custom:health-metric-card
    entity: sensor.electricity_price_per_kwh
    name: Price per kWh
    icon: mdi:cash
    color: "#79c0ff"
    decimals: 2
    show_date: false
    card_mod:
      style: |
        ha-card { height: 100%; }
    chart:
      type: line
      days: 30
      stat: max
    breakdown:
    - {name: Spot, attribute: spot, color: "#79c0ff"}
    - {name: Variable, attribute: variable, color: "#7fdbca"}
    - {name: Påslag, attribute: markup, color: "#c3e88d"}
    - {name: Grid, attribute: grid, color: "#ffd86b"}
    - {name: Tax, attribute: tax, color: "#ff9f6b"}
    - {name: VAT, attribute: vat, color: "#c792ea"}
    grid_options:
      columns: 12
  - type: custom:popup-tile-card
    title: Electricity price
    width: 900px
    grid_options:
      columns: 14
    inline: &price_timeline
      type: custom:price-timeline-card
      price: sensor.electricity_price_timeline
      theme: theme
      slider: true
      currency:
        name: Öre
        symbol: öre
    popup:
      <<: *price_timeline
      view: graph
      cheap_times: true
      day_switch: false
  - type: custom:health-metric-card
    entity: sensor.energy_cost_today
    name: Energy today
    card_mod: &full_height
      style: |
        ha-card { height: 100%; }
    icon: mdi:cash-clock
    color: "#7fdbca"
    unit: kr
    decimals: 2
    show_date: false
    chart:
      type: bar
      days: 14
      stat: max
    secondary:
    - entity: sensor.energy_used_today
      unit: " kWh"
      decimals: 1
    - entity: sensor.home_power_estimate
      prefix: "Now "
      unit: " W"
    grid_options:
      columns: 12
  - type: custom:health-metric-card
    entity: sensor.energy_cost_month
    name: This month
    card_mod: *full_height
    icon: mdi:calendar-month
    color: "#7fdbca"
    unit: kr
    decimals: 2
    show_date: false
    chart:
      type: line
      days: 30
      stat: max
    secondary:
      entity: sensor.energy_used_month
      unit: " kWh"
      decimals: 1
    popup:
      title: Electricity cost
      graphs:
      - name: Cost per day (month view) or per month, fees included
        entities:
        - sensor.energy_cost_today
        monthly: sensor.energy_cost_month
        stat: max
        type: bar
        unit: kr
        decimals: 0
        days: 30
        ranges: [30, 90, 180, 365]
    grid_options:
      columns: 12
- type: grid
  column_span: 1
  cards:
  - type: heading
    heading: Cost today by device (approx.)
    icon: mdi:cash-clock
    heading_style: title
  - type: custom:auto-entities
    grid_options:
      columns: full
    card:
      type: entities
      show_header_toggle: false
    filter:
      include: &cost_rows
      - entity_id: sensor.cost_today_all_lights
        options: &cost_opts
          secondary_info: attribute
          attribute: power
          name: All lights
          icon: mdi:lightbulb-group
      - entity_id: sensor.cost_today_bedroom
        options: {<<: *cost_opts, name: Bedroom lights, icon: "mdi:bed"}
      - entity_id: sensor.cost_today_kitchen
        options: {<<: *cost_opts, name: Kitchen lights, icon: "mdi:countertop"}
      - entity_id: sensor.cost_today_kitchen_dining
        options: {<<: *cost_opts, name: Kitchen dining lights, icon: "mdi:table-chair"}
      - entity_id: sensor.cost_today_dining_room
        options: {<<: *cost_opts, name: Dining room lights, icon: "mdi:silverware-fork-knife"}
      - entity_id: sensor.cost_today_living_room
        options: {<<: *cost_opts, name: Living room lights, icon: "mdi:sofa"}
      - entity_id: sensor.cost_today_office
        options: {<<: *cost_opts, name: Office lights, icon: "mdi:desk"}
      - entity_id: sensor.cost_today_hall
        options: {<<: *cost_opts, name: Hall lights, icon: "mdi:door"}
      - entity_id: sensor.cost_today_tv
        options: {<<: *cost_opts, name: TV, icon: "mdi:television"}
      - entity_id: sensor.cost_today_receiver
        options: {<<: *cost_opts, name: Receiver, icon: "mdi:speaker"}
      - entity_id: sensor.cost_today_camera_duo
        options: {<<: *cost_opts, name: Camera Duo, icon: "mdi:cctv"}
      - entity_id: sensor.cost_today_camera_uno
        options: {<<: *cost_opts, name: Camera Uno, icon: "mdi:cctv"}
      - entity_id: sensor.cost_today_fridge
        options: {<<: *cost_opts, name: Fridge, icon: "mdi:fridge"}
      - entity_id: sensor.cost_today_kitchen_speaker
        options: {<<: *cost_opts, name: Kitchen speaker, icon: "mdi:speaker"}
      - entity_id: sensor.cost_today_hob
        options: {<<: *cost_opts, name: Hob, icon: "mdi:pot-steam"}
      - entity_id: sensor.cost_today_oven
        options: {<<: *cost_opts, name: Oven, icon: "mdi:stove"}
      - entity_id: sensor.cost_today_dishwasher
        options: {<<: *cost_opts, name: Dishwasher, icon: "mdi:dishwasher"}
      - entity_id: sensor.cost_today_microwave
        options: {<<: *cost_opts, name: Microwave, icon: "mdi:microwave"}
      - entity_id: sensor.cost_today_hood
        options: {<<: *cost_opts, name: Hood, icon: "mdi:fan"}
    sort:
      method: state
      numeric: true
      reverse: true
      count: 5
  - type: button
    name: All 19 devices
    icon: mdi:format-list-numbered
    grid_options:
      columns: full
    tap_action:
      action: fire-dom-event
      cc_detail:
        type: custom:auto-entities
        card:
          type: entities
          title: Cost today by device (approx.)
          show_header_toggle: false
        filter:
          include: *cost_rows
        sort:
          method: state
          numeric: true
          reverse: true
- type: grid
  column_span: 1
  cards:
  - type: heading
    heading: Cost, estimated
    icon: mdi:cash
    heading_style: title
  - type: custom:plug-cost-card
    grid_options:
      columns: full
    price: sensor.electricity_price_per_kwh
    devices:
    - name: Lights
      icon: mdi:lightbulb-group
      entity: sensor.lights_cost
      energy: sensor.lights_energy
      color: var(--success-color)
      popup:
        graphs:
        - name: Energy per day
          entities:
          - sensor.lights_energy
          stat: change
          type: bar
          days: 30
    - name: Devices
      icon: mdi:television
      entity: sensor.devices_cost
      energy: sensor.devices_energy
      color: var(--primary-color)
      popup:
        graphs:
        - name: Energy per day
          entities:
          - sensor.estimated_devices_energy
          stat: change
          type: bar
          days: 30
    - name: Washer
      icon: mdi:washing-machine
      entity: sensor.washer_cost
      energy: sensor.washer_energy
      color: color-mix(in srgb, var(--info-color) 55%, var(--secondary-text-color))
      popup:
        graphs:
        - name: Energy per day
          entities:
          - sensor.washer_power_monitor_energy
          stat: change
          type: bar
          days: 30
    - name: Dryer
      icon: mdi:tumble-dryer
      entity: sensor.dryer_cost
      energy: sensor.dryer_energy
      color: var(--warning-color)
      popup:
        graphs:
        - name: Energy per day
          entities:
          - sensor.dryer_power_monitor_energy
          stat: change
          type: bar
          days: 30
    - name: Home server
      icon: mdi:flash
      entity: sensor.sutala_cost
      energy: sensor.sutala_energy
      color: var(--state-active-color)
      popup:
        graphs:
        - name: Energy per day
          entities:
          - sensor.power_monitor_1_energy
          stat: change
          type: bar
          days: 30
