# ── Security ───────────────────────────────────────────────────
- id: alarm_pending_or_triggered_lights
  alias: "Security: lights on when alarm pending or triggered"
  description: Alarm lights on when pending/triggered after dark; 7 min after it settles, room automations take back over.
  triggers:
  - entity_id: alarm_control_panel.vasudha_secure
    to:
    - pending
    - triggered
    trigger: state
    id: alarm
  - entity_id: alarm_control_panel.vasudha_secure
    from:
    - pending
    - triggered
    not_to:
    - pending
    - triggered
    trigger: state
    id: settled
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.alarm_lights_handback
    id: handback
  variables:
    revert: "{{ states('input_text.alarm_lights_revert') }}"
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: alarm
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      sequence:
      - if: "{{ not revert.startswith('on:') }}"
        then:
        - action: input_text.set_value
          target:
            entity_id: input_text.alarm_lights_revert
          data:
            value: >-
              on:{{ ['light.kitchen_dining_lights', 'light.office_room_light'] | select('is_state', 'off') | join(',') }}
      - action: timer.cancel
        target:
          entity_id: timer.alarm_lights_handback
      - action: light.turn_on
        target:
          entity_id:
          - light.kitchen_lights
          - light.hallway_hall_lights
          - light.bedroom_wardrobe_lights
          - light.living_room_lights
          - light.dining_lights
          - light.kitchen_dining_lights
          - light.office_room_light
    - conditions:
      - condition: trigger
        id: settled
      - "{{ revert.startswith('on:') }}"
      sequence:
      - action: timer.start
        target:
          entity_id: timer.alarm_lights_handback
    - conditions:
      - condition: trigger
        id: handback
      - "{{ revert.startswith('on:') }}"
      sequence:
      - variables:
          to_off: "{{ revert[3:].split(',') | reject('eq', '') | list }}"
      - if: "{{ to_off | count > 0 }}"
        then:
        - action: light.turn_off
          target:
            entity_id: "{{ to_off }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.alarm_lights_revert
        data:
          value: ""
      - event: automations_resumed
  mode: queued

- id: alarm_triggered_notify
  alias: "Security: notify on alarm triggered"
  description: Critical alert and speech in the occupied rooms naming the tripped sensor every 2.5 min while triggered; Arun first, Anjali too after 10 min.
  triggers:
  - entity_id: alarm_control_panel.vasudha_secure
    to: triggered
    trigger: state
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: alarm_control_panel.vasudha_secure
    state: triggered
  variables:
    message: >-
      {%- set tripped = (state_attr('alarm_control_panel.vasudha_secure', 'open_sensors') or {}).keys() | list -%}
      {{ tripped | map('state_attr', 'friendly_name') | join(', ') or 'Unknown sensor' }}
  actions:
  - repeat:
      while:
      - condition: state
        entity_id: alarm_control_panel.vasudha_secure
        state: triggered
      sequence:
      - action: script.notify
        data:
          title: "Alarm triggered{{ '' if repeat.index == 1 else ' (' ~ repeat.index ~ ')' }}"
          message: "{{ message }}"
          critical: true
          escalated: "{{ (now() - states.alarm_control_panel.vasudha_secure.last_changed).total_seconds() >= 600 }}"
      - if:
        - condition: or
          conditions:
          - condition: state
            entity_id: person.arun_karunagath
            state: home
          - condition: state
            entity_id: person.anjalipc
            state: home
        then:
        - action: script.announce_home
          continue_on_error: true
          data:
            message: "Alarm triggered. {{ message | replace('(', '') | replace(')', '') }}."
      - wait_template: "{{ not is_state('alarm_control_panel.vasudha_secure', 'triggered') }}"
        timeout: "00:02:30"
  mode: single

- id: alarm_no_one_home_siren
  alias: "Security: warn, then siren when triggered with nobody home"
  description: Spoken warning, then after 2 min a siren on the home theater, kitchen, office and hallway speakers; stops on disarm, 5 min cap.
  triggers:
  - entity_id: alarm_control_panel.vasudha_secure
    to: triggered
    trigger: state
    id: triggered
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.alarm_siren_grace
    id: siren
  - entity_id: alarm_control_panel.vasudha_secure
    from: triggered
    not_to: triggered
    trigger: state
    id: settled
  - trigger: homeassistant
    event: start
    id: startup
  variables:
    nobody_home: "{{ not (is_state('person.arun_karunagath', 'home') or is_state('person.anjalipc', 'home')) }}"
    speakers:
    - media_player.ma_home_theater
    - media_player.kitchen_speaker
    - media_player.office_speaker
    warning: The alarm has been triggered. Disarm it now.
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: triggered
      - "{{ nobody_home }}"
      sequence:
      - action: timer.start
        target:
          entity_id: timer.alarm_siren_grace
      - action: script.alarm_speakers_prepare
        continue_on_error: true
      - parallel:
        - action: script.alarm_speakers_play
          continue_on_error: true
          data:
            url: "http://10.3.2.1:8098/say.wav?text={{ warning | urlencode }}"
        - action: script.announce_hallway
          continue_on_error: true
          data:
            message: "{{ warning }}"
    - conditions:
      - condition: trigger
        id: settled
      sequence:
      - action: timer.cancel
        target:
          entity_id: timer.alarm_siren_grace
      - action: media_player.media_stop
        target:
          entity_id: "{{ speakers }}"
        continue_on_error: true
      - action: script.alarm_speakers_off
        continue_on_error: true
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: siren
        - condition: and
          conditions:
          - condition: trigger
            id: startup
          - condition: state
            entity_id: timer.alarm_siren_grace
            state: idle
      - condition: state
        entity_id: alarm_control_panel.vasudha_secure
        state: triggered
      - "{{ nobody_home }}"
      sequence:
      - action: script.announce_hallway
        continue_on_error: true
        data:
          message: This property is monitored. Leave now.
      - action: script.alarm_speakers_prepare
        continue_on_error: true
      - repeat:
          while:
          - condition: state
            entity_id: alarm_control_panel.vasudha_secure
            state: triggered
          - "{{ repeat.index <= 30 }}"
          sequence:
          - parallel:
            - action: script.alarm_speakers_play
              continue_on_error: true
              data:
                url: http://10.3.2.1:8098/siren.wav?seconds=10
            - sequence:
              - delay: "00:00:04"
              - action: rest_command.siren_hallway
                continue_on_error: true
            - delay: "00:00:10"
      - action: script.alarm_speakers_off
        continue_on_error: true
  mode: restart

- id: alarm_armed_away_lights_media_off
  alias: "Security: lights off when armed away"
  description: >-
    Turns off every light once armed away or vacation, however it was armed,
    or when the house empties while already armed. In vacation the
    simulation takes the lights over 30 s later.
  triggers:
  - entity_id: alarm_control_panel.vasudha_secure
    to:
    - armed_away
    - armed_vacation
    trigger: state
  - trigger: numeric_state
    entity_id: zone.home
    below: 1
  conditions:
  - condition: state
    entity_id: alarm_control_panel.vasudha_secure
    state:
    - armed_away
    - armed_vacation
  - condition: template
    value_template: >-
      {{ trigger.entity_id != 'zone.home'
         or (trigger.from_state is not none
             and trigger.from_state.state not in ['unknown', 'unavailable']) }}
  actions:
  - action: light.turn_off
    target:
      entity_id: all
  mode: single
