type: custom:command-centre
title: Lights
path: dash-lights
icon: mdi:lightbulb-group
max_columns: 2
sections:
- !include ../rail.yaml
- type: grid
  cards:
  - type: custom:mode-switch-card
    name: House mode
    grid_options:
      columns: full
    modes:
    - name: Automatic
      icon: mdi:home-automation
      hint: Lights, TV and doors react by themselves.
    - name: Party
      icon: mdi:party-popper
      entity: input_boolean.party_mode
      hint: Room lights stay as you set them and bedtime waits until the party ends. Ends at wake-up or when everyone leaves.
    - name: Paused
      icon: mdi:pause-circle
      entity: input_boolean.automations_paused
      tone: warning
      confirm: Pause the lighting, TV, door and bedtime automations (this includes arming the alarm at night)?
      hint: Lighting, Adaptive Lighting, TV, door and bedtime automations are off, including arming the alarm at night. Ends at wake-up or when everyone leaves.
  - type: heading
    heading: Scenes
    heading_style: subtitle
  - type: custom:scene-picker-card
    rooms:
    - name: Living Room
      entity: input_text.living_scene
    - name: Office
      entity: input_text.office_scene
    toggles_label: Whole house
    toggles:
    - entity: switch.home_adaptive_lighting_home
      name: Adaptive colour
      icon: mdi:theme-light-dark
      hints:
        "on": Warm and dim in the evening, bright and cool by day
        "off": Lights stay exactly as you set them
    - entity: switch.adaptive_lighting_home_adaptive_lighting_sleep_mode_home
      name: Sleep lighting
      icon: mdi:sleep
      hints:
        "on": Very dim and warm, for night walks
        "off": Switches on by itself at bedtime
    grid_options:
      columns: full
  - type: tile
    entity: binary_sensor.gloomy_outside
    name: Why lights are on
    icon: mdi:lightbulb-question
    state_content: state
    tap_action:
      action: fire-dom-event
      cc_detail:
        type: custom:streamline-card
        template: light_logic
    grid_options:
      columns: full
- type: grid
  cards:
  - type: heading
    heading: Rooms
    icon: mdi:lightbulb-group
    heading_style: title
  - type: conditional
    conditions:
    - condition: state
      entity: binary_sensor.lights_any_on
      state: "on"
    card:
      type: tile
      entity: sensor.lights_summary
      name: All lights off
      icon: mdi:lightbulb-off
      state_content: state
      tap_action:
        action: perform-action
        perform_action: script.lights_all_off
    grid_options:
      columns: full
  - type: conditional
    conditions:
    - condition: state
      entity: binary_sensor.lights_in_manual_control
      state: "on"
    card:
      type: tile
      entity: script.lights_hand_back
      name: Hand back to Adaptive
      icon: mdi:theme-light-dark
      hide_state: true
      tap_action:
        action: toggle
    grid_options:
      columns: full
  - type: grid
    columns: 2
    square: false
    grid_options:
      columns: full
    cards:
    - type: custom:streamline-card
      template: lights_room_tile
      variables:
        name: Dining Room
        icon: mdi:silverware
        light: light.dining_lights
    - type: custom:streamline-card
      template: lights_room_tile
      variables:
        name: Living Room
        icon: mdi:sofa
        light: light.living_room_lights
        scene: input_text.living_scene
        comfort: sensor.living_room_comfort
        temperature: sensor.living_room_occupancy_temperature
        humidity: sensor.living_room_occupancy_humidity
        dew: sensor.living_room_dew_point
    - type: custom:streamline-card
      template: lights_room_tile
      variables:
        name: Wardrobe
        icon: mdi:bed
        light: light.bedroom_wardrobe_lights
        comfort: sensor.bedroom_comfort
        temperature: sensor.bedroom_occupancy_temperature
        humidity: sensor.bedroom_occupancy_humidity
        dew: sensor.bedroom_dew_point
    - type: custom:streamline-card
      template: lights_room_tile
      variables:
        name: Kitchen Dining
        icon: mdi:table-furniture
        light: light.kitchen_dining_lights
        comfort: sensor.kitchen_comfort
        temperature: sensor.hue_pir_kitchen_temperature
        approx: "true"
    - type: custom:streamline-card
      template: lights_room_tile
      variables:
        name: Kitchen
        icon: mdi:fridge
        light: light.kitchen_lights
        comfort: sensor.kitchen_comfort
        temperature: sensor.hue_pir_kitchen_temperature
        approx: "true"
    - type: custom:streamline-card
      template: lights_room_tile
      variables:
        name: Office
        icon: mdi:laptop
        light: light.office_room_light
        scene: input_text.office_scene
    - type: custom:streamline-card
      template: lights_room_tile
      variables:
        name: Hall
        icon: mdi:road
        light: light.hallway_hall_lights
        comfort: sensor.hall_comfort
        temperature: sensor.hue_pir_hallway_temperature
        approx: "true"
    - type: custom:mushroom-entity-card
      entity: switch.front_entrance_double_switch_left
      name: Entrance
      icon: mdi:ceiling-light
      fill_container: true
      icon_color: orange
      primary_info: name
      secondary_info: state
      tap_action:
        action: toggle
  - type: heading
    heading: Accessories
    heading_style: subtitle
  - type: grid
    columns: 3
    square: false
    grid_options:
      columns: full
    cards:
    - type: custom:mushroom-entity-card
      entity: light.tv_backlight
      name: TV Backlight
      layout: vertical
      fill_container: true
      icon_color: orange
      primary_info: name
      secondary_info: state
    - type: custom:mushroom-entity-card
      entity: switch.hue_light_switch_1
      name: Focus light
      icon: mdi:lamp
      layout: vertical
      fill_container: true
      icon_color: orange
      primary_info: name
      secondary_info: state
    - type: custom:mushroom-entity-card
      entity: switch.hue_light_switch_2
      name: Shelf lights
      icon: mdi:led-strip-variant
      layout: vertical
      fill_container: true
      icon_color: orange
      primary_info: name
      secondary_info: state
  - type: heading
    heading: Outdoor
    heading_style: subtitle
  - type: custom:mushroom-entity-card
    entity: switch.front_entrance_double_switch_right
    name: Street Light
    icon: mdi:coach-lamp
    icon_color: orange
    primary_info: name
    secondary_info: state
    tap_action:
      action: toggle
    grid_options:
      columns: full
- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Floor plan
    icon: mdi:floor-plan
    heading_style: title
  - type: custom:streamline-card
    template: floor_plan
    variables:
      layer: lights
    grid_options:
      columns: full
