    to: below_horizon
    trigger: state
    id: dusk
  - entity_id: schedule.sleep
    to: "on"
    trigger: state
    id: sleep_started
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: dusk
      sequence:
      - target:
          entity_id: switch.front_entrance_double_switch_right
