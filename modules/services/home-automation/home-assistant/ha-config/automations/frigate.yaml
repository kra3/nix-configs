# ── Frigate detect/audio gating by alarm state ──────────────────
# All 3 cameras are interior. Object + audio detection only needs to
# run continuously while armed away; while armed night or disarmed
# (someone's home) interior person-tracking is redundant, so it's
# gated off and only re-enabled briefly on actual motion. This is a
# CPU/GPU optimization (frigate.detector:openvino + per-camera
# frigate.process were the top consumers per PR #48) built on top of
# the existing motion-mask/fps tuning in nvr.nix.
- id: frigate_detect_gate_by_alarm
  alias: "Frigate: baseline detect/audio by alarm state"
  description: >-
    Force full detect+audio on when armed away; force it off when
    armed night or disarmed. Runs on every alarm state change.
  triggers:
  - trigger: state
    entity_id: alarm_control_panel.vasudha_secure
  actions:
  - action: script.frigate_sync_detect_to_alarm_state
  mode: single

- id: frigate_detect_on_motion_when_home
  alias: "Frigate: enable detect on motion when armed night/disarmed"
  description: >-
    Temporarily re-enable a camera's detect+audio when its (always-on)
    motion sensor fires while armed night or disarmed.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.ranger_duo_fxd_motion
    - binary_sensor.ranger_duo_ptz_motion
    - binary_sensor.ranger_uno_motion
    to: "on"
  conditions:
  - condition: state
    entity_id: alarm_control_panel.vasudha_secure
    state:
    - disarmed
    - armed_night
  actions:
  - variables:
      cam: "{{ trigger.entity_id.split('.')[1] | regex_replace('_motion$', '') }}"
  - action: switch.turn_on
    target:
      entity_id: "switch.{{ cam }}_detect"
  - if:
    - condition: template
      value_template: >-
        {{ not (is_state('media_player.lg_webos_tv_oled77c35la', 'playing') and cam in ['ranger_duo_fxd', 'ranger_duo_ptz']) }}
    then:
    - action: switch.turn_on
      target:
        entity_id: "switch.{{ cam }}_audio_detection"
  mode: parallel

- id: frigate_detect_off_after_motion_when_home
  alias: "Frigate: disable detect once the room is quiet (home)"
  description: >-
    Turn a camera's detect+audio back off while armed night or disarmed,
    but only 5 minutes after its motion is clear, nobody is detected on
    it and (living and dining) the TV is not playing, so a person sitting
    still keeps being tracked.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.ranger_duo_fxd_motion
    - binary_sensor.ranger_duo_ptz_motion
    - binary_sensor.ranger_uno_motion
    - binary_sensor.ranger_duo_fxd_person_occupancy
    - binary_sensor.ranger_duo_ptz_person_occupancy
    - binary_sensor.ranger_uno_person_occupancy
    to: "off"
    for:
      minutes: 5
  - trigger: state
    entity_id: media_player.lg_webos_tv_oled77c35la
    from: playing
    for:
      minutes: 5
  conditions:
  - condition: state
    entity_id: alarm_control_panel.vasudha_secure
    state:
    - disarmed
    - armed_night
  actions:
  - variables:
      cams: >-
        {{ ['ranger_duo_fxd', 'ranger_duo_ptz'] if trigger.entity_id.startswith('media_player')
           else [trigger.entity_id.split('.')[1] | regex_replace('_(motion|person_occupancy)$', '')] }}
  - repeat:
      for_each: "{{ cams }}"
      sequence:
      - if:
        - condition: template
          value_template: >-
            {{ is_state('binary_sensor.' ~ repeat.item ~ '_motion', 'off')
               and is_state('binary_sensor.' ~ repeat.item ~ '_person_occupancy', 'off')
               and not (is_state('media_player.lg_webos_tv_oled77c35la', 'playing')
                        and repeat.item in ['ranger_duo_fxd', 'ranger_duo_ptz']) }}
        then:
        - action: switch.turn_off
          target:
            entity_id:
            - "switch.{{ repeat.item }}_detect"
            - "switch.{{ repeat.item }}_audio_detection"
  mode: parallel

- id: frigate_audio_off_while_tv_plays
  alias: "Frigate: living and dining audio off while the TV plays"
  description: >-
    The TV's glass, scream and shatter sounds trip audio detection on the
    Duo cameras covering the living and dining rooms, so it is switched off
    while the TV is playing.
  triggers:
  - trigger: state
    entity_id: media_player.lg_webos_tv_oled77c35la
    to: playing
  actions:
  - action: switch.turn_off
    target:
      entity_id:
      - switch.ranger_duo_fxd_audio_detection
      - switch.ranger_duo_ptz_audio_detection
  mode: single

- id: frigate_audio_restore_after_tv
  alias: "Frigate: living and dining audio back after the TV stops"
  description: >-
    Re-enables the Duo cameras' audio detection when the TV pauses, stops or
    turns off, but only when the alarm state wants it (armed away).
  triggers:
  - trigger: state
    entity_id: media_player.lg_webos_tv_oled77c35la
    from: playing
    for:
      seconds: 10
  conditions:
  - condition: state
    entity_id: alarm_control_panel.vasudha_secure
    state: armed_away
  actions:
  - action: switch.turn_on
    target:
      entity_id:
      - switch.ranger_duo_fxd_audio_detection
      - switch.ranger_duo_ptz_audio_detection
  mode: single

- id: frigate_detect_resync_on_restart
  alias: "Frigate: resync detect/audio baseline after restart"
  description: >-
    Re-applies the alarm-state detect/audio baseline when Frigate
    reconnects to MQTT — its switches aren't persisted across restarts.
  triggers:
  - trigger: mqtt
    topic: frigate/available
    payload: online
  actions:
  - action: script.frigate_sync_detect_to_alarm_state
  mode: single

- id: frigate_motion_staleness_watchdog
  alias: "Frigate: alert on stale motion sensor"
  description: >-
    Notifies if a camera's motion sensor hasn't updated in 4+ hours,
    with the host-side restart command — HA can't trigger it itself.
  triggers:
  - trigger: time_pattern
    hours: "/1"
  actions:
  - repeat:
      for_each:
      - binary_sensor.ranger_duo_fxd_motion
      - binary_sensor.ranger_duo_ptz_motion
      - binary_sensor.ranger_uno_motion
      sequence:
      - variables:
          stale_hours: >-
            {{ ((now() - states[repeat.item].last_changed).total_seconds() / 3600) | round(1) }}
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ stale_hours | float > 4 }}"
          sequence:
          - action: persistent_notification.create
            data:
              notification_id: "frigate_stale_{{ repeat.item }}"
              title: "Frigate motion sensor stuck"
              message: >-
                {{ repeat.item }} hasn't changed state in
                {{ stale_hours }}h (last: {{ states[repeat.item].last_changed }}).
                On sutala: machinectl shell home-auto /bin/sh -c
                "systemctl restart frigate"
        default:
        - action: persistent_notification.dismiss
          data:
            notification_id: "frigate_stale_{{ repeat.item }}"
  mode: single
