# ── Front Door Management ──────────────────────────────────────
- id: front_door_knock_announcements
  alias: "Front Door: Knock TTS & Notifications"
  description: >-
    On a valid knock (door closed, no recent lock/open activity), pauses
    the TV, plays a TTS chime on the home theater, resumes the TV, then
    notifies whoever's home (or everyone, if the house is empty).
  trigger:
    - platform: state
      entity_id: binary_sensor.front_door_knock_vibration
      to: "on"
  action:
    # 1. Wait 2 seconds to let contact/lock sensor state settle
    - delay: "00:00:02"

    # 2. Check if this was a valid knock (door is closed, and was not recently opened/closed/locked/unlocked)
    - if: &valid_knock_check
        - condition: state
          entity_id: binary_sensor.front_door_open
          state: "off"
        - condition: template
          value_template: "{{ (as_timestamp(now()) - as_timestamp(states.binary_sensor.front_door_open.last_changed)) > 15 }}"
        - condition: template
          value_template: "{{ (as_timestamp(now()) - as_timestamp(states.lock.front_door.last_changed | default(now()))) > 15 }}"
      then:
        # Determine Presence
        - variables:
            anjali_home: "{{ is_state('person.anjalipc', 'home') }}"
            arun_home: "{{ is_state('person.arun_karunagath', 'home') }}"
            anyone_home: "{{ anjali_home or arun_home }}"

        # If someone home: Play Announcement on HT and Notify present people
        - if:
            - condition: template
              value_template: "{{ anyone_home }}"
          then:
            # Toggle TV pause
            - if:
                - condition: state
                  entity_id: media_player.lg_webos_tv_oled77c35la
                  state: "playing"
              then:
                - action: media_player.media_play_pause
                  target: { entity_id: media_player.lg_webos_tv_oled77c35la }

            # Snapshot Denon (HT_2) source
            - action: input_text.set_value
              target: { entity_id: input_text.doorbell_return_source }
              data:
                value: "{{ state_attr('media_player.home_theater_2', 'source') }}"

            # Announce
            - action: music_assistant.play_announcement
              target: { entity_id: media_player.ma_home_theater }
              data:
                url: "https://ha.karunagath.in/local/sounds/doorbell-chimes.mp3"
                announce_volume: 60

            # Restore HT_2 (Denon) source
            - delay: "00:00:10"
            - action: media_player.select_source
              target: { entity_id: media_player.home_theater_2 }
              data:
                source: "{{ states('input_text.doorbell_return_source') }}"

            # Resume TV
            - if:
                - condition: state
                  entity_id: media_player.lg_webos_tv_oled77c35la
                  state: "paused"
              then:
                - action: media_player.media_play_pause
                  target: { entity_id: media_player.lg_webos_tv_oled77c35la }

            # Notify present people
            - if:
                - condition: template
                  value_template: "{{ anjali_home }}"
              then:
                - action: notify.send_message
                  target: { entity_id: notify.anjalis_iphone }
                  data: { title: "Front Door", message: "Someone is knocking at the front door." }
            - if:
                - condition: template
                  value_template: "{{ arun_home }}"
              then:
                - action: notify.send_message
                  target: { entity_id: notify.meghanadha }
                  data: { title: "Front Door", message: "Someone is knocking at the front door." }

          # If no one home: Notify all phones
          else:
            - action: script.notify_all_phones
              data: { title: "Front Door", message: "Someone is knocking at the front door." }

        # Cooldown delay to prevent rapid back-to-back announcements
        - delay: "00:00:30"
  mode: single

- id: front_door_knock_detect
  alias: "Front Door: Knock detect"
  description: Fires front_door_knock on two short vibration pulses within 20s, ignoring door/lock activity and long pulses.
  trigger:
    - platform: state
      entity_id: binary_sensor.front_door_knock_vibration
      to: "on"
  action:
    - delay: "00:00:02"
    - condition: and
      conditions: *valid_knock_check
    - wait_for_trigger:
        - platform: state
          entity_id: binary_sensor.front_door_knock_vibration
          to: "off"
      timeout: "00:00:06"
      continue_on_timeout: false
    - wait_for_trigger:
        - platform: state
          entity_id: binary_sensor.front_door_knock_vibration
          to: "on"
      timeout: "00:00:20"
      continue_on_timeout: false
    - wait_for_trigger:
        - platform: state
          entity_id: binary_sensor.front_door_knock_vibration
          to: "off"
      timeout: "00:00:08"
      continue_on_timeout: false
    - event: front_door_knock
    - delay: "00:00:30"
  mode: single
  max_exceeded: silent

- id: front_door_knock_lights
  alias: "Front Door: Knock Lights"
  description: Entrance light on a double knock in the dark once hall motion follows; 5min timer, door open cancels.
  trigger:
    - platform: event
      event_type: front_door_knock
      id: knock
    - platform: state
      entity_id: binary_sensor.front_door_open
      to: "on"
      id: door_open
    - platform: event
      event_type: timer.finished
      event_data:
        entity_id: timer.front_door_knock_auto_off
      id: timer_finished
  action:
    - choose:
        - conditions:
            - condition: trigger
              id: knock
          sequence:
            - wait_for_trigger:
                - platform: state
                  entity_id: binary_sensor.hue_pir_hallway_occupancy
                  to: "on"
              timeout: "00:02:00"
            - if:
                - condition: template
                  value_template: "{{ wait.trigger is not none }}"
                - condition: state
                  entity_id: binary_sensor.front_door_area_dark
                  state: "on"
              then:
                - action: switch.turn_on
                  target:
                    entity_id: switch.front_entrance_double_switch_left
                - action: timer.start
                  target:
                    entity_id: timer.front_door_knock_auto_off
        - conditions:
            - condition: trigger
              id: door_open
          sequence:
            - action: timer.cancel
              target:
                entity_id: timer.front_door_knock_auto_off
        - conditions:
            - condition: trigger
              id: timer_finished
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.front_entrance_double_switch_left
  mode: restart

- id: front_door_open_entrance_light
  alias: "Front Door: Entrance light on open (dark)"
  description: >-
    Turns on entrance light when the front door opens in the dark; off
    via timer.front_door_entrance_light_off (5min after close,
    restart-safe). Falls back to unlock-as-open-proxy when BLE degraded.
  triggers:
  - entity_id: binary_sensor.front_door_open
    to: "on"
    trigger: state
    id: door_open
  - entity_id: binary_sensor.front_door_open
    to: "off"
    trigger: state
    id: door_close
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.front_door_entrance_light_off
    id: timer_finished
  - entity_id: lock.front_front_door_nw
    to: "unlocked"
    trigger: state
    id: unlock_fallback
  actions:
  - choose:
      - conditions:
          - condition: trigger
            id: door_open
          - condition: state
            entity_id: binary_sensor.front_door_area_dark
            state: "on"
        sequence:
          - action: timer.cancel
            target:
              entity_id: timer.front_door_entrance_light_off
          - action: switch.turn_on
            target:
              entity_id: switch.front_entrance_double_switch_left
      - conditions:
          - condition: trigger
            id: unlock_fallback
          - condition: state
            entity_id: binary_sensor.front_door_ble_degraded
            state: "on"
          - condition: state
            entity_id: binary_sensor.front_door_area_dark
            state: "on"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.front_entrance_double_switch_left
          - action: timer.start
            target:
              entity_id: timer.front_door_entrance_light_off
      - conditions:
          - condition: trigger
            id: door_close
          - condition: state
            entity_id: switch.front_entrance_double_switch_left
            state: "on"
        sequence:
          - action: timer.start
            target:
              entity_id: timer.front_door_entrance_light_off
      - conditions:
          - condition: trigger
            id: timer_finished
        sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.front_entrance_double_switch_left
  mode: restart
