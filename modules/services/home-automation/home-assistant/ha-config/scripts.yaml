notify:
  alias: "Notify: phones"
  description: >-
    Notifies phones. to: all (default), home (only residents at home) or a list of person entity ids; critical (iOS critical alert, via mobile_app actions) goes to Arun only unless escalated.
  fields:
    title:
      required: false
      selector:
        text:
    message:
      required: true
      selector:
        text:
    to:
      required: false
      default: all
      selector:
        object:
    critical:
      required: false
      default: false
      selector:
        boolean:
    escalated:
      required: false
      default: false
      selector:
        boolean:
  variables:
    phones:
      person.arun_karunagath:
      - meghanadha
      - hiranyagarbha
      person.anjalipc:
      - anjalis_iphone
    people: >-
      {%- set t = to | default('all') -%}
      {%- if t == 'all' -%}{{ phones.keys() | list }}
      {%- elif t == 'home' -%}{{ phones.keys() | select('is_state', 'home') | list }}
      {%- else -%}{{ [t] if t is string else t }}{%- endif -%}
    devices: >-
      {%- set ns = namespace(d=[]) -%}
      {%- for p in people %}{% set ns.d = ns.d + phones[p] %}{% endfor -%}
      {{ ns.d }}
  sequence:
  - if: "{{ critical | default(false) }}"
    then:
    - parallel:
      - action: notify.mobile_app_meghanadha
        <<: &critical_push
          continue_on_error: true
          data:
            title: "{{ title | default(omit) }}"
            message: "{{ message }}"
            data:
              push:
                interruption-level: critical
                sound:
                  name: default
                  critical: 1
                  volume: 1.0
      - <<: *critical_push
        action: notify.mobile_app_hiranyagarbha
    - if: "{{ escalated | default(false) }}"
      then:
      - <<: *critical_push
        action: notify.mobile_app_anjalis_iphone
    else:
    - if: "{{ devices | count > 0 }}"
      then:
      - action: notify.send_message
        target:
          entity_id: "{{ devices | map('regex_replace', '^', 'notify.') | list }}"
        data:
          title: "{{ title | default(omit) }}"
          message: "{{ message }}"
  mode: parallel

notify_all_phones:
  alias: "Notify: all phones"
  description: Alias for script.notify addressed to everyone, kept for existing callers.
  fields:
    title:
      required: false
      selector:
        text:
    message:
      required: true
      selector:
        text:
    critical:
      required: false
      default: false
      selector:
        boolean:
    escalated:
      required: false
      default: false
      selector:
        boolean:
  sequence:
  - action: script.notify
    data:
      title: "{{ title | default(omit) }}"
      message: "{{ message }}"
      to: all
      critical: "{{ critical | default(false) }}"
      escalated: "{{ escalated | default(false) }}"
  mode: parallel

frigate_sync_detect_to_alarm_state:
  alias: "Frigate: sync detect/audio/snapshot switches to alarm state"
  description: >-
    Called by frigate_detect_baseline (on alarm state change and Frigate
    MQTT reconnect) so the armed_away/disarmed-or-armed_night switch
    lists only live in one place.
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: alarm_control_panel.vasudha_secure
        state:
        - armed_away
        - armed_vacation
      sequence:
      - action: switch.turn_on
        target:
          entity_id:
          - switch.ranger_duo_fxd_detect
          - switch.ranger_duo_ptz_detect
          - switch.ranger_uno_detect
          - switch.ranger_uno_audio_detection
          - switch.ranger_duo_fxd_snapshots
          - switch.ranger_duo_ptz_snapshots
          - switch.ranger_uno_snapshots
      - if:
        - condition: not
          conditions:
          - condition: state
            entity_id: media_player.lg_webos_tv_oled77c35la
            state: playing
        then:
        - action: switch.turn_on
          target:
            entity_id:
            - switch.ranger_duo_fxd_audio_detection
            - switch.ranger_duo_ptz_audio_detection
    - conditions:
      - condition: state
        entity_id: alarm_control_panel.vasudha_secure
        state:
        - disarmed
        - armed_night
      sequence:
      - action: switch.turn_off
        target:
          entity_id:
          - switch.ranger_duo_fxd_detect
          - switch.ranger_duo_fxd_audio_detection
          - switch.ranger_duo_ptz_detect
          - switch.ranger_duo_ptz_audio_detection
          - switch.ranger_uno_detect
          - switch.ranger_uno_audio_detection
          - switch.ranger_duo_fxd_snapshots
          - switch.ranger_duo_ptz_snapshots
          - switch.ranger_uno_snapshots

alarm_force_arm_night:
  alias: "Alarm: force arm night (bypass open sensors)"
  description: >-
    Arms night mode via alarmo.arm's force option, which auto-bypasses
    any currently-open sensor instead of refusing to arm.
  sequence:
  - action: alarmo.arm
    data:
      entity_id: alarm_control_panel.vasudha_secure
      mode: night
      force: true
      code: !secret alarm_code

alarm_force_arm_away:
  alias: "Alarm: force arm away (bypass open sensors)"
  description: >-
    Arms away mode via alarmo.arm's force option, which auto-bypasses
    any currently-open sensor instead of refusing to arm.
  sequence:
  - action: alarmo.arm
    data:
      entity_id: alarm_control_panel.vasudha_secure
      mode: away
      force: true
      code: !secret alarm_code

announce_hallway:
  alias: "Announce: hallway speaker"
  description: Speaks a message through the hallway camera speaker using local Piper TTS.
  fields:
    message:
      required: true
      selector:
        text:
  sequence:
  - action: rest_command.announce_hallway
    data:
      message: "{{ message }}"
  mode: queued

announce_home:
  alias: "Announce: speak in the occupied rooms"
  description: Speaks on the speakers of occupied rooms, kitchen if none; skipped when nobody is home. The living room hears it on the home theater while the receiver is on, unless the PS5 is in use.
  fields:
    message:
      required: true
      selector:
        text:
  sequence:
  - condition: state
    entity_id: binary_sensor.anyone_home
    state: "on"
  - variables:
      speakers: >-
        {%- set ns = namespace(l=[]) -%}
        {%- if is_state('binary_sensor.room_presence_kitchen', 'on') or is_state('binary_sensor.room_presence_dining', 'on') -%}
          {%- set ns.l = ns.l + ['media_player.kitchen_speaker'] -%}
        {%- endif -%}
        {%- if is_state('binary_sensor.room_presence_office', 'on') or is_state('binary_sensor.bedroom_occupancy_presence', 'on') -%}
          {%- set ns.l = ns.l + ['media_player.office_speaker'] -%}
        {%- endif -%}
        {{ ns.l }}
      living: >-
        {{ is_state('binary_sensor.room_presence_living', 'on')
           and states('media_player.home_theater_2') not in ['off', 'unavailable', 'unknown']
           and states('media_player.ma_home_theater') not in ['unavailable', 'unknown']
           and state_attr('media_player.home_theater_2', 'source') not in [none, '', 'PlayStation 5', 'Game']
           and state_attr('media_player.home_theater_2', 'volume_level') is number }}
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ speakers | length == 0 and not living and is_state('binary_sensor.room_presence_hall', 'on') }}"
      sequence:
      - action: script.announce_hallway
        data:
          message: "{{ message }}"
    default:
    - parallel:
      - if:
        - condition: template
          value_template: "{{ living }}"
        then:
        - action: script.announce_home_theater
          data:
            message: "{{ message }}"
      - if:
        - condition: template
          value_template: "{{ speakers | length > 0 or not living }}"
        then:
        - action: tts.speak
          target:
            entity_id: tts.piper
          data:
            media_player_entity_id: "{{ speakers if speakers | length > 0 else ['media_player.kitchen_speaker'] }}"
            message: "{{ message }}"
            language: en_US
            options:
              voice: en_US-lessac-medium
  mode: queued

announce_home_theater:
  alias: "Announce: home theater"
  description: Pauses the TV, speaks on the home theater at half volume through Music Assistant, then switches the receiver back to its input and volume and resumes the TV.
  fields:
    message:
      required: true
      selector:
        text:
  sequence:
  - variables:
      source: "{{ state_attr('media_player.home_theater_2', 'source') }}"
      volume: "{{ state_attr('media_player.home_theater_2', 'volume_level') }}"
      tv_playing: "{{ is_state('media_player.lg_webos_tv_oled77c35la', 'playing') }}"
  - parallel:
    - if:
      - condition: template
        value_template: "{{ tv_playing }}"
      then:
      - action: media_player.media_pause
        continue_on_error: true
        target:
          entity_id: media_player.lg_webos_tv_oled77c35la
    - action: media_player.volume_set
      continue_on_error: true
      target:
        entity_id: media_player.home_theater_2
      data:
        volume_level: "{{ [volume | float(0), 0.5] | max }}"
  - action: music_assistant.play_announcement
    continue_on_error: true
    target:
      entity_id: media_player.ma_home_theater
    data:
      url: "http://10.3.2.1:8098/say.wav?text={{ message | urlencode }}"
      use_pre_announce: false
  - parallel:
    - action: media_player.select_source
      continue_on_error: true
      target:
        entity_id: media_player.home_theater_2
      data:
        source: "{{ source }}"
    - if:
      - condition: template
        value_template: "{{ tv_playing }}"
      then:
      - action: media_player.media_play
        continue_on_error: true
        target:
          entity_id: media_player.lg_webos_tv_oled77c35la
  - wait_template: "{{ is_state_attr('media_player.home_theater_2', 'source', source) }}"
    timeout: "00:00:05"
    continue_on_timeout: true
  - delay: "00:00:02"
  - action: media_player.volume_set
    continue_on_error: true
    target:
      entity_id: media_player.home_theater_2
    data:
      volume_level: "{{ volume }}"
  mode: queued

alarm_speakers_prepare:
  alias: "Alarm speakers: prepare"
  description: Powers the home theater receiver on in multi-channel stereo and notes that the alarm did.
  sequence:
  - action: input_text.set_value
    target:
      entity_id: input_text.alarm_speakers_on
    data:
      value: "on"
  - if: "{{ is_state('media_player.home_theater_2', 'off') }}"
    then:
    - action: media_player.turn_on
      target:
        entity_id: media_player.home_theater_2
    - wait_template: "{{ not is_state('media_player.home_theater_2', 'off') }}"
      timeout: "00:00:20"
      continue_on_timeout: true
  - action: media_player.select_sound_mode
    continue_on_error: true
    target:
      entity_id: media_player.home_theater_2
    data:
      sound_mode: MCH STEREO
  - delay: "00:00:03"
  mode: restart

alarm_speakers_play:
  alias: "Alarm speakers: play"
  description: Plays a sound URL on the home theater (announce 65, about 50 on the receiver) and the kitchen and office at 60 %.
  fields:
    url:
      required: true
      selector:
        text:
  sequence:
  - parallel:
    - action: music_assistant.play_announcement
      continue_on_error: true
      target:
        entity_id: media_player.ma_home_theater
      data:
        url: "{{ url }}"
        use_pre_announce: false
        announce_volume: 65
    - action: music_assistant.play_announcement
      continue_on_error: true
      target:
        entity_id: media_player.kitchen_speaker
      data:
        url: "{{ url }}"
        use_pre_announce: false
        announce_volume: 60
    - action: music_assistant.play_announcement
      continue_on_error: true
      target:
        entity_id: media_player.office_speaker
      data:
        url: "{{ url }}"
        use_pre_announce: false
        announce_volume: 60
    - sequence:
      - delay: "00:00:02"
      - action: media_player.select_sound_mode
        continue_on_error: true
        target:
          entity_id: media_player.home_theater_2
        data:
          sound_mode: MCH STEREO
  mode: parallel

alarm_speakers_off:
  alias: "Alarm speakers: power off"
  description: Powers the home theater receiver off again if the alarm powered it on.
  sequence:
  - if: "{{ is_state('input_text.alarm_speakers_on', 'on') }}"
    then:
    - action: media_player.turn_off
      continue_on_error: true
      target:
        entity_id: media_player.home_theater_2
    - action: input_text.set_value
      target:
        entity_id: input_text.alarm_speakers_on
      data:
        value: ""
  mode: single

lights_hand_back:
  alias: "Lights: hand back to Adaptive"
  description: Resets both room scenes to Auto and returns every light to Adaptive Lighting.
  sequence:
  - action: input_text.set_value
    target:
      entity_id:
      - input_text.living_scene
      - input_text.office_scene
    data:
      value: Auto
  - action: adaptive_lighting.set_manual_control
    target:
      entity_id: switch.home_adaptive_lighting_home
    data:
      manual_control: false
  - action: adaptive_lighting.apply
    target:
      entity_id: switch.home_adaptive_lighting_home
    data:
      turn_on_lights: false
  mode: single

lights_all_off:
  alias: "Lights: all off"
  description: Turns off every light and the Focus and Shelf light plugs.
  sequence:
  - action: light.turn_off
    target:
      entity_id: all
  - action: switch.turn_off
    target:
      entity_id:
      - switch.hue_light_switch_1
      - switch.hue_light_switch_2
  mode: single

laundry_notify:
  alias: "Laundry: notify"
  description: Tells whoever is home about a machine, unless the sleep schedule is on. Uses a default message unless text is given.
  fields:
    machine:
      required: true
      selector:
        select:
          options:
          - washer
          - dryer
    reminder:
      required: false
      default: false
      selector:
        boolean:
    text:
      required: false
      selector:
        text:
  sequence:
  - condition: state
    entity_id: schedule.sleep
    state: "off"
  - variables:
      title: "{{ 'Washer' if machine == 'washer' else 'Dryer' }}"
      message: >-
        {% if text is defined and text %}{{ text }}
        {% elif reminder %}{{ title }} is still waiting to be emptied.
        {% elif machine == 'washer' and is_state('binary_sensor.dryer_running', 'off') %}Washer is done and the dryer is free.
        {% elif machine == 'dryer' %}Dryer is done. Clean the lint filter.
        {% else %}{{ title }} is done.{% endif %}
  - action: script.notify
    data:
      to: home
      title: "{{ title }}"
      message: "{{ message }}"
  - action: script.announce_home
    continue_on_error: true
    data:
      message: "{{ message }}"
  mode: queued

transit_check:
  alias: "Transit: check trips"
  description: >-
    Public transport options for the next 90 min for one person: home to their
    work when at home, otherwise from their phone's location to home.
    Publishes the result as a transit_trips event for the trips sensors.
  fields:
    person:
      required: true
      selector:
        entity:
          domain: person
  variables:
    work_zone: >-
      {{ {'person.arun_karunagath': 'zone.work',
          'person.anjalipc': 'zone.work_smil'}.get(person, '') }}
    at_home: "{{ is_state(person, 'home') }}"
    origin_name: "{{ 'Home' if at_home else (states(person) if states(person) not in ['not_home', 'unknown', 'unavailable'] else 'Here') }}"
    destination_name: "{{ state_attr(work_zone, 'friendly_name') if at_home else 'Home' }}"
    from_entity: "{{ 'zone.home' if at_home else person }}"
    to_entity: "{{ work_zone if at_home else 'zone.home' }}"
    coords_ok: >-
      {{ to_entity != ''
         and state_attr(from_entity, 'latitude') is not none
         and state_attr(to_entity, 'latitude') is not none }}
    depart: "{{ now().strftime('%Y-%m-%d %H:%M') }}"
    extra: >-
      {{ {'None': '&maxChange=0', 'At most 1': '&maxChange=1'}.get(states('input_select.transit_max_changes'), '')
         ~ {'Trains': '&products=22', 'Buses and trams': '&products=200'}.get(states('input_select.transit_modes'), '') }}
    max_walk: >-
      {{ {'Up to 1 km': 1000, 'Up to 500 m': 500}.get(states('input_select.transit_walking'), 2000) }}
    leg_walk: "{{ [max_walk | int // 2, 500] | max }}"
    first: {}
    second: {}
  sequence:
  - if:
    - condition: template
      value_template: "{{ coords_ok }}"
    then:
    - action: rest_command.transit_trip
      data: &trip_query
        origin_lat: "{{ state_attr(from_entity, 'latitude') }}"
        origin_lon: "{{ state_attr(from_entity, 'longitude') }}"
        dest_lat: "{{ state_attr(to_entity, 'latitude') }}"
        dest_lon: "{{ state_attr(to_entity, 'longitude') }}"
        date: "{{ depart[:10] }}"
        time: "{{ depart[11:16] }}"
        extra: "{{ extra }}&originWalk=1,0,{{ leg_walk }}&destWalk=1,0,{{ leg_walk }}"
      response_variable: first
      continue_on_error: true
    - variables:
        depart: >-
          {% set t = first.content.Trip | default([]) if first.status | default(0) == 200 else [] %}
          {% if t %}
            {{ (strptime(t[-1].Origin.date ~ ' ' ~ t[-1].Origin.time, '%Y-%m-%d %H:%M:%S') + timedelta(minutes=1)).strftime('%Y-%m-%d %H:%M') }}
          {% else %}
            {{ depart }}
          {% endif %}
    - if:
      - condition: template
        value_template: "{{ first.status | default(0) == 200 and depart < (now() + timedelta(minutes=90)).strftime('%Y-%m-%d %H:%M') }}"
      then:
      - action: rest_command.transit_trip
        data: *trip_query
        response_variable: second
        continue_on_error: true
  - variables:
      until: "{{ (now() + timedelta(minutes=90)).strftime('%Y-%m-%d %H:%M:%S') }}"
      trips: >-
        {% set ns = namespace(rows=[], seen=[]) %}
        {% for r in [first, second] if r.status | default(0) == 200 %}
          {% for t in r.content.Trip | default([]) %}
            {% set dep = t.Origin.date ~ ' ' ~ t.Origin.time %}
            {% set arr = t.Destination.date ~ ' ' ~ t.Destination.time %}
            {% set route = t.LegList.Leg | selectattr('type', 'ne', 'WALK')
                 | map(attribute='Product') | map('first') | map(attribute='name')
                 | map('replace', 'Länstrafik ', '') | join(' → ') %}
            {% set walks = t.LegList.Leg | selectattr('type', 'eq', 'WALK') | list %}
            {% set walk = walks | map(attribute='dist') | map('int', 0) | sum %}
            {% set wm = namespace(m=0) %}
            {% for w in walks %}
              {% set h = (w.duration | default('') | regex_findall_index('(\d+)H') if 'H' in w.duration | default('') else 0) | int %}
              {% set m = (w.duration | default('') | regex_findall_index('(\d+)M') if 'M' in w.duration | default('') else 0) | int %}
              {% set wm.m = wm.m + h * 60 + m %}
            {% endfor %}
            {% if dep <= until and walk <= max_walk | int and (dep ~ route) not in ns.seen %}
              {% set ns.seen = ns.seen + [dep ~ route] %}
              {% set mins = ((strptime(arr, '%Y-%m-%d %H:%M:%S') - strptime(dep, '%Y-%m-%d %H:%M:%S')).total_seconds() // 60) | int %}
              {% set ns.rows = ns.rows + [{'d': dep, 'a': arr, 'w': walk, 'wm': wm.m, 'min': mins, 'route': route or 'walk'}] %}
            {% endif %}
          {% endfor %}
        {% endfor %}
        {% set out = namespace(rows=[]) %}
        {% for r in ns.rows %}
          {% set beaten = namespace(any=false) %}
          {% for o in ns.rows if o.d >= r.d and o.a <= r.a and o.w <= r.w and (o.d > r.d or o.a < r.a or o.w < r.w) %}
            {% set beaten.any = true %}
          {% endfor %}
          {% set out.rows = out.rows + [{'dep': r.d[11:16], 'arr': r.a[11:16], 'min': r.min, 'walk': r.w, 'walk_min': r.wm,
                                         'route': r.route, 'best': not beaten.any}] %}
        {% endfor %}
        {{ out.rows | sort(attribute='dep') }}
  - event: transit_trips
    event_data:
      person: "{{ person }}"
      ok: "{{ trips | count > 0 }}"
      origin: "{{ origin_name }}"
      destination: "{{ destination_name }}"
      trips: "{{ trips }}"
  mode: queued
