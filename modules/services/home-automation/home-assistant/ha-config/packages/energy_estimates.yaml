sensor:
  - platform: integration
    source: sensor.fridge_power
    name: Fridge Energy
    unique_id: fridge_energy
    unit_prefix: k
    round: 4
    method: left
    max_sub_interval:
      minutes: 10
  - platform: integration
    source: sensor.hob_power
    name: Hob Energy
    unique_id: hob_energy
    unit_prefix: k
    round: 4
    method: left
    max_sub_interval:
      minutes: 10
  - platform: integration
    source: sensor.hood_power
    name: Hood Energy
    unique_id: hood_energy
    unit_prefix: k
    round: 4
    method: left
    max_sub_interval:
      minutes: 10
  - platform: integration
    source: sensor.dishwasher_power
    name: Dishwasher Energy
    unique_id: dishwasher_energy
    unit_prefix: k
    round: 4
    method: left
    max_sub_interval:
      minutes: 10
  - platform: integration
