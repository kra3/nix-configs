# ── Security ───────────────────────────────────────────────────
- id: alarm_pending_or_triggered_lights
  alias: "Security: lights on when alarm pending or triggered"
  description: >-
    Lights on when Alarmo goes pending/triggered and it's dark. Alarmo
    itself already owns the entry-delay (60s, armed_away) via its own
    sensor config — this only adds the light response. 7 min after the
    alarm settles (timer.alarm_lights_handback, restart-safe), hands the
    lights back: the room lighting automations re-derive their state
    (automations_resumed), and the lights no automation manages go back
    off if they were off before (input_text.alarm_lights_revert,
    "on:<list>" while a hand-back is owed).
  triggers:
  - entity_id: alarm_control_panel.vasudha_secure
    to:
    - pending
    - triggered
    trigger: state
    id: alarm
  - entity_id: alarm_control_panel.vasudha_secure
    from:
    - pending
    - triggered
    not_to:
    - pending
    - triggered
    trigger: state
    id: settled
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.alarm_lights_handback
    id: handback
  variables:
    revert: "{{ states('input_text.alarm_lights_revert') }}"
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: alarm
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      sequence:
      - if: "{{ not revert.startswith('on:') }}"
        then:
        - action: input_text.set_value
          target:
            entity_id: input_text.alarm_lights_revert
          data:
            value: >-
              on:{{ ['light.kitchen_dining_lights', 'light.office_room_light'] | select('is_state', 'off') | join(',') }}
      - action: timer.cancel
        target:
          entity_id: timer.alarm_lights_handback
      - action: light.turn_on
        target:
          entity_id:
          - light.kitchen_lights
          - light.hallway_hall_lights
          - light.bedroom_wardrobe_lights
          - light.living_room_lights
          - light.dining_lights
          - light.kitchen_dining_lights
          - light.office_room_light
    - conditions:
      - condition: trigger
        id: settled
      - "{{ revert.startswith('on:') }}"
      sequence:
      - action: timer.start
        target:
          entity_id: timer.alarm_lights_handback
    - conditions:
      - condition: trigger
        id: handback
      - "{{ revert.startswith('on:') }}"
      sequence:
      - variables:
          to_off: "{{ revert[3:].split(',') | reject('eq', '') | list }}"
      - if: "{{ to_off | count > 0 }}"
        then:
        - action: light.turn_off
          target:
            entity_id: "{{ to_off }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.alarm_lights_revert
        data:
          value: ""
      - event: automations_resumed
  mode: queued

- id: alarm_triggered_notify
  alias: "Security: notify on alarm triggered"
  description: >-
    Sends an iOS critical alert (sounds through silent and Focus)
    naming the sensor(s) Alarmo tripped on (its open_sensors
    attribute), repeated every minute until the alarm leaves triggered
    (disarmed, or back to armed when the trigger time ends) — the only
    alert when it triggers. Uses the legacy mobile_app notify actions
    because notify.send_message can't carry push data.
  triggers:
  - entity_id: alarm_control_panel.vasudha_secure
    to: triggered
    trigger: state
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: alarm_control_panel.vasudha_secure
    state: triggered
  variables:
    message: >-
      {%- set tripped = (state_attr('alarm_control_panel.vasudha_secure', 'open_sensors') or {}).keys() | list -%}
      {{ tripped | map('state_attr', 'friendly_name') | join(', ') or 'Unknown sensor' }}
  actions:
  - repeat:
      while:
      - condition: state
        entity_id: alarm_control_panel.vasudha_secure
        state: triggered
      sequence:
      - parallel:
        - &critical_push
          action: notify.mobile_app_meghanadha
          continue_on_error: true
          data:
            title: "Alarm triggered{{ '' if repeat.index == 1 else ' (' ~ repeat.index ~ ')' }}"
            message: "{{ message }}"
            data:
              push:
                interruption-level: critical
                sound:
                  name: default
                  critical: 1
                  volume: 1.0
        - <<: *critical_push
          action: notify.mobile_app_anjalis_iphone
        - <<: *critical_push
          action: notify.mobile_app_hiranyagarbha
      - wait_template: "{{ not is_state('alarm_control_panel.vasudha_secure', 'triggered') }}"
        timeout: "00:01:00"
  mode: single

- id: alarm_triggered_auto_disarm_on_arrival
  alias: "Security: auto-disarm if a resident just arrived or used the keypad"
  description: >-
    Disarms on entry (pending, retried at triggered) if a resident's
    device arrived home in the last 5min, or the front door was
    unlocked via keypad. Waits up to 15s for the lock's operator
    report, which lags the door opening. Notifies only if it disarmed.
  triggers:
  - entity_id: alarm_control_panel.vasudha_secure
    to:
    - pending
    - triggered
    trigger: state
  actions:
  - wait_template: &resident_or_keypad >-
      {%- set window = 300 -%}
      {%- set trackers = (state_attr('person.arun_karunagath', 'device_trackers') or [])
                        + (state_attr('person.anjalipc', 'device_trackers') or []) -%}
      {%- set ns = namespace(ok=false) -%}
      {%- for t in trackers -%}
        {%- if is_state(t, 'home') and (as_timestamp(now()) - as_timestamp(states[t].last_changed)) < window -%}
          {%- set ns.ok = true -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.ok or (state_attr('sensor.front_front_door_nw_operator', 'keypad') == true
         and (as_timestamp(now()) - as_timestamp(states.sensor.front_front_door_nw_operator.last_changed)) < window) }}
    timeout: "00:00:15"
    continue_on_timeout: true
  - if:
    - condition: state
      entity_id: alarm_control_panel.vasudha_secure
      state:
      - pending
      - triggered
    - condition: template
      value_template: *resident_or_keypad
    then:
    - action: alarm_control_panel.alarm_disarm
      target:
        entity_id: alarm_control_panel.vasudha_secure
      data:
        code: !secret alarm_code
    - delay: "00:00:02"
    - choose:
      - conditions:
        - condition: state
          entity_id: alarm_control_panel.vasudha_secure
          state: disarmed
        sequence:
        - action: script.notify_all_phones
          data:
            title: "Alarm auto-disarmed"
            message: "Front door opened right after a resident arrived home - disarmed automatically."
      default:
      - action: script.notify_all_phones
        data:
          title: "Alarm auto-disarm failed"
          message: "Alarm is still {{ states('alarm_control_panel.vasudha_secure') }} after a resident entry."
  mode: single
