blueprint:
  name: Room darkness detection (daylight model)
  description: >-
    Turns a room's "is dark" helper on while binary_sensor.gloomy_outside is
    on and, for rooms with their own illuminance sensor, that sensor reads
    below dark_below for 2 min. Turns it off when it is no longer gloomy
    outside, turning the light off too if the room is empty. Rooms without
    a sensor follow the house-wide state alone.
  domain: automation
  input:
    illuminance_sensor:
      name: Illuminance sensor (optional)
      default: ""
      selector:
        entity:
          domain: sensor
    dark_below:
      name: Dark threshold (lux)
      description: The room's own reading must be below this, sustained 2 min, before it counts as dark.
      default: 30
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: lx
    occupancy_sensor:
      name: Occupancy sensor
      selector:
        entity:
          domain: binary_sensor
    light_entity:
      name: Light
      selector:
        entity:
          domain: light
    dark_boolean:
      name: '"Is dark" helper'
      selector:
        entity:
          domain: input_boolean

trigger_variables:
  illuminance_sensor: !input illuminance_sensor
  dark_below: !input dark_below

triggers:
  - entity_id: binary_sensor.gloomy_outside
    to: "on"
    trigger: state
    id: gloomy
  - value_template: >-
      {{ illuminance_sensor not in [none, ''] and states(illuminance_sensor) | float(0) < dark_below }}
    for: "00:02:00"
    trigger: template
    id: gloomy
  - entity_id: binary_sensor.gloomy_outside
    to: "off"
    trigger: state
    id: bright
  - entity_id: !input occupancy_sensor
    to: "off"
    trigger: state
    id: occupancy_clear
  - trigger: homeassistant
    event: start
    id: startup
  # fired by manual-mode.yaml on resume
  - trigger: event
    event_type: automations_resumed
    id: startup

variables:
  illuminance_sensor: !input illuminance_sensor
  dark_below: !input dark_below

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: [gloomy, startup]
          - condition: state
            entity_id: binary_sensor.gloomy_outside
            state: "on"
          - condition: state
            entity_id: !input dark_boolean
            state: "off"
          - condition: template
            value_template: >-
              {{ illuminance_sensor in [none, ''] or states(illuminance_sensor) | float(0) < dark_below }}
        sequence:
          - target:
              entity_id: !input dark_boolean
            action: input_boolean.turn_on
      - conditions:
          - condition: trigger
            id: [bright, startup]
          - condition: state
            entity_id: binary_sensor.gloomy_outside
            state: "off"
          - condition: state
            entity_id: !input dark_boolean
            state: "on"
        sequence:
          - target:
              entity_id: !input dark_boolean
            action: input_boolean.turn_off
          - if:
              - condition: state
                entity_id: !input occupancy_sensor
                state: "off"
              - condition: state
                entity_id: !input light_entity
                state: "on"
            then:
              - target:
                  entity_id: !input light_entity
                action: light.turn_off
      - conditions:
          - condition: trigger
            id: [occupancy_clear, startup]
          - condition: state
            entity_id: !input dark_boolean
            state: "off"
          - condition: state
            entity_id: !input occupancy_sensor
            state: "off"
          - condition: state
            entity_id: !input light_entity
            state: "on"
        sequence:
          - target:
              entity_id: !input light_entity
            action: light.turn_off
mode: restart
