# ── Electricity price ───────────────────────────────────────────
- id: electricity_spot_sample
  alias: "Electricity: sample spot price"
  description: Adds the Nord Pool SE4 price to the month's running sum every quarter hour.
  trigger:
    - platform: time_pattern
      minutes: "/15"
      seconds: 30
  condition:
    - condition: template
      value_template: "{{ is_number(states('sensor.nord_pool_se4_current_price')) }}"
  action:
    - action: input_number.set_value
      target:
        entity_id: input_number.electricity_spot_sum
      data:
        value: "{{ states('input_number.electricity_spot_sum') | float(0) + states('sensor.nord_pool_se4_current_price') | float }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.electricity_spot_count
      data:
        value: "{{ states('input_number.electricity_spot_count') | float(0) + 1 }}"
  mode: queued

- id: electricity_month_rollover
  alias: "Electricity: month rollover"
  description: >-
    On the first run of a new month, stores last month's cost per device and its
    average spot price, then restarts the running sum. The first run after
    install only records the month.
  trigger:
    - platform: time
      at: "00:00:20"
    - platform: homeassistant
      event: start
  condition:
    - condition: template
      value_template: "{{ states('input_number.electricity_month_marker') | int(0) != now().month }}"
  action:
    - if:
        - condition: template
          value_template: "{{ states('input_number.electricity_month_marker') | int(0) != 0 }}"
      then:
        - variables:
            price: "{{ states('sensor.electricity_price_per_kwh') | float(0) }}"
            spot_avg: >-
              {% set n = states('input_number.electricity_spot_count') | float(0) %}
              {{ (states('input_number.electricity_spot_sum') | float(0) / n) | round(4) if n > 0 else 0 }}
        - repeat:
            for_each:
              - washer
              - dryer
              - server
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: "input_text.{{ repeat.item }}_cost_history"
                data:
                  value: >-
                    {% set kwh = state_attr('sensor.' ~ repeat.item ~ '_energy_month', 'last_period') | float(0) %}
                    {% set old = states('input_text.' ~ repeat.item ~ '_cost_history').split(',') | select('match', '^[0-9.]+$') | list %}
                    {{ ([(kwh * price) | round(2) | string] + old)[:12] | join(',') }}
        - action: input_number.set_value
          target:
            entity_id: input_number.electricity_spot_prev_avg
          data:
            value: "{{ spot_avg }}"
        - action: input_number.set_value
          target:
            entity_id:
              - input_number.electricity_spot_sum
              - input_number.electricity_spot_count
          data:
            value: 0
    - action: input_number.set_value
      target:
        entity_id: input_number.electricity_month_marker
      data:
        value: "{{ now().month }}"
  mode: single
