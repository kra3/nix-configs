# ── Manual mode ────────────────────────────────────────────────
- id: automations_paused_sync
  alias: "Manual mode: pause/resume automations"
  description: >-
    Pauses/resumes every automation via input_boolean.automations_paused
    except those whose config id matches keep_running: security, Frigate,
    bookkeeping, notifications and this one. New automations are paused
    by default. Adaptive Lighting is switched off with them.
  triggers:
  - entity_id: input_boolean.automations_paused
    trigger: state
  - trigger: homeassistant
    event: start
  variables:
    keep_running: >-
      ^(alarm_|frigate_|laundry_|electricity_|climate_|ble_|withings_|krisinformation_|waste_|neelu_|kunsu_|front_door_knock_(detect|announcements)$|automations_paused_sync$|modes_|everyone_left_home$|1733595301092$)
    targets: >-
      {{ states.automation
         | selectattr('attributes.id', 'defined')
         | rejectattr('attributes.id', 'match', keep_running)
         | map(attribute='entity_id') | list }}
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.automations_paused
      state: "on"
    then:
    - action: automation.turn_off
      target:
        entity_id: "{{ targets }}"
    - action: switch.turn_off
      target:
        entity_id: switch.home_adaptive_lighting_home
    else:
    - action: switch.turn_on
      target:
        entity_id: switch.home_adaptive_lighting_home
    - action: automation.turn_on
      target:
        entity_id: "{{ targets }}"
    - event: automations_resumed
  mode: single

- id: modes_end_in_morning
  alias: "Modes: end manual and party mode when the sleep schedule ends"
  description: A forgotten manual or party mode ends at wake-up.
  triggers:
  - entity_id: schedule.sleep
    to: "off"
    trigger: state
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.automations_paused
      - input_boolean.party_mode
  mode: single

- id: modes_vacation_end_on_disarm
  alias: "Modes: vacation mode follows armed vacation and disarm"
  description: >-
    Arming vacation turns vacation mode on; disarming means someone is
    back, so it ends.
  triggers:
  - entity_id: alarm_control_panel.vasudha_secure
    to: armed_vacation
    trigger: state
    id: vacation
  - entity_id: alarm_control_panel.vasudha_secure
    to: disarmed
    not_from:
    - unavailable
    - unknown
    trigger: state
    id: disarmed
  actions:
  - action: "input_boolean.turn_{{ 'on' if trigger.id == 'vacation' else 'off' }}"
    target:
      entity_id: input_boolean.vacation_mode
  mode: single
