---
name: Update Flake Lock

on:
  schedule:
    # daily at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  update-flake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31

      - name: Update flake.lock
        run: nix flake update

      - name: Open pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: "chore(deps): bump flake.lock"
          committer: Flake Bot <actions@github.com>
          author: Flake Bot <actions@github.com>
          branch: flake-update
          delete-branch: true
          add-paths: |
            flake.lock
          title: "chore(deps): bump flake.lock"
          body: |
            Automated `nix flake update`.
