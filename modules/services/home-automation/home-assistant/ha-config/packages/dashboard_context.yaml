# Derived state for the "Home" dashboard (dashboards/dashboard.yaml).
# Computed once here so dashboard cards can reference plain entity state via
# native `visibility:` conditions instead of duplicating Jinja per-card.
template:
  - sensor:
      - name: "Dashboard Time Period"
        unique_id: dashboard_time_period
        state: >-
          {%- if is_state('schedule.sleep', 'on') -%}
            night
          {%- elif is_state('sun.sun', 'above_horizon') -%}
            day
          {%- else -%}
            evening
          {%- endif -%}

      - name: "Dashboard Presence State"
        unique_id: dashboard_presence_state
        state: >-
          {%- set arun_home = is_state('person.arun_karunagath', 'home') -%}
          {%- set anjali_home = is_state('person.anjalipc', 'home') -%}
          {%- if arun_home and anjali_home -%}
            home_both
          {%- elif arun_home -%}
            home_arun
          {%- elif anjali_home -%}
            home_anjali
          {%- else -%}
            away
          {%- endif -%}

      - name: "Dashboard ETA"
        unique_id: dashboard_eta
        state: >-
          {%- set people = {'person.arun_karunagath': 'Arun', 'person.anjalipc': 'Anjali'} -%}
          {%- set ns = namespace(parts=[]) -%}
          {%- for entity_id, label in people.items() -%}
            {%- set st = states(entity_id) -%}
            {%- if st not in ['home', 'not_home', 'unknown', 'unavailable'] -%}
              {%- set ns.parts = ns.parts + [label ~ ' near ' ~ st] -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.parts | join(', ') if ns.parts else 'none' }}

      - name: "Dashboard Active Media Player"
        unique_id: dashboard_active_media_player
        state: >-
          {%- set players = [
            'media_player.lg_webos_tv_oled77c35la',
            'media_player.home_theater',
            'media_player.home_theater_2',
          ] -%}
          {%- set playing = players | select('is_state', 'playing') | list -%}
          {{ playing[0] if playing else players[0] }}

  - binary_sensor:
      - name: "Dashboard Alert: Security"
        unique_id: dashboard_alert_security
        device_class: safety
        state: >-
          {{ is_state('alarm_control_panel.vasudha_secure', 'triggered')
             or (is_state('alarm_control_panel.vasudha_secure', 'armed_away')
                 and is_state('binary_sensor.house_exits_open_status', 'on'))
             or (is_state('alarm_control_panel.vasudha_secure', 'disarmed')
                 and is_state('schedule.sleep', 'on')) }}

      - name: "Dashboard Alert: Device Health"
        unique_id: dashboard_alert_device_health
        device_class: problem
        state: >-
          {%- set curated = [
            'alarm_control_panel.vasudha_secure',
          ] -%}
          {{ (curated | map('states') | select('in', ['unavailable', 'unknown']) | list | count > 0)
             or is_state('binary_sensor.front_door_ble_degraded', 'on') }}
        attributes:
          unavailable_names: >-
            {%- set mapping = {
              'alarm_control_panel.vasudha_secure': 'Alarm Panel',
            } -%}
            {%- set ns = namespace(names=[]) -%}
            {%- if is_state('binary_sensor.front_door_ble_degraded', 'on') -%}
              {%- set ns.names = ns.names + ['Front Door (BLE down, on cloud fallback)'] -%}
            {%- endif -%}
            {%- for entity, label in mapping.items() -%}
              {%- if states(entity) in ['unavailable', 'unknown'] -%}
                {%- set ns.names = ns.names + [label] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.names | join(', ') }}

      - name: "Dashboard Alert: Override Active"
        unique_id: dashboard_alert_override_active
        device_class: running
        state: >-
          {{ is_state('input_boolean.party_mode', 'on')
             or is_state('input_boolean.automations_paused', 'on') }}

      - name: "Dashboard Alert: Crisis"
        unique_id: dashboard_alert_crisis
        device_class: safety
        state: >-
          {{ is_state('binary_sensor.krisinformation_malmo_krisinformation_aktiva_vma_malmo', 'on')
             or states('sensor.krisinformation_malmo_notices') | int(0) > 0 }}
        attributes:
          headlines: >-
            {%- set vma = state_attr('binary_sensor.krisinformation_malmo_krisinformation_aktiva_vma_malmo', 'alerts') or [] -%}
            {%- set notices = state_attr('sensor.krisinformation_malmo_notices', 'items') or [] -%}
            {{ (vma + notices) | map(attribute='headline') | list | join(', ') }}
