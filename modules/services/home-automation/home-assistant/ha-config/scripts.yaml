frigate_sync_detect_to_alarm_state:
  alias: "Frigate: sync detect/audio switches to alarm state"
  description: >-
    Shared by frigate_detect_gate_by_alarm (on alarm state change) and
    frigate_detect_resync_on_restart (on Frigate MQTT reconnect) so the
    armed_away/disarmed-or-armed_night switch lists only live in one place.
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: alarm_control_panel.vasudha_secure
        state: armed_away
      sequence:
      - action: switch.turn_on
        target:
          entity_id:
          - switch.ranger_duo_fxd_detect
          - switch.ranger_duo_fxd_audio_detection
          - switch.ranger_duo_ptz_detect
          - switch.ranger_duo_ptz_audio_detection
          - switch.ranger_uno_detect
          - switch.ranger_uno_audio_detection
    - conditions:
      - condition: state
        entity_id: alarm_control_panel.vasudha_secure
        state:
        - disarmed
        - armed_night
      sequence:
      - action: switch.turn_off
        target:
          entity_id:
          - switch.ranger_duo_fxd_detect
          - switch.ranger_duo_fxd_audio_detection
          - switch.ranger_duo_ptz_detect
          - switch.ranger_duo_ptz_audio_detection
          - switch.ranger_uno_detect
          - switch.ranger_uno_audio_detection

alarm_force_arm_night:
  alias: "Alarm: force arm night (bypass open sensors)"
  description: >-
    Arms night mode via alarmo.arm's force option, which auto-bypasses
    any currently-open sensor instead of refusing to arm.
  sequence:
  - action: alarmo.arm
    data:
      entity_id: alarm_control_panel.vasudha_secure
      mode: night
      force: true
      code: !secret alarm_code
