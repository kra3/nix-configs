# ── Away mode ──────────────────────────────────────────────────
- id: everyone_left_home
  alias: Everyone left home
  description: >-
    When all tracked persons leave the home zone for 5 min,
    turn off all lights, arm Alarmo away, and notify both phones.
  triggers:
  - entity_id:
    - person.anjalipc
    - person.arun_karunagath
    trigger: state
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: person.anjalipc
      state: home
    - condition: state
      entity_id: person.arun_karunagath
      state: home
  actions:
  - delay: "00:05:00"
  - condition: not
    conditions:
    - condition: state
      entity_id: person.anjalipc
      state: home
    - condition: state
      entity_id: person.arun_karunagath
      state: home
  - action: light.turn_off
    target:
      entity_id: all
  - action: alarm_control_panel.alarm_arm_away
    target:
      entity_id: alarm_control_panel.vasudha_secure
  - action: notify.mobile_app_anjalipc
    data:
      title: Home
      message: Everyone left — lights off, alarm armed
  - action: notify.mobile_app_arun_karunagath
    data:
      title: Home
      message: Everyone left — lights off, alarm armed
  mode: single
