# ── Kitchen ────────────────────────────────────────────────────
- id: kitchen_darkness
  alias: Kitchen — Darkness detection
  description: >-
    Hysteresis darkness state machine for kitchen. ON: lux < 10 for 2min
    (or < 15 for 15min if sun up). OFF: lux > 30 for 2min + sun up.
    House-wide average illuminance corroborates the daytime dip to
    guard against false trips.
  use_blueprint:
    path: local/darkness-detection.yaml
    input:
      illuminance_sensor: sensor.kitchen_illuminance_filtered
      occupancy_sensor: binary_sensor.hue_pir_kitchen_occupancy
      light_entity: light.kitchen_lights
      dark_boolean: input_boolean.kitchen_is_dark
      dark_below: 10
      bright_above: 30
      dark_below_daytime: 15
      dark_sustain_daytime: "00:15:00"
      corroborating_bright_sensor: sensor.average_illuminance
      corroborating_bright_above: 500

- id: kitchen_lighting
  alias: Kitchen — Lighting
  description: Presence + darkness; brightness left to Adaptive Lighting.
  use_blueprint:
    path: local/room-presence-lighting.yaml
    input:
      light_entity: light.kitchen_lights
      occupancy_sensor: binary_sensor.hue_pir_kitchen_occupancy
      motion_sensor: binary_sensor.hue_pir_kitchen_occupancy
      dark_boolean: input_boolean.kitchen_is_dark
