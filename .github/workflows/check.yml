---
name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: nix flake check
        run: nix flake check

  eval-hosts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Evaluate all three hosts' drvPaths
        run: |
          echo "nixosConfigurations.sutala:"
          nix eval --raw .#nixosConfigurations.sutala.config.system.build.toplevel.drvPath
          echo
          echo "darwinConfigurations.mac-work.system:"
          nix eval --raw .#darwinConfigurations.mac-work.system.drvPath
          echo
          echo "colmenaHive.nodes.sutala:"
          nix eval --raw .#colmenaHive.nodes.sutala.config.system.build.toplevel.drvPath
          echo

  # A refactor commit must not move any host's drvPath unless drv-lock.json is
  # updated in the same commit to record the new value. That update is what
  # makes an intentional behavior change a reviewable diff, instead of relying
  # on a commit-message escape hatch (rejected: a multi-commit PR would have
  # one flagged commit exempt the whole diff, and squash-merge rewrites
  # messages anyway).
  #
  # The actual gate is "HEAD's eval matches HEAD's drv-lock.json" — enforced
  # unconditionally below. The base-SHA comparison is informational context in
  # the logs for *why* drv-lock.json needed to change (or didn't). It reads
  # the base commit's tree but evaluates it with HEAD's flake.lock swapped in,
  # because the drv name embeds the root nixpkgs lock rev and the flake-update
  # bot bumps flake.lock on main daily — comparing against a stale base
  # flake.lock would produce a false failure on any branch more than a day
  # old, unrelated to any actual behavior change in the diff.
  refactor-guard:
    runs-on: ubuntu-latest
    needs: eval-hosts
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      - name: Evaluate HEAD drvPaths
        id: head
        run: |
          sutala=$(nix eval --raw .#nixosConfigurations.sutala.config.system.build.toplevel.drvPath)
          macwork=$(nix eval --raw .#darwinConfigurations.mac-work.system.drvPath)
          colmena=$(nix eval --raw .#colmenaHive.nodes.sutala.config.system.build.toplevel.drvPath)
          {
            echo "sutala=$sutala"
            echo "macwork=$macwork"
            echo "colmena=$colmena"
          } >> "$GITHUB_OUTPUT"

      - name: Enforce HEAD eval matches drv-lock.json
        run: |
          expected_sutala=$(jq -r '."nixosConfigurations.sutala"' drv-lock.json)
          expected_macwork=$(jq -r '."darwinConfigurations.mac-work.system"' drv-lock.json)
          expected_colmena=$(jq -r '."colmenaHive.nodes.sutala"' drv-lock.json)

          fail=0

          check() {
            name="$1"; actual="$2"; expected="$3"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$name drvPath changed to $actual but drv-lock.json still says $expected. If this change is intentional, update drv-lock.json for $name in this commit."
              fail=1
            fi
          }

          check "nixosConfigurations.sutala" "${{ steps.head.outputs.sutala }}" "$expected_sutala"
          check "darwinConfigurations.mac-work.system" "${{ steps.head.outputs.macwork }}" "$expected_macwork"
          check "colmenaHive.nodes.sutala" "${{ steps.head.outputs.colmena }}" "$expected_colmena"

          exit "$fail"

      - name: Determine base SHA
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] \
            && [ -n "${{ github.event.before }}" ] \
            && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Diff against base SHA (informational, bot-proofed)
        if: steps.base.outputs.sha != ''
        run: |
          base_sha="${{ steps.base.outputs.sha }}"
          git worktree add --detach /tmp/base-tree "$base_sha"
          # Neutralize the flake-update bot: evaluate the base tree with
          # HEAD's flake.lock, not its own, so only the code diff (not a
          # stale root-nixpkgs pin) can move the drv.
          cp flake.lock /tmp/base-tree/flake.lock

          base_sutala=$(nix eval --raw "/tmp/base-tree#nixosConfigurations.sutala.config.system.build.toplevel.drvPath")
          base_macwork=$(nix eval --raw "/tmp/base-tree#darwinConfigurations.mac-work.system.drvPath")
          base_colmena=$(nix eval --raw "/tmp/base-tree#colmenaHive.nodes.sutala.config.system.build.toplevel.drvPath")

          echo "base ($base_sha) nixosConfigurations.sutala:            $base_sutala"
          echo "head                                        :            ${{ steps.head.outputs.sutala }}"
          echo "base ($base_sha) darwinConfigurations.mac-work.system:   $base_macwork"
          echo "head                                        :            ${{ steps.head.outputs.macwork }}"
          echo "base ($base_sha) colmenaHive.nodes.sutala:               $base_colmena"
          echo "head                                        :            ${{ steps.head.outputs.colmena }}"

          if [ "$base_sutala" != "${{ steps.head.outputs.sutala }}" ] \
            || [ "$base_macwork" != "${{ steps.head.outputs.macwork }}" ] \
            || [ "$base_colmena" != "${{ steps.head.outputs.colmena }}" ]; then
            echo "::notice::At least one drvPath changed since base $base_sha. That's only acceptable because drv-lock.json was updated to match HEAD (enforced in the previous step)."
          fi
