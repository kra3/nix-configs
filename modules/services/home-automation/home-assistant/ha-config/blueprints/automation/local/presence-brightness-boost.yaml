blueprint:
  name: Presence brightness boost
  description: >-
    When it is dark between sunset and 23:00 and the room has been occupied for
    2.5 min, the light (and an optional companion light) goes to 100 %. If the
    light comes back on while presence is still held, the boost is applied
    again. The boost also applies when the window opens or it turns dark while
    the room is occupied, and a once-a-minute check boosts a light that should
    be boosted but isn't (after a restart) unless Adaptive Lighting already
    holds it in manual control. When the room empties or the light goes off,
    Adaptive Lighting takes the light back and the companion goes off. Party
    mode holds the boost; it
    is released when automations resume. No reaction while the alarm is
    pending or triggered.
  domain: automation
  input:
    light_entity:
      name: Light
      selector:
        entity:
          domain: light
    presence_sensor:
      name: Presence sensor
      selector:
        entity:
          domain: binary_sensor
    dark_boolean:
      name: '"Is dark" helper'
      selector:
        entity:
          domain: input_boolean
    companion_light:
      name: Companion light (optional)
      description: Turned on with the boost and off on release.
      default: ""
      selector:
        entity:
          domain: light
    block_entity:
      name: Block while on (optional)
      description: No boost while this entity is on.
      default: ""
      selector:
        entity:
          domain: [binary_sensor, input_boolean]

triggers:
  - trigger: state
    entity_id: !input presence_sensor
    to: "on"
    for: "00:02:30"
    id: boost
  - trigger: state
    entity_id: !input light_entity
    to: "on"
    id: boost
  - trigger: sun
    event: sunset
    id: boost
  - trigger: state
    entity_id: !input dark_boolean
    to: "on"
    id: boost
  - trigger: time_pattern
    minutes: "/1"
    id: tick
  - trigger: state
    entity_id: !input presence_sensor
    to: "off"
    id: release
  - trigger: state
    entity_id: !input light_entity
    to: "off"
    id: release
  - trigger: event
    event_type: automations_resumed
    id: release

conditions:
  - condition: not
    conditions:
      - condition: state
        entity_id: alarm_control_panel.vasudha_secure
        state:
          - pending
          - triggered

variables:
  light_entity: !input light_entity
  companion: !input companion_light
  block_entity: !input block_entity
  lights: "{{ [light_entity] + ([companion] if companion else []) }}"

actions:
  - choose:
      - conditions:
          - condition: trigger
            id:
              - boost
              - tick
          - condition: template
            value_template: >-
              {{ trigger.id != 'tick' or light_entity not in
                 (state_attr('switch.home_adaptive_lighting_home', 'manual_control') or []) }}
          - condition: state
            entity_id: !input presence_sensor
            state: "on"
            for: "00:02:30"
          - condition: state
            entity_id: !input light_entity
            state: "on"
          - condition: state
            entity_id: !input dark_boolean
            state: "on"
          - condition: state
            entity_id: schedule.sleep
            state: "off"
          - condition: sun
            after: sunset
          - condition: time
            before: "23:00:00"
          - condition: template
            value_template: "{{ block_entity == '' or not is_state(block_entity, 'on') }}"
        sequence:
          - action: adaptive_lighting.set_manual_control
            target:
              entity_id: switch.home_adaptive_lighting_home
            data:
              lights: "{{ lights }}"
              manual_control: true
          - action: light.turn_on
            target:
              entity_id: "{{ lights }}"
            data:
              brightness_pct: 100
              transition: 5
      - conditions:
          - condition: trigger
            id: release
          - condition: state
            entity_id: input_boolean.party_mode
            state: "off"
          - or:
              - condition: state
                entity_id: !input presence_sensor
                state: "off"
              - condition: state
                entity_id: !input light_entity
                state: "off"
        sequence:
          - action: adaptive_lighting.set_manual_control
            target:
              entity_id: switch.home_adaptive_lighting_home
            data:
              lights: "{{ lights }}"
              manual_control: false
          - if:
              - condition: state
                entity_id: !input light_entity
                state: "on"
            then:
              - action: adaptive_lighting.apply
                target:
                  entity_id: switch.home_adaptive_lighting_home
                data:
                  lights: "{{ light_entity }}"
                  turn_on_lights: false
          - if:
              - condition: template
                value_template: "{{ companion != '' }}"
            then:
              - action: light.turn_off
                target:
                  entity_id: "{{ companion }}"
                data:
                  transition: 5
