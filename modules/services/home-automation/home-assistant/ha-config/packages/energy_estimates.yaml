    cycle: daily
  kitchen_speaker_energy_day:
    source: sensor.kitchen_speaker_energy
    cycle: daily
  hob_energy_day:
    source: sensor.hob_energy
    cycle: daily
  hood_energy_day:
    source: sensor.hood_energy
    cycle: daily
  dishwasher_energy_day:
    source: sensor.dishwasher_energy
