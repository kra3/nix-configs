  mode: single
- id: '1762613277636'
  alias: Hall - Is Dark (ON)
  description: Set dark=ON when lux stays <30 for 2m or when sun goes below horizon
  triggers:
  - entity_id: sensor.hue_pir_hall_illuminance
    below: 30
    for: 00:02:00
    trigger: numeric_state
  - entity_id: sun.sun
