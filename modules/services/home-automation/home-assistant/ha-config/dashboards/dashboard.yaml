streamline_templates: !include_dir_named streamline_templates/
views:
- title: Home
  path: home
  sections:
  - type: grid
    cards:
    - type: custom:streamline-card
      template: home_hero
      grid_options:
        columns: full
      visibility:
      - condition: user
        users:
        - a1d4401b8b714ebb83f07c5316ab399c
        - 6edcc5a09c3144d684077ee362e7394a
    - type: custom:streamline-card
      template: home_hero
      variables:
        name: Vasudha
      grid_options:
        columns: full
      visibility:
      - condition: not
        conditions:
        - condition: user
          users:
          - a1d4401b8b714ebb83f07c5316ab399c
          - 6edcc5a09c3144d684077ee362e7394a
    - type: custom:alarmo-card
      entity: alarm_control_panel.vasudha_secure
      name: Alarm
      use_code_dialog: true
      states:
        armed_home:
          hide: true
        armed_vacation:
          hide: true
        armed_custom_bypass:
          hide: true
      grid_options:
        columns: full
    - type: tile
      entity: input_boolean.party_mode
      name: Party mode
      icon: mdi:party-popper
    - type: tile
      entity: input_boolean.automations_paused
      name: Manual mode
      icon: mdi:pause-circle
  - type: grid
    cards:
    - type: heading
      heading: Active Rooms
      heading_style: title
    - type: custom:streamline-card
      template: home_room
      variables:
        name: Kitchen
        icon: mdi:silverware-fork-knife
        presence: binary_sensor.room_presence_kitchen
        temperature: sensor.hue_pir_kitchen_temperature
        illuminance: sensor.hue_pir_kitchen_illuminance
      visibility:
      - condition: state
        entity: binary_sensor.room_presence_kitchen
        state: "on"
    - type: custom:streamline-card
      template: home_room
      variables:
        name: Dining Room
        icon: mdi:table-furniture
        presence: binary_sensor.room_presence_dining
      visibility:
      - condition: state
        entity: binary_sensor.room_presence_dining
        state: "on"
    - type: custom:streamline-card
      template: home_room
      variables:
        name: Living Room
        icon: mdi:sofa
        presence: binary_sensor.room_presence_living
      visibility:
      - condition: state
        entity: binary_sensor.room_presence_living
        state: "on"
    - type: custom:streamline-card
      template: home_room
      variables:
        name: Office
        icon: mdi:desk
        presence: binary_sensor.room_presence_office
      visibility:
      - condition: state
        entity: binary_sensor.room_presence_office
        state: "on"
    - type: custom:streamline-card
      template: home_room
      variables:
        name: Hall
        icon: mdi:door
        presence: binary_sensor.room_presence_hall
        temperature: sensor.hue_pir_hallway_temperature
        illuminance: sensor.hue_pir_hallway_illuminance
      visibility:
      - condition: state
        entity: binary_sensor.room_presence_hall
        state: "on"
    - type: custom:streamline-card
      template: home_room
      variables:
        name: Bedroom
        icon: mdi:bed
        presence: binary_sensor.bedroom_occupancy_presence
        temperature: sensor.bedroom_occupancy_temperature
        humidity: sensor.bedroom_occupancy_humidity
        illuminance: sensor.bedroom_occupancy_illuminance
      visibility:
      - condition: state
        entity: binary_sensor.bedroom_occupancy_presence
        state: "on"
    - type: custom:streamline-card
      template: home_room
      variables:
        name: Bathroom
        icon: mdi:shower
        presence: binary_sensor.bathroom_occupancy_presence
        temperature: sensor.bathroom_occupancy_temperature
        humidity: sensor.bathroom_occupancy_humidity
        illuminance: sensor.bathroom_occupancy_illuminance
      visibility:
      - condition: state
        entity: binary_sensor.bathroom_occupancy_presence
        state: "on"
    - type: custom:streamline-card
      template: home_room
      variables:
        name: Laundry
        icon: mdi:washing-machine
        presence: binary_sensor.laundry_occupancy_presence
        temperature: sensor.laundry_occupancy_temperature
        humidity: sensor.laundry_occupancy_humidity
        illuminance: sensor.laundry_occupancy_illuminance
      visibility:
      - condition: state
        entity: binary_sensor.laundry_occupancy_presence
        state: "on"
    - type: custom:streamline-card
      template: home_room
      variables:
        name: Toilet
        icon: mdi:toilet
        presence: binary_sensor.toilet_occupancy_presence
        temperature: sensor.toilet_occupancy_temperature
        humidity: sensor.toilet_occupancy_humidity
        illuminance: sensor.toilet_occupancy_illuminance
      visibility:
      - condition: state
        entity: binary_sensor.toilet_occupancy_presence
        state: "on"
    - type: tile
      entity: light.kitchen_lights
      name: Kitchen
      area: kitchen
      features:
      - type: light-brightness
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: light.kitchen_lights
          state: "on"
        - condition: user
          users:
          - 6edcc5a09c3144d684077ee362e7394a
    - type: tile
      entity: light.kitchen_dining_lights
      name: Kitchen Dining
      area: kitchen_dining_room
      features:
      - type: light-brightness
      visibility:
      - condition: state
        entity: light.kitchen_dining_lights
        state: "on"
    - type: tile
      entity: light.dining_lights
      name: Dining Room
      area: dining_room
      features:
      - type: light-brightness
      visibility:
      - condition: state
        entity: light.dining_lights
        state: "on"
    - type: tile
      entity: light.living_room_lights
      name: Living Room
      area: living_room
      features:
      - type: light-brightness
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: light.living_room_lights
          state: "on"
        - condition: state
          entity: media_player.lg_webos_tv_oled77c35la
          state: playing
        - condition: user
          users:
          - 6edcc5a09c3144d684077ee362e7394a
    - type: tile
      entity: light.tv_backlight
      name: TV Backlight
      area: living_room
      features:
      - type: light-brightness
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: light.tv_backlight
          state: "on"
        - condition: state
          entity: media_player.lg_webos_tv_oled77c35la
          state: playing
    - type: tile
      entity: light.hallway_hall_lights
      name: Hall
      area: hall
      features:
      - type: light-brightness
      visibility:
      - condition: state
        entity: light.hallway_hall_lights
        state: "on"
    - type: tile
      entity: light.bedroom_wardrobe_lights
      name: Bedroom
      area: bedroom
      features:
      - type: light-brightness
      visibility:
      - condition: state
        entity: light.bedroom_wardrobe_lights
        state: "on"
    - type: tile
      entity: light.office_room_light
      name: Office
      area: office
      features:
      - type: light-brightness
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: light.office_room_light
          state: "on"
        - condition: user
          users:
          - a1d4401b8b714ebb83f07c5316ab399c
    - type: tile
      entity: lock.front_door
      name: Front
      area: front
    - type: tile
      entity: switch.front_entrance_double_switch_left
      name: Main Entrance
      area: front
      visibility:
      - condition: state
        entity: switch.front_entrance_double_switch_left
        state: "on"
    - type: tile
      entity: switch.front_entrance_double_switch_right
      name: Street Light
      area: front
      visibility:
      - condition: state
        entity: switch.front_entrance_double_switch_right
        state: "on"
  - type: grid
    cards:
    - show_current: true
      show_forecast: true
      type: weather-forecast
      entity: weather.forecast_vasudha
      forecast_type: daily
      secondary_info_attribute: wind_speed
      forecast_slots: 7
      tap_action:
        action: more-info
    - type: heading
      heading: Media
      heading_style: title
    - type: custom:mushroom-template-card
      primary: Media activity
      secondary: >-
        {% set q = states('sensor.sabnzbd_karunagath_in_queue_count') | int(0) %}
        {% set p = states('sensor.seerr_pending_requests') | int(0) %}
        {% set parts = [] %}
        {% if q > 0 %}{% set parts = parts + [q ~ ' downloading'] %}{% endif %}
        {% if p > 0 %}{% set parts = parts + [p ~ ' pending requests'] %}{% endif %}
        {{ parts | join(' · ') }}
      icon: mdi:download
      tap_action:
        action: navigate
        navigation_path: /dashboard-home/media
      visibility:
      - condition: or
        conditions:
        - condition: numeric_state
          entity: sensor.sabnzbd_karunagath_in_queue_count
          above: 0
        - condition: numeric_state
          entity: sensor.seerr_pending_requests
          above: 0
      grid_options:
        columns: full
    - type: custom:mini-media-player
      entity: media_player.lg_webos_tv_oled77c35la
      name: TV
      artwork: cover
      info: short
      hide:
        source: true
        power: true
        shuffle: true
        repeat: true
      visibility:
      - condition: state
        entity: media_player.lg_webos_tv_oled77c35la
        state: [playing, paused]
    - type: custom:mini-media-player
      entity: media_player.ma_home_theater
      name: Living room
      artwork: cover
      info: scroll
      hide:
        source: true
        power: true
        shuffle: true
        repeat: true
      visibility:
      - condition: state
        entity: media_player.ma_home_theater
        state: [playing, paused]
    - type: custom:mini-media-player
      entity: media_player.kitchen
      name: Kitchen
      artwork: cover
      info: scroll
      hide:
        source: true
        power: true
        shuffle: true
        repeat: true
      visibility:
      - condition: state
        entity: media_player.kitchen
        state: [playing, paused]
    - type: tile
      entity: media_player.lg_webos_tv_oled77c35la
      name: Watch TV
      icon: mdi:television-play
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: media_player.turn_on
        target:
          entity_id: media_player.lg_webos_tv_oled77c35la
      grid_options:
        columns: 6
      visibility:
      - condition: state
        entity: media_player.lg_webos_tv_oled77c35la
        state_not: [playing, paused]
      - condition: state
        entity: media_player.ma_home_theater
        state_not: [playing, paused]
      - condition: state
        entity: media_player.kitchen
        state_not: [playing, paused]
    - type: tile
      entity: media_player.ma_home_theater
      name: Play music
      icon: mdi:music
      hide_state: true
      tap_action:
        action: navigate
        navigation_path: /media-browser
      grid_options:
        columns: 6
      visibility:
      - condition: state
        entity: media_player.lg_webos_tv_oled77c35la
        state_not: [playing, paused]
      - condition: state
        entity: media_player.ma_home_theater
        state_not: [playing, paused]
      - condition: state
        entity: media_player.kitchen
        state_not: [playing, paused]
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Climate
      heading_style: title
    - type: custom:streamline-card
      template: metric_line
      variables:
        entity: sensor.average_temperature
        name: Temperature
        icon: mdi:thermometer
        color: "#ff9f6b"
        decimals: 1
      grid_options:
        columns: 8
      visibility:
      - condition: screen
        media_query: "(min-width: 700px)"
    - type: custom:streamline-card
      template: metric_line
      variables:
        entity: sensor.average_humidity
        name: Humidity
        icon: mdi:water-percent
        color: "#6bb6ff"
        decimals: 0
      grid_options:
        columns: 8
      visibility:
      - condition: screen
        media_query: "(min-width: 700px)"
    - type: custom:streamline-card
      template: metric_line
      variables:
        entity: sensor.average_illuminance
        name: Illuminance
        icon: mdi:brightness-5
        color: "#ffd86b"
        decimals: 0
      grid_options:
        columns: 8
      visibility:
      - condition: screen
        media_query: "(min-width: 700px)"
    - type: custom:streamline-card
      template: metric_line
      variables:
        entity: sensor.average_temperature
        name: Temperature
        icon: mdi:thermometer
        color: "#ff9f6b"
        decimals: 1
      grid_options:
        columns: 12
      visibility:
      - condition: screen
        media_query: "(max-width: 699px)"
    - type: custom:streamline-card
      template: metric_line
      variables:
        entity: sensor.average_humidity
        name: Humidity
        icon: mdi:water-percent
        color: "#6bb6ff"
        decimals: 0
      grid_options:
        columns: 12
      visibility:
      - condition: screen
        media_query: "(max-width: 699px)"
    - type: custom:streamline-card
      template: metric_line
      variables:
        entity: sensor.average_illuminance
        name: Illuminance
        icon: mdi:brightness-5
        color: "#ffd86b"
        decimals: 0
      grid_options:
        columns: 12
      visibility:
      - condition: screen
        media_query: "(max-width: 699px)"
  - type: grid
    cards:
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: todo.shopping_list
        above: 0
      card:
        type: todo-list
        entity: todo.shopping_list
        title: Shopping List
        hide_completed: true
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: todo.shopping_list
        below: 1
      card:
        type: custom:popup-tile-card
        entity: todo.shopping_list
        name: Shopping list
        icon: mdi:cart-outline
        unit: items
        popup:
          type: todo-list
          entity: todo.shopping_list
          title: Shopping List
          hide_completed: true
  badges:
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: person.anjalipc
    color: ''
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: person.arun_karunagath
    color: ''
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: lock.front_door
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.waste_truck_type
    color: ''
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.hue_pir_hallway_temperature
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.sun_next_rising
    color: ''
    visibility:
    - condition: state
      entity: sun.sun
      state: below_horizon
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.sun_next_dusk
    color: ''
    visibility:
    - condition: state
      entity: sun.sun
      state: above_horizon
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.moon_phase
    color: ''
  - type: entity
    entity: sensor.season
  cards: []
- title: Media
  path: media
  icon: mdi:play-circle
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Players
      heading_style: title
    - type: custom:mini-media-player
      entity: media_player.lg_webos_tv_oled77c35la
      name: TV
      toggle_power: false
      artwork: cover
      info: scroll
      hide:
        source: true
      idle_view:
        when_idle: true
        when_standby: true
      shortcuts:
        attribute: source
        hide_when_off: true
        label: Apps
        list:
        - name: YouTube
          type: source
          id: YouTube AdFree
        - name: Stremio
          type: source
          id: Stremio
        - name: SVT Play
          type: source
          id: SVT Play
        - name: Breezyfin
          type: source
          id: Breezyfin
        - name: Litefin
          type: source
          id: Litefin
        - name: PS5
          type: source
          id: PlayStation 5
        - name: Live TV
          type: source
          id: Live TV
    - type: custom:mini-media-player
      entity: media_player.home_theater
      name: Now playing
      max_volume: 64
      artwork: material
      info: scroll
      hide:
        power: true
        source: true
        volume: true
        mute: true
        shuffle: true
        repeat: true
      visibility:
      - condition: state
        entity: media_player.home_theater
        state: [playing, paused]
    - type: custom:mini-media-player
      entity: media_player.home_theater_2
      name: Home theater
      toggle_power: false
      max_volume: 64
      hide:
        source: true
        controls: true
      sound_mode: full
      idle_view:
        when_idle: true
        when_standby: true
      shortcuts:
        attribute: source
        hide_when_off: true
        label: Input or radio
        list:
        - name: TV
          type: source
          id: TV Audio
        - name: Bluetooth
          type: source
          id: Bluetooth
        - name: HEOS (Net)
          type: source
          id: HEOS Music
        - name: PS5
          type: source
          id: PlayStation 5
        - name: HitCity
          type: service
          id: media_player.select_source
          data:
            entity_id: media_player.home_theater
            source: HitCity (Malmö)
        - name: BBC World Service
          type: service
          id: media_player.select_source
          data:
            entity_id: media_player.home_theater
            source: BBC World Service
        - name: Radio Relax International
          type: service
          id: media_player.select_source
          data:
            entity_id: media_player.home_theater
            source: Radio Relax International
        - name: AIR Kochi FM 102.3
          type: service
          id: media_player.select_source
          data:
            entity_id: media_player.home_theater
            source: AIR KOCHI FM 102.3 | (Classical Indian)
        - name: AIR FM Rainbow 101.3
          type: service
          id: media_player.select_source
          data:
            entity_id: media_player.home_theater
            source: AIR FM Rainbow 101.3 (Indian Music)
    - type: custom:mini-media-player
      entity: media_player.kitchen
      name: Kitchen
      artwork: material
      info: scroll
      hide:
        power: true
      idle_view:
        when_idle: true
  - type: grid
    cards:
    - type: heading
      heading: Downloads
      icon: mdi:download
      heading_style: title
    - type: custom:health-metric-card
      entity: sensor.sabnzbd_karunagath_in_speed
      name: SABnzbd
      icon: mdi:download
      color: "#6bb6ff"
      decimals: 1
      show_date: false
      chart:
        type: line
        days: 7
        stat: max
      items:
      - entity: sensor.sabnzbd_karunagath_in_queue_count
        name: Queue
        mode: now
        days: 7
        decimals: 0
        unit: ""
      - entity: sensor.sabnzbd_karunagath_in_left_to_download
        name: Left
        mode: now
        days: 7
        decimals: 0
      popup:
        graphs:
        - name: Speed (daily peak)
          entities:
          - sensor.sabnzbd_karunagath_in_speed
          days: 7
          stat: max
        - name: Queue
          entities:
          - sensor.sabnzbd_karunagath_in_queue_count
          days: 7
      grid_options:
        columns: 12
    - type: custom:health-metric-card
      entity: sensor.sabnzbd_karunagath_in_overall_total
      name: SABnzbd today
      icon: mdi:cloud-download-outline
      color: "#8fd9c0"
      decimals: 1
      hero_from: chart
      show_date: false
      chart:
        type: bar
        days: 14
        stat: change
      popup:
        graphs:
        - name: Downloaded per day
          entities:
          - sensor.sabnzbd_karunagath_in_overall_total
          days: 30
          stat: change
          type: bar
      grid_options:
        columns: 12
    - type: custom:health-metric-card
      entity: sensor.slskd_download_speed
      name: Soulseek
      icon: mdi:music-note-plus
      color: "#f5c28b"
      decimals: 1
      show_date: false
      chart:
        type: line
        days: 7
        stat: max
      items:
      - entity: sensor.slskd_active_downloads
        name: Active
        mode: now
        days: 7
        decimals: 0
        unit: ""
      - entity: sensor.slskd_queued_downloads
        name: Queued
        mode: now
        days: 7
        decimals: 0
        unit: ""
      - entity: sensor.slskd_completed_downloads
        name: Done
        mode: now
        days: 7
        decimals: 0
        unit: ""
      popup:
        graphs:
        - name: Speed (daily peak)
          entities:
          - sensor.slskd_download_speed
          days: 7
          stat: max
        - name: Queued and active
          entities:
          - entity: sensor.slskd_queued_downloads
            name: Queued
          - entity: sensor.slskd_active_downloads
            name: Active
          days: 7
      grid_options:
        columns: 12
    - type: entities
      title: SABnzbd controls
      show_header_toggle: false
      entities:
      - entity: number.sabnzbd_karunagath_in_speedlimit
        name: Speed limit
      - entity: button.sabnzbd_karunagath_in_pause
        name: Pause
        action_name: Pause
      - entity: button.sabnzbd_karunagath_in_resume
        name: Resume
        action_name: Resume
      grid_options:
        columns: 12
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.sabnzbd_karunagath_in_warnings
        state: "on"
      card:
        type: tile
        entity: binary_sensor.sabnzbd_karunagath_in_warnings
        name: SABnzbd warnings
      grid_options:
        columns: 12
  - type: grid
    cards:
    - type: heading
      heading: Requests & imports
      icon: mdi:movie-search-outline
      heading_style: title
    - type: custom:health-metric-card
      entity: sensor.seerr_total_requests
      name: Seerr
      icon: mdi:movie-open-plus-outline
      color: "#c9a7e8"
      decimals: 0
      show_date: false
      chart:
        type: line
        days: 7
      items:
      - entity: sensor.seerr_processing_requests
        name: Processing
        mode: now
        days: 7
        decimals: 0
        unit: ""
      - entity: sensor.seerr_film_requests
        name: Movies
        mode: now
        days: 7
        decimals: 0
        unit: ""
      - entity: sensor.seerr_tv_requests
        name: TV
        mode: now
        days: 7
        decimals: 0
        unit: ""
      popup:
        graphs:
        - name: Total requests
          entities:
          - sensor.seerr_total_requests
          days: 7
        - name: Pending and processing
          entities:
          - entity: sensor.seerr_pending_requests
            name: Pending
          - entity: sensor.seerr_processing_requests
            name: Processing
          days: 7
        - name: Movies and TV
          entities:
          - entity: sensor.seerr_film_requests
            name: Movies
          - entity: sensor.seerr_tv_requests
            name: TV
          days: 7
      grid_options:
        columns: 12
    - type: custom:health-metric-card
      entity: sensor.arr_queue_total
      name: Arr queues
      icon: mdi:package-down
      color: "#6bb6ff"
      decimals: 0
      show_date: false
      chart:
        type: line
        days: 7
      items:
      - entity: sensor.unpackerr_lidarr_queue
        name: Lidarr
        mode: now
        days: 7
        decimals: 0
